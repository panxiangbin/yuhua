<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#365b72"><title>离线与更新状态｜数控小潘</title><style>*{box-sizing:border-box}body{margin:0;background:#f2efe8;color:#292d30;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:820px;margin:auto;padding:14px 14px 92px}.top{display:flex;justify-content:space-between;gap:10px}.btn{min-height:46px;padding:0 14px;border:1px solid #d8d2c6;border-radius:12px;background:#365b72;color:#fff;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.btn.alt{background:#fffdf8;color:#365b72}.card{background:#fffdf8;border:1px solid #d8d2c6;border-radius:15px;box-shadow:0 6px 16px rgba(48,44,36,.07);padding:16px;margin-top:14px}h1{font-size:29px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid #d8d2c6;border-radius:12px;background:#f8f5ef}.stat strong{display:block;font-size:23px;color:#365b72;overflow-wrap:anywhere}.notice{line-height:1.7;color:#687078}.warn{border-left:4px solid #8a5a16;padding:12px;background:#f8f5ef;border-radius:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,820px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f5;border-top:1px solid #d8d2c6;padding:7px 8px calc(7px + env(safe-area-inset-bottom))}.bottom a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#687078;font-weight:900;font-size:13px}@media(max-width:520px){.grid,.actions{grid-template-columns:1fr}}</style></head><body><main class="shell"><div class="top"><a class="btn alt" href="./profile.html">← 返回成长档案</a><a class="btn alt" href="./offline.html">查看离线页</a></div><section class="card"><small>PWA · 缓存可靠性</small><h1>离线与更新状态</h1><p class="notice">这里显示网络、Service Worker和缓存版本。更新只在用户明确点击后接管页面，不会清空学习档案或重复发放XP。</p><div class="grid"><div class="stat"><span>网络</span><strong id="network">检测中</strong></div><div class="stat"><span>Service Worker</span><strong id="worker">检测中</strong></div><div class="stat"><span>缓存版本</span><strong id="build">检测中</strong></div></div></section><section class="card"><h2>更新与离线边界</h2><p id="status" class="warn" role="status">正在检查版本。</p><div class="actions"><button class="btn" id="check" type="button">检查更新</button><button class="btn alt" id="apply" type="button" disabled>应用新版本</button></div><p class="notice">离线缓存只保证已经缓存的学习页面可打开，不保证报警、参数、刀补或机型相关内容永远最新。实际操作仍须核对原厂手册和现场制度。</p></section></main><nav class="bottom"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const n=document.querySelector('#network'),w=document.querySelector('#worker'),b=document.querySelector('#build'),s=document.querySelector('#status'),apply=document.querySelector('#apply');let waiting=null;function net(){n.textContent=navigator.onLine?'在线':'离线'}addEventListener('online',net);addEventListener('offline',net);net();async function inspect(){if(!('serviceWorker'in navigator)){w.textContent='不支持';s.textContent='当前浏览器不支持Service Worker。';return}const reg=await navigator.serviceWorker.getRegistration('./');if(!reg){w.textContent='未注册';s.textContent='请先打开首页完成注册。';return}w.textContent=reg.active?'已启用':'安装中';waiting=reg.waiting||null;apply.disabled=!waiting;s.textContent=waiting?'发现新版本，点击应用后刷新。':'当前没有等待应用的新版本。';if(reg.active){const ch=new MessageChannel();ch.port1.onmessage=e=>{if(e.data&&e.data.type==='CNC_SW_BUILD')b.textContent=e.data.build};reg.active.postMessage({type:'GET_BUILD'},[ch.port2]);setTimeout(()=>{if(b.textContent==='检测中')b.textContent='已启用'},800)}reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){waiting=nw;apply.disabled=false;s.textContent='新版本已下载，等待用户应用。'}})})}document.querySelector('#check').onclick=async()=>{const reg=await navigator.serviceWorker.getRegistration('./');if(reg){s.textContent='正在检查更新…';await reg.update();await inspect()}};apply.onclick=()=>{if(waiting){waiting.postMessage({type:'SKIP_WAITING'});s.textContent='正在应用新版本…'}};navigator.serviceWorker&&navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());inspect().catch(()=>{w.textContent='检查失败';s.textContent='状态读取失败，请稍后重试。'});</script></body></html>
