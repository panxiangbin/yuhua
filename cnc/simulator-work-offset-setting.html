<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>工件坐标设定与核对模拟｜数控小潘</title><style>:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#355c73;--ok:#466b55;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 94px}.card,.step{margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px rgba(40,40,35,.07)}h1{font-size:28px}.muted{color:var(--muted);line-height:1.7}.btn,.choice,.back{min-height:46px;border:1px solid var(--line);border-radius:12px;font-weight:900;padding:11px 14px}.btn{background:var(--blue);color:#fff}.back{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;background:var(--card)}.choice{width:100%;text-align:left;background:#faf8f3;color:var(--ink);margin-top:9px}.step{display:none}.step.active{display:block}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:54px;font-weight:950;color:var(--blue)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f7;border-top:1px solid var(--line)}.nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px}</style></head><body><main class="shell"><a class="back" href="./training-camp.html">← 返回训练营</a><section class="card"><small>新手模拟训练 · 工件坐标设定与核对</small><h1>先确认基准，再把“零件的零”安全写进G54</h1><p class="muted">学习目标：掌握受控图纸与工艺基准确认、找正与测量、G54写入、符号单位检查、复测、程序调用核对和安全验证。适用FANUC类立式加工中心入门。实际机床界面、按键名称、坐标测量方法、写入方式和安全要求可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场条件为准，并由授权人员指导。</p><p><strong>历史最高分：</strong><span id="best">0</span></p></section><div id="host"></div><section class="card result" id="result"><div class="score" id="score">0</div><h2 id="title"></h2><p id="copy"></p><ul id="errors"></ul><button class="btn" id="restart" type="button">重新练习</button></section></main><nav class="nav"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1',ID='work-offset-setting';const STEPS=[{id:'wo-01',t:'设定G54前，第一步应确认什么？',a:['直接把旧值抄过来','核对受控图纸、工艺基准、装夹方向和零点定义','只看程序里写了G54'],c:1,ok:'先确认零点定义与现场基准一致。',bad:'旧值或错误基准会让整条刀路整体偏移。'},{id:'wo-02',t:'寻找X、Y基准时，正确做法是？',a:['按现场规定使用寻边器、探头或量具，并确认补偿和测量方向','凭目测估计边缘','碰到工件就立即写零'],c:0,ok:'测量方法、方向和补偿必须明确。',bad:'忽略测头半径、方向或接触方式会制造系统性误差。'},{id:'wo-03',t:'设定Z零点前应核对什么？',a:['只确认刀尖碰到表面','确认Z零点定义、测量基准、刀具/H号与测量装置数据','把机床坐标Z直接写入'],c:1,ok:'Z零点、刀长和测量基准必须在同一数据链中。',bad:'混淆机床坐标、工件零点和刀长补偿可能导致Z向碰撞。'},{id:'wo-04',t:'准备把测量值写入G54时，应该怎样处理？',a:['核对坐标页、轴、符号、单位和目标坐标系后再写入','同时改G54到G59','看到数值接近就确认'],c:0,ok:'写入前逐项确认轴、符号、单位和坐标系。',bad:'写错轴或符号会造成整条路径偏移。'},{id:'wo-05',t:'写入G54后，下一步是什么？',a:['立即循环启动','重新测量或回到已知点，检查显示值与预期位置关系','关闭坐标页面'],c:1,ok:'写入后必须独立复核，不能只相信输入动作。',bad:'未复测就无法发现输错、写错坐标系或测量误差。'},{id:'wo-06',t:'程序调用G54时还要核对什么？',a:['程序中的G54、当前激活坐标系、刀具H号和安全高度','只看程序文件名','只看有没有报警'],c:0,ok:'坐标、刀补与安全高度要共同核对。',bad:'语法无报警不代表数据链正确。'},{id:'wo-07',t:'首次验证G54的安全做法是？',a:['在安全位置使用单段、低倍率、足够安全距离观察坐标变化和接近方向','直接快速到工件表面','关闭单段提高效率'],c:0,ok:'先在安全距离验证方向和位置，再逐步接近。',bad:'直接快速接近会把坐标错误放大成碰撞。'},{id:'wo-08',t:'发现显示位置与预期不一致时怎么办？',a:['暂停并保留现场，核对基准、测量记录、G54轴值、刀补和程序调用','边运行边微调G54','先加工一刀看看'],c:0,ok:'状态不明必须停止、查清并记录。',bad:'运行中猜测修改会造成二次错误，甚至失去可追溯性。'}];let i=0,wrong=[];const host=document.querySelector('#host');function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}function render(){host.innerHTML='';STEPS.forEach((s,n)=>{const el=document.createElement('section');el.className='step'+(n===i?' active':'');el.innerHTML=`<small>步骤 ${n+1}/8</small><h2>${s.t}</h2>${s.a.map((x,j)=>`<button class="choice" data-v="${j}" type="button">${x}</button>`).join('')}<div class="feedback" aria-live="polite"></div>`;host.append(el)});host.querySelectorAll('.choice').forEach(b=>b.onclick=answer)}function answer(e){const s=STEPS[i],v=Number(e.currentTarget.dataset.v),box=e.currentTarget.parentElement,fb=box.querySelector('.feedback'),ok=v===s.c;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=ok?s.ok:s.bad;if(!ok)wrong.push(s.id);setTimeout(()=>{i++;i<STEPS.length?render():finish()},120)}function finish(){host.innerHTML='';const score=Math.round((8-wrong.length)/8*100),passed=wrong.length===0,all=read(KEY,{version:1,records:{}}),prev=all.records[ID]||{};all.version=1;all.records[ID]={bestScore:Math.max(prev.bestScore||0,score),lastScore:score,attempts:(prev.attempts||0)+1,passed:Boolean(prev.passed||passed),wrongSteps:wrong.slice(),completedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(all));if(passed&&!prev.passed){const p=read(PROFILE,{version:1,xp:0,rewards:{},abilities:{}});p.version=1;p.xp=Number(p.xp||0)+80;p.rewards={...(p.rewards||{}),workOffsetSetting:true};p.abilities={...(p.abilities||{}),coordinate:Math.max(Number(p.abilities?.coordinate||0),80)};localStorage.setItem(PROFILE,JSON.stringify(p))}document.querySelector('#score').textContent=score;document.querySelector('#title').textContent=passed?'工件坐标设定与核对模拟通过':'尚未通过：请重做错误步骤';document.querySelector('#copy').textContent=passed?'8步全部正确，首次通过奖励80 XP，并接入坐标能力档案。':'只有8步全部正确才算通过。';document.querySelector('#errors').innerHTML=wrong.length?wrong.map(x=>`<li>${x}</li>`).join(''):'<li>本次无错误</li>';document.querySelector('#result').classList.add('show');refreshBest()}function refreshBest(){const d=read(KEY,{records:{}});document.querySelector('#best').textContent=d.records?.[ID]?.bestScore||0}document.querySelector('#restart').onclick=()=>{i=0;wrong=[];document.querySelector('#result').classList.remove('show');render()};refreshBest();render();</script></body></html>
