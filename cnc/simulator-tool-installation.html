<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>刀具安装核对模拟｜数控小潘</title><style>:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#355c73;--ok:#466b55;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 94px}.card,.step{margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px rgba(40,40,35,.07)}h1{font-size:28px}.muted{color:var(--muted);line-height:1.7}.btn,.choice,.back{min-height:46px;border:1px solid var(--line);border-radius:12px;font-weight:900;padding:11px 14px}.btn{background:var(--blue);color:#fff}.back{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;background:var(--card)}.choice{width:100%;text-align:left;background:#faf8f3;color:var(--ink);margin-top:9px}.step{display:none}.step.active{display:block}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:54px;font-weight:950;color:var(--blue)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f7;border-top:1px solid var(--line)}.nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px}</style></head><body><main class="shell"><a class="back" href="./training-camp.html">← 返回训练营</a><section class="card"><small>新手模拟训练 · 刀具安装核对</small><h1>刀装进主轴前，先把“刀、柄、号、补偿”对成一条链</h1><p class="muted">本模拟包含8步正确路径与4类常见错误。实际刀柄规格、拉钉、锁紧扭矩、动平衡、换刀方式和刀补设置必须以机床、刀柄和刀具原厂手册及现场制度为准。</p><p><strong>历史最高分：</strong><span id="best">0</span></p></section><div id="host"></div><section class="card result" id="result"><div class="score" id="score">0</div><h2 id="title"></h2><p id="copy"></p><ul id="errors"></ul><button class="btn" id="restart" type="button">重新练习</button></section></main><nav class="nav"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>
const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1',ID='tool-installation';
const STEPS=[
{id:'ti-01',t:'安装前先确认什么？',a:['只看刀具直径','核对刀具、刀柄、拉钉和机床接口规格是否匹配','先装上再试'],c:1,ok:'接口、拉钉和刀柄规格必须匹配。',bad:'规格不匹配可能造成夹持失效、换刀异常或主轴损伤，应停止并核对原厂资料。'},
{id:'ti-02',t:'刀柄锥面和主轴锥孔如何处理？',a:['保持清洁、无油泥和碰伤，并按现场要求检查','涂厚油更容易安装','有铁屑也能拉紧'],c:0,ok:'接触面必须清洁完整。',bad:'铁屑和碰伤会破坏贴合，造成跳动、松动和精度风险。'},
{id:'ti-03',t:'装夹刀具时首先核对？',a:['刀具夹持长度、刃长和伸出量是否满足加工且不过长','伸得越长越安全','只看刀尖颜色'],c:0,ok:'夹持长度与伸出量共同影响刚性和安全。',bad:'过长伸出会降低刚性并增加振动、偏斜和折刀风险。'},
{id:'ti-04',t:'刀具锁紧后应检查什么？',a:['只要手感紧即可','按刀柄说明检查锁紧、刀具是否到底、夹持是否均匀和跳动风险','直接上机'],c:1,ok:'锁紧状态必须可核对、可重复。',bad:'仅凭手感可能造成夹持不足或偏心，应按说明书和现场标准复核。'},
{id:'ti-05',t:'T号、刀位和H号之间如何处理？',a:['编号相同就一定正确','逐项核对实物刀具、刀库刀位、程序T号和刀长补偿H号','H号随便选'],c:1,ok:'刀具数据链必须逐项一致。',bad:'刀位正确但H号错误仍可能造成Z向碰撞或过切。'},
{id:'ti-06',t:'刀具重新装夹后，旧刀长补偿怎么办？',a:['继续沿用旧值','重新测量、记录、复核并按现场流程更新补偿','只改G54'],c:1,ok:'重新装夹会改变刀尖位置关系。',bad:'沿用旧H值可能造成严重Z向误差，应重新测量并验证。'},
{id:'ti-07',t:'换刀后首次运动前应做什么？',a:['直接快速到工件表面','检查刀具通道、安全高度、刀补调用，并用单段低倍率验证','关闭单段'],c:1,ok:'首次运动必须受控验证。',bad:'直接快移会把数据错误变成碰撞，应先检查并低风险验证。'},
{id:'ti-08',t:'出现异常声音、跳动或刀具状态不明时？',a:['提高转速观察','立即停止，保持安全状态并由授权人员检查','继续完成这一刀'],c:1,ok:'异常必须先停止再查因。',bad:'继续运行可能扩大刀具、主轴、工件和人员风险。'}];
let i=0,wrong=[];const host=document.querySelector('#host');
function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}
function render(){host.innerHTML='';STEPS.forEach((s,n)=>{const el=document.createElement('section');el.className='step'+(n===i?' active':'');el.innerHTML=`<small>步骤 ${n+1}/8</small><h2>${s.t}</h2>${s.a.map((x,j)=>`<button class="choice" data-v="${j}" type="button">${x}</button>`).join('')}<div class="feedback" aria-live="polite"></div>`;host.append(el)});host.querySelectorAll('.choice').forEach(b=>b.onclick=answer)}
function answer(e){const s=STEPS[i],v=Number(e.currentTarget.dataset.v),box=e.currentTarget.parentElement,fb=box.querySelector('.feedback'),ok=v===s.c;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=ok?s.ok:s.bad;if(!ok)wrong.push(s.id);setTimeout(()=>{i++;i<STEPS.length?render():finish()},120)}
function finish(){host.innerHTML='';const score=Math.round((STEPS.length-wrong.length)/STEPS.length*100),passed=wrong.length===0,all=read(KEY,{version:1,records:{}}),prev=all.records[ID]||{};all.version=1;all.records[ID]={bestScore:Math.max(prev.bestScore||0,score),lastScore:score,attempts:(prev.attempts||0)+1,passed:Boolean(prev.passed||passed),wrongSteps:wrong.slice(),completedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(all));if(passed&&!prev.passed){const p=read(PROFILE,{version:1,xp:0,rewards:{}});p.version=1;p.xp=Number(p.xp||0)+80;p.rewards={...(p.rewards||{}),toolInstallation:true};localStorage.setItem(PROFILE,JSON.stringify(p))}document.querySelector('#score').textContent=score;document.querySelector('#title').textContent=passed?'刀具安装核对通过':'尚未通过：请重做错误步骤';document.querySelector('#copy').textContent=passed?'8步全部正确，首次通过奖励80 XP。':'只有8步全部正确才算通过。';document.querySelector('#errors').innerHTML=wrong.length?wrong.map(x=>`<li>${x}</li>`).join(''):'<li>本次无错误</li>';document.querySelector('#result').classList.add('show');refreshBest()}
function refreshBest(){const d=read(KEY,{records:{}});document.querySelector('#best').textContent=d.records?.[ID]?.bestScore||0}
document.querySelector('#restart').onclick=()=>{i=0;wrong=[];document.querySelector('#result').classList.remove('show');render()};refreshBest();render();
</script></body></html>
