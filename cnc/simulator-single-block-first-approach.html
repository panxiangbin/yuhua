<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>单段、倍率与首次接近模拟｜数控小潘</title><style>:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#355c73;--ok:#466b55;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 94px}.card,.step{margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px rgba(40,40,35,.07)}h1{font-size:28px}.muted{color:var(--muted);line-height:1.7}.btn,.choice,.back{min-height:46px;border:1px solid var(--line);border-radius:12px;font-weight:900;padding:11px 14px}.btn{background:var(--blue);color:#fff}.back{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;background:var(--card)}.choice{width:100%;text-align:left;background:#faf8f3;color:var(--ink);margin-top:9px}.step{display:none}.step.active{display:block}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:54px;font-weight:950;color:var(--blue)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f7;border-top:1px solid var(--line)}.nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px}</style></head><body><main class="shell"><a class="back" href="./training-camp.html">← 返回训练营</a><section class="card"><small>新手模拟训练 · 单段、倍率与首次接近</small><h1>不是“慢一点”就安全，而是每一步都知道下一刀会去哪</h1><p class="muted">学习目标：掌握首次接近工件前的程序版本、坐标与刀补确认，单段、快速倍率、进给倍率和安全距离设置，逐段观察运动方向，并在异常时立即停止。适用FANUC类立式加工中心入门。实际机床界面、按键名称、单段逻辑、倍率范围、暂停方式和安全要求可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场条件为准，并由现场师傅或授权人员指导。</p><p><strong>历史最高分：</strong><span id="best">0</span></p></section><div id="host"></div><section class="card result" id="result"><div class="score" id="score">0</div><h2 id="title"></h2><p id="copy"></p><ul id="errors"></ul><button class="btn" id="restart" type="button">重新练习</button></section></main><nav class="nav"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1',ID='single-block-first-approach';const STEPS=[{id:'sb-01',t:'首次接近前，最先确认什么？',a:['程序版本、受控图纸、装夹、G54、实物刀具与H号一致','只看程序没有报警','直接按循环启动观察'],c:0,ok:'先确认程序、坐标、刀具和现场是同一套数据。',bad:'数据链未核对，后面的单段和低倍率也可能只是慢速碰撞。'},{id:'sb-02',t:'准备首次接近时，单段功能应怎样使用？',a:['按现场规定启用并确认每次只执行一个程序段','关闭单段以免停顿','只在切削后再开启'],c:0,ok:'单段用于逐段确认下一步动作。',bad:'关闭单段会让多个未知动作连续执行，失去及时停机机会。'},{id:'sb-03',t:'快速倍率和进给倍率应怎样设置？',a:['按风险与现场规定调到低档，并明确两种倍率分别控制什么','都调到100%更容易观察','只调进给倍率，G00速度不用管'],c:0,ok:'G00快速倍率与切削进给倍率不是一回事，必须分别确认。',bad:'只降进给倍率可能无法降低G00快速接近风险。'},{id:'sb-04',t:'第一次执行刀长补偿和接近动作时，应站在哪里观察？',a:['站在安全位置，视线能确认运动方向且不进入危险区','靠近防护门缝隙看得更清楚','把手伸入机内判断距离'],c:0,ok:'观察必须在防护和企业安全制度允许的位置进行。',bad:'进入危险区或破坏防护会把观察行为变成直接伤害风险。'},{id:'sb-05',t:'单段执行前，应先说清楚什么？',a:['下一段预计是哪根轴、朝哪个方向、到什么位置','只要终点坐标对就行','先执行再看实际去哪'],c:0,ok:'能预判下一段，才有资格按下继续执行。',bad:'不理解下一段就执行，单段只剩“逐段试错”。'},{id:'sb-06',t:'刀具接近工件前，安全距离应怎样处理？',a:['先在足够安全距离验证方向与坐标，再逐步靠近','直接G00到工件表面上方极小距离','把安全高度照抄旧程序'],c:0,ok:'先远后近，逐步缩小安全距离。',bad:'旧程序的安全高度可能不适合当前装夹、刀具和现场。'},{id:'sb-07',t:'发现运动方向、坐标显示或声音异常时怎么办？',a:['立即停止，保留现场并核对程序段、G54、H号、模态和机械状态','继续一段看看是否恢复','提高倍率尽快通过异常区'],c:0,ok:'异常时先停、再查、再授权恢复。',bad:'继续运行会把可控疑点扩大成碰撞、过切或设备损伤。'},{id:'sb-08',t:'首次接近通过后，下一步正确做法是？',a:['继续按单段、低倍率完成首件试切、测量、复验和记录','立即切换自动高倍率批量加工','只要没碰撞就判定程序正确'],c:0,ok:'首次接近只是验证的一部分，必须完成首件闭环。',bad:'没有首件测量和授权放行，不能证明尺寸、补偿和工艺正确。'}];let i=0,wrong=[];const host=document.querySelector('#host');function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}function render(){host.innerHTML='';STEPS.forEach((s,n)=>{const el=document.createElement('section');el.className='step'+(n===i?' active':'');el.innerHTML=`<small>步骤 ${n+1}/8</small><h2>${s.t}</h2>${s.a.map((x,j)=>`<button class="choice" data-v="${j}" type="button">${x}</button>`).join('')}<div class="feedback" aria-live="polite"></div>`;host.append(el)});host.querySelectorAll('.choice').forEach(b=>b.onclick=answer)}function answer(e){const s=STEPS[i],v=Number(e.currentTarget.dataset.v),box=e.currentTarget.parentElement,fb=box.querySelector('.feedback'),ok=v===s.c;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=ok?s.ok:s.bad;if(!ok)wrong.push(s.id);setTimeout(()=>{i++;i<STEPS.length?render():finish()},120)}function finish(){host.innerHTML='';const score=Math.round((8-wrong.length)/8*100),passed=wrong.length===0,all=read(KEY,{version:1,records:{}}),prev=all.records[ID]||{};all.version=1;all.records[ID]={bestScore:Math.max(prev.bestScore||0,score),lastScore:score,attempts:(prev.attempts||0)+1,passed:Boolean(prev.passed||passed),wrongSteps:wrong.slice(),completedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(all));if(passed&&!prev.passed){const p=read(PROFILE,{version:1,xp:0,rewards:{},abilities:{}});p.version=1;p.xp=Number(p.xp||0)+80;p.rewards={...(p.rewards||{}),singleBlockFirstApproach:true};p.abilities={...(p.abilities||{}),safety:Math.max(Number(p.abilities?.safety||0),80),verification:Math.max(Number(p.abilities?.verification||0),80)};localStorage.setItem(PROFILE,JSON.stringify(p))}document.querySelector('#score').textContent=score;document.querySelector('#title').textContent=passed?'单段、倍率与首次接近模拟通过':'尚未通过：请重做错误步骤';document.querySelector('#copy').textContent=passed?'8步全部正确，首次通过奖励80 XP，并接入安全与验证能力档案。':'只有8步全部正确才算通过。';document.querySelector('#errors').innerHTML=wrong.length?wrong.map(x=>`<li>${x}</li>`).join(''):'<li>本次无错误</li>';document.querySelector('#result').classList.add('show');refreshBest()}function refreshBest(){const d=read(KEY,{records:{}});document.querySelector('#best').textContent=d.records?.[ID]?.bestScore||0}document.querySelector('#restart').onclick=()=>{i=0;wrong=[];document.querySelector('#result').classList.remove('show');render()};refreshBest();render();</script></body></html>
