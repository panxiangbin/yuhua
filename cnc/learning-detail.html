<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#365b72">
<title>数控学习小课｜数控小潘</title>
<style>
:root{--bg:#f1efe9;--surface:#fffdf9;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#365b72;--blue2:#24465f;--ok:#466b55;--warn:#8a5a16;--bad:#98483e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,860px);margin:auto;padding:14px 14px 92px}.top{display:flex;justify-content:space-between;gap:10px}.btn{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font-weight:900;text-decoration:none;box-shadow:0 2px 0 rgba(41,44,47,.08)}.btn.primary{color:#fff;background:var(--blue);border-color:var(--blue2)}.hero,.card,.visual,.nav-card{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 7px 20px rgba(48,44,36,.07)}.hero{padding:18px}.kicker{color:var(--blue);font-size:12px;font-weight:950;letter-spacing:.08em}.hero h1{margin:7px 0 9px;font-size:clamp(27px,7vw,38px);line-height:1.18}.hero p,.card p,.visual figcaption,.copy{color:var(--muted);line-height:1.7}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#f7f4ee;color:#54616d;font-size:11px;font-weight:900}.visual{overflow:hidden}.visual img{display:block;width:100%;max-height:390px;object-fit:cover;background:#e8edf1}.visual figcaption{padding:10px 13px;font-size:12px}.card{padding:16px}.card h2{margin:0 0 9px;font-size:21px}.card h3{margin:16px 0 7px;font-size:16px}.principle{padding:12px;border-left:4px solid var(--blue);border-radius:9px;background:#edf3f7;color:#29465d;line-height:1.65}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}.list li{display:grid;grid-template-columns:34px 1fr;gap:9px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:11px;background:#f7f4ee;line-height:1.55}.list b{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#e6eef4;color:var(--blue2)}.danger li b{background:#f8e9e6;color:var(--bad)}.safety{border-left:4px solid #d29a36;background:#fff8e8}.safety strong{color:var(--warn)}details{border:1px solid var(--line);border-radius:11px;background:#f7f4ee;overflow:hidden}summary{min-height:48px;display:flex;align-items:center;padding:0 12px;cursor:pointer;font-weight:900}details p{margin:0;padding:0 12px 13px}.nav-card{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.nav-card a{min-height:48px;display:flex;align-items:center;padding:8px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);text-decoration:none;font-weight:900}.nav-card a:last-child{justify-content:flex-end;text-align:right}.course-link{width:100%;margin-top:12px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,860px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(255,253,249,.98);box-shadow:0 -5px 16px rgba(41,44,47,.08)}.bottom a{min-height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-size:12px;font-weight:900}.error{padding:20px;text-align:center}.hidden{display:none!important}
@media(max-width:620px){.grid,.nav-card{grid-template-columns:1fr}.nav-card a:last-child{justify-content:flex-start;text-align:left}.hero{padding:15px}.card{padding:14px}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><a class="btn" href="./index.html#study">← 返回学习</a><a class="btn" id="course-top" href="./training-camp.html">12关路线</a></div>
<section id="loading" class="card"><h2>正在读取小课</h2><p>正在加载学习内容和对应图片。</p></section>
<section id="error" class="card error hidden"><h2>没有找到这节小课</h2><p>请返回学习页重新选择。</p><a class="btn primary" href="./index.html#study">返回学习页</a></section>
<div id="content" class="hidden">
<section class="hero">
<div class="kicker" id="kicker"></div>
<h1 id="title"></h1>
<p id="summary"></p>
<div class="meta"><span class="tag" id="course-tag"></span><span class="tag" id="order-tag"></span><span class="tag">手机图文小课</span></div>
</section>
<figure class="visual"><img id="image" alt=""><figcaption id="caption"></figcaption></figure>
<section class="card"><h2>这一课学什么</h2><p id="objective"></p><h3>核心原理</h3><div class="principle" id="principle"></div></section>
<section class="card"><h2>现场动作</h2><ol class="list" id="actions"></ol></section>
<section class="card"><h2>高风险错误</h2><ul class="list danger" id="errors"></ul></section>
<section class="card safety"><h2>安全边界</h2><p><strong id="safety"></strong></p><p>具体按键、坐标、补偿、报警、联锁和操作流程可能因系统、机型、厂家参数及企业制度不同而变化。</p></section>
<section class="card"><h2>自检问题</h2><details><summary id="question"></summary><p id="answer"></p></details><a class="btn primary course-link" id="course-link" href="./training-camp.html">进入本关完整课程</a></section>
<nav class="nav-card"><a id="prev" href="./index.html#study">← 上一小课</a><a id="next" href="./index.html#study">下一小课 →</a></nav>
</div>
</main>
<nav class="bottom" aria-label="平台主导航"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查询</a><a href="./profile.html">我的</a></nav>
<script src="./learning-sublesson-catalog.js?v=20260805a"></script>
<script src="./learning-sublesson-specificity.js?v=20260806a"></script>
<script>
(function(){
  'use strict';
  const params=new URLSearchParams(location.search);
  const stage=Number(params.get('stage')||1);
  const lesson=params.get('lesson')||`${stage}-1`;
  const catalog=window.CNC_LEARNING_SUBLESSONS;
  const course=catalog&&catalog.courses&&catalog.courses[stage-1];
  const items=catalog&&catalog.stages&&catalog.stages[String(stage)]||[];
  const index=items.findIndex(item=>item.id===lesson);
  const item=index>=0?items[index]:null;
  const byId=id=>document.getElementById(id);
  const set=(id,value)=>{byId(id).textContent=value||''};
  const list=(id,values,kind)=>{const node=byId(id);node.innerHTML='';(values||[]).forEach((value,i)=>{const li=document.createElement('li');const b=document.createElement('b');b.textContent=kind==='error'?'!':String(i+1);const span=document.createElement('span');span.textContent=value;li.append(b,span);node.appendChild(li)})};
  if(!catalog||!course||!item){
    byId('loading').classList.add('hidden');byId('error').classList.remove('hidden');return;
  }
  document.title=`${item.title}｜第${stage}关｜数控小潘`;
  set('kicker',`第${stage}关 · 小课 ${index+1}/${items.length}`);
  set('title',item.title);set('summary',item.summary);set('course-tag',course.title);set('order-tag',`第${stage}.${index+1}课`);
  set('objective',item.objective);set('principle',item.principle);set('safety',item.safety);set('question',item.question);set('answer',item.answer);
  const image=byId('image');image.src=item.image;image.alt=item.alt;set('caption',item.alt);
  image.addEventListener('error',()=>{image.hidden=true;set('caption','图片加载失败，正文仍可继续学习。')},{once:true});
  list('actions',item.actions,'action');list('errors',item.errors,'error');
  byId('course-link').href=`./${course.file}`;byId('course-link').textContent=`进入第${stage}关完整课程`;
  byId('course-top').href=`./${course.file}`;
  const previous=items[index-1];const next=items[index+1];
  const prev=byId('prev'),nxt=byId('next');
  if(previous){prev.href=`./learning-detail.html?stage=${stage}&lesson=${encodeURIComponent(previous.id)}`;prev.textContent=`← ${previous.title}`}
  else if(stage>1){const prior=catalog.stages[String(stage-1)];const p=prior[prior.length-1];prev.href=`./learning-detail.html?stage=${stage-1}&lesson=${encodeURIComponent(p.id)}`;prev.textContent=`← 第${stage-1}关最后一课`}
  if(next){nxt.href=`./learning-detail.html?stage=${stage}&lesson=${encodeURIComponent(next.id)}`;nxt.textContent=`${next.title} →`}
  else if(stage<12){const n=catalog.stages[String(stage+1)][0];nxt.href=`./learning-detail.html?stage=${stage+1}&lesson=${encodeURIComponent(n.id)}`;nxt.textContent=`进入第${stage+1}关 →`}
  byId('loading').classList.add('hidden');byId('content').classList.remove('hidden');
  document.body.dataset.cncLearningDetail='ready';
})();
</script>
</body>
</html>
