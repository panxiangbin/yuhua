<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>测量误差与加工误差分类｜数控小潘</title><style>:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#355c73;--ok:#466b55;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 94px}.card,.step{margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px rgba(40,40,35,.07)}h1{font-size:28px;line-height:1.25}.muted{color:var(--muted);line-height:1.7}.btn,.choice,.back{min-height:46px;border:1px solid var(--line);border-radius:12px;font-weight:900;padding:11px 14px}.btn{background:var(--blue);color:#fff}.back{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;background:var(--card)}.choice{width:100%;text-align:left;background:#faf8f3;color:var(--ink);margin-top:9px}.step{display:none}.step.active{display:block}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:54px;font-weight:950;color:var(--blue)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f7;border-top:1px solid var(--line)}.nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px}</style></head><body><main class="shell"><a class="back" href="./training-camp.html">← 返回训练营</a><section class="card"><small>新手模拟训练 · 测量误差与加工误差分类</small><h1>尺寸不一致先分清“测错了”还是“加工变了”</h1><p class="muted">学习目标：学会通过量具状态、测量基准、重复测量、尺寸分布和加工过程证据，区分测量误差、装夹定位误差、刀具相关误差与过程波动。适用FANUC类立式加工中心首件检验入门。实际量具使用、校准周期、温度要求、抽检制度和放行权限可能因企业制度、图纸要求及现场条件不同而变化，请以受控图纸、量具说明书、企业检验制度和现场授权为准。</p><p><strong>内容类型：</strong>交互模拟　<strong>风险等级：</strong>中高　<strong>核验状态：</strong>通用分类逻辑已交叉核对，具体公差与测量方法需核对受控图纸</p><p><strong>历史最高分：</strong><span id="best">0</span></p></section><div id="host"></div><section class="card result" id="result"><div class="score" id="score">0</div><h2 id="title"></h2><p id="copy"></p><ul id="errors"></ul><button class="btn" id="restart" type="button">重新练习</button></section></main><nav class="nav"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1',ID='measurement-vs-machining-error';const STEPS=[{id:'mm-01',t:'发现同一尺寸两次测量差异较大，第一步应做什么？',a:['暂停判定，检查量具、清洁、测量位置、姿势和基准后重复测量','立即修改刀补','取两次数值平均后放行'],c:0,ok:'先验证测量系统，避免把测量波动误判为加工误差。',bad:'未经验证就改刀补或取平均值，可能制造新的真实偏差。'},{id:'mm-02',t:'量具在标准件上复核也不稳定，应如何处理？',a:['停止使用并按制度送检、校准或更换合格量具','继续测量但多测几次','把程序尺寸改成测量平均值'],c:0,ok:'量具自身不可靠时，后续测量结果不能作为加工修正依据。',bad:'不合格量具测得再多，也不能证明工件真实尺寸。'},{id:'mm-03',t:'多名人员测同一零件结果差异明显，优先排查什么？',a:['测量基准、测量位置、方法、测力和读数规则是否统一','立即修改G54','直接判定机床精度差'],c:0,ok:'人员间差异常来自方法不一致，应先统一测量作业。',bad:'未排除测量方法差异就改机床数据，风险很高。'},{id:'mm-04',t:'多个尺寸整体同方向偏移且重复测量稳定，优先排查什么？',a:['装夹定位、工件基准、G54和整体位置数据链','只修改某一把刀补','更换量具后直接放行'],c:0,ok:'整体同向偏移更像定位或坐标基准问题。',bad:'单刀补通常不能解释多个特征整体同向偏移。'},{id:'mm-05',t:'只有某把刀加工的尺寸稳定超差，其他尺寸正常，应怎么查？',a:['核对该刀实物、磨损、跳动、H/D号和程序调用','整体修改G54','重新测所有基准后忽略刀具'],c:0,ok:'单刀相关且重复稳定的偏差，应沿该刀的数据链排查。',bad:'修改整体坐标会把原本正确的尺寸一起带偏。'},{id:'mm-06',t:'连续零件尺寸逐渐漂移，量具复核稳定，可能优先考虑什么？',a:['刀具磨损、热变化、装夹重复性和过程状态变化','测量员每次都读错','一次大幅修改补偿'],c:0,ok:'随加工时间渐变的趋势更像过程变化，需要查趋势与根因。',bad:'用一次大修正追赶漂移，可能造成反向超差。'},{id:'mm-07',t:'尺寸忽大忽小且无明显趋势，正确处理是什么？',a:['检查装夹松动、跳动、切屑、测量重复性和加工稳定性','不断按每件结果追调刀补','取所有尺寸平均后继续生产'],c:0,ok:'随机波动应先查稳定性，不能用刀补追逐噪声。',bad:'追着随机结果调补偿会放大过程波动。'},{id:'mm-08',t:'确认修正后，怎样形成可靠闭环？',a:['记录证据与修改前后值，重新加工并复测关联尺寸，经授权后放行','只复测原超差尺寸一次','尺寸回到公差内就删除异常记录'],c:0,ok:'复测关联尺寸并保留记录，才能证明修正没有引入新问题。',bad:'单点一次合格不足以证明过程恢复稳定。'}];let i=0,wrong=[];const host=document.querySelector('#host');function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}function render(){host.innerHTML='';STEPS.forEach((s,n)=>{const el=document.createElement('section');el.className='step'+(n===i?' active':'');el.innerHTML=`<small>步骤 ${n+1}/8</small><h2>${s.t}</h2>${s.a.map((x,j)=>`<button class="choice" data-v="${j}" type="button">${x}</button>`).join('')}<div class="feedback" aria-live="polite"></div>`;host.append(el)});host.querySelectorAll('.choice').forEach(b=>b.onclick=answer)}function answer(e){const s=STEPS[i],v=Number(e.currentTarget.dataset.v),box=e.currentTarget.parentElement,fb=box.querySelector('.feedback'),ok=v===s.c;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=ok?s.ok:s.bad;if(!ok)wrong.push(s.id);setTimeout(()=>{i++;i<STEPS.length?render():finish()},120)}function finish(){host.innerHTML='';const score=Math.round((8-wrong.length)/8*100),passed=score===100,now=new Date().toISOString(),data=read(KEY,{version:1,records:{}}),old=data.records[ID]||{};data.version=1;data.records[ID]={bestScore:Math.max(old.bestScore||0,score),lastScore:score,attempts:(old.attempts||0)+1,passed:Boolean(old.passed||passed),wrongSteps:[...wrong],lastCompletedAt:now};localStorage.setItem(KEY,JSON.stringify(data));const profile=read(PROFILE,{version:1,xp:0,rewards:{},abilities:{}});profile.version=1;profile.rewards=profile.rewards||{};profile.abilities=profile.abilities||{};if(passed&&!profile.rewards[ID]){profile.xp=(Number(profile.xp)||0)+80;profile.rewards[ID]=now}profile.abilities.measurementDiagnosis=Math.max(Number(profile.abilities.measurementDiagnosis)||0,score);localStorage.setItem(PROFILE,JSON.stringify(profile));document.querySelector('#score').textContent=score;document.querySelector('#title').textContent=passed?'模拟通过':'尚未通过';document.querySelector('#copy').textContent=passed?'你已完成测量误差与加工误差分类训练。':'必须8步全部正确才算通过，请重新练习错误步骤。';document.querySelector('#errors').innerHTML=wrong.map(x=>`<li>${x}</li>`).join('');document.querySelector('#result').classList.add('show');document.querySelector('#best').textContent=data.records[ID].bestScore}document.querySelector('#restart').onclick=()=>{i=0;wrong=[];document.querySelector('#result').classList.remove('show');render()};document.querySelector('#best').textContent=(read(KEY,{records:{}}).records[ID]||{}).bestScore||0;render();</script></body></html>
