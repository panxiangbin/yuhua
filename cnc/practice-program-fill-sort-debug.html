<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>程序补空、排序与找错15题｜数控小潘</title><style>:root{--bg:#f3f0e9;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#365b72;--ok:#3f6b50;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:760px;margin:auto;padding:14px 14px 96px}.card,.q{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:14px;box-shadow:0 6px 16px rgba(48,44,36,.07)}h1{font-size:28px}.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}.tag{border:1px solid var(--line);border-radius:999px;padding:4px 7px}.q{display:none}.q.active{display:block}.opts{display:grid;gap:10px}.opt{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start;background:#faf8f3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn,a.btn{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;text-decoration:none;background:var(--blue);color:white}.btn.alt{background:var(--card);color:var(--blue)}.feedback{display:none;margin-top:12px;padding:12px;border-radius:11px}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:56px;font-weight:950}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f5;border-top:1px solid var(--line);padding:7px}.bottom a{min-height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-weight:900;font-size:13px}@media(max-width:620px){.actions{grid-template-columns:1fr}}</style></head><body><main class="shell"><a class="btn alt" href="./training-camp.html">← 返回训练营</a><section class="card"><small>专项训练 · 程序补空＋G代码排序＋程序找错</small><h1>15题练会：不是背代码，而是会判断程序能否安全上机</h1><p>面向零基础新手，示例以FANUC类立式加工中心为主。满分100分，80分通过。</p></section><section class="card"><strong>统一安全提示</strong><p>实际机床界面、按键名称、回零方式、刀补设置、报警处理和安全要求可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场条件为准。高风险操作必须由现场师傅或授权人员指导。</p></section><div id="host"></div><section id="result" class="card result"><div id="score" class="score">0</div><h2 id="result-title"></h2><p id="result-copy"></p><div class="actions"><button id="redo" class="btn">只重做错题</button><button id="restart" class="btn alt">全部重练</button></div></section></main><nav class="bottom"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="#">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_practice_v1';const Q=[
{id:'pfsd-01',course:'第9关 G00与G01',ability:'程序结构',risk:'高',system:'FANUC类加工中心',type:'fill',title:'补全安全定位程序：G90 G54 __ X20 Y20',options:['G00','G01','G02','G03'],answer:[0],explain:'在已确认安全Z高度后，到孔位或轮廓起点通常使用G00快速定位；接近工件和切削段必须按工艺改用受控进给。'},
{id:'pfsd-02',course:'第8关 对刀与刀补',ability:'刀补核对',risk:'高',system:'FANUC类加工中心',type:'fill',title:'T03换刀并调用3号刀长补偿，常见结构应补全：G43 __ Z50.',options:['H03','D03','T03','G54'],answer:[0],explain:'G43调用刀长补偿，H03必须与实物刀具、刀位和测量记录一致；H号规则需核对机床手册。'},
{id:'pfsd-03',course:'第11关 孔加工循环',ability:'固定循环',risk:'高',system:'FANUC类加工中心',type:'fill',title:'孔加工结束后，应使用哪个代码取消固定循环？',options:['G80','G81','G98','G99'],answer:[0],explain:'G80取消固定循环，避免后续位置块被误当作继续钻孔。'},
{id:'pfsd-04',course:'第12关 完整程序与首件验证',ability:'流程排序',risk:'高',system:'通用',type:'order',title:'新程序首次上机，哪组顺序更合理？',options:['核对数据→图形检查→空运行→单段低倍率→首件测量','首件加工→核对图纸→空运行→批量','自动运行→发现异常再看G54','只做图形模拟→直接批量'],answer:[0],explain:'验证必须逐层收紧风险，图形检查不能代替空运行、单段、低倍率和首件测量。'},
{id:'pfsd-05',course:'第8关 对刀与刀补',ability:'对刀步骤',risk:'高',system:'FANUC类加工中心',type:'order',title:'重新装刀后的正确顺序是？',options:['重新测量→核对H号→安全位置验证→首件复测','继续用旧H值→直接加工','先改G54→再看刀具','只看T号正确即可'],answer:[0],explain:'重新装刀会改变实际刀长，旧H值不能直接沿用。'},
{id:'pfsd-06',course:'第11关 孔加工循环',ability:'流程排序',risk:'高',system:'FANUC类加工中心',type:'order',title:'孔加工循环前的核对顺序，哪项最完整？',options:['孔位/G54/H号→R平面与夹具→循环参数→空运行验证','只确认孔深Z','只确认转速','先钻一孔再看'],answer:[0],explain:'孔位、坐标、刀补、R平面和夹具干涉必须形成完整检查链。'},
{id:'pfsd-07',course:'第9关 G00与G01',ability:'程序找错',risk:'高',system:'FANUC类加工中心',type:'debug',title:'程序段 G00 X80 Y40 Z-5 最主要的风险是什么？',options:['多轴同时快移，中间路径可能扫过工件或夹具','X值太大一定报警','G00不能写Z','必须改成G02'],answer:[0],explain:'终点安全不代表中间路径安全。新手应优先先抬安全Z，再走XY，再受控接近。'},
{id:'pfsd-08',course:'第10关 G02与G03',ability:'程序找错',risk:'中',system:'FANUC类加工中心',type:'debug',title:'程序要在XY平面加工圆弧，但前面仍保留G18。应先检查什么？',options:['切换并确认G17加工平面','把G02改G03即可','增大进给','删除I/J'],answer:[0],explain:'圆弧方向和I/J/K含义取决于加工平面，必须先确认G17/G18/G19。'},
{id:'pfsd-09',course:'第11关 孔加工循环',ability:'程序找错',risk:'高',system:'FANUC类加工中心',type:'debug',title:'连续孔加工后没有G80，下一段仅写X100 Y50。可能发生什么？',options:['该位置可能继续执行当前固定循环','自动取消循环','只移动不加工','必然回参考点'],answer:[0],explain:'模态固定循环未取消时，后续位置块可能继续钻孔。'},
{id:'pfsd-10',course:'第8关 对刀与刀补',ability:'程序找错',risk:'高',system:'FANUC类加工中心',type:'debug',title:'实物为T04，程序却使用G43 H02。首要处理是什么？',options:['停止并核对实物刀具、刀位、H号和测量记录','把Z调高一点继续','降低进给即可','只要无报警就加工'],answer:[0],explain:'T号与H号错配可能造成严重Z向碰撞或过切。'},
{id:'pfsd-11',course:'第5-6关 坐标基础',ability:'坐标判断',risk:'高',system:'FANUC类加工中心',type:'debug',title:'多个尺寸整体同向偏移，最不应先做什么？',options:['同时修改多把刀的H/D补偿','核对G54','核对装夹与定位基准','检查图纸基准'],answer:[0],explain:'整体偏移更可能来自工件坐标或装夹基准，不应先用多把刀补追误差。'},
{id:'pfsd-12',course:'第12关 首件验证',ability:'安全判断',risk:'高',system:'通用',type:'single',title:'图形模拟路径正确后，下一步最合理的是？',options:['继续空运行、单段、低倍率和安全距离验证','直接批量加工','取消防护观察','提高快速倍率'],answer:[0],explain:'图形模拟看不到真实装夹、刀具伸出、刀补数据和机床现场状态。'},
{id:'pfsd-13',course:'第11关 孔加工循环',ability:'参数风险',risk:'高',system:'FANUC类加工中心',type:'single',title:'深孔排屑异常时，哪种做法最危险？',options:['未经核验盲目增大Q值并继续加工','停止检查刀具与冷却','核对循环格式和手册','清理切屑后重新验证'],answer:[0],explain:'Q值含义与单位可能随系统不同，盲改会增加断刀、堵屑和碰撞风险。'},
{id:'pfsd-14',course:'第12关 首件验证',ability:'首件检查',risk:'高',system:'通用',type:'single',title:'首件某尺寸超差，正确做法是？',options:['先确认测量、基准和偏差来源，再按权限小量修正并复验','一次把全部偏差写进刀补','只复测该尺寸就批量','删除报警继续'],answer:[0],explain:'超差可能来自测量、装夹、G54、刀具或热变化，必须先分类再修正。'},
{id:'pfsd-15',course:'第12关 完整程序',ability:'程序结构',risk:'高',system:'FANUC类加工中心',type:'multi',title:'完整程序结束前通常应确认哪些动作？',options:['刀具退到确认过的安全位置','主轴与冷却按工艺停止','取消不再需要的循环或补偿状态','直接在工件内执行M30'],answer:[0,1,2],explain:'结束段要把刀具和模态状态带回可控状态；具体安全位置和取消方式需按机床及企业规范确定。'}];let set=Q,idx=0,answers=[],wrong=[];function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');return v&&typeof v==='object'?v:{}}catch{return {}}}function save(score){const s=read();s.version=1;s.history=Array.isArray(s.history)?s.history:[];s.wrongItems=Array.isArray(s.wrongItems)?s.wrongItems:[];s.history.unshift({practice:'program-fill-sort-debug',score,passed:score>=80,answered:answers.length,at:new Date().toISOString()});s.history=s.history.slice(0,20);wrong.forEach(q=>{if(!s.wrongItems.some(x=>x.id===q.id))s.wrongItems.push({id:q.id,course:q.course,ability:q.ability,risk:q.risk,system:q.system,title:q.title,source:'program-fill-sort-debug'});});localStorage.setItem(KEY,JSON.stringify(s))}function render(){const h=document.getElementById('host');h.innerHTML='';set.forEach((q,i)=>{const d=document.createElement('section');d.className='q'+(i===0?' active':'');d.dataset.id=q.id;d.innerHTML=`<div class="meta"><span class="tag">${q.type}</span><span class="tag">${q.course}</span><span class="tag">${q.ability}</span><span class="tag">风险${q.risk}</span><span class="tag">${q.system}</span></div><h2>${i+1}. ${q.title}</h2><div class="opts">${q.options.map((o,j)=>`<label class="opt"><input type="${q.type==='multi'?'checkbox':'radio'}" name="q${i}" value="${j}"><span>${o}</span></label>`).join('')}</div><div class="actions"><button class="btn submit">提交答案</button><button class="btn alt next" disabled>${i===set.length-1?'查看成绩':'下一题'}</button></div><div class="feedback"></div>`;h.appendChild(d)});idx=0;answers=[];wrong=[];bind()}function bind(){document.querySelectorAll('.q').forEach((el,i)=>{el.querySelector('.submit').onclick=()=>{const q=set[i],picked=[...el.querySelectorAll('input:checked')].map(x=>+x.value).sort(),ok=JSON.stringify(picked)===JSON.stringify([...q.answer].sort());answers.push({id:q.id,correct:ok});if(!ok)wrong.push(q);const f=el.querySelector('.feedback');f.className='feedback show '+(ok?'ok':'bad');f.textContent=(ok?'回答正确。':'回答错误。')+q.explain;el.querySelectorAll('input').forEach(x=>x.disabled=true);el.querySelector('.submit').disabled=true;el.querySelector('.next').disabled=false};el.querySelector('.next').onclick=()=>{el.classList.remove('active');if(i===set.length-1)finish();else document.querySelectorAll('.q')[i+1].classList.add('active')}})}function finish(){const score=Math.round(answers.filter(x=>x.correct).length/answers.length*100),r=document.getElementById('result');save(score);document.getElementById('score').textContent=score;document.getElementById('result-title').textContent=score>=80?'已通过专项':'未达到80分';document.getElementById('result-copy').textContent=`答对${answers.filter(x=>x.correct).length}题，错${wrong.length}题。`;r.className='card result show'}document.getElementById('restart').onclick=()=>{set=Q;document.getElementById('result').className='card result';render()};document.getElementById('redo').onclick=()=>{if(!wrong.length)return;set=[...wrong];document.getElementById('result').className='card result';render()};render();</script></body></html>
