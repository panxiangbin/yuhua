<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>对刀与刀长补偿核对模拟｜数控小潘</title><style>:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#355c73;--ok:#466b55;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 94px}.card,.step{margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px rgba(40,40,35,.07)}h1{font-size:28px}.muted{color:var(--muted);line-height:1.7}.btn,.choice,.back{min-height:46px;border:1px solid var(--line);border-radius:12px;font-weight:900;padding:11px 14px}.btn{background:var(--blue);color:#fff}.back{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;background:var(--card)}.choice{width:100%;text-align:left;background:#faf8f3;color:var(--ink);margin-top:9px}.step{display:none}.step.active{display:block}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:54px;font-weight:950;color:var(--blue)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f7;border-top:1px solid var(--line)}.nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px}</style></head><body><main class="shell"><a class="back" href="./training-camp.html">← 返回训练营</a><section class="card"><small>新手模拟训练 · 对刀与刀长补偿核对</small><h1>对刀不是记一个数，而是把“刀尖、基准、H号、程序”连成一条可靠数据链</h1><p class="muted">本模拟包含8步正确路径与多类常见错误。实际对刀方式、测量装置、补偿页面、H号规则、安全高度和验证流程可能因系统、机型、厂家参数和企业制度不同而变化，请以原厂手册、企业安全制度和现场条件为准，并由授权人员指导。</p><p><strong>历史最高分：</strong><span id="best">0</span></p></section><div id="host"></div><section class="card result" id="result"><div class="score" id="score">0</div><h2 id="title"></h2><p id="copy"></p><ul id="errors"></ul><button class="btn" id="restart" type="button">重新练习</button></section></main><nav class="nav"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>
const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1',ID='tool-length-offset-check';
const STEPS=[
{id:'tl-01',t:'开始对刀前，第一项应确认什么？',a:['直接把旧补偿清零','确认机床状态、测量基准、当前刀具和现场对刀方法','先启动主轴'],c:1,ok:'先确认状态、基准和方法，后续数据才有意义。',bad:'未确认基准和方法就操作，可能把错误数据写入补偿并形成碰撞风险。'},
{id:'tl-02',t:'测量装置或基准面应如何处理？',a:['保持清洁、完整，并确认其位置和高度数据可靠','有铁屑不影响','只看显示数值'],c:0,ok:'接触面和装置状态直接影响测量重复性。',bad:'铁屑、碰伤或高度数据错误会把测量误差带入刀补。'},
{id:'tl-03',t:'当前测量的实物刀具必须与什么对应？',a:['只和刀具颜色对应','刀库刀位、程序T号和将要调用的H号','只和G54对应'],c:1,ok:'实物刀具、刀位、T号和H号必须逐项一致。',bad:'刀装对了但H号错了，仍可能发生严重Z向过切或碰撞。'},
{id:'tl-04',t:'刀具重新装夹或更换后，旧刀长值怎么办？',a:['继续沿用','重新测量、记录、复核，并按现场流程更新对应补偿','只修改进给速度'],c:1,ok:'重新装夹会改变刀尖位置关系，必须重新建立数据。',bad:'沿用旧值可能使刀尖实际位置与控制系统认知不一致。'},
{id:'tl-05',t:'写入刀长补偿后应核对什么？',a:['只看数值是否非零','核对正负方向、单位、H号、数值范围和记录来源','马上自动运行'],c:1,ok:'补偿值必须可追溯、可解释、可复核。',bad:'符号、单位或H号错误都可能造成大幅Z向误差。'},
{id:'tl-06',t:'程序中的G43 H03表示什么核对重点？',a:['只要有G43就一定安全','确认调用的是H03，并与当前实物刀具和测量记录一致','H号可任意选择'],c:1,ok:'程序调用必须与实物和记录形成闭环。',bad:'仅看G43存在不够，H号错配仍会调用错误补偿。'},
{id:'tl-07',t:'首次验证刀长补偿时应怎么做？',a:['直接快速接近工件表面','在确认过的安全位置，用单段、低倍率和安全距离核对刀尖位置','关闭单段提高效率'],c:1,ok:'首次运动必须把风险控制在可停止、可观察范围内。',bad:'直接快移会把数据错误瞬间变成碰撞。'},
{id:'tl-08',t:'发现刀尖位置异常、数值不一致或来源不明时？',a:['继续试切观察','立即停止，不猜测修改，由授权人员核对基准、刀具、H号和记录','只降低进给继续'],c:1,ok:'状态不明时先停止并查清数据链。',bad:'继续运行或凭猜测改值可能扩大设备、工件和人员风险。'}];
let i=0,wrong=[];const host=document.querySelector('#host');
function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}
function render(){host.innerHTML='';STEPS.forEach((s,n)=>{const el=document.createElement('section');el.className='step'+(n===i?' active':'');el.innerHTML=`<small>步骤 ${n+1}/8</small><h2>${s.t}</h2>${s.a.map((x,j)=>`<button class="choice" data-v="${j}" type="button">${x}</button>`).join('')}<div class="feedback" aria-live="polite"></div>`;host.append(el)});host.querySelectorAll('.choice').forEach(b=>b.onclick=answer)}
function answer(e){const s=STEPS[i],v=Number(e.currentTarget.dataset.v),box=e.currentTarget.parentElement,fb=box.querySelector('.feedback'),ok=v===s.c;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=ok?s.ok:s.bad;if(!ok)wrong.push(s.id);setTimeout(()=>{i++;i<STEPS.length?render():finish()},120)}
function finish(){host.innerHTML='';const score=Math.round((STEPS.length-wrong.length)/STEPS.length*100),passed=wrong.length===0,all=read(KEY,{version:1,records:{}}),prev=all.records[ID]||{};all.version=1;all.records[ID]={bestScore:Math.max(prev.bestScore||0,score),lastScore:score,attempts:(prev.attempts||0)+1,passed:Boolean(prev.passed||passed),wrongSteps:wrong.slice(),completedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(all));if(passed&&!prev.passed){const p=read(PROFILE,{version:1,xp:0,rewards:{}});p.version=1;p.xp=Number(p.xp||0)+80;p.rewards={...(p.rewards||{}),toolLengthOffsetCheck:true};localStorage.setItem(PROFILE,JSON.stringify(p))}document.querySelector('#score').textContent=score;document.querySelector('#title').textContent=passed?'对刀与刀长补偿核对通过':'尚未通过：请重做错误步骤';document.querySelector('#copy').textContent=passed?'8步全部正确，首次通过奖励80 XP。':'只有8步全部正确才算通过。';document.querySelector('#errors').innerHTML=wrong.length?wrong.map(x=>`<li>${x}</li>`).join(''):'<li>本次无错误</li>';document.querySelector('#result').classList.add('show');refreshBest()}
function refreshBest(){const d=read(KEY,{records:{}});document.querySelector('#best').textContent=d.records?.[ID]?.bestScore||0}
document.querySelector('#restart').onclick=()=>{i=0;wrong=[];document.querySelector('#result').classList.remove('show');render()};refreshBest();render();
</script></body></html>
