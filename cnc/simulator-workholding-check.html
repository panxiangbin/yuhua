<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>工件装夹检查模拟｜数控小潘</title><meta name="description" content="面向CNC零基础新手的工件装夹检查交互模拟，包含8步流程、错误后果、成长记录与安全边界。"><style>
:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#3f6279;--blue2:#2d4e64;--ok:#466b55;--bad:#8a4034;--warn:#8b5b16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 96px}.top{display:flex;gap:10px}.btn,.back{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 15px;border:1px solid var(--line);border-radius:12px;font-weight:900;text-decoration:none;box-shadow:0 2px 0 rgba(41,45,48,.08)}.back{background:var(--card);color:var(--ink)}.btn{background:var(--blue);border-color:var(--blue2);color:#fff;cursor:pointer}.btn.secondary{background:var(--card);color:var(--blue2)}.hero,.panel,.step{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 6px 16px rgba(48,44,36,.07)}h1{font-size:29px;line-height:1.2;margin:6px 0 10px}.hero p,.panel p,.step p{color:var(--muted);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:11px;border:1px solid var(--line);border-radius:11px;background:#f7f4ee;text-align:center}.stat strong{display:block;font-size:27px;color:var(--blue2)}.notice{border-left:4px solid #d4a044}.notice strong{color:var(--warn)}.step{display:none}.step.active{display:block}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;font-weight:800}.choices{display:grid;gap:10px}.choice{min-height:48px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf8f3;color:var(--ink);font-weight:800;cursor:pointer}.choice:hover,.choice:focus{border-color:#8ea5b4}.feedback{display:none;margin-top:12px;padding:12px;border-radius:11px;border:1px solid var(--line);line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640;border-color:#aac2b4}.feedback.bad{background:#f7ece9;color:#74372c;border-color:#d5aaa0}.result{display:none}.result.show{display:block}.score{font-size:56px;font-weight:950;color:var(--blue2)}.result.pass .score{color:var(--ok)}.errors{padding:0;list-style:none;display:grid;gap:8px}.errors li{padding:10px;border:1px solid var(--line);border-radius:10px;background:#f7f4ee}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.97);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(41,45,48,.08)}.bottom-nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:13px;font-weight:900}.bottom-nav a.active{color:var(--blue2)}@media(max-width:620px){.stats{grid-template-columns:1fr}.top>*{flex:1}h1{font-size:27px}}
</style></head><body><main class="shell"><div class="top"><a class="back" href="./training-camp.html">← 返回训练营</a><button class="btn secondary" id="restart-top" type="button">重新模拟</button></div><section class="hero"><small>新手模拟训练 · 工件装夹检查</small><h1>夹得紧不等于夹得对，先定位、再夹紧、最后查干涉</h1><p>本模拟用8步建立装夹检查习惯。你会判断定位面、支撑、夹紧点、刀具通道、坐标重设和首件前复查。</p><div class="stats"><div class="stat"><strong>8</strong><span>检查步骤</span></div><div class="stat"><strong>4</strong><span>典型错误路径</span></div><div class="stat"><strong id="best">0</strong><span>历史最高分</span></div></div></section><section class="panel notice"><strong>高风险安全边界</strong><p>本页面只用于理解装夹检查逻辑，不等于具备独立上机资格。实际夹具、压板、扭矩、支撑、工件材料、刀具通道和坐标重设要求，必须以夹具说明书、机床原厂手册、企业制度和现场授权人员指导为准。</p></section><div id="host"></div><section class="panel result" id="result"><small>模拟结果</small><div class="score" id="score">0</div><h2 id="result-title"></h2><p id="result-copy"></p><h3>本次错误</h3><ul class="errors" id="errors"></ul><button class="btn" id="restart-main" type="button">再练一次</button></section></main><nav class="bottom-nav" aria-label="平台主导航"><a href="./index.html">首页</a><a class="active" href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>
const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1';
const STEPS=[
{id:'wh-01',title:'装夹前第一件事是什么？',choices:['先拧紧压板，之后再找基准','清洁工作台、夹具、定位面和工件基准面，并确认无铁屑顶起','先输入G54'],correct:1,ok:'定位面必须清洁、贴实。铁屑或毛刺会让工件看似夹紧，实际处于悬空或倾斜状态。',bad:'跳过清洁会造成基准漂移、工件翘起和尺寸不稳定。应停止装夹，清洁并重新确认贴合。'},
{id:'wh-02',title:'选择定位面时，优先确认什么？',choices:['选择稳定、可重复且与图纸工艺基准一致的定位面','哪一面最亮就用哪一面','只要能夹住即可'],correct:0,ok:'定位面要稳定、可重复，并与图纸和工艺基准建立关系。',bad:'随意选面会导致坐标、尺寸和方向失去依据。应按受控图纸和工艺方案确认定位基准。'},
{id:'wh-03',title:'工件底面局部悬空时怎么办？',choices:['加大夹紧力把它压下去','按夹具方案检查支撑高度、垫铁和接触点，消除悬空后再夹紧','加工时降低进给即可'],correct:1,ok:'支撑必须稳定、等高并落在合理位置，不能用夹紧力强行消除悬空。',bad:'强压悬空工件可能造成变形、松动或加工后回弹。应重新调整支撑并复查贴合。'},
{id:'wh-04',title:'夹紧点应该如何选择？',choices:['尽量靠近受力区域和支撑点，并避免使工件翘曲','越远离工件越方便','只压一角最省时间'],correct:0,ok:'夹紧力应通过支撑形成稳定力路，避免悬臂受力和局部变形。',bad:'夹紧点错误会让工件翘起、旋转或振动。应重新布置夹紧点和支撑。'},
{id:'wh-05',title:'装夹后检查刀具通道时，应同时看什么？',choices:['只看刀尖是否能到达','刀具、刀柄、主轴鼻端与压板、夹具、工件的全路径间隙','只看程序终点'],correct:1,ok:'干涉检查必须覆盖刀具、刀柄和主轴部件在全部路径中的空间。',bad:'只看刀尖会漏掉刀柄和主轴与压板碰撞。应结合图形检查、空运行和现场观察。'},
{id:'wh-06',title:'重新装夹或更换定位后，G54应该怎么处理？',choices:['沿用上一次G54，省时间','重新测量、核对并记录工件坐标，不能默认旧值仍正确','只改程序中的X值'],correct:1,ok:'装夹关系改变后，工件零点关系也可能改变，必须重新核对坐标。',bad:'沿用旧G54可能造成整体偏移和碰撞。应按现场流程重新测量并复核。'},
{id:'wh-07',title:'夹紧完成后，哪项复查最可靠？',choices:['用手晃不动就算完成','按清单复查定位贴合、支撑、夹紧、紧固件、刀具通道和坐标标记','只拍照留档'],correct:1,ok:'清单式复查能减少遗漏，不能把“感觉很紧”当作装夹合格。',bad:'仅凭手感无法确认支撑、干涉和坐标。应逐项复查并由需要的人员确认。'},
{id:'wh-08',title:'首件启动前的正确做法是什么？',choices:['直接100%快移和进给运行','完成程序检查、图形检查、空运行、单段低倍率，并观察装夹是否松动或干涉','先加工完再测量'],correct:1,ok:'首件前要把装夹、坐标、刀补和路径串成验证闭环。',bad:'直接高速运行会放大装夹和坐标错误。应先空运行、单段和低倍率验证，异常立即停止。'}];
function safe(key,fallback){try{const v=JSON.parse(localStorage.getItem(key)||'null');return v&&typeof v==='object'?v:fallback}catch{return fallback}}
let index=0,correct=0,mistakes=[];
function render(){document.getElementById('result').className='panel result';document.getElementById('host').innerHTML=STEPS.map((s,i)=>`<section class="step ${i===index?'active':''}" data-step="${s.id}"><div class="meta"><span>步骤 ${i+1}/8</span><span>能力：装夹检查</span></div><h2>${s.title}</h2><div class="choices">${s.choices.map((c,j)=>`<button class="choice" data-choice="${j}" type="button">${c}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div></section>`).join('');bind()}
function bind(){const step=document.querySelector('.step.active');if(!step)return;step.querySelectorAll('.choice').forEach(btn=>btn.addEventListener('click',()=>answer(step,Number(btn.dataset.choice))))}
function answer(step,pick){const s=STEPS[index],ok=pick===s.correct,feedback=step.querySelector('.feedback');step.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(ok)correct++;else mistakes.push({id:s.id,title:s.title,reason:s.bad});feedback.className=`feedback show ${ok?'ok':'bad'}`;feedback.innerHTML=`<strong>${ok?'判断正确':'这一步有风险'}</strong><p>${ok?s.ok:s.bad}</p><button class="btn" id="next-step" type="button">${index===STEPS.length-1?'查看结果':'下一步'}</button>`;document.getElementById('next-step').addEventListener('click',()=>{index++;index>=STEPS.length?finish():render()})}
function finish(){const score=Math.round(correct/STEPS.length*100),passed=score===100,root=safe(KEY,{version:1,records:{}}),profile=safe(PROFILE,{version:1,xp:0});root.version=1;root.records=root.records&&typeof root.records==='object'?root.records:{};const old=root.records.workholdingCheck||{};root.records.workholdingCheck={bestScore:Math.max(Number(old.bestScore||0),score),lastScore:score,attempts:Number(old.attempts||0)+1,passed:Boolean(old.passed)||passed,lastErrors:mistakes.map(x=>x.id),lastCompletedAt:new Date().toISOString()};if(passed&&!old.passed){profile.version=1;profile.xp=Number(profile.xp||0)+80;profile.simulatorRewards={...(profile.simulatorRewards||{}),workholdingCheck:true}}localStorage.setItem(KEY,JSON.stringify(root));localStorage.setItem(PROFILE,JSON.stringify(profile));document.getElementById('host').innerHTML='';const result=document.getElementById('result');result.className=`panel result show ${passed?'pass':''}`;document.getElementById('score').textContent=score;document.getElementById('result-title').textContent=passed?'装夹检查流程通过':'还需要重新练习';document.getElementById('result-copy').textContent=passed?'8步全部判断正确，首次通过已记录80 XP。':'本模拟要求8步全部正确。请根据错误原因重新检查定位、支撑、夹紧、干涉和坐标。';document.getElementById('errors').innerHTML=mistakes.length?mistakes.map(x=>`<li><strong>${x.title}</strong><br>${x.reason}</li>`).join(''):'<li>本次无错误。</li>';loadBest()}
function restart(){index=0;correct=0;mistakes=[];render()}
function loadBest(){const r=safe(KEY,{records:{}});document.getElementById('best').textContent=Number(r.records?.workholdingCheck?.bestScore||0)}
document.getElementById('restart-top').addEventListener('click',restart);document.getElementById('restart-main').addEventListener('click',restart);loadBest();render();
</script></body></html>
