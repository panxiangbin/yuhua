<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>首件测量与超差排查模拟｜数控小潘</title><style>:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#355c73;--ok:#466b55;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 94px}.card,.step{margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px rgba(40,40,35,.07)}h1{font-size:28px}.muted{color:var(--muted);line-height:1.7}.btn,.choice,.back{min-height:46px;border:1px solid var(--line);border-radius:12px;font-weight:900;padding:11px 14px}.btn{background:var(--blue);color:#fff}.back{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;background:var(--card)}.choice{width:100%;text-align:left;background:#faf8f3;color:var(--ink);margin-top:9px}.step{display:none}.step.active{display:block}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:54px;font-weight:950;color:var(--blue)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f7;border-top:1px solid var(--line)}.nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px}</style></head><body><main class="shell"><a class="back" href="./training-camp.html">← 返回训练营</a><section class="card"><small>新手模拟训练 · 首件测量与超差排查</small><h1>先确认测量可信，再判断偏差来自哪里</h1><p class="muted">学习目标：掌握首件停机、测量准备、基准确认、关键尺寸测量、偏差分类、原因排查、授权修正与复验记录。适用FANUC类立式加工中心入门。实际量具、测量方法、补偿权限、停机方式和判定规则可能因系统、机型、工艺文件和企业制度不同而变化，请以原厂手册、受控工艺文件和现场条件为准，并由授权人员指导。</p><p><strong>历史最高分：</strong><span id="best">0</span></p></section><div id="host"></div><section class="card result" id="result"><div class="score" id="score">0</div><h2 id="title"></h2><p id="copy"></p><ul id="errors"></ul><button class="btn" id="restart" type="button">重新练习</button></section></main><nav class="nav"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1',ID='first-piece-inspection';const STEPS=[{id:'fp-01',t:'首件加工结束后，第一步应怎么做？',a:['不停机直接加工第二件','按规定停机并保留当前状态，确认工件可安全测量','先把刀补改大一点'],c:1,ok:'先停机并保留可追溯状态，避免边运行边测量。',bad:'继续加工会放大错误，也会丢失首件状态。'},{id:'fp-02',t:'测量前应先确认什么？',a:['量具校准状态、清洁、温度影响、测量基准和图纸版本','只看量具外观','只测最容易测的尺寸'],c:0,ok:'测量系统本身可信，结果才可用于判断。',bad:'量具、基准或图纸版本错误会制造假超差。'},{id:'fp-03',t:'首件尺寸应怎样选择？',a:['只测一个外形尺寸','按受控图纸和检验要求测关键尺寸、基准相关尺寸及高风险特征','只看表面是否光亮'],c:1,ok:'关键尺寸和基准链要形成完整判断。',bad:'单一尺寸无法判断整体偏移、刀补或装夹问题。'},{id:'fp-04',t:'发现多个尺寸同方向整体偏移，优先怀疑什么？',a:['工件坐标、装夹基准或整体定位偏移','随便一把刀磨损','立即改所有刀补'],c:0,ok:'整体同向偏移通常先查基准与坐标链。',bad:'盲改多把刀补会掩盖真正的基准错误。'},{id:'fp-05',t:'只有某把刀加工的尺寸超差，优先怎么排查？',a:['核对该刀实物、磨损、H/D补偿、装夹和程序调用','重设G54解决所有问题','继续加工观察几件'],c:0,ok:'单刀相关偏差先沿刀具数据链排查。',bad:'用G54修单刀问题会让其他尺寸一起偏移。'},{id:'fp-06',t:'尺寸波动大、重复测量不稳定时怎么办？',a:['取平均值直接放行','检查测量方法、毛刺、夹紧、刀具跳动、热状态和重复定位','直接加大夹紧力'],c:1,ok:'先区分测量不稳定与加工过程不稳定。',bad:'平均值不能掩盖过程波动和测量错误。'},{id:'fp-07',t:'确认需要修正补偿时，正确做法是？',a:['按权限和受控流程小量修正，记录前后值并重新验证','凭经验一次改到目标值','让任何人都可修改'],c:0,ok:'授权、小量、记录、复验是安全闭环。',bad:'大幅或无记录修改容易造成二次超差甚至碰撞。'},{id:'fp-08',t:'修正后怎样结束首件验证？',a:['只复测刚才超差的一个尺寸','重新加工或按流程复验相关尺寸，记录结果并经授权放行','看起来正常就批量生产'],c:1,ok:'复验相关尺寸并记录授权，首件闭环才完成。',bad:'局部修正可能影响关联尺寸，不能凭外观放行。'}];let i=0,wrong=[];const host=document.querySelector('#host');function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}function render(){host.innerHTML='';STEPS.forEach((s,n)=>{const el=document.createElement('section');el.className='step'+(n===i?' active':'');el.innerHTML=`<small>步骤 ${n+1}/8</small><h2>${s.t}</h2>${s.a.map((x,j)=>`<button class="choice" data-v="${j}" type="button">${x}</button>`).join('')}<div class="feedback" aria-live="polite"></div>`;host.append(el)});host.querySelectorAll('.choice').forEach(b=>b.onclick=answer)}function answer(e){const s=STEPS[i],v=Number(e.currentTarget.dataset.v),box=e.currentTarget.parentElement,fb=box.querySelector('.feedback'),ok=v===s.c;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=ok?s.ok:s.bad;if(!ok)wrong.push(s.id);setTimeout(()=>{i++;i<STEPS.length?render():finish()},120)}function finish(){host.innerHTML='';const score=Math.round((STEPS.length-wrong.length)/STEPS.length*100),passed=wrong.length===0,all=read(KEY,{version:1,records:{}}),prev=all.records[ID]||{};all.version=1;all.records[ID]={bestScore:Math.max(prev.bestScore||0,score),lastScore:score,attempts:(prev.attempts||0)+1,passed:Boolean(prev.passed||passed),wrongSteps:wrong.slice(),completedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(all));if(passed&&!prev.passed){const p=read(PROFILE,{version:1,xp:0,rewards:{},abilities:{}});p.version=1;p.xp=Number(p.xp||0)+80;p.rewards={...(p.rewards||{}),firstPieceInspection:true};p.abilities={...(p.abilities||{}),inspection:Math.max(Number(p.abilities?.inspection||0),80)};localStorage.setItem(PROFILE,JSON.stringify(p))}document.querySelector('#score').textContent=score;document.querySelector('#title').textContent=passed?'首件测量与超差排查模拟通过':'尚未通过：请重做错误步骤';document.querySelector('#copy').textContent=passed?'8步全部正确，首次通过奖励80 XP，并接入能力档案。':'只有8步全部正确才算通过。';document.querySelector('#errors').innerHTML=wrong.length?wrong.map(x=>`<li>${x}</li>`).join(''):'<li>本次无错误</li>';document.querySelector('#result').classList.add('show');refreshBest()}function refreshBest(){const d=read(KEY,{records:{}});document.querySelector('#best').textContent=d.records?.[ID]?.bestScore||0}document.querySelector('#restart').onclick=()=>{i=0;wrong=[];document.querySelector('#result').classList.remove('show');render()};refreshBest();render();</script></body></html>
