<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>图纸、对刀与加工流程15题｜数控小潘</title><meta name="description" content="面向零基础CNC新手的图纸识读、对刀步骤与加工流程15题专项。"><style>:root{--bg:#f3f0e9;--card:#fffdf8;--ink:#2b2f32;--muted:#687078;--line:#d8d2c6;--blue:#365b72;--ok:#3f6b50;--bad:#8a4034;--warn:#8b5b16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 96px}.top{display:flex;gap:10px}.btn,.back{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 15px;border:1px solid var(--line);border-radius:12px;font-weight:900;text-decoration:none}.back{background:var(--card);color:var(--ink)}.btn{background:var(--blue);color:#fff;cursor:pointer}.btn.secondary{background:var(--card);color:var(--blue)}.hero,.panel,.question{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 6px 16px rgba(48,44,36,.07)}h1{font-size:29px;line-height:1.2;margin:6px 0 10px}.hero p,.panel p{color:var(--muted);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:11px;border:1px solid var(--line);border-radius:11px;background:#f7f4ee;text-align:center}.stat strong{display:block;font-size:27px;color:var(--blue)}.notice{border-left:4px solid #d4a044}.notice strong{color:var(--warn)}.question{display:none}.question.active{display:block}.meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px;font-weight:800}.tag{padding:4px 7px;border:1px solid var(--line);border-radius:999px}.question h2{font-size:21px;line-height:1.45}.options{display:grid;gap:10px}.option{min-height:48px;display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf8f3;cursor:pointer}.option input{min-width:18px;min-height:18px;margin-top:3px}.option:has(input:checked){border-color:#8ea5b4;background:#edf2f5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.feedback{display:none;margin-top:12px;padding:12px;border-radius:11px;border:1px solid var(--line);line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:56px;font-weight:950;color:var(--blue)}.result.pass .score{color:var(--ok)}.result.fail .score{color:var(--bad)}.weak{padding:0;list-style:none;display:grid;gap:8px}.weak li{padding:10px;border:1px solid var(--line);border-radius:10px;background:#f7f4ee}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.97);border-top:1px solid var(--line)}.bottom-nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:13px;font-weight:900}.bottom-nav a.active{color:var(--blue)}@media(max-width:620px){.stats,.actions{grid-template-columns:1fr}.top>*{flex:1}h1{font-size:27px}}</style></head><body><main class="shell"><div class="top"><a class="back" href="./training-camp.html">← 返回训练营</a><button class="btn secondary" id="restart-top" type="button">重新练习</button></div><section class="hero"><small>专项训练 · 图纸识读＋对刀步骤＋加工流程</small><h1>15题练到会：先看懂、再设定、最后验证</h1><p>面向零基础新手，覆盖基准、尺寸、公差、装夹、对刀、H号、加工顺序、空运行和首件检查。示例以FANUC类立式加工中心为主。</p><div class="stats"><div class="stat"><strong>15</strong><span>原创题目</span></div><div class="stat"><strong>80</strong><span>通过分数</span></div><div class="stat"><strong id="best">0</strong><span>历史最高分</span></div></div></section><section class="panel notice"><strong>统一安全提示</strong><p>实际机床界面、按键名称、回零方式、刀补设置、报警处理和安全要求可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场条件为准。高风险操作必须由现场师傅或授权人员指导。</p></section><div id="host"></div><section class="panel result" id="result"><small>本次成绩</small><div class="score" id="score">0</div><h2 id="result-title"></h2><p id="result-copy"></p><h3>建议重练</h3><ul class="weak" id="weak"></ul><div class="actions"><button class="btn" id="redo-wrong" type="button">只重做错题</button><button class="btn secondary" id="restart-main" type="button">全部重练</button></div></section></main><nav class="bottom-nav" aria-label="平台主导航"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a class="active" href="./practice-drawing-setup-process.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_practice_v1';const QS=[{id:'dsp-01',course:'第4关 图纸识读基础',ability:'图纸识读',risk:'中',system:'通用',type:'single',title:'图纸上标注“以A面为基准”，最直接的含义是什么？',options:['A面只是外观面','相关尺寸和位置判断要以A面作为参照','所有刀具都从A面开始','A面必须朝上装夹'],answer:[1],explain:'基准是测量、定位和尺寸关系的参照，不等于固定的装夹方向。'},{id:'dsp-02',course:'第4关 图纸识读基础',ability:'图纸识读',risk:'中',system:'通用',type:'multi',title:'上机前读基础图纸时应核对哪些内容？',options:['尺寸与公差','基准和表面要求','孔位及轮廓关系','只看零件名称'],answer:[0,1,2],explain:'尺寸、公差、基准和特征关系共同决定加工与检验方法。'},{id:'dsp-03',course:'第4关 图纸识读基础',ability:'图纸识读',risk:'高',system:'通用',type:'judge',title:'图纸尺寸与现场工件状态矛盾时，可以先按经验加工再确认。',options:['正确','错误'],answer:[1],explain:'错误。应停止并核对受控图纸、工艺和现场状态，不能凭经验冒险。'},{id:'dsp-04',course:'第6关 工件装夹基础',ability:'装夹判断',risk:'高',system:'通用',type:'sequence',title:'装夹前更合理的流程是哪一项？',options:['清洁定位面→核对基准→检查支撑→夹紧→复查刀具通道','先大力夹紧→再看基准','装上就加工→超差再调整','只检查刀尖位置'],answer:[0],explain:'先保证定位面和支撑可靠，再夹紧并检查完整运动通道。'},{id:'dsp-05',course:'第6关 工件装夹基础',ability:'装夹判断',risk:'高',system:'通用',type:'multi',title:'哪些现象说明装夹可能不可靠？',options:['定位面夹有铁屑','支撑点悬空','夹紧点远离支撑','工件外观干净'],answer:[0,1,2],explain:'铁屑、悬空和受力不合理都可能造成位移、变形或振动。'},{id:'dsp-06',course:'第8关 对刀与刀长补偿',ability:'对刀流程',risk:'高',system:'FANUC类加工中心',type:'sequence',title:'重新装刀后的正确处理顺序是什么？',options:['核对刀具与刀位→重新测量→写入正确H号→安全位置验证','直接沿用旧H值→加工','只看T号一致→启动','先改G54→再测刀'],answer:[0],explain:'重新装刀后实际长度可能变化，必须重新测量、核对H号并安全验证。'},{id:'dsp-07',course:'第8关 对刀与刀长补偿',ability:'对刀流程',risk:'高',system:'FANUC类加工中心',type:'single',title:'程序使用T03 M06后，G43 H02最需要警惕什么？',options:['主轴转速太低','实物刀具与刀长补偿号可能错配','冷却液颜色','程序行号不连续'],answer:[1],explain:'T号和H号不一致可能导致错误刀长生效，必须核对实物、刀位和补偿记录。'},{id:'dsp-08',course:'第8关 对刀与刀长补偿',ability:'对刀流程',risk:'高',system:'机型相关',type:'judge',title:'只要H号中有数值，就说明刀长补偿可以安全使用。',options:['正确','错误'],answer:[1],explain:'错误。还要确认测量基准、单位、正负、数据来源和实物刀具对应关系。'},{id:'dsp-09',course:'第12关 完整程序与首件验证',ability:'加工流程',risk:'高',system:'FANUC类加工中心',type:'sequence',title:'新程序首次上机的安全验证顺序是什么？',options:['核对资料与实物→逐段检查→图形检查→空运行→单段低倍率→首件测量','直接自动运行→测量','只图形模拟→批量生产','先修改刀补→再核对图纸'],answer:[0],explain:'应逐级降低未知风险，任何一步都不能替代首件测量。'},{id:'dsp-10',course:'第9关 G00与G01',ability:'加工流程',risk:'高',system:'FANUC类加工中心',type:'single',title:'从一个孔位移动到另一个孔位前，最重要的动作顺序是什么？',options:['先走XY再抬Z','先退到确认过的安全Z，再移动XY','同时快速走XYZ','只降低进给倍率'],answer:[1],explain:'先离开工件和夹具危险高度，再进行平面移动，能降低干涉风险。'},{id:'dsp-11',course:'第11关 孔加工循环',ability:'加工流程',risk:'高',system:'FANUC类加工中心',type:'multi',title:'孔加工开始前应核对哪些项目？',options:['孔位坐标和G90/G91','G98/G99及R平面','刀具、H号和孔底Z','只看主轴是否转动'],answer:[0,1,2],explain:'孔位、退刀高度、刀长补偿和孔深共同决定安全与尺寸。'},{id:'dsp-12',course:'第12关 完整程序与首件验证',ability:'首件检查',risk:'高',system:'通用',type:'sequence',title:'首件超差后的正确处理流程是什么？',options:['停机保留状态→核对量具与基准→判断偏差来源→授权修正→复测关联尺寸→记录放行','立即大幅改刀补→继续加工','只复测一个尺寸→批量生产','删除报警记录→重启'],answer:[0],explain:'必须先保留证据和分类判断，再小量修正并复测关联尺寸。'},{id:'dsp-13',course:'第5关 机床坐标与工件坐标',ability:'坐标判断',risk:'高',system:'FANUC类加工中心',type:'single',title:'多个尺寸整体同向偏移时，优先排查什么？',options:['每把刀分别改补偿','G54、装夹基准和定位','主轴转速','冷却液浓度'],answer:[1],explain:'整体偏移更像坐标或定位问题，不应先用多把刀补掩盖根因。'},{id:'dsp-14',course:'第12关 完整程序与首件验证',ability:'安全验证',risk:'高',system:'通用',type:'judge',title:'空运行通过后，就可以跳过首件测量直接批量加工。',options:['正确','错误'],answer:[1],explain:'错误。空运行不能验证实际切削、装夹变形、刀具磨损和尺寸结果。'},{id:'dsp-15',course:'综合流程',ability:'加工流程',risk:'高',system:'通用',type:'multi',title:'加工流程中哪些步骤属于必须保留的验证闭环？',options:['记录程序与补偿版本','空运行和单段验证','首件测量与复验','只要师傅口头说可以'],answer:[0,1,2],explain:'可追溯记录、分层验证和首件复验共同构成安全闭环。'}];let set=QS,index=0,correct=0,wrong=[];function load(){try{return JSON.parse(localStorage.getItem(KEY))||{version:1,bestScores:{},history:[],wrongQuestions:[]}}catch(e){return{version:1,bestScores:{},history:[],wrongQuestions:[]}}}function save(v){localStorage.setItem(KEY,JSON.stringify(v))}function render(){const q=set[index],multi=q.type==='multi';document.getElementById('host').innerHTML=`<section class="question active"><div class="meta"><span class="tag">${index+1}/${set.length}</span><span class="tag">${q.type}</span><span class="tag">${q.course}</span><span class="tag">${q.ability}</span><span class="tag">风险${q.risk}</span><span class="tag">${q.system}</span></div><h2>${q.title}</h2><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="${multi?'checkbox':'radio'}" name="answer" value="${i}"><span>${o}</span></label>`).join('')}</div><div class="feedback"></div><div class="actions"><button class="btn submit" type="button">提交答案</button><button class="btn secondary next" type="button" disabled>${index===set.length-1?'查看成绩':'下一题'}</button></div></section>`;const card=document.querySelector('.question.active'),submit=card.querySelector('.submit'),next=card.querySelector('.next');submit.onclick=()=>{const selected=[...card.querySelectorAll('input:checked')].map(x=>+x.value).sort(),answer=[...q.answer].sort(),ok=JSON.stringify(selected)===JSON.stringify(answer),fb=card.querySelector('.feedback');if(!selected.length)return;if(ok)correct++;else wrong.push(q);card.querySelectorAll('input').forEach(x=>x.disabled=true);fb.className=`feedback show ${ok?'ok':'bad'}`;fb.textContent=`${ok?'回答正确':'回答错误'}。${q.explain}`;submit.disabled=true;next.disabled=false};next.onclick=()=>{if(index<set.length-1){index++;render()}else finish()}}function finish(){const score=Math.round(correct/set.length*100),pass=score>=80,data=load();data.version=1;data.bestScores=data.bestScores||{};data.history=Array.isArray(data.history)?data.history:[];data.wrongQuestions=Array.isArray(data.wrongQuestions)?data.wrongQuestions:[];data.bestScores.drawingSetupProcess=Math.max(data.bestScores.drawingSetupProcess||0,score);data.history.push({id:'drawingSetupProcess',score,answered:set.length,at:new Date().toISOString()});data.history=data.history.slice(-20);data.wrongQuestions=data.wrongQuestions.filter(x=>!/^dsp-/.test(x.id)).concat(wrong.map(q=>({...q,redoUrl:'./practice-drawing-setup-process.html'})));save(data);document.getElementById('host').innerHTML='';const r=document.getElementById('result');r.className=`panel result show ${pass?'pass':'fail'}`;document.getElementById('score').textContent=score;document.getElementById('result-title').textContent=pass?'已通过专项训练':'未达到80分';document.getElementById('result-copy').textContent=pass?'继续把图纸、对刀和加工流程用于真实案例练习。':'先重做错题，再按完整流程复盘。';document.getElementById('weak').innerHTML=wrong.length?wrong.map(q=>`<li><strong>${q.ability}</strong><br>${q.title}</li>`).join(''):'<li>本次没有错题。</li>';document.getElementById('best').textContent=data.bestScores.drawingSetupProcess||0}function restart(list=QS){set=list;index=0;correct=0;wrong=[];document.getElementById('result').className='panel result';render()}document.getElementById('restart-top').onclick=()=>restart();document.getElementById('restart-main').onclick=()=>restart();document.getElementById('redo-wrong').onclick=()=>{const d=load(),ids=new Set((d.wrongQuestions||[]).filter(x=>/^dsp-/.test(x.id)).map(x=>x.id)),list=QS.filter(q=>ids.has(q.id));restart(list.length?list:QS)};document.getElementById('best').textContent=load().bestScores?.drawingSetupProcess||0;window.__CNC_DRAWING_SETUP_PROCESS__={questions:QS};render();</script></body></html>
