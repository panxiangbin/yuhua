<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>报警排查与安全恢复｜数控小潘</title><style>:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#355c73;--ok:#466b55;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 94px}.card,.step{margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px rgba(40,40,35,.07)}h1{font-size:28px;line-height:1.25}.muted{color:var(--muted);line-height:1.7}.btn,.choice,.back{min-height:46px;border:1px solid var(--line);border-radius:12px;font-weight:900;padding:11px 14px}.btn{background:var(--blue);color:#fff}.back{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;background:var(--card)}.choice{width:100%;text-align:left;background:#faf8f3;color:var(--ink);margin-top:9px}.step{display:none}.step.active{display:block}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:54px;font-weight:950;color:var(--blue)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f7;border-top:1px solid var(--line)}.nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px}</style></head><body><main class="shell"><a class="back" href="./training-camp.html">← 返回训练营</a><section class="card"><small>新手模拟训练 · 报警排查与安全恢复</small><h1>报警不是“按复位就结束”，先保留现场，再查清原因</h1><p class="muted">学习目标：掌握报警出现后的安全停止、报警信息记录、现场状态核对、原因分类、授权处理、复位前确认和恢复后的分层验证。适用FANUC类立式加工中心入门。实际报警号、复位方法、联锁逻辑、参数权限和恢复步骤可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场条件为准，并由现场师傅或授权人员指导。</p><p><strong>内容类型：</strong>交互模拟　<strong>风险等级：</strong>高　<strong>核验状态：</strong>通用排查逻辑已交叉核对，具体报警必须核对原厂手册</p><p><strong>历史最高分：</strong><span id="best">0</span></p></section><div id="host"></div><section class="card result" id="result"><div class="score" id="score">0</div><h2 id="title"></h2><p id="copy"></p><ul id="errors"></ul><button class="btn" id="restart" type="button">重新练习</button></section></main><nav class="nav"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1',ID='alarm-troubleshooting';const STEPS=[{id:'at-01',t:'机床运行中出现报警，第一步应做什么？',a:['立即停止危险运动，确认人员和设备处于安全状态','连续按复位直到报警消失','先提高倍率看能否继续'],c:0,ok:'先控制风险，再开始诊断。',bad:'未确认安全就反复复位，可能让危险动作再次发生。'},{id:'at-02',t:'开始排查前，应记录哪些信息？',a:['完整报警号和文字、发生程序段、模式、轴位置、刀具、操作经过和现场现象','只记报警号最后两位','只拍一张屏幕照片即可'],c:0,ok:'完整现场记录有助于定位根因，也便于授权人员复核。',bad:'信息不完整会让后续排查靠猜测，破坏可追溯性。'},{id:'at-03',t:'报警发生后，现场检查应优先确认什么？',a:['刀具、工件、夹具、轴位置、干涉、切屑和异常声音是否存在','先修改参数','先删除当前程序段'],c:0,ok:'现场状态决定是否可以安全复位和移动。',bad:'不看实物状态就改参数或程序，可能掩盖碰撞、卡滞和装夹问题。'},{id:'at-04',t:'查阅报警含义时，正确做法是？',a:['按系统、机型和报警原文核对原厂手册及企业处置流程','直接套用网上相似报警答案','只凭经验判断'],c:0,ok:'相同编号在不同系统或机型上可能含义不同。',bad:'套用未经核验的处理方式，可能误改参数或绕过保护。'},{id:'at-05',t:'确认报警与操作、程序或现场状态有关后，应怎样处理？',a:['由授权人员按原因分类处理，并保留修改前后记录','同时修改多项数据直到报警消失','屏蔽报警继续加工'],c:0,ok:'一次只处理已确认的原因，才能验证修复是否有效。',bad:'多项同时修改会失去因果关系，也可能引入新的风险。'},{id:'at-06',t:'按下复位前，必须确认什么？',a:['危险源已解除、移动方向可控、人员离开危险区且恢复条件满足','报警文字暂时看不见','程序光标回到开头'],c:0,ok:'复位是恢复流程的一部分，不是诊断本身。',bad:'报警消失不代表机械、坐标、刀补或现场问题已经解决。'},{id:'at-07',t:'复位后首次恢复运动应怎样进行？',a:['按现场规定使用安全位置、单段、低倍率和必要的手动验证','直接自动循环启动','先把快速倍率调到100%'],c:0,ok:'恢复后需要分层验证，防止原问题或新问题再次触发。',bad:'直接自动运行可能让尚未查清的问题迅速扩大。'},{id:'at-08',t:'报警重复出现或原因不明时，正确处理是什么？',a:['立即停止，保留记录，升级给现场师傅、维修或厂家技术人员','继续反复复位','删除报警记录后再试'],c:0,ok:'原因不明就停止升级，不允许凭猜测继续。',bad:'反复复位会掩盖根因，并可能造成设备损伤或人员风险。'}];let i=0,wrong=[];const host=document.querySelector('#host');function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}function render(){host.innerHTML='';STEPS.forEach((s,n)=>{const el=document.createElement('section');el.className='step'+(n===i?' active':'');el.innerHTML=`<small>步骤 ${n+1}/8</small><h2>${s.t}</h2>${s.a.map((x,j)=>`<button class="choice" data-v="${j}" type="button">${x}</button>`).join('')}<div class="feedback" aria-live="polite"></div>`;host.append(el)});host.querySelectorAll('.choice').forEach(b=>b.onclick=answer)}function answer(e){const s=STEPS[i],v=Number(e.currentTarget.dataset.v),box=e.currentTarget.parentElement,fb=box.querySelector('.feedback'),ok=v===s.c;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=ok?s.ok:s.bad;if(!ok)wrong.push(s.id);setTimeout(()=>{i++;i<STEPS.length?render():finish()},120)}function finish(){host.innerHTML='';const score=Math.round((8-wrong.length)/8*100),passed=score===100,now=new Date().toISOString(),data=read(KEY,{version:1,records:{}}),old=data.records[ID]||{};data.version=1;data.records[ID]={bestScore:Math.max(old.bestScore||0,score),lastScore:score,attempts:(old.attempts||0)+1,passed:Boolean(old.passed||passed),wrongSteps:[...wrong],lastCompletedAt:now};localStorage.setItem(KEY,JSON.stringify(data));const profile=read(PROFILE,{version:1,xp:0,rewards:{},abilities:{}});profile.version=1;profile.rewards=profile.rewards||{};profile.abilities=profile.abilities||{};if(passed&&!profile.rewards[ID]){profile.xp=(Number(profile.xp)||0)+80;profile.rewards[ID]=now}profile.abilities.troubleshooting=Math.max(Number(profile.abilities.troubleshooting)||0,score);localStorage.setItem(PROFILE,JSON.stringify(profile));document.querySelector('#score').textContent=score;document.querySelector('#title').textContent=passed?'模拟通过':'尚未通过';document.querySelector('#copy').textContent=passed?'你已完成报警记录、原因核对、授权处理和安全恢复训练。':'必须8步全部正确才算通过，请重新练习错误步骤。';document.querySelector('#errors').innerHTML=wrong.map(x=>`<li>${x}</li>`).join('');document.querySelector('#result').classList.add('show');document.querySelector('#best').textContent=data.records[ID].bestScore}document.querySelector('#restart').onclick=()=>{i=0;wrong=[];document.querySelector('#result').classList.remove('show');render()};document.querySelector('#best').textContent=(read(KEY,{records:{}}).records[ID]||{}).bestScore||0;render();</script></body></html>
