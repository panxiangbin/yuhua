<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>阶段训练证书｜数控小潘 CNC新手训练平台</title>
  <style>
    :root{color-scheme:light;--bg:#f1efe9;--surface:#fffdf9;--ink:#292c2f;--muted:#687078;--blue:#3f6179;--line:#d8d3c8;--ok:#466b55;--warn:#9a6518}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:18px 14px 34px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.back,.action{display:inline-flex;min-height:44px;align-items:center;justify-content:center;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:900;box-shadow:0 2px 0 rgba(41,44,47,.08);cursor:pointer}.action{color:#fff;background:var(--blue);border-color:#34546b}.action.secondary{color:var(--ink);background:var(--surface);border-color:var(--line)}.certificate,.summary,.abilities,.scores,.notice{margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 6px 16px rgba(48,44,36,.07)}.certificate{padding:20px;text-align:center}.certificate small{color:var(--blue);font-weight:950;letter-spacing:.08em}.certificate h1{margin:8px 0 4px;font-size:31px}.certificate .status{display:inline-flex;margin-top:12px;padding:8px 12px;border:1px solid #b6c3b9;border-radius:999px;background:#edf3ee;color:var(--ok);font-weight:950}.certificate .status.is-progress{border-color:#d6c49f;background:#fff8e8;color:var(--warn)}.certificate p,.notice{color:var(--muted);line-height:1.65}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}.metric{padding:12px;border:1px solid var(--line);border-radius:10px;background:#f7f4ee}.metric strong{display:block;font-size:27px}.metric span{font-size:12px;color:var(--muted);font-weight:800}.abilities,.scores{padding:16px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:end}.section-head h2{margin:0;font-size:21px}.section-head p{margin:0;color:var(--muted);font-size:12px;text-align:right}.ability-list,.score-list{display:grid;gap:9px;margin-top:12px}.ability,.score{padding:12px;border:1px solid var(--line);border-radius:10px;background:#f7f4ee}.ability-head,.score-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.ability strong,.score strong{font-size:21px}.ability span,.score span{font-size:12px;color:var(--muted);font-weight:850}.track{height:9px;margin-top:9px;border-radius:99px;background:#e5e0d7;overflow:hidden}.track i{display:block;height:100%;background:var(--blue)}.notice{padding:14px}.notice strong{display:block;color:var(--ink);margin-bottom:5px}.share-status{min-height:24px;margin:10px 2px 0;color:var(--muted);font-size:13px;font-weight:800}
    @media(max-width:520px){.toolbar{display:grid;grid-template-columns:1fr 1fr}.back{grid-column:1/-1}.summary{grid-template-columns:1fr 1fr}.certificate h1{font-size:27px}.section-head{align-items:flex-start;flex-direction:column}.section-head p{text-align:left}.ability-list,.score-list{grid-template-columns:1fr}}
    @media print{body{background:#fff}.shell{width:100%;max-width:none;padding:0}.toolbar,.share-status{display:none!important}.certificate,.summary,.abilities,.scores,.notice{box-shadow:none;break-inside:avoid}.notice{font-size:11px}.score-list,.ability-list{grid-template-columns:1fr 1fr}.score,.ability{break-inside:avoid}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="toolbar" aria-label="证书操作">
      <a class="back" href="./training-achievements.html">← 返回成长成果</a>
      <button class="action secondary" id="share-certificate" type="button">分享阶段成果</button>
      <button class="action" id="print-certificate" type="button">打印 / 保存PDF</button>
    </div>
    <div class="share-status" id="share-status" role="status" aria-live="polite"></div>
    <section class="certificate" aria-labelledby="certificate-title">
      <small>CNC 新手训练营</small>
      <h1 id="certificate-title">阶段训练证书</h1>
      <p>根据本机保存的12关成绩、六维能力、训练天数与徽章自动生成，用于回顾当前学习阶段。</p>
      <div class="status is-progress" id="certificate-status">训练进行中</div>
    </section>
    <section class="summary" aria-label="阶段训练统计">
      <div class="metric"><strong id="passed">0/12</strong><span>已通过课程</span></div>
      <div class="metric"><strong id="average">0</strong><span>平均成绩</span></div>
      <div class="metric"><strong id="days">0</strong><span>累计训练天数</span></div>
      <div class="metric"><strong id="badges">0</strong><span>已获得徽章</span></div>
    </section>
    <section class="abilities" aria-labelledby="ability-title"><div class="section-head"><h2 id="ability-title">六维能力</h2><p>按安全、坐标、对刀、编程、工艺和首件验证统计</p></div><div class="ability-list" id="ability-list" role="list"></div></section>
    <section class="scores" aria-labelledby="score-title"><div class="section-head"><h2 id="score-title">12关成绩</h2><p>80分及以上视为达标</p></div><div class="score-list" id="score-list" role="list"></div></section>
    <section class="notice"><strong>重要说明</strong>本页面只是本站阶段训练记录，不是职业资格证书，也不能证明具备独立上机能力。真实机床操作必须在合格人员指导下进行，并以原厂手册、企业制度和现场条件为准。</section>
  </main>
  <script>
  (function(){'use strict';var BUILD='20260724c',PRACTICE='cnc_training_practice_v1',PROFILE='cnc_training_profile_v1',DONE='cnc_study_completed_v1';var ABILITIES=[['安全操作',[3,12]],['坐标基础',[2,6]],['对刀装夹',[4,5]],['编程基础',[1,7,9,10]],['刀具工艺',[8]],['首件验证与排障',[11,12]]];function read(k,f){try{var v=JSON.parse(localStorage.getItem(k));return v==null?f:v;}catch(e){return f;}}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}var practice=read(PRACTICE,{lessonScores:{}}),profile=read(PROFILE,{trainingDays:[],badges:[]}),done=(read(DONE,[])||[]).map(Number),scores=practice.lessonScores||{},lessons=Array.from({length:12},function(_,i){var level=i+1,score=Math.max(Number(scores[level]||0),done.indexOf(level)!==-1?80:0);return{level:level,score:Math.min(100,score),passed:score>=80};}),passed=lessons.filter(function(x){return x.passed;}).length,average=Math.round(lessons.reduce(function(sum,x){return sum+x.score;},0)/12),abilities=ABILITIES.map(function(item){var score=Math.round(item[1].reduce(function(sum,l){return sum+lessons[l-1].score;},0)/item[1].length);return{name:item[0],score:score,status:score>=80?'已掌握':score>=60?'接近达标':score>0?'需要加强':'尚未训练'};}),days=Array.isArray(profile.trainingDays)?profile.trainingDays.length:0,badges=Array.isArray(profile.badges)?profile.badges.length:0,graduated=passed===12&&average>=80;document.getElementById('passed').textContent=passed+'/12';document.getElementById('average').textContent=average;document.getElementById('days').textContent=days;document.getElementById('badges').textContent=badges;var status=document.getElementById('certificate-status');status.textContent=graduated?'基础训练营已达标':'训练进行中';status.classList.toggle('is-progress',!graduated);document.getElementById('ability-list').innerHTML=abilities.map(function(x){return'<article class="ability" role="listitem"><div class="ability-head"><div><strong>'+esc(x.name)+'</strong><span>'+esc(x.status)+'</span></div><strong>'+x.score+'<span>/100</span></strong></div><div class="track" aria-label="'+esc(x.name)+' '+x.score+' 分"><i style="width:'+x.score+'%"></i></div></article>';}).join('');document.getElementById('score-list').innerHTML=lessons.map(function(x){return'<article class="score" role="listitem"><div class="score-head"><strong>第 '+x.level+' 关</strong><strong>'+x.score+'<span>/100</span></strong></div><div class="track" aria-label="第 '+x.level+' 关 '+x.score+' 分"><i style="width:'+x.score+'%"></i></div><span>'+(x.passed?'已达标':'未达标')+'</span></article>';}).join('');var feedback=document.getElementById('share-status');function shareText(){return'数控小潘 CNC新手训练平台：已通过 '+passed+'/12 关，平均成绩 '+average+' 分，累计训练 '+days+' 天。阶段状态：'+(graduated?'基础训练营已达标':'训练进行中')+'。';}document.getElementById('print-certificate').addEventListener('click',function(){window.print();});document.getElementById('share-certificate').addEventListener('click',async function(){var data={title:'CNC阶段训练成果',text:shareText(),url:location.href};try{if(navigator.share){await navigator.share(data);feedback.textContent='已打开系统分享。';return;}if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(data.text+' '+data.url);feedback.textContent='阶段成果和链接已复制。';return;}feedback.textContent='当前浏览器不支持系统分享，请使用打印 / 保存PDF。';}catch(e){if(e&&e.name==='AbortError'){feedback.textContent='已取消分享。';return;}feedback.textContent='分享失败，请使用打印 / 保存PDF。';}});document.body.dataset.trainingCertificate='ready';window.CNC_TRAINING_CERTIFICATE={build:BUILD,snapshot:function(){return{passed:passed,average:average,days:days,badges:badges,graduated:graduated,abilities:abilities.map(function(x){return x.score;})};},shareText:shareText};})();
  </script>
</body>
</html>
