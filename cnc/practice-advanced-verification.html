<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>程序验证与异常排查15题｜数控小潘</title>
<meta name="description" content="面向CNC新手的程序排序、报警排查、参数风险、首件检查15题专项练习。">
<style>
:root{--bg:#f3f0e9;--card:#fffdf8;--ink:#2b2f32;--muted:#687078;--line:#d8d2c6;--blue:#365b72;--ok:#3f6b50;--bad:#8a4034;--warn:#8b5b16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 96px}.top{display:flex;gap:10px}.btn,.back{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 15px;border:1px solid var(--line);border-radius:12px;font-weight:900;text-decoration:none}.back{background:var(--card);color:var(--ink)}.btn{background:var(--blue);color:#fff;cursor:pointer}.btn.secondary{background:var(--card);color:var(--blue)}.hero,.panel,.question{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 6px 16px rgba(48,44,36,.07)}h1{font-size:29px;line-height:1.2;margin:6px 0 10px}.hero p,.panel p{color:var(--muted);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:11px;border:1px solid var(--line);border-radius:11px;background:#f7f4ee;text-align:center}.stat strong{display:block;font-size:27px;color:var(--blue)}.notice{border-left:4px solid #d4a044}.notice strong{color:var(--warn)}.question{display:none}.question.active{display:block}.meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px;font-weight:800}.tag{padding:4px 7px;border:1px solid var(--line);border-radius:999px}.question h2{font-size:21px;line-height:1.45}.options{display:grid;gap:10px}.option{min-height:48px;display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf8f3;cursor:pointer}.option input{min-width:18px;min-height:18px;margin-top:3px}.option:has(input:checked){border-color:#8ea5b4;background:#edf2f5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.feedback{display:none;margin-top:12px;padding:12px;border-radius:11px;border:1px solid var(--line);line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:56px;font-weight:950;color:var(--blue)}.result.pass .score{color:var(--ok)}.result.fail .score{color:var(--bad)}.weak{padding:0;list-style:none;display:grid;gap:8px}.weak li{padding:10px;border:1px solid var(--line);border-radius:10px;background:#f7f4ee}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.97);border-top:1px solid var(--line)}.bottom-nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:13px;font-weight:900}.bottom-nav a.active{color:var(--blue)}@media(max-width:620px){.stats,.actions{grid-template-columns:1fr}.top>*{flex:1}h1{font-size:27px}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><a class="back" href="./training-camp.html">← 返回训练营</a><button class="btn secondary" id="restart-top" type="button">重新练习</button></div>
<section class="hero"><small>高级专项 · 程序验证＋异常排查</small><h1>15题练到会：程序上机前，先把风险判断练准确</h1><p>覆盖程序段排序、报警排查、参数风险判断、首件检查、孔加工异常和刀补修正边界。题目围绕FANUC类立式加工中心入门场景原创设计。</p><div class="stats"><div class="stat"><strong>15</strong><span>有效题目</span></div><div class="stat"><strong>80</strong><span>通过分数</span></div><div class="stat"><strong id="best">0</strong><span>历史最高分</span></div></div></section>
<section class="panel notice"><strong>统一安全提示</strong><p>实际机床界面、按键名称、回零方式、刀补设置、报警处理和安全要求可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场条件为准。高风险操作必须由现场师傅或授权人员指导。</p></section>
<div id="host"></div>
<section class="panel result" id="result"><small>本次成绩</small><div class="score" id="score">0</div><h2 id="result-title"></h2><p id="result-copy"></p><h3>建议重练</h3><ul class="weak" id="weak"></ul><div class="actions"><button class="btn" id="redo-wrong" type="button">只重做错题</button><button class="btn secondary" id="restart-main" type="button">全部重练</button></div></section>
</main>
<nav class="bottom-nav" aria-label="平台主导航"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a class="active" href="./practice-advanced-verification.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav>
<script>
const KEY='cnc_training_practice_v1';
const QS=[
{id:'av-01',course:'第12关 完整程序与首件验证',ability:'程序验证',risk:'高',system:'FANUC类加工中心',type:'sequence',title:'首次验证程序时，哪一组顺序更安全？',options:['核对图纸与实物→逐段检查→图形检查→空运行→单段低倍率→首件测量','图形看起来正常→直接自动加工→测量','先改刀补→再核对程序→批量加工','只看程序无报警→循环启动'],answer:[0],explain:'完整验证必须从资料和实物核对开始，再逐级降低未知风险。图形检查不能替代空运行、单段和首件测量。'},
{id:'av-02',course:'第12关 完整程序与首件验证',ability:'程序验证',risk:'高',system:'通用',type:'multi',title:'程序上机前应同时核对哪些项目？',options:['受控图纸与程序版本','装夹、G54与刀具清单','H/D号及安全高度','只确认程序文件能打开'],answer:[0,1,2],explain:'程序能打开只说明文件可读取，不代表坐标、刀具、装夹和安全路径正确。'},
{id:'av-03',course:'报警排查模拟',ability:'故障排查',risk:'高',system:'机型相关',type:'single',title:'出现报警后，最先应该做什么？',options:['连续按复位','停止危险运动并记录完整报警信息','直接修改参数','网上搜索相似报警照做'],answer:[1],explain:'先确保人员设备安全，再记录报警号、文字、程序段、模式、轴位置和操作经过。'},
{id:'av-04',course:'报警排查模拟',ability:'故障排查',risk:'高',system:'机型相关',type:'judge',title:'报警消失就代表故障原因已经排除。',options:['正确','错误'],answer:[1],explain:'错误。复位只可能清除报警状态，不能证明根因已经消除，必须按原因验证。'},
{id:'av-05',course:'报警排查模拟',ability:'故障排查',risk:'高',system:'机型相关',type:'multi',title:'报警记录应包含哪些信息？',options:['完整报警号和文字','当前程序段、模式和轴位置','刀具、工件及操作经过','只记大概意思'],answer:[0,1,2],explain:'完整记录是复现、排查和安全恢复的基础，不能只记一个模糊结论。'},
{id:'av-06',course:'刀补风险判断模拟',ability:'刀补风险',risk:'高',system:'FANUC类',type:'single',title:'多个尺寸整体同向偏移时，优先排查什么？',options:['同时修改多把刀补','G54、装夹基准和定位','主轴冷却液颜色','只改最后一把刀'],answer:[1],explain:'整体同向偏移更像坐标或定位问题，不能先用多把刀补掩盖根因。'},
{id:'av-07',course:'刀补风险判断模拟',ability:'刀补风险',risk:'高',system:'FANUC类',type:'judge',title:'尺寸偏差0.20 mm，就应一次性把刀补改0.20 mm。',options:['正确','错误'],answer:[1],explain:'错误。必须先确认测量、基准、刀具、补偿方向和实际加工关系，再按权限小量、分步修改并复验。'},
{id:'av-08',course:'刀补风险判断模拟',ability:'参数风险',risk:'高',system:'参数相关',type:'multi',title:'修改H/D补偿前必须确认哪些内容？',options:['目标补偿号','正负方向与单位','当前值和数据来源','只凭经验判断'],answer:[0,1,2],explain:'补偿号、方向、单位和原值都可能直接造成过切或碰撞。'},
{id:'av-09',course:'孔加工循环',ability:'孔加工排查',risk:'高',system:'FANUC类',type:'single',title:'孔间移动撞压板，优先检查什么？',options:['主轴转速','G98/G99、R平面与夹具最高点','孔底停留时间','刀具品牌'],answer:[1],explain:'孔间退刀高度不足会导致刀具或刀柄跨越夹具时碰撞，应先核对退刀方式和R平面。'},
{id:'av-10',course:'孔加工循环',ability:'孔加工排查',risk:'高',system:'FANUC类',type:'judge',title:'固定循环结束后忘记G80，后续位置可能继续执行钻孔动作。',options:['正确','错误'],answer:[0],explain:'正确。固定循环通常具有模态性，必须在适当位置用G80取消。'},
{id:'av-11',course:'孔加工循环',ability:'参数风险',risk:'高',system:'机型相关',type:'single',title:'深孔排屑差时，正确做法是什么？',options:['盲目增大Q值','核对刀具、冷却、排屑和循环参数后再调整','提高倍率硬钻','取消安全高度'],answer:[1],explain:'Q值含义和单位可能机型相关，必须结合刀具、材料、冷却和原厂手册判断。'},
{id:'av-12',course:'首件测量',ability:'首件检查',risk:'高',system:'通用',type:'sequence',title:'首件超差后的正确闭环顺序是哪一项？',options:['停机保留状态→核对量具与基准→分类判断偏差来源→授权修正→复测关联尺寸→记录放行','直接修改刀补→继续生产','取多次平均值→放行','只测一个尺寸→批量加工'],answer:[0],explain:'首件超差必须先保留证据、判断来源，再小量修正并复测相关尺寸。'},
{id:'av-13',course:'首件测量',ability:'测量诊断',risk:'中',system:'通用',type:'single',title:'同一尺寸多次测量结果忽大忽小时，优先做什么？',options:['立即修改刀补','检查量具、清洁、测量位置和方法一致性','修改G54','直接取平均值'],answer:[1],explain:'先排除测量系统不稳定，否则会把测量波动误判成加工误差。'},
{id:'av-14',course:'单段与首次接近',ability:'安全验证',risk:'高',system:'FANUC类',type:'multi',title:'首次接近工件时应同时使用哪些控制？',options:['单段','低快速倍率与低进给倍率','预判下一程序段','关闭防护观察'],answer:[0,1,2],explain:'单段、倍率和段落预判共同降低未知风险，但不能替代正确程序、坐标和刀补。'},
{id:'av-15',course:'图形模拟',ability:'程序验证',risk:'高',system:'机型相关',type:'single',title:'图形模拟显示正常后，下一步应是什么？',options:['直接自动高倍率加工','继续空运行、单段、低倍率和首件验证','删除所有报警记录','跳过实物核对'],answer:[1],explain:'图形模拟不能完整反映实物刀具、夹具、补偿、机床参数和现场条件。'}
];
let active=[...QS],index=0,correct=0,wrong=[],answered=false;
const normalize=a=>[...a].sort((x,y)=>x-y).join(',');
function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
function write(data){localStorage.setItem(KEY,JSON.stringify(data))}
function render(){const q=active[index];document.getElementById('result').className='panel result';document.getElementById('host').innerHTML=`<section class="question active"><div class="meta"><span class="tag">${index+1}/${active.length}</span><span class="tag">${q.course}</span><span class="tag">${q.ability}</span><span class="tag">风险：${q.risk}</span><span class="tag">${q.system}</span></div><h2>${q.title}</h2><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="${q.type==='multi'?'checkbox':'radio'}" name="answer" value="${i}"><span>${o}</span></label>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn" id="submit" type="button">提交答案</button><button class="btn secondary" id="next" type="button" disabled>${index===active.length-1?'查看成绩':'下一题'}</button></div></section>`;document.getElementById('submit').onclick=submit;document.getElementById('next').onclick=next;answered=false}
function submit(){if(answered)return;const q=active[index];const picked=[...document.querySelectorAll('input:checked')].map(x=>+x.value);if(!picked.length)return;const ok=normalize(picked)===normalize(q.answer);answered=true;if(ok)correct++;else wrong.push(q);const f=document.getElementById('feedback');f.className='feedback show '+(ok?'ok':'bad');f.innerHTML=`<strong>${ok?'回答正确':'回答错误'}</strong><br>${q.explain}`;document.getElementById('next').disabled=false;document.getElementById('submit').disabled=true}
function next(){if(index<active.length-1){index++;render()}else finish()}
function finish(){const score=Math.round(correct/active.length*100),pass=score>=80,data=read(),history=Array.isArray(data.history)?data.history:[];data.version=1;data.bestScores=data.bestScores||{};data.bestScores.advancedVerification=Math.max(Number(data.bestScores.advancedVerification)||0,score);data.history=[...history,{id:'advanced-verification',score,passed:pass,answered:active.length,at:new Date().toISOString()}].slice(-20);data.wrongQuestions=Array.isArray(data.wrongQuestions)?data.wrongQuestions:[];const wrongIds=new Set(wrong.map(q=>q.id));data.wrongQuestions=data.wrongQuestions.filter(x=>!QS.some(q=>q.id===x.id));wrong.forEach(q=>data.wrongQuestions.push({id:q.id,title:q.title,course:q.course,ability:q.ability,risk:q.risk,system:q.system,explain:q.explain,redoUrl:'./practice-advanced-verification.html'}));write(data);document.getElementById('best').textContent=data.bestScores.advancedVerification;document.getElementById('host').innerHTML='';const r=document.getElementById('result');r.className='panel result show '+(pass?'pass':'fail');document.getElementById('score').textContent=score;document.getElementById('result-title').textContent=pass?'已通过高级专项':'未达到80分';document.getElementById('result-copy').textContent=pass?'继续把错题重做，直到能说清每项风险。':'先重做错题，再回到相关课程与模拟训练。';document.getElementById('weak').innerHTML=wrong.length?wrong.map(q=>`<li><strong>${q.ability}</strong>：${q.title}</li>`).join(''):'<li>本次无错题，可进入下一阶段训练。</li>';document.getElementById('redo-wrong').disabled=!wrong.length;document.getElementById('redo-wrong').onclick=()=>start(wrong);document.getElementById('restart-main').onclick=()=>start(QS)}
function start(list){active=[...list];index=0;correct=0;wrong=[];render()}
document.getElementById('restart-top').onclick=()=>start(QS);const saved=read();document.getElementById('best').textContent=Number(saved.bestScores?.advancedVerification)||0;render();
window.__CNC_ADVANCED_PRACTICE__={questions:QS,read};
</script>
</body>
</html>
