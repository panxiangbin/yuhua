<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>程序检查与空运行模拟｜数控小潘</title><style>:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#355c73;--ok:#466b55;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 94px}.card,.step{margin-top:14px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 6px 16px rgba(40,40,35,.07)}h1{font-size:28px}.muted{color:var(--muted);line-height:1.7}.btn,.choice,.back{min-height:46px;border:1px solid var(--line);border-radius:12px;font-weight:900;padding:11px 14px}.btn{background:var(--blue);color:#fff}.back{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none;background:var(--card)}.choice{width:100%;text-align:left;background:#faf8f3;color:var(--ink);margin-top:9px}.step{display:none}.step.active{display:block}.feedback{display:none;margin-top:12px;padding:12px;border-radius:10px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:54px;font-weight:950;color:var(--blue)}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f7;border-top:1px solid var(--line)}.nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-weight:900;font-size:13px}</style></head><body><main class="shell"><a class="back" href="./training-camp.html">← 返回训练营</a><section class="card"><small>新手模拟训练 · 程序检查与空运行</small><h1>程序能读懂、路径能验证、风险能停住，才有资格进入首件试切</h1><p class="muted">本模拟包含8步正确路径与多类错误。实际图形检查、空运行、单段、倍率、机床锁住、Z轴抬高方式和安全要求可能因系统、机型、厂家参数和企业制度不同而变化，请以原厂手册、企业安全制度和现场条件为准，并由授权人员指导。</p><p><strong>历史最高分：</strong><span id="best">0</span></p></section><div id="host"></div><section class="card result" id="result"><div class="score" id="score">0</div><h2 id="title"></h2><p id="copy"></p><ul id="errors"></ul><button class="btn" id="restart" type="button">重新练习</button></section></main><nav class="nav"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1',ID='program-dry-run';const STEPS=[{id:'pd-01',t:'开始验证前，第一项应确认什么？',a:['直接按循环启动','核对受控图纸、程序版本、毛坯、装夹、刀具清单和加工基准','先把倍率调到100%'],c:1,ok:'先确认输入条件一致，后面的路径验证才有意义。',bad:'版本、装夹或刀具不一致时，程序再正确也可能发生碰撞或报废。'},{id:'pd-02',t:'逐段读程序时应重点核对什么？',a:['只看程序有没有报警','坐标系、刀具与H号、模态状态、安全高度、进给、主轴和循环取消','只看最后一行M30'],c:1,ok:'逐段核对状态与动作，才能发现隐藏的模态和数据链错误。',bad:'只看语法报警无法发现G54、H号、平面或安全高度错误。'},{id:'pd-03',t:'图形检查的正确定位是什么？',a:['图形正确就可以直接加工','用于检查明显路径和方向，但不能替代实物、装夹和补偿核对','只用于看刀具颜色'],c:1,ok:'图形检查是筛查工具，不是安全保证。',bad:'仿真通常无法完整反映真实刀柄、压板、毛坯和补偿状态。'},{id:'pd-04',t:'进入空运行前应怎样设置？',a:['按现场规定设置安全位置、单段、低倍率和可随时停止的观察方式','关闭单段提高效率','让人员靠近观察刀尖'],c:0,ok:'先把速度、距离和停止条件控制住。',bad:'高速连续运行会让小错误迅速变成碰撞。'},{id:'pd-05',t:'首次验证移动顺序时应重点观察什么？',a:['只看终点是否正确','先抬安全Z、再走XY、接近工件时改受控进给，并检查刀柄与夹具通道','只看主轴是否旋转'],c:1,ok:'终点正确不代表中间路径安全。',bad:'刀具或刀柄可能在中间路径扫过压板、工件或夹具。'},{id:'pd-06',t:'发现坐标、H号、模态或路径与预期不一致时？',a:['立即停止，查清程序与现场数据后再重新验证','先降低倍率继续','凭经验临时改一个数'],c:0,ok:'状态不明时停止并查清真实原因。',bad:'边运行边猜测修改会扩大风险并破坏问题追溯。'},{id:'pd-07',t:'空运行通过后，进入首件前还需要什么？',a:['直接批量加工','继续用单段、低倍率和安全距离做首次接近，并确认测量计划','把倍率直接调满'],c:1,ok:'空运行通过不等于切削状态安全。',bad:'切削负载、毛坯差异和实际补偿仍需首件验证。'},{id:'pd-08',t:'首件试切后的正确闭环是什么？',a:['尺寸差就随意改刀补','停机测量关键尺寸，分析偏差来源，经授权修正并重新验证后记录结果','只看表面亮不亮'],c:1,ok:'测量、分析、修正、复验和记录构成首件闭环。',bad:'盲目改补偿可能把装夹、刀具磨损或基准错误掩盖掉。'}];let i=0,wrong=[];const host=document.querySelector('#host');function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d}catch{return d}}function render(){host.innerHTML='';STEPS.forEach((s,n)=>{const el=document.createElement('section');el.className='step'+(n===i?' active':'');el.innerHTML=`<small>步骤 ${n+1}/8</small><h2>${s.t}</h2>${s.a.map((x,j)=>`<button class="choice" data-v="${j}" type="button">${x}</button>`).join('')}<div class="feedback" aria-live="polite"></div>`;host.append(el)});host.querySelectorAll('.choice').forEach(b=>b.onclick=answer)}function answer(e){const s=STEPS[i],v=Number(e.currentTarget.dataset.v),box=e.currentTarget.parentElement,fb=box.querySelector('.feedback'),ok=v===s.c;box.querySelectorAll('.choice').forEach(x=>x.disabled=true);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=ok?s.ok:s.bad;if(!ok)wrong.push(s.id);setTimeout(()=>{i++;i<STEPS.length?render():finish()},120)}function finish(){host.innerHTML='';const score=Math.round((STEPS.length-wrong.length)/STEPS.length*100),passed=wrong.length===0,all=read(KEY,{version:1,records:{}}),prev=all.records[ID]||{};all.version=1;all.records[ID]={bestScore:Math.max(prev.bestScore||0,score),lastScore:score,attempts:(prev.attempts||0)+1,passed:Boolean(prev.passed||passed),wrongSteps:wrong.slice(),completedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(all));if(passed&&!prev.passed){const p=read(PROFILE,{version:1,xp:0,rewards:{}});p.version=1;p.xp=Number(p.xp||0)+80;p.rewards={...(p.rewards||{}),programDryRun:true};localStorage.setItem(PROFILE,JSON.stringify(p))}document.querySelector('#score').textContent=score;document.querySelector('#title').textContent=passed?'程序检查与空运行模拟通过':'尚未通过：请重做错误步骤';document.querySelector('#copy').textContent=passed?'8步全部正确，首次通过奖励80 XP。':'只有8步全部正确才算通过。';document.querySelector('#errors').innerHTML=wrong.length?wrong.map(x=>`<li>${x}</li>`).join(''):'<li>本次无错误</li>';document.querySelector('#result').classList.add('show');refreshBest()}function refreshBest(){const d=read(KEY,{records:{}});document.querySelector('#best').textContent=d.records?.[ID]?.bestScore||0}document.querySelector('#restart').onclick=()=>{i=0;wrong=[];document.querySelector('#result').classList.remove('show');render()};refreshBest();render();</script></body></html>
