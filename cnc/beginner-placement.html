<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CNC新手起点测评｜数控小潘</title>
  <style>
    :root{color-scheme:light;--bg:#f4f7fb;--card:#fff;--text:#182230;--muted:#65758b;--line:#dce4ee;--accent:#1463ff;--soft:#eaf1ff}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 16px 40px}.back{display:inline-flex;min-height:44px;align-items:center;color:var(--accent);text-decoration:none;font-weight:700}h1{font-size:26px;margin:14px 0 8px}.lead{color:var(--muted);line-height:1.7;margin:0 0 18px}.progress{height:10px;background:#dfe6ef;border-radius:999px;overflow:hidden;margin:14px 0 24px}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:.2s}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.qtitle{font-size:18px;font-weight:800;line-height:1.5;margin-bottom:14px}.option{display:flex;gap:10px;align-items:flex-start;width:100%;min-height:52px;margin:10px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font-size:16px;text-align:left}.option.selected{border-color:var(--accent);background:var(--soft)}.actions{display:flex;gap:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:14px;border:0;font-size:16px;font-weight:800;text-decoration:none}.primary{background:var(--accent);color:#fff;flex:1}.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}.result{display:none}.result.show{display:block}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--accent);font-weight:800}.result h2{font-size:24px;margin:14px 0 8px}.result p{line-height:1.7;color:var(--muted)}.route{margin:16px 0;padding:14px;border-left:4px solid var(--accent);background:#f8faff;border-radius:10px}.note{font-size:14px;color:var(--muted);line-height:1.6}
  </style>
</head>
<body>
<main class="wrap">
  <a class="back" href="./training-camp.html">← 返回训练营</a>
  <h1>CNC新手起点测评</h1>
  <p class="lead">6道题，约2分钟。根据安全意识、坐标对刀和程序验证基础，推荐最合适的起点。测评只做推荐，不改动你的成绩、XP或通关记录。</p>
  <div class="progress" aria-label="测评进度"><span id="bar"></span></div>
  <section id="quiz" class="card" aria-live="polite">
    <div id="qtitle" class="qtitle"></div>
    <div id="options"></div>
    <div class="actions"><button id="prev" class="btn ghost" type="button">上一题</button><button id="next" class="btn primary" type="button">下一题</button></div>
  </section>
  <section id="result" class="card result" aria-live="polite">
    <span class="tag">推荐起点</span>
    <h2 id="result-title"></h2>
    <p id="result-copy"></p>
    <div id="result-route" class="route"></div>
    <div class="actions"><a id="result-link" class="btn primary" href="./course-safety-foundation.html">开始学习</a><button id="restart" class="btn ghost" type="button">重新测评</button></div>
  </section>
  <p class="note">判断原则：安全基础优先于操作熟练度；坐标与对刀不稳时，不建议直接跳到程序运行；测评结果仅保存在本次页面内。</p>
</main>
<script>
const questions=[
 {t:'看到一段陌生程序准备上机，你会先做什么？',a:[['直接按循环启动',0],['单段、空运行并检查刀补和坐标',2],['只看程序有没有报警',1]]},
 {t:'你能否说清楚机床坐标系与工件坐标系的区别？',a:[['完全说不清',0],['大概知道，但容易混',1],['能结合G54和回零说明',2]]},
 {t:'换刀后，加工深度突然偏差5毫米，你最先怀疑什么？',a:[['进给速度',0],['刀长补偿或对刀数据',2],['冷却液',1]]},
 {t:'程序中的G00快速移动最需要先确认什么？',a:[['主轴声音',0],['路径是否会撞刀、撞夹具',2],['工件颜色',1]]},
 {t:'首件加工完成后，你通常怎么处理？',a:[['直接批量加工',0],['测量关键尺寸并与图纸、公差核对',2],['看表面亮不亮',1]]},
 {t:'出现报警时，你会怎样排查？',a:[['反复复位再启动',0],['记录报警号，确认当前状态后按原因排查',2],['先改参数试试',1]]}
];
let index=0;const answers=Array(questions.length).fill(null);
const qtitle=document.querySelector('#qtitle'),options=document.querySelector('#options'),bar=document.querySelector('#bar'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),quiz=document.querySelector('#quiz'),result=document.querySelector('#result');
function render(){const q=questions[index];qtitle.textContent=`第${index+1}题｜${q.t}`;options.innerHTML='';q.a.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.className='option'+(answers[index]===i?' selected':'');b.textContent=item[0];b.addEventListener('click',()=>{answers[index]=i;render()});options.appendChild(b)});bar.style.width=`${((index+(answers[index]!==null?1:0))/questions.length)*100}%`;prev.disabled=index===0;next.textContent=index===questions.length-1?'查看结果':'下一题'}
function finish(){const score=answers.reduce((s,v,i)=>s+(v===null?0:questions[i].a[v][1]),0);let data;if(score<=5)data={title:'从第1关：安全基础开始',copy:'你的首要任务不是记更多G代码，而是先建立“先确认、再操作”的安全习惯。',route:'建议路线：安全基础 → 加工中心基础 → 坐标轴与回零',href:'./course-safety-foundation.html'};else if(score<=9)data={title:'从坐标、对刀与刀补开始',copy:'你已有基本安全意识，但坐标系、对刀和补偿仍可能成为现场失误来源。',route:'建议路线：坐标轴 → 工件坐标系 → 刀长补偿 → 对刀检查模拟',href:'./course-coordinate-axes.html'};else data={title:'进入程序验证与首件检查',copy:'基础较稳，可以重点训练程序验证、空运行、首件测量和异常排查。',route:'建议路线：G00/G01 → 程序空运行模拟 → 首件检查 → 故障排查专项',href:'./course-g00-g01.html'};document.querySelector('#result-title').textContent=data.title;document.querySelector('#result-copy').textContent=data.copy;document.querySelector('#result-route').textContent=data.route;document.querySelector('#result-link').href=data.href;quiz.style.display='none';result.classList.add('show');bar.style.width='100%'}
next.addEventListener('click',()=>{if(answers[index]===null){next.textContent='请先选择一个答案';return}if(index<questions.length-1){index++;render()}else finish()});prev.addEventListener('click',()=>{if(index>0){index--;render()}});document.querySelector('#restart').addEventListener('click',()=>{answers.fill(null);index=0;result.classList.remove('show');quiz.style.display='block';render()});render();
</script>
</body>
</html>
