<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>安全与坐标专项练习｜数控小潘</title>
<meta name="description" content="面向CNC零基础新手的安全操作与坐标基础15题专项练习，含答案解析、错题记录和重做入口。">
<style>
:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#3f6279;--blue2:#2d4e64;--ok:#466b55;--bad:#8a4034;--warn:#8b5b16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 96px}.top{display:flex;gap:10px}.btn,.back{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 15px;border:1px solid var(--line);border-radius:12px;font-weight:900;text-decoration:none;box-shadow:0 2px 0 rgba(41,45,48,.08)}.back{background:var(--card);color:var(--ink)}.btn{background:var(--blue);border-color:var(--blue2);color:#fff;cursor:pointer}.btn.secondary{background:var(--card);color:var(--blue2)}.hero,.panel,.question{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 6px 16px rgba(48,44,36,.07)}h1{font-size:29px;line-height:1.2;margin:6px 0 10px}.hero p,.panel p,.question p{color:var(--muted);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:11px;border:1px solid var(--line);border-radius:11px;background:#f7f4ee;text-align:center}.stat strong{display:block;font-size:27px;color:var(--blue2)}.notice{border-left:4px solid #d4a044}.notice strong{color:var(--warn)}.question{display:none}.question.active{display:block}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;font-weight:800}.question h2{font-size:21px;line-height:1.45}.options{display:grid;gap:10px}.option{min-height:48px;display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf8f3;cursor:pointer}.option input{min-width:18px;min-height:18px;margin-top:3px}.option:has(input:checked){border-color:#8ea5b4;background:#edf2f5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.feedback{display:none;margin-top:12px;padding:12px;border-radius:11px;border:1px solid var(--line);line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640;border-color:#aac2b4}.feedback.bad{background:#f7ece9;color:#74372c;border-color:#d5aaa0}.result{display:none}.result.show{display:block}.score{font-size:56px;font-weight:950;color:var(--blue2)}.result.pass .score{color:var(--ok)}.result.fail .score{color:var(--bad)}.weak{padding:0;list-style:none;display:grid;gap:8px}.weak li{padding:10px;border:1px solid var(--line);border-radius:10px;background:#f7f4ee}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.97);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(41,45,48,.08)}.bottom-nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:13px;font-weight:900}.bottom-nav a.active{color:var(--blue2)}@media(max-width:620px){.stats,.actions{grid-template-columns:1fr}.top>*{flex:1}h1{font-size:27px}}
</style>
</head>
<body>
<main class="shell">
<div class="top"><a class="back" href="./practice.html">← 返回练习</a><button class="btn secondary" id="restart-top" type="button">重新练习</button></div>
<section class="hero"><small>专项题库 · 安全操作＋坐标基础</small><h1>15题练到会：先别碰机床，先把判断练准确</h1><p>覆盖防护门、急停、回零、坐标轴、G90/G91、机床坐标、G54和安全移动顺序。每题提交后立即显示原创解析。</p><div class="stats"><div class="stat"><strong>15</strong><span>有效题目</span></div><div class="stat"><strong>80</strong><span>通过分数</span></div><div class="stat"><strong id="best">0</strong><span>历史最高分</span></div></div></section>
<section class="panel notice"><strong>安全边界</strong><p>本练习只用于理解训练，不等于具备独立上机资格。实际按键、回零方式、坐标显示和安全要求可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场条件为准。</p></section>
<div id="host"></div>
<section class="panel result" id="result"><small>本次成绩</small><div class="score" id="score">0</div><h2 id="result-title"></h2><p id="result-copy"></p><h3>建议重练</h3><ul class="weak" id="weak"></ul><div class="actions"><button class="btn" id="redo-wrong" type="button">只重做错题</button><button class="btn secondary" id="restart-main" type="button">全部重练</button></div></section>
</main>
<nav class="bottom-nav" aria-label="平台主导航"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a class="active" href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav>
<script>
const KEY='cnc_training_practice_v1', SCORE_KEY='cnc_training_profile_v1';
const QS=[
{id:'sc-01',course:'第1关 安全基础',ability:'安全操作',risk:'高',system:'FANUC类加工中心',type:'single',title:'程序运行时出现异常撞击声，第一优先动作是什么？',options:['继续观察几秒','使用进给保持或急停停止危险运动','立即伸手摸刀具','直接修改参数'],answer:[1],explain:'先停止危险运动，再按现场流程判断原因。具体使用进给保持还是急停，应遵守机床手册和企业制度。'},
{id:'sc-02',course:'第1关 安全基础',ability:'安全操作',risk:'高',system:'通用',type:'judge',title:'为了看清刀具，短时间绕过防护门联锁是可以接受的。',options:['正确','错误'],answer:[1],explain:'错误。不得绕过防护门、联锁和其他安全装置。'},
{id:'sc-03',course:'第1关 安全基础',ability:'安全操作',risk:'高',system:'通用',type:'multi',title:'首件试切前应完成哪些检查？',options:['确认工件与夹具','核对坐标和刀补','空运行或图形检查','直接把倍率开到100%'],answer:[0,1,2],explain:'首件前必须核对实物、坐标、刀补和程序路径；不能把高倍率当成默认选择。'},
{id:'sc-04',course:'第2关 认识加工中心',ability:'机床认知',risk:'中',system:'立式加工中心',type:'single',title:'立式加工中心通常与主轴轴线平行的是哪一轴？',options:['X轴','Y轴','Z轴','A轴'],answer:[2],explain:'通常是Z轴，但具体正方向和部件运动必须看机床标识与手册。'},
{id:'sc-05',course:'第3关 坐标轴',ability:'坐标基础',risk:'中',system:'通用',type:'judge',title:'判断轴方向时，只看工作台实际运动方向就一定不会错。',options:['正确','错误'],answer:[1],explain:'错误。程序描述的是刀具相对工件的运动关系，必须区分部件实际运动与相对运动。'},
{id:'sc-06',course:'第3关 坐标轴',ability:'坐标基础',risk:'中',system:'FANUC类',type:'single',title:'G90表示什么？',options:['增量编程','绝对编程','快速定位','工件坐标选择'],answer:[1],explain:'G90表示绝对编程，目标坐标相对于当前工件坐标系零点。'},
{id:'sc-07',course:'第3关 坐标轴',ability:'坐标基础',risk:'中',system:'FANUC类',type:'single',title:'G91程序段中的X10表示什么？',options:['移动到绝对X10','从当前位置沿X正方向移动10','选择G10参数','返回参考点'],answer:[1],explain:'G91为增量方式，X10表示相对当前位置增加10。'},
{id:'sc-08',course:'第5关 工件坐标',ability:'坐标基础',risk:'高',system:'FANUC类',type:'judge',title:'机床回参考点后，G54一定已经自动正确。',options:['正确','错误'],answer:[1],explain:'错误。回参考点建立机床参考，G54仍需根据工件、装夹和设定单独核对。'},
{id:'sc-09',course:'第5关 工件坐标',ability:'坐标基础',risk:'高',system:'FANUC类',type:'multi',title:'核对G54时应同时确认哪些内容？',options:['当前工件与装夹是否对应','坐标值来源和设定基准','程序使用的坐标系编号','只看程序语法'],answer:[0,1,2],explain:'G54正确与否取决于工件、装夹、基准和程序调用是否一致，语法正确不等于坐标正确。'},
{id:'sc-10',course:'第5关 工件坐标',ability:'坐标基础',risk:'高',system:'FANUC类',type:'single',title:'程序语法完全正确，但G54整体偏移20 mm，最可能出现什么问题？',options:['程序自动纠正','刀路整体偏移并可能碰撞','只影响主轴转速','完全没有影响'],answer:[1],explain:'工件坐标偏移会让整个刀路跟着偏移，可能造成过切、撞夹具或撞工件。'},
{id:'sc-11',course:'第9关 G00/G01',ability:'编程基础',risk:'高',system:'FANUC类',type:'single',title:'换位置前更安全的常见顺序是什么？',options:['先移动XY，再抬Z','先退到确认过的安全Z，再移动XY','同时快速移动XYZ即可','只降低主轴转速'],answer:[1],explain:'通常先退安全Z再移动XY，但具体安全高度必须结合刀具、夹具、工件和机床条件确认。'},
{id:'sc-12',course:'第9关 G00/G01',ability:'编程基础',risk:'高',system:'FANUC类',type:'judge',title:'G00只要终点安全，中间路径就不用检查。',options:['正确','错误'],answer:[1],explain:'错误。G00中间路径可能受系统插补方式、倍率和机床参数影响，必须检查整个运动空间。'},
{id:'sc-13',course:'第9关 G00/G01',ability:'编程基础',risk:'中',system:'FANUC类',type:'single',title:'G01程序段中通常由哪个地址指定进给？',options:['S','T','F','H'],answer:[2],explain:'F通常指定进给量，但G94/G95等进给方式必须确认。'},
{id:'sc-14',course:'第3关 坐标轴',ability:'坐标基础',risk:'高',system:'通用',type:'multi',title:'开始移动前，应确认哪些坐标相关项目？',options:['当前坐标系','G90/G91状态','刀长补偿状态','只确认屏幕亮度'],answer:[0,1,2],explain:'坐标系、绝对/增量状态和刀补都可能直接改变实际位置。'},
{id:'sc-15',course:'第1关 安全基础',ability:'安全操作',risk:'高',system:'通用',type:'single',title:'发现图纸、程序和现场装夹互相矛盾时，正确做法是什么？',options:['按经验选一个继续','暂停并联系相关人员确认','提高倍率快速试一下','删除报警继续'],answer:[1],explain:'矛盾未确认前必须停止推进，核对受控图纸、工艺、程序和现场条件并保留确认记录。'}];
let active=[...QS], index=0, correct=0, wrong=[];
const normalize=a=>[...a].map(Number).sort((x,y)=>x-y).join(',');
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
function save(obj){localStorage.setItem(KEY,JSON.stringify(obj))}
function bestScore(){const d=load();return Number(d.scores?.safetyCoordinate||0)}
function render(){document.getElementById('best').textContent=bestScore();document.getElementById('result').className='panel result';const q=active[index],host=document.getElementById('host');if(!q){finish();return}host.innerHTML=`<section class="question active"><div class="meta"><span>${q.course} · ${q.type==='multi'?'多选':q.type==='judge'?'判断':'单选'}</span><span>${index+1}/${active.length}</span></div><h2>${q.title}</h2><div class="options">${q.options.map((o,i)=>`<label class="option"><input type="${q.type==='multi'?'checkbox':'radio'}" name="answer" value="${i}"><span>${o}</span></label>`).join('')}</div><div class="feedback" id="feedback"></div><div class="actions"><button class="btn" id="submit" type="button">提交答案</button><button class="btn secondary" id="next" type="button" disabled>${index===active.length-1?'查看成绩':'下一题'}</button></div></section>`;document.getElementById('submit').onclick=submit;document.getElementById('next').onclick=()=>{index++;render()}}
function submit(){const q=active[index],picked=[...document.querySelectorAll('input[name=answer]:checked')].map(x=>Number(x.value));if(!picked.length){return}const ok=normalize(picked)===normalize(q.answer),fb=document.getElementById('feedback');fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=(ok?'回答正确。':'回答错误。')+q.explain;document.querySelectorAll('input[name=answer]').forEach(x=>x.disabled=true);document.getElementById('submit').disabled=true;document.getElementById('next').disabled=false;if(ok)correct++;else wrong.push(q);const d=load();d.version=1;d.answers=d.answers||[];d.answers.push({id:q.id,correct:ok,selected:picked,answer:q.answer,course:q.course,ability:q.ability,risk:q.risk,system:q.system,at:new Date().toISOString()});d.wrong=d.wrong||{};if(ok)delete d.wrong[q.id];else d.wrong[q.id]={id:q.id,course:q.course,ability:q.ability,title:q.title,explain:q.explain,updatedAt:new Date().toISOString()};save(d)}
function finish(){const score=Math.round(correct/active.length*100),pass=score>=80,d=load();d.scores=d.scores||{};d.scores.safetyCoordinate=Math.max(Number(d.scores.safetyCoordinate||0),score);d.lastSession={set:'safety-coordinate',score,pass,total:active.length,wrong:wrong.length,at:new Date().toISOString()};save(d);document.getElementById('host').innerHTML='';const r=document.getElementById('result');r.className='panel result show '+(pass?'pass':'fail');document.getElementById('score').textContent=score;document.getElementById('result-title').textContent=pass?'专项通过':'未达到80分';document.getElementById('result-copy').textContent=`答对${correct}题，答错${wrong.length}题。错题已记录，可立即重做。`;document.getElementById('weak').innerHTML=wrong.length?wrong.map(q=>`<li><strong>${q.ability}</strong>：${q.title}</li>`).join(''):'<li>本轮没有错题，建议隔天再复习一次。</li>';document.getElementById('best').textContent=d.scores.safetyCoordinate}
function restart(list=QS){active=[...list];index=0;correct=0;wrong=[];render()}
document.getElementById('restart-top').onclick=()=>restart();document.getElementById('restart-main').onclick=()=>restart();document.getElementById('redo-wrong').onclick=()=>restart(wrong.length?wrong:QS);render();
</script>
</body></html>
