<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>报警、参数风险与首件检查15题｜数控小潘</title><style>:root{--bg:#f3f0e9;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#365b72;--ok:#3f6b50;--bad:#8a4034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:760px;margin:auto;padding:14px 14px 96px}.card,.q{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;margin-top:14px;box-shadow:0 6px 16px rgba(48,44,36,.07)}h1{font-size:28px;line-height:1.25}.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}.tag{border:1px solid var(--line);border-radius:999px;padding:4px 7px}.q{display:none}.q.active{display:block}.opts{display:grid;gap:10px}.opt{min-height:48px;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start;background:#faf8f3}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn,a.btn{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;font-weight:900;text-decoration:none;background:var(--blue);color:#fff}.btn.alt{background:var(--card);color:var(--blue)}.feedback{display:none;margin-top:12px;padding:12px;border-radius:11px}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640}.feedback.bad{background:#f7ece9;color:#74372c}.result{display:none}.result.show{display:block}.score{font-size:56px;font-weight:950}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:#fffdf8f5;border-top:1px solid var(--line);padding:7px}.bottom a{min-height:48px;display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-weight:900;font-size:13px}@media(max-width:620px){.actions{grid-template-columns:1fr}}</style></head><body><main class="shell"><a class="btn alt" href="./training-camp.html">← 返回训练营</a><section class="card"><small>专项训练 · 报警排查＋参数风险＋首件检查</small><h1>15题练会：先找原因，再恢复；先验证，再放行</h1><p>面向零基础新手，示例以FANUC类立式加工中心为主。满分100分，80分通过。</p></section><section class="card"><strong>统一安全提示</strong><p>实际机床界面、按键名称、回零方式、刀补设置、报警处理和安全要求可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场条件为准。高风险操作必须由现场师傅或授权人员指导。</p></section><div id="host"></div><section id="result" class="card result"><div id="score" class="score">0</div><h2 id="result-title"></h2><p id="result-copy"></p><div class="actions"><button id="redo" class="btn">只重做错题</button><button id="restart" class="btn alt">全部重练</button></div></section></main><nav class="bottom"><a href="./index.html">首页</a><a href="./training-camp.html">训练营</a><a href="#">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>const KEY='cnc_training_practice_v1';const Q=[
{id:'apf-01',course:'异常与报警基础',ability:'报警排查',risk:'高',system:'FANUC类加工中心',type:'single',title:'加工中出现异常声音并伴随报警，第一步应做什么？',options:['停止危险运动并确认人员、设备安全','连续按复位直到报警消失','提高倍率尽快跑完当前程序段','立即修改参数'],answer:[0],explain:'报警出现时先控制风险并确认现场安全，再记录和分析。连续复位可能掩盖根因。'},
{id:'apf-02',course:'异常与报警基础',ability:'报警记录',risk:'高',system:'机型相关',type:'multi',title:'报警发生后，哪些信息应完整记录？',options:['完整报警号和文字','当前程序段、模式与轴位置','实物刀具、装夹和操作经过','只记最后两位报警号'],answer:[0,1,2],explain:'完整记录是复现和定位根因的基础；只记部分报警号容易套错处理方法。'},
{id:'apf-03',course:'异常与报警基础',ability:'安全恢复',risk:'高',system:'FANUC类加工中心',type:'judge',title:'报警复位成功，就说明故障原因已经彻底消除。',options:['正确','错误'],answer:[1],explain:'复位只代表控制器允许清除当前报警显示，不等于机械、程序、坐标或联锁根因已消失。'},
{id:'apf-04',course:'异常与报警基础',ability:'流程排序',risk:'高',system:'通用',type:'order',title:'报警排查与恢复的合理顺序是？',options:['停止并记录→检查现场→核对手册→授权处理→单段低倍率验证','连续复位→自动运行→再看报警','先改参数→再记录原值','删除报警记录→直接恢复生产'],answer:[0],explain:'正确流程必须可追溯、可验证，并由授权人员处理高风险项。'},
{id:'apf-05',course:'参数与补偿风险',ability:'参数风险判断',risk:'高',system:'参数相关',type:'single',title:'网上看到“相同报警改某参数即可”，最安全的做法是？',options:['核对本机系统、机型、报警原文和原厂手册后再由授权人员处理','直接照抄参数值','先改大一点看效果','删除原值避免混淆'],answer:[0],explain:'参数含义和权限可能因系统、机型、厂家配置不同而变化，不能跨机照抄。'},
{id:'apf-06',course:'参数与补偿风险',ability:'变更控制',risk:'高',system:'通用',type:'multi',title:'修改参数或补偿前，应至少确认哪些内容？',options:['目标地址与当前值','单位、正负和允许范围','修改权限与备份记录','只确认修改后报警能否消失'],answer:[0,1,2],explain:'修改前要形成完整证据链和回退条件，不能只以“报警消失”作为正确标准。'},
{id:'apf-07',course:'参数与补偿风险',ability:'根因分析',risk:'高',system:'通用',type:'judge',title:'尺寸超差时，一次同时修改G54、H号和D号，更容易快速找到原因。',options:['正确','错误'],answer:[1],explain:'同时修改多项会破坏因果关系，难以判断真正根因，还可能引入新的偏差。'},
{id:'apf-08',course:'参数与补偿风险',ability:'刀补判断',risk:'高',system:'FANUC类加工中心',type:'single',title:'多个尺寸整体同向偏移时，优先排查什么？',options:['G54、装夹定位和基准','随意增加每把刀的补偿','提高主轴转速','关闭单段'],answer:[0],explain:'整体同向偏移更像坐标或定位基准问题，不应先改多把刀补。'},
{id:'apf-09',course:'首件检查',ability:'首件流程',risk:'高',system:'通用',type:'order',title:'首件加工后的合理顺序是？',options:['停机保留状态→核对量具与基准→测关键尺寸→分析偏差→授权修正→复验放行','首件完成→立即批量→抽检','只测一个容易测的尺寸→放行','先大幅改刀补→再找原因'],answer:[0],explain:'首件必须完成测量、分析、修正、复验和授权放行闭环。'},
{id:'apf-10',course:'首件检查',ability:'测量可信度',risk:'中',system:'通用',type:'multi',title:'首件测量前应确认哪些条件？',options:['量具状态和校准要求','测量面清洁与温度影响','受控图纸、基准和测量位置','只确认零件外观'],answer:[0,1,2],explain:'测量结果只有在量具、环境、基准和方法一致时才有判断价值。'},
{id:'apf-11',course:'首件检查',ability:'误差分类',risk:'高',system:'通用',type:'single',title:'只有T03加工的尺寸稳定超差，其他刀具尺寸正常，优先排查什么？',options:['T03实物刀具、磨损、H/D号与程序调用','整体修改G54','同时修改所有刀具补偿','忽略并继续批量'],answer:[0],explain:'单刀相关且稳定的偏差，应沿该刀具的数据链排查。'},
{id:'apf-12',course:'首件检查',ability:'测量诊断',risk:'高',system:'通用',type:'judge',title:'同一尺寸重复测量差异很大时，应先追着结果不断修改刀补。',options:['正确','错误'],answer:[1],explain:'先检查量具、测量方法、装夹、跳动和过程稳定性；追着随机波动改刀补会放大风险。'},
{id:'apf-13',course:'首件检查',ability:'放行边界',risk:'高',system:'通用',type:'single',title:'修正后一个关键尺寸恢复合格，是否可以立即批量生产？',options:['还需复验关联尺寸并按权限完成放行记录','可以，单个尺寸合格即可','只要报警消失即可','只要操作者有经验即可'],answer:[0],explain:'修正可能影响关联尺寸，必须复验并完成授权放行。'},
{id:'apf-14',course:'异常与报警基础',ability:'恢复验证',risk:'高',system:'FANUC类加工中心',type:'multi',title:'报警处理后恢复运行前，哪些验证是必要的？',options:['确认危险源已解除','安全位置、单段和低倍率验证','核对坐标、刀补、程序段和现场状态','直接自动循环验证效率最高'],answer:[0,1,2],explain:'恢复验证要分层进行，不能把自动循环当成第一次验证手段。'},
{id:'apf-15',course:'异常与报警基础',ability:'升级处理',risk:'高',system:'机型相关',type:'single',title:'报警重复出现且原因仍不明确，正确处理是？',options:['停止并升级给现场师傅、维修或厂家技术人员','反复复位直到偶尔通过','删除记录继续加工','修改多个参数试错'],answer:[0],explain:'原因不明且重复出现时必须停止试错，保留证据并升级处理。'}];
let list=[...Q],idx=0,correct=0,wrong=[];const host=document.getElementById('host'),result=document.getElementById('result');function safe(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return x&&typeof x==='object'?x:{}}catch{return {}}}function save(score){const d=safe();d.version=1;d.history=Array.isArray(d.history)?d.history:[];d.wrongQuestions=Array.isArray(d.wrongQuestions)?d.wrongQuestions:[];d.history.unshift({practiceId:'alarm-parameter-first-piece',score,passed:score>=80,answered:list.length,at:new Date().toISOString()});d.history=d.history.slice(0,20);wrong.forEach(q=>{const i=d.wrongQuestions.findIndex(x=>x.id===q.id);const row={id:q.id,title:q.title,course:q.course,ability:q.ability,risk:q.risk,system:q.system,source:'practice-alarm-parameter-first-piece.html',updatedAt:new Date().toISOString()};if(i>=0)d.wrongQuestions[i]=row;else d.wrongQuestions.push(row)});localStorage.setItem(KEY,JSON.stringify(d))}function draw(){host.innerHTML='';list.forEach((q,i)=>{const s=document.createElement('section');s.className='q'+(i===0?' active':'');s.dataset.id=q.id;s.innerHTML=`<div class="meta"><span class="tag">${i+1}/${list.length}</span><span class="tag">${q.type}</span><span class="tag">${q.course}</span><span class="tag">${q.ability}</span><span class="tag">风险：${q.risk}</span><span class="tag">${q.system}</span></div><h2>${q.title}</h2><div class="opts">${q.options.map((o,j)=>`<label class="opt"><input type="${q.type==='multi'?'checkbox':'radio'}" name="${q.id}" value="${j}"><span>${o}</span></label>`).join('')}</div><div class="feedback"></div><div class="actions"><button class="btn submit">提交答案</button><button class="btn alt next" disabled>${i===list.length-1?'查看成绩':'下一题'}</button></div>`;host.appendChild(s)});bind()}function bind(){document.querySelectorAll('.q').forEach((s,i)=>{const q=list[i],fb=s.querySelector('.feedback'),sub=s.querySelector('.submit'),next=s.querySelector('.next');sub.onclick=()=>{const picked=[...s.querySelectorAll('input:checked')].map(x=>+x.value).sort((a,b)=>a-b);if(!picked.length)return;const ok=JSON.stringify(picked)===JSON.stringify([...q.answer].sort((a,b)=>a-b));if(ok)correct++;else wrong.push(q);fb.className='feedback show '+(ok?'ok':'bad');fb.textContent=(ok?'回答正确。':'回答错误。')+q.explain;s.querySelectorAll('input').forEach(x=>x.disabled=true);sub.disabled=true;next.disabled=false};next.onclick=()=>{s.classList.remove('active');idx++;if(idx<list.length)document.querySelectorAll('.q')[idx].classList.add('active');else finish()}})}function finish(){const score=Math.round(correct/list.length*100);save(score);result.classList.add('show');document.getElementById('score').textContent=score;document.getElementById('result-title').textContent=score>=80?'专项通过':'未达到80分';document.getElementById('result-copy').textContent=`答对${correct}题，错${wrong.length}题。`;result.scrollIntoView({behavior:'smooth'});document.getElementById('redo').disabled=!wrong.length}document.getElementById('restart').onclick=()=>{list=[...Q];idx=0;correct=0;wrong=[];result.classList.remove('show');draw();scrollTo(0,0)};document.getElementById('redo').onclick=()=>{if(!wrong.length)return;list=[...wrong];idx=0;correct=0;wrong=[];result.classList.remove('show');draw();scrollTo(0,0)};draw();</script></body></html>
