<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>回零流程模拟｜数控小潘</title><meta name="description" content="面向CNC零基础新手的加工中心回参考点交互模拟，含错误路径、风险解释和成长记录。"><style>
:root{--bg:#f2efe8;--card:#fffdf8;--ink:#292d30;--muted:#687078;--line:#d8d2c6;--blue:#3f6279;--blue2:#2d4e64;--ok:#466b55;--bad:#8a4034;--warn:#8b5b16}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{width:min(100%,760px);margin:auto;padding:14px 14px 96px}.top{display:flex;gap:10px}.btn,.back{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:0 15px;border:1px solid var(--line);border-radius:12px;font-weight:900;text-decoration:none;box-shadow:0 2px 0 rgba(41,45,48,.08)}.back{background:var(--card);color:var(--ink)}.btn{background:var(--blue);border-color:var(--blue2);color:#fff;cursor:pointer}.btn.secondary{background:var(--card);color:var(--blue2)}.hero,.panel,.step{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:0 6px 16px rgba(48,44,36,.07)}h1{font-size:29px;line-height:1.2;margin:6px 0 10px}.hero p,.panel p,.step p{color:var(--muted);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{padding:11px;border:1px solid var(--line);border-radius:11px;background:#f7f4ee;text-align:center}.stat strong{display:block;font-size:27px;color:var(--blue2)}.notice{border-left:4px solid #d4a044}.notice strong{color:var(--warn)}.step{display:none}.step.active{display:block}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px;font-weight:800}.choices{display:grid;gap:10px}.choice{min-height:48px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:#faf8f3;color:var(--ink);font-weight:800;cursor:pointer}.choice:hover,.choice:focus{border-color:#8ea5b4}.feedback{display:none;margin-top:12px;padding:12px;border-radius:11px;border:1px solid var(--line);line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf3ed;color:#315640;border-color:#aac2b4}.feedback.bad{background:#f7ece9;color:#74372c;border-color:#d5aaa0}.result{display:none}.result.show{display:block}.score{font-size:56px;font-weight:950;color:var(--blue2)}.result.pass .score{color:var(--ok)}.errors{padding:0;list-style:none;display:grid;gap:8px}.errors li{padding:10px;border:1px solid var(--line);border-radius:10px;background:#f7f4ee}.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:rgba(255,253,248,.97);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(41,45,48,.08)}.bottom-nav a{min-height:48px;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:13px;font-weight:900}.bottom-nav a.active{color:var(--blue2)}@media(max-width:620px){.stats{grid-template-columns:1fr}.top>*{flex:1}h1{font-size:27px}}
</style></head><body><main class="shell"><div class="top"><a class="back" href="./training-camp.html">← 返回训练营</a><button class="btn secondary" id="restart-top" type="button">重新模拟</button></div><section class="hero"><small>新手模拟训练 · 回参考点</small><h1>回零不是“按一下就走”，先确认环境，再让轴运动</h1><p>本模拟训练你按正确顺序完成8步回参考点检查，并体验3类常见错误路径。目标是建立“先观察、再确认、后运动”的习惯。</p><div class="stats"><div class="stat"><strong>8</strong><span>关键步骤</span></div><div class="stat"><strong>3</strong><span>错误路径</span></div><div class="stat"><strong id="best">0</strong><span>历史最高分</span></div></div></section><section class="panel notice"><strong>高风险安全边界</strong><p>本页面只用于理解流程，不等于具备独立上机资格。实际回零模式、轴顺序、按键名称、联锁条件和异常处理可能因系统、机型、厂家参数和企业制度不同而变化，请以机床原厂手册、企业安全制度和现场授权人员指导为准。</p></section><div id="host"></div><section class="panel result" id="result"><small>模拟结果</small><div class="score" id="score">0</div><h2 id="result-title"></h2><p id="result-copy"></p><h3>本次错误</h3><ul class="errors" id="errors"></ul><button class="btn" id="restart-main" type="button">再练一次</button></section></main><nav class="bottom-nav" aria-label="平台主导航"><a href="./index.html">首页</a><a class="active" href="./training-camp.html">训练营</a><a href="./practice.html">练习</a><a href="./index.html#workspace">查代码</a><a href="./profile.html">我的</a></nav><script>
const KEY='cnc_training_simulator_v1',PROFILE='cnc_training_profile_v1';
const STEPS=[
{id:'hm-01',title:'开机后第一步先做什么？',choices:['立即按回零键，让全部轴一起运动','确认现场无人进入危险区，防护门和急停状态正常','先启动主轴听声音'],correct:1,ok:'先确认人员、环境和安全装置，避免轴运动时有人或物处在危险区域。',bad:'未确认危险区就让轴运动，可能造成人员受伤或碰撞。正确做法是先停下并完成现场安全确认。'},
{id:'hm-02',title:'确认机床内部时，重点看什么？',choices:['只看屏幕是否亮','检查工作台、刀具、夹具、工件及行程区域是否存在干涉物','只看切削液液位'],correct:1,ok:'回零前必须确认各轴可能经过的空间没有工件、量具、扳手或夹具干涉。',bad:'只看屏幕或液位无法排除机械干涉。若发现障碍物，应保持机床停止并按现场流程处理。'},
{id:'hm-03',title:'机床出现报警或位置状态异常时怎么办？',choices:['先强行回零，报警可能自己消失','读取报警信息并按原厂手册和现场流程确认原因','连续按复位直到能动'],correct:1,ok:'报警和位置状态必须先确认，不能把“能动”当作“安全”。',bad:'强行消警或连续复位可能掩盖真实故障。应读取报警、确认状态并由授权人员处理。'},
{id:'hm-04',title:'准备进入回参考点模式前，应该确认什么？',choices:['确认当前模式和机床规定的回零方式','把快速倍率调到100%','先输入G54'],correct:0,ok:'不同机床的回零模式和顺序可能不同，必须先确认模式和原厂规定。',bad:'高倍率或输入工件坐标不能替代模式确认。错误模式下操作可能产生非预期运动。'},
{id:'hm-05',title:'执行轴回零时的正确策略是什么？',choices:['按机床规定的轴顺序，观察每一轴运动和指示状态','同时按所有轴，越快越好','离开操作面板去拿工具'],correct:0,ok:'按规定顺序逐轴观察，异常时能及时停止并定位问题。',bad:'盲目同时回零或离开面板会降低可控性。具体轴顺序以原厂手册为准。'},
{id:'hm-06',title:'某一轴运动方向或声音异常时，应如何处理？',choices:['继续到回零完成再说','立即停止运动，保持现场安全并报告确认','提高倍率让它快点结束'],correct:1,ok:'异常方向、声音或阻力都应立即停止，不得用继续运行验证猜测。',bad:'继续或提速可能把小问题变成碰撞。应停止、隔离风险并按流程检查。'},
{id:'hm-07',title:'各轴回零后要核对什么？',choices:['只看屏幕有坐标数字','核对参考点完成指示、机床坐标状态和报警是否清除','直接启动程序'],correct:1,ok:'必须确认各轴参考点状态、机床坐标和报警状态一致正常。',bad:'有数字不代表参考点完成。未核对状态就运行程序可能导致坐标基准错误。'},
{id:'hm-08',title:'回零完成后，下一步最安全的做法是什么？',choices:['认为G54和刀补自动正确，直接加工','再核对工件坐标、刀补、程序和现场条件，按空运行/单段/低倍率验证','马上删除所有报警记录'],correct:1,ok:'回零只恢复机床参考基准，不等于G54、刀补和程序已经正确。',bad:'把回零等同于全部准备完成是高风险误区。必须继续核对坐标、补偿和程序。'}];
let index=0,score=0,mistakes=[];const host=document.querySelector('#host'),result=document.querySelector('#result');
function read(k,f){try{return Object.assign({},f,JSON.parse(localStorage.getItem(k)||'{}'))}catch{return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function render(){host.innerHTML=STEPS.map((s,i)=>`<section class="step${i===index?' active':''}" data-id="${s.id}"><div class="meta"><span>步骤 ${i+1}/8</span><span>风险：高</span></div><h2>${s.title}</h2><div class="choices">${s.choices.map((c,j)=>`<button class="choice" type="button" data-choice="${j}">${c}</button>`).join('')}</div><div class="feedback" aria-live="polite"></div></section>`).join('');document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',choose));}
function choose(e){const step=STEPS[index],picked=Number(e.currentTarget.dataset.choice),box=e.currentTarget.closest('.step'),fb=box.querySelector('.feedback');box.querySelectorAll('.choice').forEach(b=>b.disabled=true);const ok=picked===step.correct;if(ok){score+=12.5;fb.className='feedback show ok';fb.textContent='正确：'+step.ok}else{mistakes.push({id:step.id,title:step.title,reason:step.bad});fb.className='feedback show bad';fb.textContent='需要纠正：'+step.bad}setTimeout(()=>{index++;index<STEPS.length?render():finish()},120)}
function finish(){host.innerHTML='';const final=Math.round(score),passed=final===100;result.className='panel result show '+(passed?'pass':'fail');document.querySelector('#score').textContent=final;document.querySelector('#result-title').textContent=passed?'回零流程模拟已通过':'还需重练关键步骤';document.querySelector('#result-copy').textContent=passed?'你已按安全顺序完成8步。请记住：实际机床仍必须核对原厂手册并由授权人员指导。':'建议逐项重练错误步骤，不要把“记住按键”误当作理解安全流程。';document.querySelector('#errors').innerHTML=mistakes.length?mistakes.map(x=>`<li><strong>${x.title}</strong><br>${x.reason}</li>`).join(''):'<li>本次无错误路径。</li>';const data=read(KEY,{version:1,simulators:{}});const old=data.simulators.homing||{};data.version=1;data.simulators.homing={bestScore:Math.max(old.bestScore||0,final),passed:old.passed||passed,lastScore:final,lastCompletedAt:new Date().toISOString(),attempts:(old.attempts||0)+1,mistakes:mistakes.map(x=>x.id)};save(KEY,data);document.querySelector('#best').textContent=data.simulators.homing.bestScore;const profile=read(PROFILE,{version:1,xp:0,completedCourses:[],simulators:{}});profile.version=1;profile.simulators=profile.simulators||{};const firstPass=passed&&!profile.simulators.homing?.passed;profile.simulators.homing={passed:profile.simulators.homing?.passed||passed,bestScore:Math.max(profile.simulators.homing?.bestScore||0,final),updatedAt:new Date().toISOString()};if(firstPass)profile.xp=(profile.xp||0)+80;save(PROFILE,profile)}
function restart(){index=0;score=0;mistakes=[];result.className='panel result';render()}document.querySelector('#restart-top').onclick=restart;document.querySelector('#restart-main').onclick=restart;document.querySelector('#best').textContent=read(KEY,{simulators:{}}).simulators?.homing?.bestScore||0;render();
</script></body></html>
