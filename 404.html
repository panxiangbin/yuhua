<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root{color-scheme:light;--navy:#0a1e36;--blue:#1464c8;--teal:#00a9bd;--ink:#1a2637;--sub:#52667f;--line:#dce6f0;--bg:#f3f6fb}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:linear-gradient(150deg,#eef4fb,#fff 52%,#eaf9fb);color:var(--ink);line-height:1.65}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:28px 18px}
    .card{width:min(720px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(10,30,54,.14);overflow:hidden}
    .top{padding:34px 34px 26px;background:linear-gradient(135deg,var(--navy),#0d4a98 72%,#0b8396);color:#fff}
    .brand{font-size:14px;font-weight:800;letter-spacing:1.4px;opacity:.82}
    .code{font-size:clamp(58px,16vw,104px);line-height:1;font-weight:900;margin:18px 0 8px;letter-spacing:-4px}
    h1{font-size:clamp(24px,5vw,34px);line-height:1.3;margin:0}
    .top p{margin:14px 0 0;color:rgba(255,255,255,.82);font-size:15px}
    .body{padding:30px 34px 34px}
    .tip{margin:0 0 22px;color:var(--sub)}
    .actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .btn{display:flex;align-items:center;justify-content:center;min-height:48px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);font-weight:800;text-decoration:none;color:var(--navy);background:#fff;transition:.18s}
    .btn:hover,.btn:focus-visible{border-color:var(--blue);box-shadow:0 0 0 4px rgba(20,100,200,.1);outline:0}
    .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    .email{margin-top:22px;padding:16px 18px;border-radius:12px;background:#f5f9fd;border-left:4px solid var(--teal);color:var(--sub);font-size:14px}
    .email a{color:var(--blue);font-weight:800;overflow-wrap:anywhere}
    .foot{margin-top:18px;color:#8090a3;font-size:12px}
    @media(max-width:560px){.wrap{padding:14px}.card{border-radius:18px}.top{padding:28px 22px 22px}.body{padding:24px 22px 26px}.actions{grid-template-columns:1fr}.code{letter-spacing:-2px}}
  </style>
</head>

</body>
</html>
