<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f3b75">
  <title>恢复数控小潘 CNC助手</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f8fc;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}
    .card{width:min(92vw,460px);padding:28px;text-align:center;background:#fff;border:1px solid #dbe7f3;border-radius:22px;box-shadow:0 18px 48px rgba(15,59,117,.12)}
    .spinner{width:46px;height:46px;margin:0 auto 18px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{margin:0 0 12px;font-size:22px}
    p{margin:8px 0;line-height:1.7;color:#52677d}
    .btn{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:#0f3b75;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>正在恢复数控网站</h1>
    <p>正在清理数控网站的旧缓存，不会影响予华仪器官网。</p>
    <p id="status">正在处理，请稍候……</p>
    <a class="btn" href="./cnc/?recovered=20260720i">直接进入数控网站</a>
  </main>
  <script>
  (async function(){
    var status=document.getElementById('status');
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.filter(function(reg){
          return reg.scope.indexOf('/yuhua/cnc/')!==-1;
        }).map(function(reg){return reg.unregister()}));
      }
      if('caches' in window){
        var names=await caches.keys();
        await Promise.all(names.map(function(name){return caches.delete(name)}));
      }
      status.textContent='旧缓存已清理，正在进入数控网站……';
    }catch(error){
      status.textContent='自动清理未完全成功，正在尝试进入数控网站。';
    }
    setTimeout(function(){location.replace('./cnc/?recovered=20260720i')},700);
  })();
  </script>
</body>
</html>
