name: Temporary cache bump for IMG_1672 manifest fix

on:
  push:
    branches:
      - fix/remove-img-1672-broken-poster

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump videos.js cache key and remove obsolete fallback entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old_script = '<script src="assets/videos.js?v=20260614b"></script>'
          new_script = '<script src="assets/videos.js?v=20260920a"></script>'
          if text.count(old_script) != 1:
              raise SystemExit(f'expected one old videos.js cache reference, found {text.count(old_script)}')
          text = text.replace(old_script, new_script, 1)

          old_fallback = '    "assets/videos/img_1672.jpg": true,\n'
          if text.count(old_fallback) != 1:
              raise SystemExit(f'expected one IMG_1672 fallback entry, found {text.count(old_fallback)}')
          text = text.replace(old_fallback, '', 1)
          path.write_text(text, encoding='utf-8')

          if 'assets/videos/img_1672.jpg' in Path('assets/videos.js').read_text(encoding='utf-8'):
              raise SystemExit('assets/videos.js still references the removed poster')
          if 'assets/videos/img_1672.jpg' in Path('videos.json').read_text(encoding='utf-8'):
              raise SystemExit('videos.json still references the removed poster')
          if 'assets/videos/img_1672.jpg' in path.read_text(encoding='utf-8'):
              raise SystemExit('index.html still contains the obsolete IMG_1672 poster fallback')

          Path('.github/workflows/tmp-bump-video-cache-img-1672.yml').unlink()
          PY

      - name: Commit cache-safe cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/tmp-bump-video-cache-img-1672.yml
          git diff --cached --check
          git commit -m "Bump video manifest cache after IMG_1672 cleanup"
          git push origin HEAD:fix/remove-img-1672-broken-poster
