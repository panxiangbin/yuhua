name: CNC PWA42 training camp controlled sync

on:
  push:
    branches:
      - codex/cnc-training-camp-simulator-full-pass-pwa42

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message != 'CNC：统一训练营模拟满分通过与PWA42构建'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run controlled sync and strict audit
        id: sync
        continue-on-error: true
        run: node cnc/test-results/pwa42-training-camp-sync-tool.cjs

      - name: Commit generated CNC-only changes
        id: commit
        if: steps.sync.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts/pwa42-training-camp-sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc .github/workflows
          git reset -- cnc/test-results/pwa42-training-camp-sync-tool.cjs .github/workflows/cnc-pwa42-training-camp-sync.yml
          git diff --cached --name-only > artifacts/pwa42-training-camp-sync/committed-files.txt
          if [ ! -s artifacts/pwa42-training-camp-sync/committed-files.txt ]; then
            echo 'No generated changes to commit' >&2
            exit 1
          fi
          while IFS= read -r file; do
            case "$file" in
              cnc/*|.github/workflows/cnc-*) ;;
              *) echo "Out-of-scope file: $file" >&2; exit 1 ;;
            esac
          done < artifacts/pwa42-training-camp-sync/committed-files.txt
          git commit -m 'CNC：统一训练营模拟满分通过与PWA42构建'
          git rev-parse HEAD > artifacts/pwa42-training-camp-sync/generated-commit-sha.txt
          git show --stat --oneline --decorate=short HEAD > artifacts/pwa42-training-camp-sync/generated-commit-stat.txt

      - name: Push generated commit
        id: push
        if: steps.sync.outcome == 'success' && steps.commit.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          git push origin HEAD:codex/cnc-training-camp-simulator-full-pass-pwa42 > artifacts/pwa42-training-camp-sync/push.log 2>&1
          status=$?
          echo "$status" > artifacts/pwa42-training-camp-sync/push-status.txt
          cat artifacts/pwa42-training-camp-sync/push.log
          exit "$status"

      - name: Upload controlled sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa42-training-camp-sync
          path: |
            artifacts/pwa42-training-camp-sync
            cnc/test-results/pwa-build-reference-audit/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce sync and push result
        if: always()
        run: |
          set -euo pipefail
          test '${{ steps.sync.outcome }}' = 'success'
          test '${{ steps.commit.outcome }}' = 'success'
          test '${{ steps.push.outcome }}' = 'success'
