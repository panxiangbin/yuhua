name: Yuhua runtime catalog provenance audit

on:
  pull_request:
    paths:
      - 'assets/data.js'
      - 'products.json'
      - 'specs_index.json'
      - 'md_specs.json'
      - 'assets/pages.js'
      - 'tools/check_product_data.py'
      - 'tools/audit_public_catalog_runtime.py'
      - 'tools/audit_runtime_md_specs_alignment.py'
      - 'tools/audit_catalog_git_provenance.py'
      - '.github/workflows/yuhua-catalog-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data.js'
      - 'products.json'
      - 'specs_index.json'
      - 'md_specs.json'
      - 'assets/pages.js'
      - 'tools/check_product_data.py'
      - 'tools/audit_public_catalog_runtime.py'
      - 'tools/audit_runtime_md_specs_alignment.py'
      - 'tools/audit_catalog_git_provenance.py'
      - '.github/workflows/yuhua-catalog-provenance.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history without eagerly downloading historical blobs
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build base data-quality report
        run: python tools/check_product_data.py --json-output data_quality_report.json

      - name: Audit customer-facing runtime catalog data
        run: python tools/audit_public_catalog_runtime.py --report data_quality_report.json

      - name: Compare runtime-only models with current md_specs values
        run: python tools/audit_runtime_md_specs_alignment.py --report data_quality_report.json

      - name: Trace runtime-only models and same-commit context through Git history
        run: python tools/audit_catalog_git_provenance.py --report data_quality_report.json

      - name: Verify provenance coverage, current-value audit, and context accounting
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('data_quality_report.json').read_text(encoding='utf-8'))
          alignment = report['public_catalog_md_specs_alignment']
          provenance = report['public_catalog_git_provenance']
          context = provenance['introduction_context']

          assert alignment['status'] == 'ok'
          assert alignment['compared_model_count'] == alignment['runtime_only_models_with_exact_md_specs_key_count']
          assert alignment['missing_runtime_model_count'] == 0, repr(alignment['missing_runtime_models'])

          difference_models = set(alignment['models_with_any_shared_component_difference'])
          classified_difference_models = set().union(
              alignment['models_with_key_component_difference'],
              alignment['models_with_selling_component_difference'],
              alignment['models_with_specs_runtime_only_fields'],
              alignment['models_with_specs_md_specs_only_fields'],
              alignment['models_with_specs_shared_value_mismatch'],
          )
          assert classified_difference_models == difference_models, (
              'Every shared-component difference must be covered by at least one structural classification: '
              + repr(sorted(difference_models ^ classified_difference_models))
          )
          assert set(alignment['models_with_product_name_only_runtime_addition']).issubset(
              set(alignment['models_with_specs_runtime_only_fields'])
          )

          assert provenance['status'] == 'ok'
          assert provenance['runtime_history_commit_count'] >= 1
          assert provenance['source_history_commit_count'] >= 1
          assert provenance['unresolved_first_seen_model_count'] == 0, (
              'Every current runtime-only model must be traceable to a checked-in assets/data.js version: '
              + repr(provenance['unresolved_first_seen_models'])
          )
          assert len(context['models']) == provenance['resolved_first_seen_model_count']
          accounted = (
              context['same_commit_structured_key_model_count']
              + context['same_commit_strict_text_mention_model_count']
              + context['same_commit_documents_only_model_count']
              + context['git_provenance_only_model_count']
          )
          assert accounted == provenance['resolved_first_seen_model_count']
          print(
              'Runtime-only audits: OK '
              f"({alignment['compared_model_count']} current md_specs comparisons; "
              f"{alignment['models_with_any_shared_component_difference_count']} with classified differences; "
              f"{provenance['resolved_first_seen_model_count']} provenance-resolved models; "
              f"{context['same_commit_context_model_count']} with same-commit context)"
          )
          PY

      - name: Upload provenance-enhanced data-quality report
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-data-quality-provenance-report
          path: data_quality_report.json

      # Reporting only: Git age/provenance/context and current-value differences are never treated as proof of a product fact.
