name: CNC daily training plan smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-daily-training-plan-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-training-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Record exact tested head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cnc/test-artifacts/daily-training-plan
          tested_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$tested_head" != "$expected_head" ]; then
            echo "每日训练计划实际检出提交与预期最新头不一致：tested=$tested_head expected=$expected_head" >&2
            exit 1
          fi
          TESTED_HEAD="$tested_head" EVENT_SHA="$GITHUB_SHA" node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('cnc/test-artifacts/daily-training-plan/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            eventName: process.env.GITHUB_EVENT_NAME,
            testedHead: process.env.TESTED_HEAD,
            eventSha: process.env.EVENT_SHA,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Temporary controlled PWA49 generator
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '20260817-pwa48' cnc/build-info.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            python3 cnc/tests/apply_training_profile_nested_integrity_pwa49.py 2>&1 | tee cnc/test-artifacts/daily-training-plan/pwa49-generator.log
            git diff --name-only | tee cnc/test-artifacts/daily-training-plan/pwa49-files.txt
            if git diff --name-only | grep -Ev '^cnc/'; then
              echo 'PWA49受控生成越出cnc/**范围' >&2
              exit 1
            fi
            node --check cnc/training-profile.js
            node --check cnc/tests/mobile-daily-training-plan-smoke.cjs
            git add cnc
            git commit -m 'CNC：阻断共享成长档案嵌套异常覆盖并同步PWA49'
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          else
            echo 'PWA49正式CNC生成内容已经存在，本次仅执行只读回归。'
          fi
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: |
          node --check cnc/training-profile.js
          node --check cnc/tests/mobile-daily-training-plan-smoke.cjs
      - name: Start static server and wait until ready
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . > /tmp/cnc-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/cnc/ >/dev/null; then
              cp /tmp/cnc-server.log cnc/test-artifacts/daily-training-plan/server.log
              exit 0
            fi
            sleep 0.25
          done
          cp /tmp/cnc-server.log cnc/test-artifacts/daily-training-plan/server.log || true
          echo 'CNC静态服务器未在10秒内就绪' >&2
          exit 1
      - name: Chromium 390x844 personalized daily training plan
        run: |
          set -o pipefail
          node cnc/tests/mobile-daily-training-plan-smoke.cjs 2>&1 | tee cnc/test-artifacts/daily-training-plan/test.log
      - name: Upload daily training plan diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-daily-training-plan-${{ github.run_id }}
          path: cnc/test-artifacts/daily-training-plan/*
          if-no-files-found: error
          retention-days: 14
