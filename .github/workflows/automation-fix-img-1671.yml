name: One-off IMG_1671 poster cleanup

on:
  push:
    branches:
      - fix-img-1671-poster-20260921

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-img-1671-poster-20260921
          fetch-depth: 0
      - name: Apply deterministic cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          mp4 = Path('assets/videos/img_1671.mp4')
          jpg = Path('assets/videos/img_1671.jpg')
          if not mp4.is_file():
              raise SystemExit('Expected MP4 is missing; refusing to patch')
          if jpg.exists():
              raise SystemExit('Poster JPG exists; refusing to remove its reference')

          old_entry = '  "file": "assets/videos/img_1671.mp4",\n  "poster": "assets/videos/img_1671.jpg"'
          new_entry = '  "file": "assets/videos/img_1671.mp4"'
          for filename in ('assets/videos.js', 'videos.json'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old_entry) != 1:
                  raise SystemExit(f'{filename}: expected exactly one IMG_1671 poster reference')
              path.write_text(text.replace(old_entry, new_entry), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          fallback = '    "assets/videos/img_1671.jpg": true,\n'
          if text.count(fallback) != 1:
              raise SystemExit('index.html: expected exactly one IMG_1671 fallback')
          if text.count('assets/videos.js?v=20260921d') != 1:
              raise SystemExit('index.html: expected current videos.js cache version 20260921d exactly once')
          text = text.replace(fallback, '')
          text = text.replace('assets/videos.js?v=20260921d', 'assets/videos.js?v=20260921e')
          index.write_text(text, encoding='utf-8')

          manifest = json.loads(Path('videos.json').read_text(encoding='utf-8'))
          js = Path('assets/videos.js').read_text(encoding='utf-8')
          prefix = 'window.VIDEOS = '
          if not js.startswith(prefix) or not js.endswith(';'):
              raise SystemExit('assets/videos.js wrapper changed unexpectedly')
          if json.loads(js[len(prefix):-1]) != manifest:
              raise SystemExit('Video manifests diverged after patch')
          item = [v for v in manifest if v.get('file') == 'assets/videos/img_1671.mp4']
          if len(item) != 1 or 'poster' in item[0]:
              raise SystemExit('IMG_1671 cleanup validation failed')

          Path('.github/workflows/automation-fix-img-1671.yml').unlink()
          PY
      - name: Commit branch-only patch
        shell: bash
        run: |
          git config user.name "yuhua-site-automation"
          git config user.email "smxpxb008@gmail.com"
          git add assets/videos.js videos.json index.html .github/workflows/automation-fix-img-1671.yml
          git diff --cached --check
          git commit -m "Fix stale IMG_1671 video poster reference"
          git push origin HEAD:fix-img-1671-poster-20260921
