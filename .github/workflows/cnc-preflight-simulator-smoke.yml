name: CNC preflight simulator smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-preflight-simulator-smoke.yml'
  workflow_dispatch:

jobs:
  preflight-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check cnc/tests/mobile-preflight-simulator-smoke.cjs
      - name: Start static server
        run: python3 -m http.server 4173 --directory . > /tmp/cnc-server.log 2>&1 &
      - name: Chromium 390x844 preflight simulator
        run: node cnc/tests/mobile-preflight-simulator-smoke.cjs