name: Yuhua public homepage network audit

on:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - 'tools/audit_public_homepage_network.py'
      - '.github/workflows/yuhua-public-homepage-network-audit.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'assets/**'
      - 'tools/audit_public_homepage_network.py'
      - '.github/workflows/yuhua-public-homepage-network-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  self-test:
    name: Network audit self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4

      - name: Compile audit tool
        run: python3 -m py_compile tools/audit_public_homepage_network.py

      - name: Run deterministic self-test
        run: python3 tools/audit_public_homepage_network.py --self-test

  live-audit:
    name: Measure deployed homepage responses
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout audited revision
        uses: actions/checkout@v4

      - name: Wait for Pages deployment of this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          matched=0
          for attempt in $(seq 1 48); do
            runs="$(curl -fsSL --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=30")"
            status="$(jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")] | sort_by(.created_at) | last | .status // "missing"' <<<"${runs}")"
            conclusion="$(jq -r '[.workflow_runs[] | select(.name == "pages build and deployment")] | sort_by(.created_at) | last | .conclusion // ""' <<<"${runs}")"
            echo "Pages deployment attempt ${attempt}/48: status=${status}, conclusion=${conclusion:-pending}"

            if [[ "${status}" == "completed" && "${conclusion}" == "success" ]]; then
              matched=1
              break
            fi
            if [[ "${status}" == "completed" && "${conclusion}" != "success" ]]; then
              echo "::error::Pages deployment for ${GITHUB_SHA} completed with ${conclusion}."
              exit 1
            fi
            sleep 15
          done
          if [[ "${matched}" -ne 1 ]]; then
            echo "::error::Timed out waiting for Pages deployment of ${GITHUB_SHA}."
            exit 1
          fi

      - name: Measure public homepage and direct local dependencies
        run: >-
          python3 tools/audit_public_homepage_network.py
          --base-url https://panxiangbin.github.io/yuhua/
          --index index.html
          --output-dir reports/public_homepage_network
          --timeout 30

      - name: Show concise report
        if: always()
        run: |
          if [ -f reports/public_homepage_network/public_homepage_network_report.md ]; then
            cat reports/public_homepage_network/public_homepage_network_report.md
          fi

      - name: Upload network audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-public-homepage-network-audit-${{ github.run_id }}
          path: reports/public_homepage_network/
          if-no-files-found: error
          retention-days: 90
