name: CNC AI teacher public summary exact fix

on:
  push:
    branches:
      - chatgpt/cnc-ai-teacher-data-integrity-mainline
    paths:
      - 'cnc/tests/ai-teacher-data-integrity-smoke.cjs'
      - '.github/workflows/cnc-ai-teacher-public-summary-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-ai-teacher-public-summary-exact-fix
  cancel-in-progress: false

jobs:
  exact-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-ai-teacher-data-integrity-mainline

      - name: 精确修复公开摘要异常状态
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cnc/ai-teacher.html')
          text = path.read_text(encoding='utf-8')
          old = """    window.CNC_AI_TEACHER.getSummary=()=>{\n      const integrity=inspectLearningData();\n      if(!integrity.ok)return {integrity:'blocked',invalidKeys:integrity.invalid.map(item=>item.key),courses:null,wrong:null,simulations:null,weakest:null};\n      return originalGetSummary();\n    };\n"""
          new = """    const blockedSummary=integrity=>({integrity:'blocked',invalidKeys:integrity.invalid.map(item=>item.key),courses:null,wrong:null,simulations:null,weakest:null});\n    window.CNC_AI_TEACHER.getSummary=()=>{\n      const integrity=inspectLearningData();\n      if(!integrity.ok)return blockedSummary(integrity);\n      return originalGetSummary();\n    };\n    if(!initialIntegrity.ok)window.CNC_AI_TEACHER.initialSummary=blockedSummary(initialIntegrity);\n"""
          if new in text:
              print('公开摘要异常保护已存在，无需重复修改')
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          else:
              raise SystemExit('未找到唯一目标片段，拒绝猜改')
          PY
          grep -q "initialSummary=blockedSummary(initialIntegrity)" cnc/ai-teacher.html
          node --check cnc/tests/ai-teacher-data-integrity-smoke.cjs
          git diff --check

      - name: 提交精确修复
        shell: bash
        run: |
          if git diff --quiet; then
            echo '没有需要提交的变化'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/ai-teacher.html
          git commit -m 'fix(cnc): 阻止AI老师公开摘要伪报零进度'
          git push origin HEAD:chatgpt/cnc-ai-teacher-data-integrity-mainline
