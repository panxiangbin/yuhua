name: CNC training achievements integrity controlled fix

on:
  pull_request:
    paths:
      - 'cnc/tests/apply_training_achievements_completion_integrity_fix.py'
      - '.github/workflows/cnc-training-achievements-integrity-controlled-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-integrity-fix:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 241
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$tested_head" = "$expected_head"
          echo "tested_head=$tested_head"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply production and browser regression fix
        run: python3 cnc/tests/apply_training_achievements_completion_integrity_fix.py

      - name: Verify strict contract and syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check cnc/tests/mobile-training-achievements-smoke.cjs
          node --check cnc/tests/training-achievements-completion-integrity-contract-smoke.cjs
          node cnc/tests/training-achievements-completion-integrity-contract-smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('cnc/training-achievements.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if len(scripts)!=1:
              raise SystemExit(f'成长成果页内联脚本数量异常：{len(scripts)}')
          Path('/tmp/cnc-training-achievements-inline.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/cnc-training-achievements-inline.js
          git diff --check

      - name: Audit generated scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only | sort)
          printf '%s\n' "${files[@]}"
          expected=(
            cnc/tests/mobile-training-achievements-smoke.cjs
            cnc/training-achievements.html
          )
          if [ "${#files[@]}" -ne "${#expected[@]}" ]; then
            echo '受控修复文件数量异常' >&2
            exit 1
          fi
          for i in "${!expected[@]}"; do
            test "${files[$i]}" = "${expected[$i]}"
          done

      - name: Commit and fast-forward PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/training-achievements.html cnc/tests/mobile-training-achievements-smoke.cjs
          git commit -m 'CNC：阻断成长成果非法课程完成项静默降级'
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload controlled-fix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-training-achievements-integrity-fix-${{ github.run_id }}
          path: cnc/test-artifacts/training-achievements/*
          if-no-files-found: error
          retention-days: 14
