name: CNC profile practice analytics smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-profile-practice-analytics-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - run: node cnc/tests/mobile-profile-practice-analytics-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-profile-practice-analytics-${{ github.run_id }}
          path: cnc/test-results/profile-practice-analytics*
          if-no-files-found: warn
