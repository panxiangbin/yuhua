name: CNC AI teacher wrong compat PWA45 controlled sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          mkdir -p cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$actual" "$expected" > cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync/identity.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate AI teacher fix and PWA45 sync
        shell: bash
        run: |
          set -euo pipefail
          python3 cnc/tools/apply_ai_teacher_wrong_compat_pwa45.py | tee cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync/sync.log

      - name: Run strict PWA build reference audit
        shell: bash
        run: |
          set -euo pipefail
          node cnc/tests/pwa-build-reference-audit-smoke.cjs | tee cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync/pwa-audit.log
          cp cnc/test-results/pwa-build-reference-audit/report.json cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync/pwa-build-reference-report.json

      - name: Validate changed test syntax and scope
        shell: bash
        run: |
          set -euo pipefail
          node --check cnc/tests/ai-teacher-data-integrity-smoke.cjs
          git diff --name-only --diff-filter=ACMRT > cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync/changed-files.txt
          python3 - <<'PY'
          from pathlib import Path
          files=[line.strip() for line in Path('cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync/changed-files.txt').read_text().splitlines() if line.strip()]
          bad=[p for p in files if not (p.startswith('cnc/') or (p.startswith('.github/workflows/cnc-') and p.endswith(('.yml','.yaml'))))]
          required={'cnc/ai-teacher.html','cnc/tests/ai-teacher-data-integrity-smoke.cjs','cnc/sw.js','cnc/build-info.json'}
          missing=sorted(required-set(files))
          if bad: raise SystemExit(f'越界文件：{bad}')
          if missing: raise SystemExit(f'缺少核心变更：{missing}')
          print(f'受控生成文件数：{len(files)}')
          PY

      - name: Package full generated files and patch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync
          git diff --stat > "$out/diff-stat.txt" || true
          git diff --binary > "$out/generated.patch" || true
          if [ -s "$out/changed-files.txt" ]; then
            tar -czf "$out/generated-files.tar.gz" -T "$out/changed-files.txt"
          fi
          if [ -f cnc/test-results/ai-teacher-wrong-compat-pwa45-sync/manifest.json ]; then
            cp cnc/test-results/ai-teacher-wrong-compat-pwa45-sync/manifest.json "$out/manifest.json"
          fi

      - name: Create clean generated commit
        shell: bash
        run: |
          set -euo pipefail
          out=cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          while IFS= read -r path; do
            [ -n "$path" ] && git add -- "$path"
          done < "$out/changed-files.txt"
          git rm -- .github/workflows/cnc-ai-teacher-wrong-compat-pwa45-sync.yml cnc/tools/apply_ai_teacher_wrong_compat_pwa45.py
          git commit -m 'CNC：统一AI老师错题兼容字段并升级PWA45'
          generated="$(git rev-parse HEAD)"
          printf '%s\n' "$generated" > "$out/generated-commit-sha.txt"
          git show --stat --oneline --no-renames HEAD > "$out/generated-commit-stat.txt"
          git diff-tree --no-commit-id --name-status -r HEAD > "$out/generated-commit-files.txt"

      - name: Attempt clean branch fast-forward push
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Upload controlled sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-wrong-compat-pwa45-sync-${{ github.run_id }}
          path: cnc/test-artifacts/ai-teacher-wrong-compat-pwa45-sync
          if-no-files-found: error
