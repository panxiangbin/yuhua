name: CNC G93 inverse time feed safety trust smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g93-inverse-time-feed-safety-trust-smoke.yml'
  push:
    branches:
      - main
      - codex/cnc-g93-runtime-trust-gate
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g93-inverse-time-feed-safety-trust-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'push' && github.ref_name == 'codex/cnc-g93-runtime-trust-gate' && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: codex/cnc-g93-runtime-trust-gate
          fetch-depth: 2
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Apply G93 runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python cnc/tests/g93-runtime-repair.py
          node --check cnc/gm-code-complete.js
          node --check cnc/search-aliases.js
          node cnc/tests/g93-inverse-time-feed-safety-trust-smoke.cjs
          git diff --check
      - name: Commit CNC-only runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc
          if git diff --cached --quiet; then
            echo 'No CNC runtime changes produced' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -Ev '^cnc/' ; then
            echo 'Out-of-scope staged file detected' >&2
            exit 1
          fi
          git commit -m 'CNC：修复 G93 运行时边界并升级 PWA36'
          git push origin HEAD:codex/cnc-g93-runtime-trust-gate

  trust:
    if: github.event_name != 'push' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CNC_G93_REPORT: cnc-g93-inverse-time-feed-trust-report.json
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run G93 inverse-time feed safety trust gate
        run: node cnc/tests/g93-inverse-time-feed-safety-trust-smoke.cjs

      - name: Upload G93 trust diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-g93-inverse-time-feed-trust-${{ github.run_id }}
          path: cnc-g93-inverse-time-feed-trust-report.json
          if-no-files-found: error
          retention-days: 14
