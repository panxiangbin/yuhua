name: CNC training profile PWA52 workflow pin controlled sync

on:
  pull_request:
    paths:
      - 'cnc/tests/update_pwa52_workflow_pins.py'
      - '.github/workflows/cnc-training-profile-stage-compat-pwa52-controlled.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$tested" = "$expected"
          mkdir -p /tmp/cnc-pwa52-workflows
          printf '%s\n' "$tested" > /tmp/cnc-pwa52-workflows/tested-head.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure controlled commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Synchronize PWA52 workflow pins
        run: |
          set -euo pipefail
          python3 cnc/tests/update_pwa52_workflow_pins.py 2>&1 | tee /tmp/cnc-pwa52-workflows/generator.log
          git diff --check
          git diff --name-only | tee /tmp/cnc-pwa52-workflows/changed-files.txt
          git diff > /tmp/cnc-pwa52-workflows/generated.patch
      - name: Verify exact 10-workflow scope
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/cnc-pwa52-workflows/expected-files.txt <<'EOF'
          .github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml
          .github/workflows/cnc-beginner-placement-offline-pages-smoke.yml
          .github/workflows/cnc-g95-cold-offline-source-trust-smoke.yml
          .github/workflows/cnc-g96-g97-cold-offline-source-trust-smoke.yml
          .github/workflows/cnc-g98-g99-cold-offline-source-trust-smoke.yml
          .github/workflows/cnc-learning-media-smoke.yml
          .github/workflows/cnc-pwa-offline-cache-smoke.yml
          .github/workflows/cnc-pwa-self-test-smoke.yml
          .github/workflows/cnc-pwa-upgrade-data-smoke.yml
          .github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml
          EOF
          sort -o /tmp/cnc-pwa52-workflows/expected-files.txt /tmp/cnc-pwa52-workflows/expected-files.txt
          sort /tmp/cnc-pwa52-workflows/changed-files.txt > /tmp/cnc-pwa52-workflows/actual-files.txt
          diff -u /tmp/cnc-pwa52-workflows/expected-files.txt /tmp/cnc-pwa52-workflows/actual-files.txt
          grep -R -q '20260818-pwa52' $(cat /tmp/cnc-pwa52-workflows/expected-files.txt)
          old_pwa='20260817-pwa''51'
          old_cache='20260817-learning''51'
          if grep -R -E "$old_pwa|$old_cache" $(cat /tmp/cnc-pwa52-workflows/expected-files.txt); then
            echo 'workflow current target still contains previous PWA/cache pins' >&2
            exit 1
          fi
      - name: Run central PWA build reference audit
        run: |
          set -euo pipefail
          node cnc/tests/pwa-build-reference-audit-smoke.cjs 2>&1 | tee /tmp/cnc-pwa52-workflows/pwa-audit.log
      - name: Create generated workflow child commit
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows
          git commit -m 'CNC：同步PWA52工作流构建针'
          child="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          printf '%s\n' "$child" > /tmp/cnc-pwa52-workflows/child-sha.txt
          printf '%s\n' "$parent" > /tmp/cnc-pwa52-workflows/parent-sha.txt
          git show --stat --oneline HEAD > /tmp/cnc-pwa52-workflows/child-stat.txt
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Upload controlled workflow sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa52-workflow-pin-sync-${{ github.run_id }}
          path: /tmp/cnc-pwa52-workflows/*
          if-no-files-found: warn
          retention-days: 14
