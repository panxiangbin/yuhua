name: CNC apply AI teacher handoff producer on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cnc-apply-ai-teacher-handoff-producer-pr.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/cnc-ai-teacher-explainability-handoff-producer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-ai-teacher-explainability-handoff-producer
      - name: Apply controlled producer changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cnc/ai-teacher.html')
          text = path.read_text(encoding='utf-8')
          if "const HANDOFF_KEY = 'cnc_ai_teacher_explainability_handoff_v1';" in text:
              raise SystemExit('producer already applied')
          old = "  const CLASSIFICATION_VERSION = '20260802-v2';\n"
          new = old + "  const HANDOFF_KEY = 'cnc_ai_teacher_explainability_handoff_v1';\n  const HANDOFF_SCHEMA_VERSION = 1;\n  const HANDOFF_MAX_AGE_MS = 5 * 60 * 1000;\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          marker = "\n\n  function recommendation(intent,state){"
          producer = """

  function clearExplainabilityHandoff(){try{sessionStorage.removeItem(HANDOFF_KEY)}catch{}}
  function prepareExplainabilityHandoff(question,intent,now=Date.now()){
    clearExplainabilityHandoff();
    const value=String(question||'').trim();
    if((intent!=='blocked'&&intent!=='safety-boundary')||!value||value.length>120||!Number.isFinite(now))return false;
    const payload={schemaVersion:HANDOFF_SCHEMA_VERSION,source:'ai-teacher',intent,question:value,createdAt:now,expiresAt:now+HANDOFF_MAX_AGE_MS};
    try{sessionStorage.setItem(HANDOFF_KEY,JSON.stringify(payload));return true}catch{return false}
  }
"""
          assert text.count(marker) == 1
          text = text.replace(marker, producer + marker, 1)
          old_render = "  function renderAnswer(intent){const state=learningState();const result=recommendation(intent,state);const status=document.getElementById('answer-status');status.textContent=result.status||'训练建议';status.classList.toggle('blocked',result.blocked===true);document.getElementById('answer-title').textContent=result.title;document.getElementById('answer-copy').textContent=result.copy;fillList('answer-steps',result.steps,true);fillList('answer-donts',result.donts);fillList('answer-reasons',result.reasons);document.getElementById('answer-scope').textContent=result.scope;const routeRoot=document.getElementById('answer-routes');routeRoot.replaceChildren(...result.routes.map(item=>{const link=document.createElement('a');link.className=`btn${item.primary?'':' alt'}`;link.href=item.href;link.textContent=item.text;return link}));renderSources(result.sources||[]);const answer=document.getElementById('answer');answer.classList.add('show');answer.scrollIntoView({behavior:'smooth',block:'start'})}"
          new_render = """  function renderAnswer(intent,{handoffReady=false}={}){
    const state=learningState();
    const result=recommendation(intent,state);
    const status=document.getElementById('answer-status');
    status.textContent=result.status||'训练建议';
    status.classList.toggle('blocked',result.blocked===true);
    document.getElementById('answer-title').textContent=result.title;
    document.getElementById('answer-copy').textContent=result.copy;
    fillList('answer-steps',result.steps,true);
    fillList('answer-donts',result.donts);
    fillList('answer-reasons',result.reasons);
    document.getElementById('answer-scope').textContent=result.scope;
    const routes=[...result.routes];
    if(handoffReady)routes.push(route('查看本次判断说明','./ai-teacher-explainability.html'));
    const routeRoot=document.getElementById('answer-routes');
    routeRoot.replaceChildren(...routes.map(item=>{const link=document.createElement('a');link.className=`btn${item.primary?'':' alt'}`;link.href=item.href;link.textContent=item.text;return link}));
    renderSources(result.sources||[]);
    const answer=document.getElementById('answer');
    answer.classList.add('show');
    answer.scrollIntoView({behavior:'smooth',block:'start'});
  }"""
          assert text.count(old_render) == 1
          text = text.replace(old_render, new_render, 1)
          old_quick = "  document.getElementById('quick-questions').addEventListener('click',event=>{const button=event.target.closest('[data-intent]');if(button)renderAnswer(button.dataset.intent)});"
          new_quick = "  document.getElementById('quick-questions').addEventListener('click',event=>{const button=event.target.closest('[data-intent]');if(button){clearExplainabilityHandoff();renderAnswer(button.dataset.intent)}});"
          assert text.count(old_quick) == 1
          text = text.replace(old_quick, new_quick, 1)
          old_submit = "  document.getElementById('ask-form').addEventListener('submit',event=>{event.preventDefault();const classified=classifyQuestion(document.getElementById('question').value);renderAnswer(classified.intent)});"
          new_submit = "  document.getElementById('ask-form').addEventListener('submit',event=>{event.preventDefault();const question=document.getElementById('question').value;const classified=classifyQuestion(question);const handoffReady=prepareExplainabilityHandoff(question,classified.intent);renderAnswer(classified.intent,{handoffReady})});"
          assert text.count(old_submit) == 1
          text = text.replace(old_submit, new_submit, 1)
          old_export = "classificationSignals:{blocked:BLOCK_RULES.map(rule=>rule.id),safeDiscussion:SAFE_DISCUSSION_RULES.map(rule=>rule.id)},getSummary:"
          new_export = "classificationSignals:{blocked:BLOCK_RULES.map(rule=>rule.id),safeDiscussion:SAFE_DISCUSSION_RULES.map(rule=>rule.id)},handoff:{key:HANDOFF_KEY,schemaVersion:HANDOFF_SCHEMA_VERSION,maxAgeMs:HANDOFF_MAX_AGE_MS,prepare:prepareExplainabilityHandoff,clear:clearExplainabilityHandoff},getSummary:"
          assert text.count(old_export) == 1
          text = text.replace(old_export, new_export, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          text = Path('cnc/ai-teacher.html').read_text(encoding='utf-8')
          Path('/tmp/ai-teacher.js').write_text(text.split('<script>',1)[1].split('</script>',1)[0], encoding='utf-8')
          PY
          node --check /tmp/ai-teacher.js
      - name: Commit controlled change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cnc/ai-teacher.html
          git diff --cached --check
          git commit -m "feat(cnc): 接入AI老师判断说明一次性交接生产端"
          git push origin HEAD:chatgpt/cnc-ai-teacher-explainability-handoff-producer
