name: CNC training camp data integrity apply

on:
  push:
    branches:
      - codex/cnc-training-camp-data-integrity
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cnc-training-camp-data-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply controlled data-integrity patch
        run: node cnc/tests/apply-training-camp-data-integrity-patch.cjs
      - name: Verify scoped changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          node --check cnc/tests/mobile-training-camp-hub-smoke.cjs
          node --check cnc/tests/apply-training-camp-data-integrity-patch.cjs
          test "$(git diff --name-only | grep -Ev '^cnc/' | wc -l)" -eq 0
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CNC Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cnc/training-camp.html cnc/tests/mobile-training-camp-hub-smoke.cjs cnc/sw.js cnc/build-info.json cnc/pwa-status.html cnc/pwa-self-test.html cnc/MOBILE_LEARNING_MEDIA_PROGRESS.md
          git diff --cached --quiet && exit 0
          git commit -m 'CNC：增强训练营异常数据降级并提升PWA41'
          git push origin HEAD:codex/cnc-training-camp-data-integrity
