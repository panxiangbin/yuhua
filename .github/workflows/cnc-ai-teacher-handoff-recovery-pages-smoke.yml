name: CNC AI teacher handoff recovery Pages smoke

on:
  pull_request:
    paths:
      - 'cnc/ai-teacher-explainability.html'
      - 'cnc/tests/pages-ai-teacher-handoff-recovery-deployment-smoke.cjs'
      - 'cnc/docs/ai-teacher-handoff-recovery-pages-contract.md'
      - '.github/workflows/cnc-ai-teacher-handoff-recovery-pages-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'cnc/ai-teacher-explainability.html'
      - 'cnc/tests/pages-ai-teacher-handoff-recovery-deployment-smoke.cjs'
      - 'cnc/docs/ai-teacher-handoff-recovery-pages-contract.md'
      - '.github/workflows/cnc-ai-teacher-handoff-recovery-pages-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnc-ai-teacher-handoff-recovery-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate exact deployment test and anti-bypass contract
        run: |
          set -euxo pipefail
          test -f cnc/tests/pages-ai-teacher-handoff-recovery-deployment-smoke.cjs
          test -f cnc/docs/ai-teacher-handoff-recovery-pages-contract.md
          node --check cnc/tests/pages-ai-teacher-handoff-recovery-deployment-smoke.cjs
          grep -q "逐字节" cnc/docs/ai-teacher-handoff-recovery-pages-contract.md
          grep -q "SHA-256" cnc/docs/ai-teacher-handoff-recovery-pages-contract.md
          grep -q "pageshow.persisted === true" cnc/docs/ai-teacher-handoff-recovery-pages-contract.md
          grep -q "相同版本原厂手册" cnc/docs/ai-teacher-handoff-recovery-pages-contract.md
          ! grep -Eq "test\.skip\(|describe\.skip\(|it\.skip\(|process\.exit\(0\)" cnc/tests/pages-ai-teacher-handoff-recovery-deployment-smoke.cjs
          ! grep -Eqi "allowOperationalUse: true|跳过原厂手册|关闭联锁" cnc/docs/ai-teacher-handoff-recovery-pages-contract.md
      - name: Verify main and Pages exact recovery deployment
        env:
          CNC_PAGES_VERIFY_ATTEMPTS: '18'
          CNC_PAGES_VERIFY_INTERVAL_MS: '10000'
        run: node cnc/tests/pages-ai-teacher-handoff-recovery-deployment-smoke.cjs
      - name: Upload Pages deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-handoff-recovery-pages-${{ github.run_id }}
          path: cnc/test-results/ai-teacher-handoff-recovery-pages/
          if-no-files-found: error
          retention-days: 14
