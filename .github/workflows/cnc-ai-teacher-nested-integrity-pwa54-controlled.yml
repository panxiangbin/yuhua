name: CNC AI teacher nested integrity PWA54 controlled fix

on:
  pull_request:
    paths:
      - 'cnc/tests/apply_ai_teacher_nested_integrity_pwa54.py'
      - '.github/workflows/cnc-ai-teacher-nested-integrity-pwa54-controlled.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-ai-teacher-nested-integrity-pwa54-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact tested head
        shell: bash
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          mkdir -p cnc/test-results/ai-teacher-pwa54-controlled
          printf '{"expectedHead":"%s","testedHead":"%s"}\n' "$expected" "$actual" > cnc/test-results/ai-teacher-pwa54-controlled/identity.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply scoped PWA54 CNC runtime patch
        shell: bash
        run: |
          set -o pipefail
          python3 cnc/tests/apply_ai_teacher_nested_integrity_pwa54.py 2>&1 | tee cnc/test-results/ai-teacher-pwa54-controlled/generator.log

      - name: Validate generated JavaScript and scope
        shell: bash
        run: |
          node --check cnc/tests/ai-teacher-data-integrity-smoke.cjs
          node --check cnc/tests/ai-teacher-nested-integrity-contract-smoke.cjs
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          changed="$(git diff --name-only)"
          test -n "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^cnc/' || true)"
          test -z "$bad" || { echo "越权文件：$bad" >&2; exit 1; }
          printf '%s\n' "$changed" > cnc/test-results/ai-teacher-pwa54-controlled/changed-files.txt

      - name: Create generated child commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/
          git diff --cached --quiet && { echo '没有生成变更' >&2; exit 1; }
          git commit -m 'CNC：阻断AI老师嵌套损坏档案并升级PWA54'
          git rev-parse HEAD > cnc/test-results/ai-teacher-pwa54-controlled/child-sha.txt
          git show --stat --oneline HEAD > cnc/test-results/ai-teacher-pwa54-controlled/stat.txt
          git show --format=fuller --binary HEAD > cnc/test-results/ai-teacher-pwa54-controlled/patch.txt

      - name: Push generated child commit
        shell: bash
        run: |
          branch='${{ github.event.pull_request.head.ref }}'
          test -n "$branch"
          git push origin "HEAD:$branch"

      - name: Upload controlled generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-nested-integrity-pwa54-${{ github.run_id }}
          path: cnc/test-results/ai-teacher-pwa54-controlled/
          if-no-files-found: error
