name: CNC beginner placement offline Pages smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-beginner-placement-offline-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize diagnostics
        run: |
          mkdir -p cnc/test-results/beginner-placement-offline-pages
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('cnc/test-results/beginner-placement-offline-pages/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            headSha: process.env.GITHUB_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Validate deployment gate contract
        run: |
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/sw.js
          node - <<'NODE'
          const fs = require('fs');
          const test = fs.readFileSync('cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs', 'utf8');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const placement = fs.readFileSync('cnc/beginner-placement.html', 'utf8');
          const camp = fs.readFileSync('cnc/training-camp.html', 'utf8');
          if (info.build !== '20260806-learning-depth1') throw new Error(`unexpected site build: ${info.build}`);
          if (info.pwaBuild !== '20260806-pwa15' || info.cacheRevision !== '20260806-learning15') throw new Error(`unexpected PWA/cache build: ${info.pwaBuild}/${info.cacheRevision}`);
          if (!sw.includes("const BUILD = '20260806-pwa15'") || !sw.includes("const CACHE_REVISION = '20260806-learning15'")) throw new Error('Service Worker build/cache mismatch');
          for (const token of [
            "const branchTargetPwaBuild = '20260806-pwa15'",
            "const previousPublicPwaBuild = '20260806-pwa14'",
            "[branchTargetPwaBuild]: '20260806-learning15'",
            "[previousPublicPwaBuild]: '20260806-learning14'",
            "const expectedSiteBuild = '20260806-learning-depth1'",
            'CNC_PAGES_VERIFY_ATTEMPTS || 18',
            "cache: 'no-store'",
            'cnc/beginner-placement.html',
            'beginnerPlacementPublic: true',
            'beginnerPlacementInCoreCache: true',
            'trainingCampInCoreCache: true',
            'placementFirstStepCoursesInCoreCache: true',
            'coreResourceCount: EXACT_CORE.length',
            'criticalSafetyGatePresent: true',
            'oneTimeRouteHandoffPresent: true',
            'mainPagesExactBytesMatch: true',
            'mainPagesExactSha256Match: true',
            'branchDeploymentPending',
            'process.exit(1)'
          ]) {
            if (!test.includes(token)) throw new Error(`deployment test missing: ${token}`);
          }
          if (!placement.includes('criticalFailures') || !placement.includes("decision:'critical-safety'")) throw new Error('beginner placement critical safety gate missing');
          if (!placement.includes('cnc_beginner_placement_route_handoff_v1') || !camp.includes('cnc_beginner_placement_route_handoff_v1')) throw new Error('placement route handoff producer or consumer missing');
          for (const file of ['./training-camp.html','./course-safety-foundation.html','./course-coordinate-axes.html','./course-g00-g01-basics.html','./ai-teacher.html','./ai-teacher-intake.html','./ai-teacher-explainability.html']) {
            if (!sw.includes(`'${file}'`)) throw new Error(`PWA core missing: ${file}`);
          }
          for (const stage of ['起点测评关键安全门禁','起点测评离线核心','测评路线一次性交接','训练营路线离线核心','测评首步课程离线核心','正式课程开发占位清零','AI老师学习档案异常保护','80个图文小课']) {
            if (!String(info.contentStage || '').includes(stage)) throw new Error(`build marker missing: ${stage}`);
          }
          for (const forbidden of ['test.skip(', 'describe.skip(', 'it.skip(', 'process.exit(0)', 'CNC_PAGES_VERIFY_ATTEMPTS || 0']) {
            if (test.includes(forbidden)) throw new Error(`deployment gate bypass found: ${forbidden}`);
          }
          NODE
      - name: Verify main and Pages exact deployment
        env:
          CNC_PAGES_VERIFY_ATTEMPTS: 18
          CNC_PAGES_VERIFY_INTERVAL_MS: 10000
        run: node cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-beginner-placement-offline-pages-${{ github.run_id }}
          path: cnc/test-results/beginner-placement-offline-pages/**
          if-no-files-found: error
          retention-days: 14
