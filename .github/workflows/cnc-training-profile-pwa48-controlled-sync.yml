name: CNC training profile PWA48 controlled sync

on:
  pull_request:
    paths:
      - 'cnc/tests/apply_training_profile_root_integrity_pwa48.py'
      - '.github/workflows/cnc-training-profile-pwa48-controlled-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          mkdir -p cnc/test-artifacts/training-profile-pwa48-sync
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$actual" "$expected" > cnc/test-artifacts/training-profile-pwa48-sync/identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate CNC-only PWA48 source/test changes
        run: python3 cnc/tests/apply_training_profile_root_integrity_pwa48.py
      - name: Record generated commit and scope
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > cnc/test-artifacts/training-profile-pwa48-sync/generated-head.txt
          git show --stat --oneline --decorate=no HEAD > cnc/test-artifacts/training-profile-pwa48-sync/stat.txt
          git diff HEAD^ HEAD -- . > cnc/test-artifacts/training-profile-pwa48-sync/generated.patch
          git diff --name-only HEAD^ HEAD > cnc/test-artifacts/training-profile-pwa48-sync/files.txt
          if grep -Ev '^cnc/' cnc/test-artifacts/training-profile-pwa48-sync/files.txt; then
            echo '生成提交越过 CNC 范围' >&2
            exit 1
          fi
      - name: Push generated non-workflow commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload controlled sync diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-training-profile-pwa48-sync-${{ github.run_id }}
          path: cnc/test-artifacts/training-profile-pwa48-sync/*
          if-no-files-found: warn
          retention-days: 14
