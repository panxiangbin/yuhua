name: CNC safety coordinate practice smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-practice-safety-coordinate-smoke.yml'
  workflow_dispatch:

jobs:
  safety-coordinate-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check cnc/tests/mobile-practice-safety-coordinate-smoke.cjs
      - name: Start static server
        run: python3 -m http.server 4173 --directory . > /tmp/cnc-server.log 2>&1 &
      - name: Chromium 390x844 safety coordinate practice
        run: node cnc/tests/mobile-practice-safety-coordinate-smoke.cjs
      - name: Upload safety coordinate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-coordinate-practice-diagnostics
          path: artifacts/practice-safety-coordinate/
          if-no-files-found: warn
          retention-days: 7
