name: Yuhua customer site checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'assets/pages.js'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - 'product/**'
      - 'model/**'
      - 'sitemap.xml'
      - 'products.json'
      - 'specs_index.json'
      - 'tools/check_product_data.py'
      - '.github/workflows/yuhua-data-quality.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'assets/pages.js'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - 'product/**'
      - 'model/**'
      - 'sitemap.xml'
      - 'products.json'
      - 'specs_index.json'
      - 'tools/check_product_data.py'
      - '.github/workflows/yuhua-data-quality.yml'

permissions:
  contents: read

jobs:
  inspect-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check assets/pages.js
          node --check assets/customer-tools.js

      - name: Verify mobile table header/body alignment contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          css = Path('assets/customer-tools.css').read_text(encoding='utf-8')
          app_js = Path('app.js').read_text(encoding='utf-8')
          tools_js = Path('assets/customer-tools.js').read_text(encoding='utf-8')

          def hidden_header_columns(section_id):
              section = re.search(
                  rf'<section\b[^>]*\bid=["\']{re.escape(section_id)}["\'][^>]*>(.*?)</section>',
                  html,
                  flags=re.S | re.I,
              )
              assert section, f'Missing section #{section_id}'
              head = re.search(r'<thead>\s*<tr>(.*?)</tr>\s*</thead>', section.group(1), flags=re.S | re.I)
              assert head, f'Missing table header in #{section_id}'
              cells = re.findall(r'<th\b([^>]*)>', head.group(1), flags=re.S | re.I)
              assert cells, f'No header cells found in #{section_id}'
              return [
                  index
                  for index, attrs in enumerate(cells, start=1)
                  if re.search(r'\bclass=["\'][^"\']*\bhide-sm\b', attrs, flags=re.I)
              ]

          catalog_hidden = hidden_header_columns('catalog')
          specs_hidden = hidden_header_columns('specs')
          assert catalog_hidden == [3, 4, 5], f'Unexpected catalog mobile-hidden headers: {catalog_hidden}'
          assert specs_hidden == [2], f'Unexpected specs mobile-hidden headers: {specs_hidden}'

          media_start = css.find('@media (max-width: 768px)')
          media_end = css.find('@media (max-width: 480px)', media_start + 1)
          assert media_start >= 0 and media_end > media_start, 'Expected 768px mobile CSS block is missing'
          mobile_css = css[media_start:media_end]

          for column in catalog_hidden:
              selector = f'#catalog .ptable tbody td:nth-child({column})'
              assert selector in mobile_css, f'Mobile catalog body does not hide column {column}'
          assert '#specs .ptable tbody .pname' in mobile_css, 'Specs body series/title column is not hidden with its header'
          assert '#specs .table-wrap' in mobile_css and 'overflow-x: auto' in mobile_css, 'Specs table must remain horizontally scrollable on mobile'
          assert '#specs .ptable { min-width:' in mobile_css, 'Specs table needs a mobile minimum width so action columns are not clipped'

          # Body structure contracts that the CSS selectors depend on.
          assert app_js.count('<td class="pname">') >= 2, 'Expected pname cells for product/spec table rendering'
          assert "'<td><a class=\"spec-btn rich\"" in app_js, 'Specs online-view action column is missing'
          assert "'<td><a class=\"spec-btn\"" in app_js, 'Specs download action column is missing'

          # customer-tools.js adds the fifth specs action column after the four-column base table renders.
          assert 'headCell.className = "spec-inquiry-head";' in tools_js, 'Specs inquiry header extension is missing'
          assert 'cell.className = "spec-inquiry-cell";' in tools_js, 'Specs inquiry body extension is missing'
          assert 'if (row.cells[0].colSpan >= 4) row.cells[0].colSpan = 5;' in tools_js, 'Specs overflow row colspan must expand to five columns'

          print('Mobile table alignment contract: OK (catalog hidden 3/4/5; specs hidden 2 + 3 visible actions)')
          PY

      - name: Verify separator-tolerant model search
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('app.js', 'utf8');
          const fn = source.match(/function normalizeSearchText\(value\) \{[\s\S]*?\n  \}/);
          if (!fn) throw new Error('normalizeSearchText helper is missing');
          eval(fn[0]);

          const variants = ['DLSB-5/30', 'DLSB-5-30', 'DLSB 5 30', 'DLSB_5／30'];
          const normalized = variants.map(normalizeSearchText);
          if (!normalized.every(v => v === 'dlsb530')) {
            throw new Error('DLSB model separator normalization failed: ' + normalized.join(', '));
          }
          if (normalizeSearchText('YRE-2020Z') !== normalizeSearchText('YRE 2020Z')) {
            throw new Error('YRE separator normalization failed');
          }
          if ((source.match(/var qCompact = normalizeSearchText\(q\);/g) || []).length < 2) {
            throw new Error('Both product and specification searches must normalize the query');
          }
          if ((source.match(/rankSearchResults\(/g) || []).length < 3) {
            throw new Error('Both product and specification searches must use the shared ranking helper');
          }
          console.log('Separator-tolerant search: OK');
          NODE

      - name: Verify exact-model-first search ranking
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('app.js', 'utf8');
          const names = ['normalizeSearchText', 'normalizeSearchToken', 'searchMatchRank', 'rankSearchResults'];
          const snippets = names.map(name => {
            const fn = source.match(new RegExp('function ' + name + '\\([^)]*\\) \\{[\\s\\S]*?\\n  \\}'));
            if (!fn) throw new Error(name + ' helper is missing');
            return fn[0];
          });
          const helpers = new Function(snippets.join('\n') + '\nreturn { normalizeSearchText, normalizeSearchToken, searchMatchRank, rankSearchResults };')();
          const normalizeSearchText = helpers.normalizeSearchText;
          const rankSearchResults = helpers.rankSearchResults;

          const models = [
            { model: 'YSFS-50L', text: '高温循环装置' },
            { model: 'YSF-50L', text: '高温循环装置' },
            { model: 'YSF', text: '高温循环装置' },
            { model: 'AYSF-50L', text: '测试文本' },
            { model: 'DLSB-5-30', text: '低温冷却循环泵' }
          ];
          function ranked(query) {
            const q = query.toLowerCase();
            return rankSearchResults(models, x => x.model, x => x.text, q, normalizeSearchText(q)).map(x => x.model);
          }

          const ysf = ranked('YSF');
          const expectedYsf = ['YSF', 'YSF-50L', 'YSFS-50L', 'AYSF-50L'];
          if (ysf.slice(0, 4).join('|') !== expectedYsf.join('|')) {
            throw new Error('YSF ranking is not exact -> family boundary -> broader prefix -> contains: ' + ysf.join(', '));
          }
          const dlsb = ranked('DLSB-5/30');
          if (dlsb[0] !== 'DLSB-5-30') {
            throw new Error('Separator-equivalent exact model must rank first: ' + dlsb.join(', '));
          }
          console.log('Exact-model-first ranking: OK');
          NODE

      - name: Prevent unsafe category-level detail fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('app.js').read_text(encoding='utf-8')
          forbidden = [
              'var _keyMap',
              '_keyMap[p.key]',
              '同类任意详情页均可引路',
          ]
          for token in forbidden:
              assert token not in js, f'Unsafe category-level detail fallback found: {token}'

          assert 'if (p.detail) return p.detail;' in js, 'Explicit product detail mapping is missing'
          assert '_prefixMap.push({ prefix: pf.toUpperCase(), key: pg.key, page: pg.page });' in js, 'Prefix mappings must retain product category key'
          assert 'p.key === candidate.key && m.indexOf(candidate.prefix) === 0' in js, 'Prefix detail links must also match product category'
          print('Detail-link safety policy: OK (explicit detail, or prefix + category match only)')
          PY

      - name: Verify email-only public contact policy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          expected = 'smxpxb008@gmail.com'
          index_html = Path('index.html').read_text(encoding='utf-8')
          assert expected in index_html, 'Sales email is missing from index.html'
          assert 'mailto:' + expected in index_html, 'Clickable sales email is missing'

          public_html = [Path('index.html')] + sorted(Path('model').glob('*.html'))
          for path in public_html:
              html = path.read_text(encoding='utf-8')
              assert 'tel:' not in html.lower(), f'Telephone link found in {path}'
              assert '微信' not in html, f'WeChat wording found in {path}'
              assert not re.search(r'(?<!\d)1[3-9]\d{9}(?!\d)', html), f'Possible mobile phone number found in {path}'
          print(f'Email-only contact policy: OK ({len(public_html)} public pages checked)')
          PY

      - name: Verify sitemap and model landing pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = [node.text.strip() for node in root.findall('sm:url/sm:loc', ns) if node.text]
          assert len(locs) == len(set(locs)), 'Duplicate URLs found in sitemap.xml'

          sitemap_paths = {urlparse(url).path.removeprefix('/yuhua/') for url in locs}
          model_pages = sorted(Path('model').glob('*.html'))
          for page in model_pages:
              assert page.as_posix() in sitemap_paths, f'{page} is not listed in sitemap.xml'
          print(f'Sitemap/model-page check: OK ({len(model_pages)} model pages)')
          PY

      - name: Check product, spec and detail-page mapping data
        run: python tools/check_product_data.py --json-output data_quality_report.json

      - name: Enforce unambiguous detail-page mappings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('data_quality_report.json').read_text(encoding='utf-8'))
          mapping = report['page_mapping']
          assert mapping['missing_target_count'] == 0, f"Missing detail-page targets: {mapping['missing_targets']}"
          assert mapping['ambiguous_same_key_prefix_count'] == 0, (
              'Ambiguous same-category model prefixes must be resolved before merge: '
              + repr(mapping['ambiguous_same_key_prefixes'])
          )
          print('Detail-page mapping gate: OK (no missing targets, no ambiguous same-category prefixes)')
          PY

      - name: Upload data-quality report
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-data-quality-report
          path: data_quality_report.json

      # This workflow is intentionally read-only: it reports catalogue problems
      # but never edits or deletes product parameters automatically.
