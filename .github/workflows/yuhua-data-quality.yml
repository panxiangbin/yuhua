name: Yuhua customer site checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - 'products.json'
      - 'specs_index.json'
      - 'tools/check_product_data.py'
      - '.github/workflows/yuhua-data-quality.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - 'products.json'
      - 'specs_index.json'
      - 'tools/check_product_data.py'
      - '.github/workflows/yuhua-data-quality.yml'

permissions:
  contents: read

jobs:
  inspect-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check assets/customer-tools.js

      - name: Verify email-only public contact policy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          html = Path('index.html').read_text(encoding='utf-8')
          expected = 'smxpxb008@gmail.com'
          assert expected in html, 'Sales email is missing from index.html'
          assert 'mailto:' + expected in html, 'Clickable sales email is missing'
          assert 'tel:' not in html.lower(), 'Telephone link found in public page'
          assert '微信' not in html, 'WeChat wording found in public page'
          assert not re.search(r'(?<!\d)1[3-9]\d{9}(?!\d)', html), 'Possible mobile phone number found in public page'
          print('Email-only contact policy: OK')
          PY

      - name: Check product and spec data
        run: python tools/check_product_data.py --json-output data_quality_report.json

      - name: Upload data-quality report
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-data-quality-report
          path: data_quality_report.json
