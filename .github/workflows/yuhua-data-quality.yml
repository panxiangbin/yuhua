name: Yuhua customer site checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'assets/pages.js'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - 'product/**'
      - 'model/**'
      - 'sitemap.xml'
      - 'products.json'
      - 'specs_index.json'
      - 'tools/check_product_data.py'
      - '.github/workflows/yuhua-data-quality.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'assets/pages.js'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - 'product/**'
      - 'model/**'
      - 'sitemap.xml'
      - 'products.json'
      - 'specs_index.json'
      - 'tools/check_product_data.py'
      - '.github/workflows/yuhua-data-quality.yml'

permissions:
  contents: read

jobs:
  inspect-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check assets/pages.js
          node --check assets/customer-tools.js

      - name: Prevent unsafe category-level detail fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('app.js').read_text(encoding='utf-8')
          forbidden = [
              'var _keyMap',
              '_keyMap[p.key]',
              '同类任意详情页均可引路',
          ]
          for token in forbidden:
              assert token not in js, f'Unsafe category-level detail fallback found: {token}'

          assert 'if (p.detail) return p.detail;' in js, 'Explicit product detail mapping is missing'
          assert '_prefixMap.push({ prefix: pf.toUpperCase(), key: pg.key, page: pg.page });' in js, 'Prefix mappings must retain product category key'
          assert 'p.key === candidate.key && m.indexOf(candidate.prefix) === 0' in js, 'Prefix detail links must also match product category'
          print('Detail-link safety policy: OK (explicit detail, or prefix + category match only)')
          PY

      - name: Verify email-only public contact policy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          expected = 'smxpxb008@gmail.com'
          index_html = Path('index.html').read_text(encoding='utf-8')
          assert expected in index_html, 'Sales email is missing from index.html'
          assert 'mailto:' + expected in index_html, 'Clickable sales email is missing'

          public_html = [Path('index.html')] + sorted(Path('model').glob('*.html'))
          for path in public_html:
              html = path.read_text(encoding='utf-8')
              assert 'tel:' not in html.lower(), f'Telephone link found in {path}'
              assert '微信' not in html, f'WeChat wording found in {path}'
              assert not re.search(r'(?<!\d)1[3-9]\d{9}(?!\d)', html), f'Possible mobile phone number found in {path}'
          print(f'Email-only contact policy: OK ({len(public_html)} public pages checked)')
          PY

      - name: Verify sitemap and model landing pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = [node.text.strip() for node in root.findall('sm:url/sm:loc', ns) if node.text]
          assert len(locs) == len(set(locs)), 'Duplicate URLs found in sitemap.xml'

          sitemap_paths = {urlparse(url).path.removeprefix('/yuhua/') for url in locs}
          model_pages = sorted(Path('model').glob('*.html'))
          for page in model_pages:
              assert page.as_posix() in sitemap_paths, f'{page} is not listed in sitemap.xml'
          print(f'Sitemap/model-page check: OK ({len(model_pages)} model pages)')
          PY

      - name: Check product, spec and detail-page mapping data
        run: python tools/check_product_data.py --json-output data_quality_report.json

      - name: Enforce unambiguous detail-page mappings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('data_quality_report.json').read_text(encoding='utf-8'))
          mapping = report['page_mapping']
          assert mapping['missing_target_count'] == 0, f"Missing detail-page targets: {mapping['missing_targets']}"
          assert mapping['ambiguous_same_key_prefix_count'] == 0, (
              'Ambiguous same-category model prefixes must be resolved before merge: '
              + repr(mapping['ambiguous_same_key_prefixes'])
          )
          print('Detail-page mapping gate: OK (no missing targets, no ambiguous same-category prefixes)')
          PY

      - name: Upload data-quality report
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-data-quality-report
          path: data_quality_report.json

      # This workflow is intentionally read-only: it reports catalogue problems
      # but never edits or deletes product parameters automatically.
