name: Yuhua catalogue data quality

on:
  pull_request:
    paths:
      - 'products.json'
      - 'specs_index.json'
      - 'tools/check_product_data.py'
      - '.github/workflows/yuhua-data-quality.yml'
  push:
    branches: [main]
    paths:
      - 'products.json'
      - 'specs_index.json'
      - 'tools/check_product_data.py'
      - '.github/workflows/yuhua-data-quality.yml'

permissions:
  contents: read

jobs:
  inspect-catalogue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check product and spec data
        run: python tools/check_product_data.py --json-output data_quality_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-data-quality-report
          path: data_quality_report.json
