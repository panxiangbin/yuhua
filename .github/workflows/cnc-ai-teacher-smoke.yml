name: CNC AI teacher smoke

on:
  pull_request:
    paths:
      - 'cnc/ai-teacher.html'
      - 'cnc/ai-teacher-intake.html'
      - 'cnc/profile.html'
      - 'cnc/build-info.json'
      - 'cnc/docs/ai-teacher-trust-boundary-contract.md'
      - 'cnc/docs/ai-teacher-classification-contract.md'
      - 'cnc/tests/mobile-ai-teacher-smoke.cjs'
      - 'cnc/tests/ai-teacher-classification-smoke.cjs'
      - 'cnc/tests/fixtures/ai-teacher-classification-cases.json'
      - '.github/workflows/cnc-ai-teacher-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-teacher:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate local-only safety and trust contract
        run: |
          set -euxo pipefail
          grep -q "20260804-mobile-home1" cnc/ai-teacher.html
          grep -q "20260802-v2" cnc/ai-teacher.html
          grep -q "localOnly:true\|localOnly: true" cnc/ai-teacher.html
          grep -q "externalModel:false\|externalModel: false" cnc/ai-teacher.html
          grep -q "不调用外部模型" cnc/ai-teacher.html
          grep -q "不会给出脱离具体机床" cnc/ai-teacher.html
          grep -q "核对机床原厂手册" cnc/ai-teacher.html
          grep -q "ai-teacher-intake.html" cnc/ai-teacher.html
          grep -q "先生成现场问诊单\|生成现场问诊单" cnc/ai-teacher.html
          grep -q "classifyQuestion" cnc/ai-teacher.html
          grep -q "BLOCK_RULES" cnc/ai-teacher.html
          grep -q "SAFE_DISCUSSION_RULES" cnc/ai-teacher.html
          grep -q "OVERRIDE_EXECUTION_PATTERN" cnc/ai-teacher.html
          grep -q "已阻断高风险请求" cnc/ai-teacher.html
          grep -q "安全原理说明" cnc/ai-teacher.html
          grep -q "无法给出可直接上机" cnc/ai-teacher.html
          grep -q "content-trust-status.html" cnc/ai-teacher.html
          grep -q "content-trust-evidence.html" cnc/ai-teacher.html
          grep -q "依据来源与可信状态" cnc/ai-teacher.html
          grep -q "资料清单与逐条复核记录不能互相代替" cnc/ai-teacher.html
          test -f cnc/ai-teacher-intake.html
          test -f cnc/content-trust-status.html
          test -f cnc/content-trust-evidence.html
          test -f cnc/docs/ai-teacher-trust-boundary-contract.md
          test -f cnc/docs/ai-teacher-classification-contract.md
          test -f cnc/tests/fixtures/ai-teacher-classification-cases.json
          ! grep -Eqi "https?://|fetch\(|XMLHttpRequest|WebSocket|EventSource" cnc/ai-teacher.html
          ! grep -Eq "test\.skip\(|describe\.skip\(|it\.skip\(" cnc/tests/mobile-ai-teacher-smoke.cjs cnc/tests/ai-teacher-classification-smoke.cjs
      - name: Validate classification fixture contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const fixture = JSON.parse(fs.readFileSync('cnc/tests/fixtures/ai-teacher-classification-cases.json', 'utf8'));
          if (fixture.schemaVersion !== 1) throw new Error('classification fixture schemaVersion must be 1');
          if (fixture.classificationVersion !== '20260802-v2') throw new Error('classification fixture version mismatch');
          if (!Array.isArray(fixture.blocked) || fixture.blocked.length < 15) throw new Error('blocked cases must be at least 15');
          if (!Array.isArray(fixture.allowed) || fixture.allowed.length < 15) throw new Error('allowed cases must be at least 15');
          const rows = [...fixture.blocked, ...fixture.allowed];
          if (new Set(rows.map(row => row.id)).size !== rows.length) throw new Error('classification case id duplicated');
          if (new Set(rows.map(row => row.question)).size !== rows.length) throw new Error('classification question duplicated');
          NODE
      - name: Validate site and AI teacher build consistency
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const page = fs.readFileSync('cnc/ai-teacher.html', 'utf8');
          const pageBuild = page.match(/const BUILD = '([^']+)'/)?.[1];
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          if (!pageBuild) throw new Error('AI teacher build marker missing');
          if (info.build !== pageBuild) {
            throw new Error(`site/AI teacher build mismatch: ${info.build || 'missing'} / ${pageBuild}`);
          }
          if (!String(info.contentStage || '').includes('AI老师问诊闭环')) {
            throw new Error('site build marker lost AI teacher intake handoff capability');
          }
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check cnc/tests/mobile-ai-teacher-smoke.cjs
          node --check cnc/tests/ai-teacher-classification-smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          text=Path('cnc/ai-teacher.html').read_text(encoding='utf-8')
          script=text.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/cnc-ai-teacher.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/cnc-ai-teacher.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: python3 -m http.server 4173 --directory . > /tmp/cnc-ai-teacher-server.log 2>&1 &
      - name: Chromium 390x844 local AI teacher
        run: node cnc/tests/mobile-ai-teacher-smoke.cjs
      - name: Validate high-risk and educational classification cases
        run: node cnc/tests/ai-teacher-classification-smoke.cjs
      - name: Upload AI teacher diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-diagnostics
          path: artifacts/ai-teacher/
          if-no-files-found: warn
          retention-days: 14
