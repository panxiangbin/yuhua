name: CNC PWA11 test pin sync temporary

on:
  push:
    branches:
      - chatgpt/cnc-ai-teacher-data-integrity
    paths:
      - '.github/workflows/cnc-pwa11-test-pin-sync-temporary.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-pwa11-test-pin-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-ai-teacher-data-integrity
          fetch-depth: 0

      - name: 同步PWA11测试版本与文案契约
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('cnc/tests/mobile-pwa-offline-cache-smoke.cjs'),
              Path('cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs'),
              Path('cnc/tests/mobile-pwa-upgrade-data-smoke.cjs'),
              Path('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs'),
              Path('cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs'),
              Path('cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs'),
          ]

          for path in files:
              original = path.read_text(encoding='utf-8')
              text = original
              text = text.replace(
                  'PWA10会刷新已清理开发占位后的核心课程正文',
                  'PWA11会刷新AI老师学习档案异常保护',
              )
              text = text.replace(
                  'PWA10用于刷新已清理开发占位后的核心课程正文',
                  'PWA11用于刷新AI老师学习档案异常保护',
              )
              text = text.replace('20260804-pwa10', '__CNC_PWA_CURRENT__')
              text = text.replace('20260803-pwa9', '20260804-pwa10')
              text = text.replace('__CNC_PWA_CURRENT__', '20260804-pwa11')
              text = text.replace('PWA10', '__CNC_PWA_LABEL_CURRENT__')
              text = text.replace('PWA9', 'PWA10')
              text = text.replace('__CNC_PWA_LABEL_CURRENT__', 'PWA11')
              text = text.replace("source: 'pwa9'", "source: 'pwa10'")
              text = text.replace(
                  "'正式课程开发占位清零']",
                  "'正式课程开发占位清零', 'AI老师学习档案异常保护']",
              )
              if text == original:
                  raise SystemExit(f'未在{path}发现待同步的PWA版本针')
              path.write_text(text, encoding='utf-8')

          checks = {
              files[0]: ["const PWA_BUILD = '20260804-pwa11';"],
              files[1]: ["const PWA_BUILD = '20260804-pwa11';"],
              files[2]: [
                  "const CURRENT_PWA_BUILD = '20260804-pwa11';",
                  "const PREVIOUS_PWA_BUILD = '20260804-pwa10';",
              ],
              files[3]: [
                  "const branchTargetPwaBuild = '20260804-pwa11';",
                  "const previousPublicPwaBuild = '20260804-pwa10';",
                  'PWA11会刷新AI老师学习档案异常保护',
                  'PWA11用于刷新AI老师学习档案异常保护',
              ],
              files[4]: [
                  "const branchTargetPwaBuild = '20260804-pwa11';",
                  "const previousPublicPwaBuild = '20260804-pwa10';",
                  'PWA11会刷新AI老师学习档案异常保护',
                  'PWA11用于刷新AI老师学习档案异常保护',
              ],
              files[5]: [
                  "const branchTargetPwaBuild = '20260804-pwa11';",
                  "const previousPublicPwaBuild = '20260804-pwa10';",
                  'PWA11会刷新AI老师学习档案异常保护',
                  'PWA11用于刷新AI老师学习档案异常保护',
              ],
          }
          for path, tokens in checks.items():
              text = path.read_text(encoding='utf-8')
              for token in tokens:
                  if token not in text:
                      raise SystemExit(f'{path}同步后缺少：{token}')
          PY

          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs

      - name: 提交同步结果
        shell: bash
        run: |
          if git diff --quiet -- cnc/tests; then
            echo '没有需要提交的测试版本针变化' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            cnc/tests/mobile-pwa-offline-cache-smoke.cjs \
            cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs \
            cnc/tests/mobile-pwa-upgrade-data-smoke.cjs \
            cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs \
            cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs \
            cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          git commit -m 'test(cnc): 同步PWA11测试版本与公网基线'
          git push origin HEAD:chatgpt/cnc-ai-teacher-data-integrity
