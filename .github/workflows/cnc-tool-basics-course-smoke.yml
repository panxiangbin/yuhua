name: CNC tool basics course smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-tool-basics-course-smoke.yml'
  workflow_dispatch:

jobs:
  tool-basics-course:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check cnc/tests/mobile-tool-basics-course-smoke.cjs
      - name: Start static server
        run: python3 -m http.server 4173 --directory . > /tmp/cnc-server.log 2>&1 &
      - name: Chromium 390x844 tool basics course
        run: node cnc/tests/mobile-tool-basics-course-smoke.cjs
      - name: Upload tool basics diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-basics-course-diagnostics
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
