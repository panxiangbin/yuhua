name: CNC temporary PWA37 baseline sync for PR201

on:
  push:
    branches:
      - cnc-tmp-pwa37-baseline-sync-201

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact temporary branch
        uses: actions/checkout@v4
        with:
          ref: cnc-tmp-pwa37-baseline-sync-201
          fetch-depth: 0

      - name: Synchronize active PWA37 and boundary-10 gates
        shell: python
        run: |
          from pathlib import Path

          version_files = [
              'cnc/tests/mobile-pwa-offline-cache-smoke.cjs',
              'cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs',
              'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs',
              'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
              'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
              'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
              'cnc/tests/g95-cold-offline-source-trust-smoke.cjs',
              'cnc/tests/g96-g97-cold-offline-source-trust-smoke.cjs',
              'cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs',
              '.github/workflows/cnc-pwa-offline-cache-smoke.yml',
              '.github/workflows/cnc-pwa-profile-bfcache-smoke.yml',
              '.github/workflows/cnc-pwa-upgrade-data-smoke.yml',
              '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml',
              '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml',
              '.github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml',
              '.github/workflows/cnc-g95-cold-offline-source-trust-smoke.yml',
              '.github/workflows/cnc-g96-g97-cold-offline-source-trust-smoke.yml',
              '.github/workflows/cnc-g98-g99-cold-offline-source-trust-smoke.yml',
              '.github/workflows/cnc-pwa-self-test-smoke.yml',
          ]
          guard_files = [
              'cnc/tests/g95-cold-offline-source-trust-smoke.cjs',
              'cnc/tests/g96-g97-cold-offline-source-trust-smoke.cjs',
              'cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs',
              '.github/workflows/cnc-g95-cold-offline-source-trust-smoke.yml',
              '.github/workflows/cnc-g96-g97-cold-offline-source-trust-smoke.yml',
              '.github/workflows/cnc-g98-g99-cold-offline-source-trust-smoke.yml',
          ]
          old_guard = 'g10-g28-g53-g92-g93-g94-g95-g96-g97-g98-g99-boundary-9'
          new_guard = 'g10-g28-g50-g53-g92-g93-g94-g95-g96-g97-g98-g99-boundary-10'

          changed = []
          for name in version_files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              before = text
              text = text.replace('20260811-pwa36', '20260811-pwa37')
              text = text.replace('20260811-learning36', '20260811-learning37')
              if name in guard_files:
                  text = text.replace(old_guard, new_guard)
              if text != before:
                  path.write_text(text, encoding='utf-8')
                  changed.append(name)

          if not changed:
              raise SystemExit('No PWA37 baseline changes were produced')

          stale = []
          for name in version_files:
              text = Path(name).read_text(encoding='utf-8')
              if '20260811-pwa36' in text or '20260811-learning36' in text:
                  stale.append(name)
          if stale:
              raise SystemExit('Active PWA36 references remain: ' + ', '.join(stale))

          stale_guards = []
          for name in guard_files:
              text = Path(name).read_text(encoding='utf-8')
              if old_guard in text:
                  stale_guards.append(name)
          if stale_guards:
              raise SystemExit('boundary-9 references remain: ' + ', '.join(stale_guards))

          # Historical upgrade/public baseline must remain intact.
          historical_files = [
              'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs',
              'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
              'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
              'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
              '.github/workflows/cnc-pwa-upgrade-data-smoke.yml',
              '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml',
              '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml',
              '.github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml',
          ]
          for name in historical_files:
              text = Path(name).read_text(encoding='utf-8')
              if '20260810-pwa35' not in text or '20260810-learning35' not in text:
                  raise SystemExit(f'Historical PWA35 migration/public baseline was lost: {name}')

          print('Changed files:')
          for name in changed:
              print(' -', name)

      - name: Validate no assertion bypass was introduced
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git diff | grep -E '^\+.*(continue-on-error:[[:space:]]*true|\.skip\(|process\.exit\(0\))'
          test "$(git diff --name-only | grep -Ev '^(cnc/|\.github/workflows/cnc-)' | wc -l)" -eq 0

      - name: Commit synchronized CNC-only tree and remove temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/cnc-tmp-pwa37-baseline-sync-201.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc .github/workflows
          git commit -m 'CNC：批量同步 PWA37 门禁基线'
          git push origin HEAD:cnc-tmp-pwa37-baseline-sync-201
