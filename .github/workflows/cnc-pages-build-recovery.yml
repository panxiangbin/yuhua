name: CNC Pages build recovery

on:
  pull_request:
    paths:
      - 'cnc/build-info.json'
      - 'cnc/tests/mobile-pages-deployment-status-smoke.cjs'
      - '.github/workflows/cnc-pages-build-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pages-build-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnc-pages-build-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: 审计CNC Pages恢复契约
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 验证恢复流程范围、权限与防绕过规则
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const workflow = fs.readFileSync('.github/workflows/cnc-pages-build-recovery.yml', 'utf8');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8').replace(/^\uFEFF/, ''));
          const publicTest = fs.readFileSync('cnc/tests/mobile-pages-deployment-status-smoke.cjs', 'utf8');
          for (const token of [
            "branches: [main]",
            "- 'cnc/**'",
            "pages: write",
            "/pages/builds/latest",
            "/pages/builds",
            "github.event_name != 'pull_request'",
            "cache: 'no-store'",
            "CNC_PAGES_RECOVERY_ATTEMPTS || 40",
            "mobile-pages-deployment-status-smoke.cjs",
            "actions/upload-artifact@v4"
          ]) {
            if (!workflow.includes(token)) throw new Error(`缺少Pages恢复契约：${token}`);
          }
          for (const forbidden of [
            'continue-on-error: true',
            'cancel-in-progress: true',
            'git push --force',
            'force: true',
            'process.exit(0)',
            'test.skip('
          ]) {
            if (workflow.includes(forbidden)) throw new Error(`发现恢复流程绕过项：${forbidden}`);
          }
          if (info.app !== 'cnc-training-platform') throw new Error('CNC构建标记无效');
          if (!/^\d{8}-pwa\d+$/.test(String(info.pwaBuild || ''))) throw new Error('PWA构建号格式无效');
          for (const token of ['mainMatchesPages: true', 'statusPageMatchesMarker: true', 'CNC_PAGES_VERIFY_ATTEMPTS || 18']) {
            if (!publicTest.includes(token)) throw new Error(`公网浏览器门禁缺少：${token}`);
          }
          for (const forbidden of ['test.skip(', 'process.exit(0)', 'CNC_PAGES_VERIFY_ATTEMPTS || 0']) {
            if (publicTest.includes(forbidden)) throw new Error(`公网浏览器门禁存在绕过项：${forbidden}`);
          }
          console.log(`CNC Pages恢复契约通过：${info.build}/${info.pwaBuild}/${info.cacheRevision}`);
          NODE

  recover:
    name: 恢复并验收CNC Pages公网版本
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 读取最新Pages构建并仅在过期时请求重建
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const out = path.resolve('cnc/test-results/pages-build-recovery');
          fs.mkdirSync(out, { recursive: true });
          const expected = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8').replace(/^\uFEFF/, ''));
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.GITHUB_SHA;
          const token = process.env.GH_TOKEN;
          const publicUrl = `https://${repository.split('/')[0]}.github.io/${repository.split('/')[1]}/cnc/build-info.json`;
          const apiBase = `https://api.github.com/repos/${repository}/pages/builds`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2026-03-10',
            'User-Agent': 'cnc-pages-build-recovery'
          };
          const exact = marker => marker && ['app','build','pwaBuild','cacheRevision','contentStage'].every(key => marker[key] === expected[key]);
          async function readJson(url, options = {}) {
            const response = await fetch(url, { cache: 'no-store', ...options });
            const text = await response.text();
            let body = null;
            try { body = JSON.parse(text.replace(/^\uFEFF/, '')); } catch (_) {}
            if (!response.ok) throw new Error(`${options.method || 'GET'} ${url} HTTP ${response.status}: ${text.slice(0, 300)}`);
            return { response, body };
          }
          (async () => {
            const report = { checkedAt: new Date().toISOString(), repository, sha, expected, publicUrl };
            try {
              const publicResult = await readJson(`${publicUrl}?verify=${Date.now()}`, { headers: { 'Cache-Control': 'no-cache, no-store, max-age=0', Pragma: 'no-cache' } });
              report.publicBefore = publicResult.body;
            } catch (error) {
              report.publicReadError = error.message;
            }
            if (exact(report.publicBefore)) {
              report.action = 'already-current';
              fs.writeFileSync(path.join(out, 'request-result.json'), JSON.stringify(report, null, 2));
              console.log('CNC Pages公网标记已与当前main一致，无需请求重建');
              return;
            }
            try {
              const latest = await readJson(`${apiBase}/latest`, { headers });
              report.latestBuild = latest.body;
            } catch (error) {
              report.latestBuildReadError = error.message;
            }
            const latestStatus = String(report.latestBuild?.status || '').toLowerCase();
            const sameCommitActive = report.latestBuild?.commit === sha && ['queued', 'building'].includes(latestStatus);
            if (sameCommitActive) {
              report.action = 'await-existing-build';
              console.log(`最新main的Pages构建已在执行：${latestStatus}`);
            } else {
              const requested = await readJson(apiBase, { method: 'POST', headers });
              report.action = 'requested-rebuild';
              report.requestResponse = requested.body;
              if (!['queued', 'building'].includes(String(requested.body?.status || '').toLowerCase())) {
                throw new Error(`Pages重建请求未进入队列：${JSON.stringify(requested.body)}`);
              }
              console.log(`已请求Pages从最新main重建：${requested.body.status}`);
            }
            fs.writeFileSync(path.join(out, 'request-result.json'), JSON.stringify(report, null, 2));
          })().catch(error => {
            fs.writeFileSync(path.join(out, 'request-error.txt'), `${error.stack || error}\n`);
            throw error;
          });
          NODE
      - name: 等待main与Pages公网CNC构建标记逐字段一致
        env:
          CNC_PAGES_RECOVERY_ATTEMPTS: '40'
          CNC_PAGES_RECOVERY_INTERVAL_MS: '15000'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const out = path.resolve('cnc/test-results/pages-build-recovery');
          fs.mkdirSync(out, { recursive: true });
          const expected = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8').replace(/^\uFEFF/, ''));
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const mainUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/cnc/build-info.json`;
          const publicUrl = `https://${owner}.github.io/${repo}/cnc/build-info.json`;
          const attempts = Number(process.env.CNC_PAGES_RECOVERY_ATTEMPTS || 40);
          const intervalMs = Number(process.env.CNC_PAGES_RECOVERY_INTERVAL_MS || 15000);
          const keys = ['app','build','pwaBuild','cacheRevision','contentStage'];
          const report = { startedAt: new Date().toISOString(), expected, mainUrl, publicUrl, attempts: [] };
          async function marker(url) {
            const target = new URL(url);
            target.searchParams.set('verify', `${Date.now()}-${Math.random().toString(16).slice(2)}`);
            const response = await fetch(target, {
              cache: 'no-store',
              headers: { 'Cache-Control': 'no-cache, no-store, max-age=0', Pragma: 'no-cache', 'User-Agent': 'cnc-pages-build-recovery' }
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${text.slice(0, 180)}`);
            return JSON.parse(text.replace(/^\uFEFF/, ''));
          }
          const same = value => keys.every(key => value?.[key] === expected[key]);
          (async () => {
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const row = { attempt, at: new Date().toISOString() };
              try {
                row.main = await marker(mainUrl);
                row.pages = await marker(publicUrl);
                row.mainMatchesExpected = same(row.main);
                row.pagesMatchesExpected = same(row.pages);
                report.attempts.push(row);
                if (!row.mainMatchesExpected) throw new Error('raw main构建标记与当前检出提交不一致');
                if (row.pagesMatchesExpected) {
                  report.completedAt = new Date().toISOString();
                  report.verified = true;
                  fs.writeFileSync(path.join(out, 'public-marker-result.json'), JSON.stringify(report, null, 2));
                  console.log(`CNC Pages公网已更新：${row.pages.build}/${row.pages.pwaBuild}/${row.pages.cacheRevision}`);
                  return;
                }
              } catch (error) {
                row.error = error.message;
                if (!report.attempts.includes(row)) report.attempts.push(row);
              }
              if (attempt < attempts) await new Promise(resolve => setTimeout(resolve, intervalMs));
            }
            report.completedAt = new Date().toISOString();
            report.verified = false;
            fs.writeFileSync(path.join(out, 'public-marker-result.json'), JSON.stringify(report, null, 2));
            const last = report.attempts.at(-1) || {};
            throw new Error(`Pages公网未与main一致：main=${last.main?.pwaBuild || '未读取'}，Pages=${last.pages?.pwaBuild || '未读取'}`);
          })().catch(error => {
            fs.writeFileSync(path.join(out, 'public-marker-error.txt'), `${error.stack || error}\n`);
            throw error;
          });
          NODE
      - name: 安装390×844公网浏览器验收环境
        run: |
          npm install --no-save playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: 执行390×844 Pages公网状态验收
        env:
          CNC_PAGES_VERIFY_ATTEMPTS: '1'
          CNC_PAGES_VERIFY_INTERVAL_MS: '1000'
        run: node cnc/tests/mobile-pages-deployment-status-smoke.cjs
      - name: 上传Pages恢复与公网诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pages-build-recovery-${{ github.run_id }}
          path: |
            cnc/test-results/pages-build-recovery/
            cnc/test-results/pages-deployment-status-*
          if-no-files-found: error
          retention-days: 14
