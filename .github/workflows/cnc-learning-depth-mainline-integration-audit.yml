name: CNC learning depth mainline integration apply

on:
  pull_request:
    paths:
      - '.github/workflows/cnc-learning-depth-mainline-integration-audit.yml'
      - 'cnc/tools/apply-learning-depth-mainline-integration.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: cnc-learning-depth-mainline-integration-apply
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-learning-depth-mainline-20260806
          fetch-depth: 0
          persist-credentials: true

      - name: 核验精确来源与修改范围
        id: prepare
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cnc-learning-depth-integration
          git fetch --no-tags origin main codex/learning-depth-refactor-20260805
          test "$(git rev-parse origin/main)" = '6ed004d55a808a43c2c225b54d8ec6da956b3062'
          test "$(git rev-parse origin/codex/learning-depth-refactor-20260805)" = '4dd43680d8cc9b1ca754cc75c062d526600ee570'
          git rev-parse HEAD > /tmp/cnc-learning-depth-integration/bootstrap-head.txt
          if git merge-base --is-ancestor origin/codex/learning-depth-refactor-20260805 HEAD; then
            echo 'already_integrated=true' >> "$GITHUB_OUTPUT"
            echo '80课来源头已经进入当前分支历史，本轮不重复合并。' | tee /tmp/cnc-learning-depth-integration/already-integrated.txt
            exit 0
          fi
          echo 'already_integrated=false' >> "$GITHUB_OUTPUT"
          test "$(git merge-base HEAD origin/main)" = '6ed004d55a808a43c2c225b54d8ec6da956b3062'
          test -f cnc/tools/apply-learning-depth-mainline-integration.py
          changed="$(git diff --name-only origin/main...HEAD)"
          printf '%s\n' "$changed" > /tmp/cnc-learning-depth-integration/bootstrap-files.txt
          if printf '%s\n' "$changed" | grep -Ev '^(cnc/|\.github/workflows/cnc-)' ; then
            echo '整合分支已出现非CNC范围改动' >&2
            exit 1
          fi

      - name: 执行真实三方合并并核对冲突
        if: steps.prepare.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/codex/learning-depth-refactor-20260805 > /tmp/cnc-learning-depth-integration/merge.log 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/cnc-learning-depth-integration/merge-exit-code.txt
          git diff --name-only --diff-filter=U | sort > /tmp/cnc-learning-depth-integration/conflict-files.txt
          cat > /tmp/cnc-learning-depth-integration/expected-conflicts.txt <<'EOF'
          cnc/build-info.json
          cnc/personal-home.js
          cnc/pwa-self-test.html
          cnc/pwa-status.html
          cnc/sw.js
          cnc/tests/main-course-catalog-drift-smoke.cjs
          cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          EOF
          sed -i 's/^          //' /tmp/cnc-learning-depth-integration/expected-conflicts.txt
          if [ "$code" = '0' ]; then
            echo '预期存在已审计冲突，但本次合并意外无冲突' >&2
            exit 1
          fi
          diff -u /tmp/cnc-learning-depth-integration/expected-conflicts.txt /tmp/cnc-learning-depth-integration/conflict-files.txt

      - name: 保留当前CNC工作流并解决12个冲突
        if: steps.prepare.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git restore --source=HEAD --staged --worktree -- .github/workflows
          python3 cnc/tools/apply-learning-depth-mainline-integration.py | tee /tmp/cnc-learning-depth-integration/resolution-report.json
          rm cnc/tools/apply-learning-depth-mainline-integration.py
          git add -A cnc
          test -z "$(git diff --name-only --diff-filter=U)"
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged" > /tmp/cnc-learning-depth-integration/staged-files.txt
          test -n "$staged"
          if printf '%s\n' "$staged" | grep -Ev '^cnc/' ; then
            echo '整合提交包含非cnc文件' >&2
            exit 1
          fi

      - name: 执行静态、80课、目录与PWA门禁
        if: steps.prepare.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          node --check cnc/personal-home.js
          node --check cnc/learning-sublesson-catalog.js
          node --check cnc/tests/learning-depth-smoke.cjs
          node --check cnc/tests/learning-depth-browser-smoke.cjs
          node --check cnc/tests/main-course-catalog-drift-smoke.cjs
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node cnc/tests/learning-depth-smoke.cjs
          node cnc/tests/main-course-catalog-drift-smoke.cjs
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const selfTest = fs.readFileSync('cnc/pwa-self-test.html', 'utf8');
          const status = fs.readFileSync('cnc/pwa-status.html', 'utf8');
          const expectedSiteBuild = ['20260806', 'learning-depth1'].join('-');
          const expectedPwaBuild = ['20260806', 'pwa14'].join('-');
          const expectedCacheRevision = ['20260806', 'learning14'].join('-');
          if (info.build !== expectedSiteBuild || info.pwaBuild !== expectedPwaBuild || info.cacheRevision !== expectedCacheRevision) {
            throw new Error(`PWA14构建标记异常：${JSON.stringify(info)}`);
          }
          for (const token of ['./learning-sublesson-catalog.js', './learning-depth.css', './learning-detail.html']) {
            if (!sw.includes(`'${token}'`)) throw new Error(`Service Worker缺少学习资源：${token}`);
            if (!selfTest.includes(JSON.stringify(token))) throw new Error(`PWA自检缺少学习资源：${token}`);
          }
          if (!status.includes(`const EXPECTED='${expectedPwaBuild}'`) || !status.includes(`const EXPECTED_CACHE='${expectedCacheRevision}'`)) {
            throw new Error('PWA状态页版本异常');
          }
          if (!String(info.contentStage).includes('80个图文小课') || !String(info.contentStage).includes('AI老师学习档案异常保护')) {
            throw new Error('内容阶段未同时保留80课与AI老师档案保护');
          }
          NODE
          git diff --check --cached
          mkdir -p /tmp/cnc-learning-depth-integration/test-results
          cp -R cnc/test-results/main-course-catalog-drift /tmp/cnc-learning-depth-integration/test-results/
          if [ -d cnc/test-results/learning-depth ]; then
            cp -R cnc/test-results/learning-depth /tmp/cnc-learning-depth-integration/test-results/
          fi

      - name: 创建只含CNC文件的整合提交
        if: steps.prepare.outputs.already_integrated != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git status --short > /tmp/cnc-learning-depth-integration/final-status.txt
          git commit -m 'feat(cnc-learning): 整合80个图文小课并升级PWA14'
          git rev-parse HEAD > /tmp/cnc-learning-depth-integration/result-head.txt
          git diff-tree --no-commit-id --name-only -r HEAD^1 HEAD | tee /tmp/cnc-learning-depth-integration/commit-files.txt
          if git diff-tree --no-commit-id --name-only -r HEAD^1 HEAD | grep -Ev '^cnc/' ; then
            echo '最终整合提交包含非cnc文件' >&2
            exit 1
          fi
          git push origin HEAD:chatgpt/cnc-learning-depth-mainline-20260806

      - name: 上传真实整合诊断
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-learning-depth-mainline-apply-${{ github.run_id }}
          path: /tmp/cnc-learning-depth-integration/
          if-no-files-found: error
          retention-days: 30

      - name: 将真实结果写入PR
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          API_URL: ${{ github.api_url }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -u
          local_head="$(git rev-parse HEAD 2>/dev/null || true)"
          result_head="$(cat /tmp/cnc-learning-depth-integration/result-head.txt 2>/dev/null || true)"
          conflict_count="$(wc -l < /tmp/cnc-learning-depth-integration/conflict-files.txt 2>/dev/null || printf 'unknown')"
          body="<!-- cnc-learning-depth-integration-run -->
          80课主线整合运行：${JOB_STATUS}

          - Run：${RUN_ID}
          - 本地HEAD：${local_head}
          - 结果提交：${result_head:-未生成}
          - 真实冲突文件数：${conflict_count}
          - 运行地址：${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}

          失败时必须读取完整日志与Artifact后修复真实根因，不得将后续 skipped 当作成功。"
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API_URL}/repos/${REPOSITORY}/issues/161/comments" \
            -d "$payload"
