name: CNC PWA34 one-shot G96 G97 fix

on:
  push:
    branches:
      - codex/cnc-g96-g97-safety-audit
    paths:
      - '.github/workflows/cnc-pwa34-one-shot-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CNC branch
        uses: actions/checkout@v4
        with:
          ref: codex/cnc-g96-g97-safety-audit
          fetch-depth: 0
      - name: Apply PWA34 CNC-only source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone, timedelta

          root = Path('.')
          gm_path = root / 'cnc/gm-code-complete.js'
          gm = gm_path.read_text(encoding='utf-8')
          start96 = gm.index('  {\n    "id": "kb-gcode-g96",')
          start97 = gm.index('  {\n    "id": "kb-gcode-g97",', start96)
          start98 = gm.index('  {\n    "id": "kb-gcode-g98",', start97)
          g96 = '''  {
            "id": "kb-gcode-g96",
            "category": "G代码",
            "title": "G96 恒线速度模式（部分车床CNC）",
            "code": "G96",
            "aliases": ["恒线速", "CSS"],
            "summary": "在部分明确支持该车床语义的CNC中，G96用于恒线速度控制，主轴转速会随当前加工直径变化；其它机床或控制器上G96可能具有不同含义，必须先核对当前CNC和机床厂原厂手册。",
            "usage": "仅在确认机床类型、当前CNC、G96组别、单位制与S地址含义后使用；同时确认本机最高允许主轴转速及限制方式，并核对主轴、卡盘、装夹、工件和刀具各自允许的转速与安全限制。",
            "beginner": "不要把“G96前必写G50”或任何固定S数值记成跨系统口诀；先确认本机如何设置最高主轴转速限制、S的单位以及当前加工直径解释。",
            "warning": "恒线速度下随着有效加工直径减小，主轴转速可能升高。最高允许主轴转速不是只由程序一个数值决定，还受主轴、卡盘、装夹、工件、刀具和机床配置限制。上机前必须按当前CNC和机床厂原厂手册确认限制方式、单位制、S含义与全部转速上限，并按现场规程做仿真、图形检查、单段或其它受控验证。",
            "example": "教学语义示意：部分车床CNC中G96表示恒线速度模式，S表示该模式规定的线速度值；具体单位、最高转速限制指令与可用范围必须逐项以本机原厂手册为准，不提供可直接照抄的固定转速或线速度数值。",
            "risk": "高",
            "tags": ["G96", "恒线速度", "车床适用范围", "当前CNC", "原厂手册", "最高允许主轴转速", "卡盘", "装夹", "工件", "刀具"]
          },
          '''
          g97 = '''  {
            "id": "kb-gcode-g97",
            "category": "G代码",
            "title": "G97 恒线速度取消/固定转速模式（部分车床CNC）",
            "code": "G97",
            "aliases": ["取消恒线速", "Constant RPM"],
            "summary": "在部分明确支持该车床语义的CNC中，G97用于取消恒线速度并进入固定主轴转速模式；其它机床或控制器上G97可能具有不同含义，必须先核对当前CNC和机床厂原厂手册。",
            "usage": "仅在确认机床类型、当前CNC、G97组别、单位制与S地址含义后使用；同时确认本机最高允许主轴转速，以及主轴、卡盘、装夹、工件和刀具的全部转速与安全限制。",
            "beginner": "不要把“G97后S一定就是转/分”当成跨系统口诀；只有本机原厂手册明确该车床语义时，才能按其规定解释S和固定转速模式。",
            "warning": "切换到固定转速并不会自动证明该转速安全。S地址解释、单位和最大允许值必须按当前CNC与机床配置确认，并同时受主轴、卡盘、装夹、工件和刀具限制；上机前核对原厂手册并按现场规程做受控验证。",
            "example": "教学语义示意：部分车床CNC中G97取消恒线速度并按本机规定使用S设置固定主轴转速；具体S单位、允许范围和主轴方向控制必须以本机原厂手册为准，不提供可直接照抄的固定转速数值。",
            "risk": "高",
            "tags": ["G97", "恒线速度取消", "固定转速", "车床适用范围", "当前CNC", "原厂手册", "最高允许主轴转速", "卡盘", "装夹", "工件", "刀具"]
          },
          '''
          gm = gm[:start96] + g96 + g97 + gm[start98:]

          replacements = {
            '"usage": "车床G96恒线速前限制最高转速，或旧程序设定坐标时使用。"': '"usage": "仅在确认当前CNC明确支持对应语义后使用；若涉及恒线速度最高转速限制，必须核对本机G50的组别、S地址单位与限制方式；旧程序坐标设定或其它功能也必须按机床厂原厂手册确认。"',
            '"warning": "车床上漏写G50限速，G96靠近中心时主轴可能转速过高。"': '"warning": "不同机型或控制器上的G50语义可能不同；不要把G50 Sxxxx当成跨系统通用限速格式。涉及主轴最高转速时，还必须同时满足主轴、卡盘、装夹、工件、刀具和机床配置限制，并核对当前CNC与机床厂原厂手册。"',
            '"example": "G50 S2000 表示恒线速模式下主轴最高限制2000转/分。"': '"example": "教学语义示意：部分车床CNC中G50可用于设置恒线速度模式下的最高主轴转速限制；具体格式、S单位和上限必须以当前CNC与机床厂原厂手册为准，不提供可直接照抄的固定数值。"'
          }
          for old, new in replacements.items():
              if old not in gm:
                  raise SystemExit(f'missing expected G50 source: {old}')
              gm = gm.replace(old, new, 1)
          for bad in ['G50 S2000；G96 S180','G97 S800 M03','用G96前先用G50限制最高转速','G97后S就是转/分','车床G96恒线速前限制最高转速','G50 S2000 表示恒线速模式下主轴最高限制2000转/分']:
              if bad in gm:
                  raise SystemExit(f'unsafe source remains: {bad}')
          gm_path.write_text(gm, encoding='utf-8')

          info_path = root / 'cnc/build-info.json'
          info = json.loads(info_path.read_text(encoding='utf-8'))
          if (info.get('pwaBuild'), info.get('cacheRevision')) != ('20260810-pwa33','20260810-learning33'):
              raise SystemExit('unexpected build base')
          info['pwaBuild'] = '20260810-pwa34'
          info['cacheRevision'] = '20260810-learning34'
          marker = 'G96/G97恒线速/恒转速适用范围'
          stage = str(info.get('contentStage') or '')
          if marker not in stage:
              info['contentStage'] = stage + ('，' if stage else '') + marker
          info['generatedAt'] = datetime.now(timezone(timedelta(hours=8))).isoformat(timespec='seconds')
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw_path = root / 'cnc/sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("const BUILD = '20260810-pwa33';", "const BUILD = '20260810-pwa34';", 1)
          sw = sw.replace("const CACHE_REVISION = '20260810-learning33';", "const CACHE_REVISION = '20260810-learning34';", 1)
          if "const BUILD = '20260810-pwa34';" not in sw or "const CACHE_REVISION = '20260810-learning34';" not in sw:
              raise SystemExit('Service Worker build bump failed')
          sw_path.write_text(sw, encoding='utf-8')

          note = '  <p class="pwa-note" data-contract="g96-g97-spindle-mode-boundary"><strong>G96/G97恒线速/恒转速适用范围：</strong>G96/G97不是跨设备统一含义。仅在部分明确支持该车床语义的CNC中，G96用于恒线速度、G97用于取消恒线速度并进入固定主轴转速模式；其它控制器或设备可能有不同定义。真实机床必须先确认当前CNC、G代码组别、单位制和S地址含义，并核对机床厂原厂手册；最高允许主轴转速还必须同时满足主轴、卡盘、装夹、工件、刀具和机床配置限制。不得把“G96前必写G50”、固定S数值或“G97后S一定就是转/分”当成跨系统口诀；上机前按现场规程做仿真、图形检查、单段或其它受控验证。</p>\n'
          anchor = '  <p class="pwa-note" data-contract="g98-g99-dual-semantic-boundary">'
          for rel in ['cnc/pwa-status.html','cnc/pwa-self-test.html']:
              p = root / rel
              text = p.read_text(encoding='utf-8').replace('20260810-pwa33','20260810-pwa34').replace('20260810-learning33','20260810-learning34')
              if 'data-contract="g96-g97-spindle-mode-boundary"' not in text:
                  if anchor not in text:
                      raise SystemExit(f'missing note anchor in {rel}')
                  text = text.replace(anchor, note + anchor, 1)
              p.write_text(text, encoding='utf-8')

          old_guard = 'g10-g28-g53-g92-g94-g98-g99-boundary-6'
          new_guard = 'g10-g28-g53-g92-g94-g96-g97-g98-g99-boundary-7'
          old_comment = '作为第二层防御保持G10/G28/G53/G92/G94/G98/G99边界一致'
          new_comment = '作为第二层防御保持G10/G28/G53/G92/G94/G96/G97/G98/G99边界一致'
          for p in (root / 'cnc/tests').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace(old_guard,new_guard).replace(old_comment,new_comment)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
          PY

          git config user.name 'CNC automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cnc
          test -z "$(git diff --cached --name-only | grep -Ev '^cnc/' || true)"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No CNC source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(cnc): 完成G96/G97基础源与PWA34构建升级'
          git push origin HEAD:codex/cnc-g96-g97-safety-audit
