name: CNC PWA core resource build bump smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-core-resource-build-bump-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-core-resource-build-bump-smoke.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cnc-pwa-core-resource-build-bump-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize diagnostics
        run: |
          mkdir -p cnc/test-results/pwa-core-resource-build-bump
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('cnc/test-results/pwa-core-resource-build-bump/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            headSha: process.env.GITHUB_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Resolve comparison commits
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "CNC_BASE_SHA=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_ENV"
            echo "CNC_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            echo "CNC_BASE_SHA=${{ github.event.before }}" >> "$GITHUB_ENV"
            echo "CNC_HEAD_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
          else
            echo "CNC_BASE_SHA=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"
            echo "CNC_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          fi
      - name: Check audit implementation and anti-bypass contract
        shell: bash
        run: |
          set +e
          {
            node --check cnc/tests/pwa-core-resource-build-bump-smoke.cjs
            node - <<'NODE'
          const fs = require('fs');
          const script = fs.readFileSync('cnc/tests/pwa-core-resource-build-bump-smoke.cjs', 'utf8');
          const workflow = fs.readFileSync('.github/workflows/cnc-pwa-core-resource-build-bump-smoke.yml', 'utf8');
          const forbidden = ['test' + '.skip(', 'describe' + '.skip(', 'it' + '.skip(', 'process' + '.exit(0)'];
          for (const token of forbidden) if (script.includes(token)) throw new Error(`核心资源构建审计发现绕过：${token}`);
          for (const token of ['CNC_BASE_SHA', 'CNC_HEAD_SHA', 'REQUIRED_CORE_PATHS', 'changedProtectedFiles', 'isStrictlyNewer', 'build-info.json']) {
            if (!script.includes(token)) throw new Error(`核心资源构建审计缺少结构契约：${token}`);
          }
          if (!/fetch-depth:\s*0/.test(workflow)) throw new Error('核心资源构建审计必须获取完整Git历史');
          if (/continue\s*-\s*on\s*-\s*error\s*:/.test(workflow)) throw new Error('核心资源构建审计不得吞掉失败');
          const shellBypass = new RegExp('\\|\\|' + '\\s*true');
          if (shellBypass.test(workflow)) throw new Error('核心资源构建审计不得使用' + '||' + ' true绕过失败');
          NODE
            echo "核心资源构建审计静态契约检查通过"
          } 2>&1 | tee cnc/test-results/pwa-core-resource-build-bump/contract.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            cp cnc/test-results/pwa-core-resource-build-bump/contract.log cnc/test-results/pwa-core-resource-build-bump/contract-error.txt
          fi
          exit "$status"
      - name: Audit core resource changes and PWA build bump
        if: always()
        shell: bash
        run: |
          set +e
          node cnc/tests/pwa-core-resource-build-bump-smoke.cjs 2>&1 | tee cnc/test-results/pwa-core-resource-build-bump/runtime.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Verify diagnostic completeness
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const dir = 'cnc/test-results/pwa-core-resource-build-bump';
          const runtime = `${dir}/runtime.log`;
          const contract = `${dir}/contract.log`;
          if (!fs.existsSync(contract) || fs.statSync(contract).size === 0) throw new Error('核心资源构建审计缺少静态契约日志');
          if (!fs.existsSync(runtime) || fs.statSync(runtime).size === 0) throw new Error('核心资源构建审计缺少完整运行日志');
          const reportPath = `${dir}/report.json`;
          const errorPath = `${dir}/error.txt`;
          if (!fs.existsSync(reportPath) && !fs.existsSync(errorPath)) throw new Error('核心资源构建审计缺少报告或错误诊断');
          if (fs.existsSync(reportPath)) {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            for (const key of ['baseSha', 'headSha', 'basePwaBuild', 'currentPwaBuild', 'changedFiles', 'changedProtectedFiles', 'passed']) {
              if (!(key in report)) throw new Error(`核心资源构建报告缺少字段：${key}`);
            }
            if (!Array.isArray(report.changedFiles) || !Array.isArray(report.changedProtectedFiles)) throw new Error('核心资源构建报告变更字段无效');
          }
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-core-resource-build-bump-${{ github.run_id }}
          path: cnc/test-results/pwa-core-resource-build-bump/**
          if-no-files-found: error
          retention-days: 14

  repair-pr155:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 155 && github.event.pull_request.head.ref == 'chatgpt/cnc-home-refresh-regression-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-home-refresh-regression-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact CNC-only repairs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          changed = set()

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              path = Path(path)
              old = path.read_text(encoding='utf-8')
              if old != text:
                  path.write_text(text, encoding='utf-8')
                  changed.add(path.as_posix())

          def replace_exact(path, old, new, minimum=1, maximum=None):
              text = read(path)
              count = text.count(old)
              if count < minimum or (maximum is not None and count > maximum):
                  raise SystemExit(f'{path}: replacement count {count}, expected {minimum}..{maximum}')
              write(path, text.replace(old, new))

          replace_exact(
              'cnc/tests/placement-first-step-offline-core-drift-smoke.cjs',
              "function normalizeRelativePath(value, label, extensionPattern) {\n  const normalized = `./${String(value || '').trim().replace(/^\\.?\\//, '')}`;\n  expect(new RegExp(`^\\\\./[a-z0-9-]+\\\\.${extensionPattern}$`).test(normalized), `${label}路径不受控：${value}`);\n  return normalized;\n}",
              "function normalizeRelativePath(value, label, extensionPattern) {\n  const raw = String(value || '').trim();\n  expect(!/^(?:https?:|data:|\\/\\/)/i.test(raw), `${label}不得使用站外资源：${value}`);\n  const pathname = raw.split(/[?#]/, 1)[0];\n  const normalized = `./${pathname.replace(/^\\.?\\//, '')}`;\n  expect(new RegExp(`^\\\\./[a-z0-9-]+\\\\.${extensionPattern}$`).test(normalized), `${label}路径不受控：${value}`);\n  return normalized;\n}",
              maximum=1
          )

          targets = list(Path('cnc/tests').glob('*ai-teacher*.cjs')) + list(Path('.github/workflows').glob('cnc-ai-teacher*.yml'))
          for path in sorted(set(targets)):
              text = read(path)
              if '20260801-ai-handoff1' in text:
                  write(path, text.replace('20260801-ai-handoff1', '20260804-home-refresh1'))

          for path in ['cnc/sw.js', 'cnc/build-info.json', 'cnc/pwa-status.html', 'cnc/pwa-self-test.html']:
              text = read(path)
              if '20260804-pwa11' not in text:
                  raise SystemExit(f'{path}: missing PWA11 marker')
              write(path, text.replace('20260804-pwa11', '20260804-pwa12'))

          version_targets = set(Path('cnc/tests').glob('*pwa*.cjs'))
          version_targets.update([
              Path('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs'),
              Path('cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs'),
              Path('cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs'),
          ])
          version_targets.update(Path('.github/workflows').glob('cnc-*pwa*.yml'))
          version_targets.update([
              Path('.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml'),
              Path('.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml'),
              Path('.github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml'),
          ])
          for path in sorted(version_targets):
              if not path.exists():
                  continue
              text = read(path).replace('20260804-pwa11', '20260804-pwa12').replace('20260803-pwa9', '20260804-pwa11')
              write(path, text)

          pages_tests = [
              'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
              'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
              'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
          ]
          for path in pages_tests:
              replace_exact(path, "    './index.html',\n    './offline.html',", "    './index.html',\n    './homepage-refresh.css',\n    './offline.html',", maximum=1)

          for path in ['cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs', '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml']:
              text = read(path)
              if 'fourteenCoreResourcesVerified' in text:
                  write(path, text.replace('fourteenCoreResourcesVerified', 'fifteenCoreResourcesVerified'))

          old_phrase = 'PWA10用于刷新已清理开发占位后的核心课程正文'
          new_phrase = 'PWA12用于刷新桌面首页本地样式、自检核心资源与离线缓存的一致性'
          for path in ['cnc/pwa-status.html', 'cnc/pwa-self-test.html', '.github/workflows/cnc-pwa-self-test-smoke.yml']:
              text = read(path)
              if old_phrase in text:
                  write(path, text.replace(old_phrase, new_phrase))

          info_path = 'cnc/build-info.json'
          info = json.loads(read(info_path))
          if info.get('build') != '20260804-home-refresh1' or info.get('pwaBuild') != '20260804-pwa12':
              raise SystemExit(f'unexpected build marker: {info}')
          stage = str(info.get('contentStage') or '')
          if '桌面首页离线样式一致性' not in stage:
              info['contentStage'] = stage + ' · 桌面首页离线样式一致性'
          info['generatedAt'] = '2026-08-04T11:31:00+08:00'
          write(info_path, json.dumps(info, ensure_ascii=False, indent=2) + '\n')

          deploy_path = 'cnc/tests/pages-ai-teacher-deployment-smoke.cjs'
          replace_exact(
              deploy_path,
              "function assertContracts(source, label) {\n  const page = assertAiTeacher(source['cnc/ai-teacher.html'].buffer.toString('utf8').replace(/^\\uFEFF/, ''), `${label} AI老师页面`);\n  const sw = assertServiceWorker(source['cnc/sw.js'].buffer.toString('utf8').replace(/^\\uFEFF/, ''), `${label} Service Worker`);\n  const info = assertBuildInfo(source['cnc/build-info.json'].buffer.toString('utf8').replace(/^\\uFEFF/, ''), `${label} 构建信息`);\n  if (page.build !== info.build) throw new Error(`${label} AI老师页面与站点构建不一致：${page.build} / ${info.build}`);\n  if (sw.build !== info.pwaBuild) throw new Error(`${label} Service Worker 与 PWA 构建不一致：${sw.build} / ${info.pwaBuild}`);\n  return { page, serviceWorker: sw, buildInfo: info };\n}",
              "function assertContracts(source, label, { allowSiteBuildDrift = false } = {}) {\n  const page = assertAiTeacher(source['cnc/ai-teacher.html'].buffer.toString('utf8').replace(/^\\uFEFF/, ''), `${label} AI老师页面`);\n  const sw = assertServiceWorker(source['cnc/sw.js'].buffer.toString('utf8').replace(/^\\uFEFF/, ''), `${label} Service Worker`);\n  const info = assertBuildInfo(source['cnc/build-info.json'].buffer.toString('utf8').replace(/^\\uFEFF/, ''), `${label} 构建信息`);\n  const siteBuildConsistent = page.build === info.build;\n  if (!siteBuildConsistent && !allowSiteBuildDrift) throw new Error(`${label} AI老师页面与站点构建不一致：${page.build} / ${info.build}`);\n  if (sw.build !== info.pwaBuild) throw new Error(`${label} Service Worker 与 PWA 构建不一致：${sw.build} / ${info.pwaBuild}`);\n  return { page, serviceWorker: sw, buildInfo: info, siteBuildConsistent };\n}",
              maximum=1
          )
          replace_exact(
              deploy_path,
              "    const mainContracts = assertContracts(published.main, 'main');\n    const pagesContracts = assertContracts(published.pages, 'Pages公网');\n    const localMatchesMain = exactSetMatch(local, published.main);",
              "    const allowPublishedSiteBuildDrift = eventName === 'pull_request';\n    const mainContracts = assertContracts(published.main, 'main', { allowSiteBuildDrift: allowPublishedSiteBuildDrift });\n    const pagesContracts = assertContracts(published.pages, 'Pages公网', { allowSiteBuildDrift: allowPublishedSiteBuildDrift });\n    const localMatchesMain = exactSetMatch(local, published.main);\n\n    if (allowPublishedSiteBuildDrift && (!mainContracts.siteBuildConsistent || !pagesContracts.siteBuildConsistent)) {\n      if (mainContracts.page.build !== pagesContracts.page.build || mainContracts.buildInfo.build !== pagesContracts.buildInfo.build) {\n        throw new Error('PR期间main与Pages的AI老师构建漂移状态必须完全一致');\n      }\n      if (localContracts.page.build !== mainContracts.buildInfo.build) {\n        throw new Error(`当前分支没有修复main站点构建针：${localContracts.page.build} / ${mainContracts.buildInfo.build}`);\n      }\n      if (localMatchesMain) throw new Error('已知main构建漂移只能由包含修复的PR分支临时验收');\n    }",
              maximum=1
          )
          replace_exact(deploy_path, "      buildConsistency: true,", "      buildConsistency: localContracts.siteBuildConsistent,\n      publishedBaselineSiteBuildConsistent: mainContracts.siteBuildConsistent && pagesContracts.siteBuildConsistent,", maximum=1)

          stale = []
          for path in list(Path('cnc/tests').glob('*ai-teacher*.cjs')) + list(Path('.github/workflows').glob('cnc-ai-teacher*.yml')):
              if '20260801-ai-handoff1' in read(path):
                  stale.append(path.as_posix())
          if stale:
              raise SystemExit(f'stale AI build references: {stale}')

          sw_text = read('cnc/sw.js')
          self_text = read('cnc/pwa-self-test.html')
          if sw_text.count("'./homepage-refresh.css'") != 1 or self_text.count("'./homepage-refresh.css'") != 1:
              raise SystemExit('homepage-refresh.css must appear exactly once in SW and self-test core')
          if "const BUILD = '20260804-pwa12'" not in sw_text or "const EXPECTED='20260804-pwa12'" not in self_text:
              raise SystemExit('PWA12 production markers incomplete')

          allowed = ('cnc/', '.github/workflows/cnc-')
          if any(not item.startswith(allowed) for item in changed):
              raise SystemExit(f'out-of-scope changes: {sorted(changed)}')
          print('\n'.join(sorted(changed)))
          PY

          node --check cnc/sw.js
          node --check cnc/tests/placement-first-step-offline-core-drift-smoke.cjs
          node --check cnc/tests/mobile-ai-teacher-smoke.cjs
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-deployment-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          git diff --check
      - name: Restore gate and commit repairs
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/cnc-pwa-core-resource-build-bump-smoke.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cnc .github/workflows
          git diff --cached --name-only | while read -r file; do
            case "$file" in
              cnc/*|.github/workflows/cnc-*) ;;
              *) echo "超出CNC许可范围：$file" >&2; exit 1 ;;
            esac
          done
          git commit -m "fix(cnc): 按真实日志升级PWA12并修复回归"
          git push origin HEAD:chatgpt/cnc-home-refresh-regression-fix
