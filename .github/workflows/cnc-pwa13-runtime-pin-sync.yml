name: CNC PWA13 runtime pin sync

on:
  push:
    branches: [chatgpt/cnc-ai-teacher-data-integrity-mainline]
    paths:
      - '.github/workflows/cnc-pwa13-runtime-pin-sync.yml'

permissions:
  contents: write

concurrency:
  group: cnc-pwa13-runtime-pin-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-ai-teacher-data-integrity-mainline
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 精确同步PWA13构建、缓存修订与历史能力标记
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: 精确标记数量不是1：{old!r}，实际{count}')
              write(path, text.replace(old, new, 1))

          def replace_at_least(path, old, new, minimum=1):
              text = read(path)
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f'{path}: 精确标记不足：{old!r}，实际{count}')
              write(path, text.replace(old, new))
              print(f'{path}: 替换 {old!r} 共 {count} 处')

          # 保留既有能力，不允许PWA版本升级时把历史内容阶段覆盖掉。
          info_path = Path('cnc/build-info.json')
          info = json.loads(info_path.read_text(encoding='utf-8-sig'))
          required_stages = [
              '起点测评离线核心',
              '测评路线一次性交接',
              'AI老师现场问诊单',
              'AI老师判断说明',
              'AI老师离线核心',
              'AI老师问诊闭环',
              'AI老师学习档案异常保护',
              'PWA可靠性'
          ]
          stages = [item.strip() for item in str(info.get('contentStage') or '').split('·') if item.strip()]
          for stage in required_stages:
              if stage not in stages:
                  stages.append(stage)
          info['contentStage'] = ' · '.join(stages)
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # AI老师真实浏览器测试必须等待当前站点构建，而不是历史构建。
          once(
              'cnc/tests/mobile-ai-teacher-smoke.cjs',
              "window.CNC_AI_TEACHER?.build === '20260801-ai-handoff1'",
              "window.CNC_AI_TEACHER?.build === '20260804-mobile-home1'"
          )

          # 冷离线测试区分PWA代码构建与真实缓存修订。
          offline = 'cnc/tests/mobile-pwa-offline-cache-smoke.cjs'
          once(
              offline,
              "const PWA_BUILD = '20260804-pwa12';",
              "const PWA_BUILD = '20260804-pwa13';\nconst CACHE_REVISION = '20260804-mobile13';"
          )
          replace_at_least(offline, '`cnc-static-${PWA_BUILD}`', '`cnc-static-${CACHE_REVISION}`', 2)
          replace_at_least(offline, '`cnc-runtime-${PWA_BUILD}`', '`cnc-runtime-${CACHE_REVISION}`', 1)
          once(offline, '}, PWA_BUILD);', '}, CACHE_REVISION);')
          once(offline, '{ build: PWA_BUILD, paths: CORE_OFFLINE_PATHS }', '{ build: CACHE_REVISION, paths: CORE_OFFLINE_PATHS }')

          # 升级保护同时模拟上一PWA构建与上一缓存修订，不能混为同一标识。
          upgrade = 'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs'
          once(upgrade, "const CURRENT_PWA_BUILD = '20260804-pwa12';", "const CURRENT_PWA_BUILD = '20260804-pwa13';")
          once(
              upgrade,
              "const PREVIOUS_PWA_BUILD = '20260804-pwa11';",
              "const PREVIOUS_PWA_BUILD = '20260804-pwa12';\nconst CURRENT_CACHE_REVISION = '20260804-mobile13';\nconst PREVIOUS_CACHE_REVISION = '20260804-mobile12';"
          )
          once(upgrade, 'const CURRENT_STATIC_CACHE = `cnc-static-${CURRENT_PWA_BUILD}`;', 'const CURRENT_STATIC_CACHE = `cnc-static-${CURRENT_CACHE_REVISION}`;')
          once(upgrade, 'const CURRENT_RUNTIME_CACHE = `cnc-runtime-${CURRENT_PWA_BUILD}`;', 'const CURRENT_RUNTIME_CACHE = `cnc-runtime-${CURRENT_CACHE_REVISION}`;')
          once(upgrade, 'const PREVIOUS_STATIC_CACHE = `cnc-static-${PREVIOUS_PWA_BUILD}`;', 'const PREVIOUS_STATIC_CACHE = `cnc-static-${PREVIOUS_CACHE_REVISION}`;')
          once(upgrade, 'const PREVIOUS_RUNTIME_CACHE = `cnc-runtime-${PREVIOUS_PWA_BUILD}`;', 'const PREVIOUS_RUNTIME_CACHE = `cnc-runtime-${PREVIOUS_CACHE_REVISION}`;')

          # 两个专用工作流同步当前/上一版本，并核验新的缓存清理实现。
          once('.github/workflows/cnc-pwa-offline-cache-smoke.yml', "info.pwaBuild !== '20260804-pwa11'", "info.pwaBuild !== '20260804-pwa13'")
          once('.github/workflows/cnc-pwa-upgrade-data-smoke.yml', "info.pwaBuild !== '20260804-pwa11'", "info.pwaBuild !== '20260804-pwa13'")
          once('.github/workflows/cnc-pwa-upgrade-data-smoke.yml', "const PREVIOUS_PWA_BUILD = '20260803-pwa9'", "const PREVIOUS_PWA_BUILD = '20260804-pwa12'")
          once(
              '.github/workflows/cnc-pwa-upgrade-data-smoke.yml',
              "if (!sw.includes(\"name.startsWith('cnc-')\") || !sw.includes('!name.endsWith(BUILD)')) {",
              "if (!sw.includes(\"name.startsWith('cnc-')\") || !sw.includes('name !== STATIC_CACHE && name !== RUNTIME_CACHE')) {"
          )

          # 三项Pages精确传播门禁只更新明确的目标、上一正式版本与站点构建针。
          pages = [
              'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
              'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
              'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs'
          ]
          for path in pages:
              once(path, "const branchTargetPwaBuild = '20260804-pwa12';", "const branchTargetPwaBuild = '20260804-pwa13';")
              once(path, "const previousPublicPwaBuild = '20260803-pwa9';", "const previousPublicPwaBuild = '20260804-pwa12';")
              text = read(path)
              if "const expectedSiteBuild = '20260804-home-refresh1';" in text:
                  once(path, "const expectedSiteBuild = '20260804-home-refresh1';", "const expectedSiteBuild = '20260804-mobile-home1';")

          # AI老师离线核心Pages门禁适配PWA构建与缓存修订分离。
          page_path = 'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs'
          text = read(page_path)
          helper_anchor = 'function expectedCorePaths(build) {'
          helper = "function cacheRevisionFor(build) {\n  return build === branchTargetPwaBuild ? '20260804-mobile13' : '20260804-mobile12';\n}\n\n"
          if helper not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit('AI老师Pages门禁缺少唯一expectedCorePaths锚点')
              text = text.replace(helper_anchor, helper + helper_anchor, 1)
          old_tokens = [
              '    "const STATIC_CACHE = `cnc-static-${BUILD}`",',
              '    "const RUNTIME_CACHE = `cnc-runtime-${BUILD}`",',
              '    "name.startsWith(\'cnc-\') && !name.endsWith(BUILD)",'
          ]
          new_tokens = [
              "    `const CACHE_REVISION = '${cacheRevisionFor(expectedBuild)}'`,\n    \"const STATIC_CACHE = `cnc-static-${CACHE_REVISION}`\",",
              '    "const RUNTIME_CACHE = `cnc-runtime-${CACHE_REVISION}`",',
              '    "name.startsWith(\'cnc-\') && name !== STATIC_CACHE && name !== RUNTIME_CACHE",'
          ]
          for old, new in zip(old_tokens, new_tokens):
              if text.count(old) != 1:
                  raise SystemExit(f'AI老师Pages门禁架构标记不是1处：{old!r}，实际{text.count(old)}')
              text = text.replace(old, new, 1)
          text = text.replace("requireTokens(text, label, ['PWA10会刷新已清理开发占位后的核心课程正文']);", "requireTokens(text, label, ['PWA13会刷新AI老师学习档案异常保护']);")
          text = text.replace("requireTokens(text, label, ['PWA10用于刷新已清理开发占位后的核心课程正文']);", "requireTokens(text, label, ['PWA13用于刷新AI老师学习档案异常保护']);")
          write(page_path, text)

          # 所有主动构建针必须已消除旧PWA12目标；上一版本仅允许升级测试与Pages传播契约使用。
          active_files = [
              'cnc/tests/mobile-pwa-offline-cache-smoke.cjs',
              'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs',
              'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
              'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
              'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs'
          ]
          if "const PWA_BUILD = '20260804-pwa13'" not in read(active_files[0]):
              raise SystemExit('冷离线测试未同步PWA13')
          if "const CURRENT_PWA_BUILD = '20260804-pwa13'" not in read(active_files[1]):
              raise SystemExit('升级保护测试未同步PWA13')
          for path in active_files[2:]:
              if "const branchTargetPwaBuild = '20260804-pwa13'" not in read(path):
                  raise SystemExit(f'{path}未同步PWA13目标')
          PY

      - name: 执行语法、构建引用与差异审计
        shell: bash
        run: |
          set -euo pipefail
          node --check cnc/tests/mobile-ai-teacher-smoke.cjs
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node --check cnc/tests/pwa-build-reference-audit-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check

      - name: 删除临时写权限工作流并提交精确结果
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/cnc-pwa13-runtime-pin-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cnc-pwa13-runtime-pin-sync.yml .github/workflows/cnc-pwa-offline-cache-smoke.yml .github/workflows/cnc-pwa-upgrade-data-smoke.yml cnc/build-info.json cnc/tests/mobile-ai-teacher-smoke.cjs cnc/tests/mobile-pwa-offline-cache-smoke.cjs cnc/tests/mobile-pwa-upgrade-data-smoke.cjs cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          git diff --cached --quiet && { echo '没有可提交的精确同步结果' >&2; exit 1; }
          git commit -m 'test(cnc): 同步PWA13运行与离线门禁'
          git push origin HEAD:chatgpt/cnc-ai-teacher-data-integrity-mainline
