name: Deploy CNC site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "cnc/**"
      - ".github/workflows/deploy-cnc-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare lightweight site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R cnc _site/cnc
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="theme-color" content="#0f3b75">
            <title>正在恢复数控小潘 CNC助手</title>
            <style>
              *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f8fc;color:#17324d;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;padding:24px}.card{width:min(92vw,460px);background:#fff;border:1px solid #dbe7f3;border-radius:22px;padding:28px;box-shadow:0 18px 48px rgba(15,59,117,.12);text-align:center}.spinner{width:46px;height:46px;border:5px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 12px}p{line-height:1.7;color:#52677d;margin:8px 0}.btn{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:12px;background:#0f3b75;color:#fff;text-decoration:none;font-weight:700}
            </style>
          </head>
          <body>
            <main class="card">
              <div class="spinner" aria-hidden="true"></div>
              <h1>正在清理旧缓存</h1>
              <p>这是一次手机端恢复操作。清理完成后会自动进入网站。</p>
              <p id="status">正在处理，请不要关闭页面……</p>
              <a class="btn" id="manual" href="./cnc/?recovered=20260720i">直接进入网站</a>
            </main>
            <script>
            (async function(){
              var status=document.getElementById('status');
              try{
                if('serviceWorker' in navigator){
                  var regs=await navigator.serviceWorker.getRegistrations();
                  await Promise.all(regs.filter(function(r){return r.scope.indexOf('/yuhua/cnc/')!==-1}).map(function(r){return r.unregister()}));
                }
                if('caches' in window){
                  var names=await caches.keys();
                  await Promise.all(names.map(function(name){return caches.delete(name)}));
                }
                status.textContent='旧缓存已清理，正在进入网站……';
              }catch(error){
                status.textContent='自动清理未完全成功，仍将尝试进入网站。';
              }
              setTimeout(function(){location.replace('./cnc/?recovered=20260720i')},500);
            })();
            </script>
          </body>
          </html>
          HTML
          touch _site/.nojekyll
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
