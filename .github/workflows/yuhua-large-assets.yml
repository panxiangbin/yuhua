name: Yuhua large asset audit

on:
  pull_request:
    paths:
      - '**/*.mp4'
      - '**/*.webm'
      - '**/*.mov'
      - '**/*.avi'
      - '**/*.mkv'
      - '**/*.m4v'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.m4a'
      - '**/*.aac'
      - '**/*.ogg'
      - '**/*.flac'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.webp'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.avif'
      - '**/*.pdf'
      - '**/*.doc'
      - '**/*.docx'
      - '**/*.xls'
      - '**/*.xlsx'
      - '**/*.ppt'
      - '**/*.pptx'
      - '**/*.zip'
      - '**/*.rar'
      - '**/*.7z'
      - '**/*.tar'
      - '**/*.gz'
      - '**/*.tgz'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.eot'
      - 'tools/audit_large_assets.py'
      - 'tools/check_large_asset_additions.py'
      - '.github/workflows/yuhua-large-assets.yml'
  push:
    branches: [main]
    paths:
      - '**/*.mp4'
      - '**/*.webm'
      - '**/*.mov'
      - '**/*.avi'
      - '**/*.mkv'
      - '**/*.m4v'
      - '**/*.mp3'
      - '**/*.wav'
      - '**/*.m4a'
      - '**/*.aac'
      - '**/*.ogg'
      - '**/*.flac'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.webp'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.avif'
      - '**/*.pdf'
      - '**/*.doc'
      - '**/*.docx'
      - '**/*.xls'
      - '**/*.xlsx'
      - '**/*.ppt'
      - '**/*.pptx'
      - '**/*.zip'
      - '**/*.rar'
      - '**/*.7z'
      - '**/*.tar'
      - '**/*.gz'
      - '**/*.tgz'
      - '**/*.woff'
      - '**/*.woff2'
      - '**/*.ttf'
      - '**/*.otf'
      - '**/*.eot'
      - 'tools/audit_large_assets.py'
      - 'tools/check_large_asset_additions.py'
      - '.github/workflows/yuhua-large-assets.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On pull_request, depth 2 keeps the merge ref plus its parents so the
          # exact base SHA is available without fetching the repository history.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit tracked large assets
        run: |
          python -m py_compile tools/audit_large_assets.py tools/check_large_asset_additions.py
          python tools/audit_large_assets.py --json-output large_asset_report.json

      - name: Upload large-asset audit report
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-large-assets-report
          path: large_asset_report.json
          if-no-files-found: error
          retention-days: 90

      - name: Guard new or enlarged very large files
        if: github.event_name == 'pull_request'
        run: |
          python tools/check_large_asset_additions.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --max-mib 50

      # Existing large files remain read-only audit findings. The PR guard blocks
      # new blobs >=50 MiB and existing blobs that grow at/further above 50 MiB.
      # Unchanged legacy assets and size reductions remain allowed.
