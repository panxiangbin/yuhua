name: Yuhua core model link integrity

on:
  pull_request:
    paths:
      - 'index.html'
      - 'model/**'
      - 'sitemap.xml'
      - '.github/workflows/yuhua-core-model-links.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'model/**'
      - 'sitemap.xml'
      - '.github/workflows/yuhua-core-model-links.yml'

permissions:
  contents: read

jobs:
  check-core-model-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify homepage core-model links
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          class QuickModelParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.quick_depth = 0
                  self.current = None
                  self.links = []

              @staticmethod
              def classes(attrs):
                  return set(dict(attrs).get('class', '').split())

              def handle_starttag(self, tag, attrs):
                  if tag == 'div':
                      if self.quick_depth:
                          self.quick_depth += 1
                      elif 'quick-models' in self.classes(attrs):
                          self.quick_depth = 1
                  elif tag == 'a' and self.quick_depth:
                      href = dict(attrs).get('href', '').strip()
                      self.current = {'href': href, 'text': ''}

              def handle_data(self, data):
                  if self.current is not None:
                      self.current['text'] += data

              def handle_endtag(self, tag):
                  if tag == 'a' and self.current is not None:
                      self.current['text'] = ' '.join(self.current['text'].split())
                      self.links.append(self.current)
                      self.current = None
                  elif tag == 'div' and self.quick_depth:
                      self.quick_depth -= 1

          parser = QuickModelParser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          assert parser.links, 'Homepage quick-model entry block has no links'

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          locs = [node.text.strip() for node in root.findall('sm:url/sm:loc', ns) if node.text]
          sitemap_paths = {urlparse(url).path.removeprefix('/yuhua/') for url in locs}

          concrete = []
          for link in parser.links:
              href, label = link['href'], link['text']
              if href.startswith('model/'):
                  assert href.endswith('.html'), f'Core model link is not an HTML page: {label} -> {href}'
                  assert Path(href).is_file(), f'Core model link target is missing: {label} -> {href}'
                  assert href in sitemap_paths, f'Core model page is missing from sitemap.xml: {href}'

              if '系列' not in label:
                  assert href.startswith('model/'), (
                      f'Concrete core-model entry must link directly to model/*.html: {label} -> {href}'
                  )
                  concrete.append((label, href))

          assert concrete, 'No concrete core-model entries found on homepage'
          hrefs = [href for _, href in concrete]
          assert len(hrefs) == len(set(hrefs)), f'Duplicate concrete core-model targets found: {hrefs}'

          print(f'Homepage core-model link integrity: OK ({len(concrete)} concrete model links checked)')
          PY

      - name: Verify core-model email inquiry context
        run: |
          python - <<'PY'
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import parse_qs, urlsplit
          import json

          ALLOWED_EMAIL = 'smxpxb008@gmail.com'

          class ModelPageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.canonical = ''
                  self.mailtos = []
                  self._json_ld = False
                  self._json_chunks = []
                  self.json_ld_blocks = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'link' and 'canonical' in attrs.get('rel', '').split():
                      self.canonical = attrs.get('href', '').strip()
                  elif tag == 'a':
                      href = unescape(attrs.get('href', '').strip())
                      if href.lower().startswith('mailto:'):
                          self.mailtos.append(href)
                  elif tag == 'script' and attrs.get('type', '').lower() == 'application/ld+json':
                      self._json_ld = True
                      self._json_chunks = []

              def handle_data(self, data):
                  if self._json_ld:
                      self._json_chunks.append(data)

              def handle_endtag(self, tag):
                  if tag == 'script' and self._json_ld:
                      self.json_ld_blocks.append(''.join(self._json_chunks).strip())
                      self._json_ld = False
                      self._json_chunks = []

          def find_product_model(value):
              if isinstance(value, dict):
                  item_type = value.get('@type')
                  types = item_type if isinstance(item_type, list) else [item_type]
                  if 'Product' in types and value.get('model'):
                      return str(value['model']).strip()
                  for child in value.values():
                      found = find_product_model(child)
                      if found:
                          return found
              elif isinstance(value, list):
                  for child in value:
                      found = find_product_model(child)
                      if found:
                          return found
              return ''

          pages = sorted(Path('model').glob('*.html'))
          assert pages, 'No core model pages found under model/*.html'

          checked_links = 0
          for page in pages:
              parser = ModelPageParser()
              parser.feed(page.read_text(encoding='utf-8'))

              assert parser.canonical, f'{page}: missing canonical URL'
              assert parser.mailtos, f'{page}: missing email inquiry link'

              model = ''
              for block in parser.json_ld_blocks:
                  if not block:
                      continue
                  data = json.loads(block)
                  model = find_product_model(data)
                  if model:
                      break
              assert model, f'{page}: Product JSON-LD is missing model identity'

              for href in parser.mailtos:
                  parsed = urlsplit(href)
                  recipient = parsed.path.strip().lower()
                  assert recipient == ALLOWED_EMAIL, (
                      f'{page}: unauthorized inquiry recipient {recipient!r}; expected {ALLOWED_EMAIL}'
                  )

                  query = parse_qs(parsed.query, keep_blank_values=True)
                  subject = query.get('subject', [''])[0].strip()
                  body = query.get('body', [''])[0].strip()

                  assert subject, f'{page}: mailto subject is missing'
                  assert body, f'{page}: mailto body is missing'
                  assert model in subject, f'{page}: mailto subject does not identify model {model}'
                  assert model in body, f'{page}: mailto body does not identify model {model}'
                  assert parser.canonical in body, (
                      f'{page}: mailto body does not include source page {parser.canonical}'
                  )
                  checked_links += 1

          print(
              f'Core model email inquiry integrity: OK '
              f'({len(pages)} pages, {checked_links} mailto links checked)'
          )
          PY
