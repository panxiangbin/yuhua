name: CNC mobile quality check

on:
  pull_request:
    paths:
      - "cnc/mobile-gcode-pro.js"
      - "cnc/mobile-gcode-pro.css"
      - "cnc/import-test.js"
      - "cnc/learning-alignment-hotfix.js"
      - "cnc/sw.js"
      - ".github/workflows/cnc-mobile-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check cnc/mobile-gcode-pro.js
          node --check cnc/import-test.js
          node --check cnc/learning-alignment-hotfix.js
          node --check cnc/sw.js
      - name: Critical feature assertions
        run: |
          grep -q "20260720h" cnc/mobile-gcode-pro.js
          grep -q "20260720h" cnc/import-test.js
          grep -q "20260720h" cnc/sw.js
          grep -q "G05.1" cnc/mobile-gcode-pro.js
          grep -q "data-gcode-machine" cnc/mobile-gcode-pro.js
          grep -q "detail-panel.mobile-open" cnc/mobile-gcode-pro.css
          grep -q "learning-alignment-hotfix.js" cnc/sw.js
          grep -q "CNC_ALIGN_LEARNING_IMAGES" cnc/learning-alignment-hotfix.js
          grep -q "4000" cnc/learning-alignment-hotfix.js
          if grep -q "new MutationObserver" cnc/mobile-gcode-pro.js; then
            echo "mobile-gcode-pro.js must not install a global MutationObserver"
            exit 1
          fi
