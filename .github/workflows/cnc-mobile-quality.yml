name: CNC mobile quality check

on:
  pull_request:
    paths:
      - "cnc/mobile-gcode-pro.js"
      - "cnc/mobile-gcode-pro.css"
      - "cnc/import-test.js"
      - "cnc/sw.js"
      - ".github/workflows/cnc-mobile-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check cnc/mobile-gcode-pro.js
          node --check cnc/import-test.js
          node --check cnc/sw.js
      - name: Critical feature assertions
        run: |
          grep -q "20260720e" cnc/mobile-gcode-pro.js
          grep -q "G05.1" cnc/mobile-gcode-pro.js
          grep -q "data-gcode-machine" cnc/mobile-gcode-pro.js
          grep -q "detail-panel.mobile-open" cnc/mobile-gcode-pro.css
          grep -q "mobile-gcode-pro.js" cnc/sw.js
