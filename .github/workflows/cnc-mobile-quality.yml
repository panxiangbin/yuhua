name: CNC mobile quality check

on:
  pull_request:
    paths:
      - "cnc/mobile-gcode-pro.js"
      - "cnc/mobile-gcode-pro.css"
      - "cnc/clean-ui.css"
      - "cnc/clean-ui.js"
      - "cnc/import-test.js"
      - "cnc/sw.js"
      - "cnc-recover.html"
      - "cnc/tests/mobile-*.cjs"
      - ".github/workflows/cnc-mobile-quality.yml"
      - ".github/workflows/cnc-mobile-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check cnc/mobile-gcode-pro.js
          node --check cnc/clean-ui.js
          node --check cnc/import-test.js
          node --check cnc/sw.js
          node --check cnc/tests/mobile-home-smoke.cjs
          node --check cnc/tests/mobile-gcode-smoke.cjs
          node --check cnc/tests/mobile-gcode-layout-smoke.cjs
          node --check cnc/tests/mobile-gcode-search-smoke.cjs
          node --check cnc/tests/mobile-gcode-detail-smoke.cjs
          node --check cnc/tests/mobile-other-search-smoke.cjs
          node --check cnc/tests/mobile-sw-smoke.cjs
      - name: Stability and clean UI assertions
        run: |
          grep -q "20260720k" cnc/import-test.js
          grep -q "clean-ui.css" cnc/import-test.js
          grep -q "clean-ui.js" cnc/import-test.js
          grep -q "CNC_CLEAN_UI" cnc/clean-ui.js
          grep -q "openMobilePanel" cnc/clean-ui.js
          grep -q "setTimeout(openMobilePanel" cnc/clean-ui.js
          grep -q "cnc-clean-ui" cnc/import-test.js
          grep -q "数控小潘 CNC速查与学习助手" cnc/import-test.js
          grep -q "不保证直线" cnc/import-test.js
          grep -q "最小输入单位" cnc/import-test.js
          grep -q "disableServiceWorkerRegistration" cnc/import-test.js
          grep -q "Object.defineProperty(navigator.serviceWorker, 'register'" cnc/import-test.js
          grep -q "loadGcodePro" cnc/import-test.js
          grep -q "gcode-quick-row" cnc/clean-ui.css
          grep -q "study-card-grid" cnc/clean-ui.css
          grep -q "featured-images-preview" cnc/clean-ui.css
          grep -q "result-thumb" cnc/clean-ui.css
          grep -q "result-button" cnc/clean-ui.css
          grep -q "正在恢复数控网站" cnc-recover.html
          grep -q "./cnc/?recovered=20260720i" cnc-recover.html
          grep -q "getRegistrations" cnc-recover.html
          grep -q "/yuhua/cnc/" cnc-recover.html
          if grep -q "learning-images-04-12" cnc/import-test.js; then
            echo "Homepage bootstrap must not auto-load the large lesson image bundle"
            exit 1
          fi
          if grep -q "addEventListener('fetch'" cnc/sw.js; then
            echo "Emergency Service Worker must not intercept fetch requests"
            exit 1
          fi
          if grep -q "new MutationObserver" cnc/mobile-gcode-pro.js; then
            echo "mobile-gcode-pro.js must not install a global MutationObserver"
            exit 1
          fi
