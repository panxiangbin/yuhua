name: CNC mobile quality check

on:
  pull_request:
    paths:
      - "cnc/**"
      - ".github/workflows/cnc-mobile-quality.yml"
      - ".github/workflows/cnc-mobile-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check cnc/mobile-gcode-pro.js
          node --check cnc/clean-ui.js
          node --check cnc/query-modes.js
          node --check cnc/import-test.js
          node --check cnc/sw.js
          for file in cnc/tests/mobile-*.cjs; do node --check "$file"; done
      - name: Stability performance and split query assertions
        run: |
          grep -q "20260721q" cnc/import-test.js
          grep -q "BUILD = '20260721q'" cnc/clean-ui.js
          grep -q "polling: false" cnc/clean-ui.js
          grep -q "retryDelays" cnc/clean-ui.js
          grep -q "maxReadinessAttempts" cnc/clean-ui.js
          grep -q "mobile-performance-smoke" .github/workflows/cnc-mobile-smoke.yml
          grep -q "20260720n" cnc/query-modes.js
          grep -q "FILTER_META.alarm" cnc/query-modes.js
          grep -q "FILTER_META.parameter" cnc/query-modes.js
          grep -q "FILTER_META.fault" cnc/query-modes.js
          grep -q "delete FILTER_META.params" cnc/query-modes.js
          grep -q "isAlarmEntry" cnc/query-modes.js
          grep -q "isParameterEntry" cnc/query-modes.js
          grep -q "isFaultEntry" cnc/query-modes.js
          grep -q "clean-ui.css" cnc/import-test.js
          grep -q "vivid-ui.css" cnc/import-test.js
          grep -q "数控小潘 CNC速查与学习助手" cnc/import-test.js
          grep -q "不保证直线" cnc/import-test.js
          grep -q "最小输入单位" cnc/import-test.js
          grep -q "disableServiceWorkerRegistration" cnc/import-test.js
          grep -q "loadGcodePro" cnc/import-test.js
          grep -q "正在恢复数控网站" cnc-recover.html
          if grep -q "setInterval" cnc/clean-ui.js; then
            echo "clean-ui.js must not keep a 100ms polling interval"
            exit 1
          fi
          if grep -q "setTimeout(function(){ensureCleanStyle" cnc/import-test.js; then
            echo "Homepage bootstrap must not repeat every enhancement after startup"
            exit 1
          fi
          if grep -q "learning-images-04-12" cnc/import-test.js; then
            echo "Homepage bootstrap must not auto-load the large lesson image bundle"
            exit 1
          fi
          if grep -q "addEventListener('fetch'" cnc/sw.js; then
            echo "Emergency Service Worker must not intercept fetch requests"
            exit 1
          fi
          if grep -q "new MutationObserver" cnc/mobile-gcode-pro.js; then
            echo "mobile-gcode-pro.js must not install a global MutationObserver"
            exit 1
          fi