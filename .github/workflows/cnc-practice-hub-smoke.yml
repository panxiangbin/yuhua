name: CNC practice hub smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-practice-hub-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout actual PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify tested commit is actual PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          test "$tested" = "$EXPECTED_HEAD" || { echo "tested head mismatch: $tested != $EXPECTED_HEAD"; exit 1; }
          mkdir -p artifacts/practice-hub
          printf '{"testedHead":"%s","expectedHead":"%s","eventSha":"%s"}\n' "$tested" "$EXPECTED_HEAD" "$GITHUB_SHA" > artifacts/practice-hub/identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check cnc/tests/mobile-practice-hub-smoke.cjs
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cnc-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/cnc/practice.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/cnc-server.log
          exit 1
      - name: Run Chromium 390x844 smoke
        env:
          CNC_BASE_URL: http://127.0.0.1:4173
          CNC_ARTIFACT_DIR: artifacts/practice-hub
        run: node cnc/tests/mobile-practice-hub-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-practice-hub-${{ github.run_id }}
          path: artifacts/practice-hub
          if-no-files-found: error
          retention-days: 14