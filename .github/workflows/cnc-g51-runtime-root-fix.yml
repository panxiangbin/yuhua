name: CNC G51 runtime root fix

on:
  push:
    branches:
      - cnc-g51-runtime-trust-gate
    paths:
      - '.github/workflows/cnc-g51-runtime-root-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: cnc-g51-runtime-trust-gate
          fetch-depth: 0

      - name: Patch G51 base source and runtime guard
        shell: python
        run: |
          from pathlib import Path

          gm_path = Path('cnc/gm-code-complete.js')
          alias_path = Path('cnc/search-aliases.js')

          old_g51 = '''  {
              "id": "kb-gcode-g51",
              "category": "G代码",
              "title": "G51 缩放功能",
              "code": "G51",
              "aliases": [
                "比例缩放",
                "Scaling"
              ],
              "summary": "按指定比例放大或缩小程序轨迹。",
              "usage": "同形状不同尺寸零件、图形比例加工时使用。",
              "beginner": "G51用完要取消，且要确认缩放中心。",
              "warning": "缩放会影响坐标轨迹，忘记取消会让后续加工尺寸全错。",
              "example": "G51 X0 Y0 P2.0 可能表示以原点为中心放大2倍。",
              "risk": "中",
              "tags": [
                "G51",
                "缩放",
                "比例"
              ]
            },'''.replace('          ', '')

          new_g51 = '''  {
              "id": "kb-gcode-g51",
              "category": "G代码",
              "title": "G51 缩放功能（按当前CNC确认）",
              "code": "G51",
              "aliases": [
                "比例缩放",
                "Scaling"
              ],
              "summary": "在部分明确支持缩放功能的铣床/加工中心CNC中，G51会按本机定义改变后续坐标或轨迹的缩放解释；是否为选项功能、所属组别或模式、参与轴、缩放中心与倍率表达方式都会因当前CNC和机床厂配置不同，必须核对原厂手册。",
              "usage": "仅在确认当前CNC支持G51且已逐项核对选项、组别或模式、缩放中心、倍率表达、参与缩放的轴，以及圆弧、固定循环、刀具补偿等相关解释后受控使用；同时检查刀具、刀柄、工件、夹具和全部后续程序段的完整运动空间。",
              "beginner": "把G51理解成会改变后续坐标解释的高风险缩放状态，不要背固定P值、固定缩放中心或固定轴地址。看到G51先确认这台机床当前CNC和原厂手册，再判断它影响哪些轴、哪些后续程序段以及如何取消。",
              "warning": "G51的可用性、组别或模式、倍率格式、默认或指定缩放中心、参与轴，以及对快速、直线、圆弧、固定循环和补偿的影响必须以当前CNC和机床厂原厂手册为准。部分明确支持该关系的控制实现可能将G50用于取消缩放，但不能推广为所有CNC的通用规则。真实机床执行前必须检查完整计划运动空间，并按现场规程做图形检查、仿真、单段、低倍率、空运行或其它受控验证。",
              "example": "教学语义示意：部分明确支持该功能的铣床或加工中心CNC中，G51用于启用缩放；具体缩放中心、倍率表达、参与轴、圆弧、固定循环、补偿影响以及取消方式必须逐项以当前CNC和机床厂原厂手册为准，不提供可直接照抄的固定P值、轴位置或缩放倍率。",
              "risk": "高",
              "tags": [
                "G51",
                "缩放",
                "高风险状态",
                "当前CNC",
                "原厂手册",
                "缩放中心",
                "参与轴",
                "圆弧",
                "固定循环",
                "补偿"
              ]
            },'''.replace('          ', '')

          gm = gm_path.read_text(encoding='utf-8')
          if gm.count(old_g51) != 1:
              raise SystemExit(f'G51 base block count mismatch: {gm.count(old_g51)}')
          gm_path.write_text(gm.replace(old_g51, new_g51, 1), encoding='utf-8')

          aliases = alias_path.read_text(encoding='utf-8')
          aliases = aliases.replace(
              '作为第二层防御保持G10/G28/G50/G53/G92/G93/G94/G95/G96/G97/G98/G99边界一致；',
              '作为第二层防御保持G10/G28/G50/G51/G53/G92/G93/G94/G95/G96/G97/G98/G99边界一致；',
              1,
          )

          normalize_g51 = '''  function normalizeG51(entry) {
            if (!entry || entry.id !== 'kb-gcode-g51') return entry;
            return Object.assign({}, entry, {
              title: 'G51 缩放功能（按当前CNC确认）',
              summary: '在部分明确支持缩放功能的铣床/加工中心CNC中，G51会按本机定义改变后续坐标或轨迹的缩放解释；是否为选项功能、所属组别或模式、参与轴、缩放中心与倍率表达方式都会因当前CNC和机床厂配置不同，必须核对原厂手册。',
              usage: '仅在确认当前CNC支持G51且已逐项核对选项、组别或模式、缩放中心、倍率表达、参与缩放的轴，以及圆弧、固定循环、刀具补偿等相关解释后受控使用；同时检查刀具、刀柄、工件、夹具和全部后续程序段的完整运动空间。',
              beginner: '把G51理解成会改变后续坐标解释的高风险缩放状态，不要背固定P值、固定缩放中心或固定轴地址。看到G51先确认这台机床当前CNC和原厂手册，再判断它影响哪些轴、哪些后续程序段以及如何取消。',
              warning: 'G51的可用性、组别或模式、倍率格式、默认或指定缩放中心、参与轴，以及对快速、直线、圆弧、固定循环和补偿的影响必须以当前CNC和机床厂原厂手册为准。部分明确支持该关系的控制实现可能将G50用于取消缩放，但不能推广为所有CNC的通用规则。真实机床执行前必须检查完整计划运动空间，并按现场规程做图形检查、仿真、单段、低倍率、空运行或其它受控验证。',
              example: '教学语义示意：部分明确支持该功能的铣床或加工中心CNC中，G51用于启用缩放；具体缩放中心、倍率表达、参与轴、圆弧、固定循环、补偿影响以及取消方式必须逐项以当前CNC和机床厂原厂手册为准，不提供可直接照抄的固定P值、轴位置或缩放倍率。',
              risk: '高',
              tags: ['G51','缩放','高风险状态','当前CNC','原厂手册','缩放中心','参与轴','圆弧','固定循环','补偿']
            });
          }

          '''.replace('      ', '')

          anchor = '  function normalizeG53(entry) {'
          if aliases.count(anchor) != 1:
              raise SystemExit('normalizeG53 anchor mismatch')
          aliases = aliases.replace(anchor, normalize_g51 + anchor, 1)

          old_chain = 'normalizeG53(normalizeG50(normalizeG28(normalizeG10(entry))))'
          new_chain = 'normalizeG53(normalizeG51(normalizeG50(normalizeG28(normalizeG10(entry)))))'
          if aliases.count(old_chain) != 1:
              raise SystemExit('normalizeCatalog chain mismatch')
          aliases = aliases.replace(old_chain, new_chain, 1)

          old_version = "version: 'g10-g28-g50-g53-g92-g93-g94-g95-g96-g97-g98-g99-boundary-10'"
          new_version = "version: 'g10-g28-g50-g51-g53-g92-g93-g94-g95-g96-g97-g98-g99-boundary-11'"
          if aliases.count(old_version) != 1:
              raise SystemExit('guard version mismatch')
          aliases = aliases.replace(old_version, new_version, 1)

          old_export = '    normalizeG50: normalizeG50,\n    normalizeG53: normalizeG53,'
          new_export = '    normalizeG50: normalizeG50,\n    normalizeG51: normalizeG51,\n    normalizeG53: normalizeG53,'
          if aliases.count(old_export) != 1:
              raise SystemExit('guard export mismatch')
          aliases = aliases.replace(old_export, new_export, 1)
          alias_path.write_text(aliases, encoding='utf-8')

      - name: Verify migration before commit
        shell: bash
        run: |
          set -euo pipefail
          node cnc/tests/g51-scaling-runtime-trust-smoke.cjs
          git diff --check
          git diff -- cnc/gm-code-complete.js cnc/search-aliases.js

      - name: Commit real root fix to PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cnc/gm-code-complete.js cnc/search-aliases.js; then
            echo 'No migration changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/gm-code-complete.js cnc/search-aliases.js
          git commit -m 'CNC：修复 G51 缩放可信度运行时边界'
          git push origin HEAD:cnc-g51-runtime-trust-gate
