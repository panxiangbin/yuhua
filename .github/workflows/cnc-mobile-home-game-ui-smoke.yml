name: CNC mobile branch repair checkpoint

on:
  pull_request:
    paths:
      - 'cnc/tests/apply-mobile-home-fix.py'
      - '.github/workflows/cnc-mobile-home-game-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-mobile-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/mobile-home-refactor-20260804'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/mobile-home-refactor-20260804

      - name: Apply deterministic mobile fix
        run: |
          set -euxo pipefail
          python3 cnc/tests/apply-mobile-home-fix.py
          node --check cnc/personal-home.js
          node --check cnc/tests/mobile-home-refactor-smoke.cjs
          git diff --check
          if git diff --quiet; then
            echo 'No pending repair changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc .github/workflows
          git commit -m 'fix(cnc-mobile): fit viewport nav and visible course cards'
          git push origin HEAD:codex/mobile-home-refactor-20260804
