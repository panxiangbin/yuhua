name: CNC mobile game home UI smoke

on:
  pull_request:
    paths:
      - 'cnc/index.html'
      - 'cnc/personal-home.js'
      - 'cnc/mobile-home-game.css'
      - 'cnc/import-test.js'
      - 'cnc/mobile-trust-nav.js'
      - 'cnc/industrial-tools.js'
      - 'cnc/course-*.html'
      - 'cnc/beginner-placement.html'
      - 'cnc/training-camp.html'
      - 'cnc/practice.html'
      - 'cnc/practice-wrong-review.html'
      - 'cnc/simulator-hub.html'
      - 'cnc/profile.html'
      - 'cnc/tests/mobile-home-game-ui-smoke.cjs'
      - 'cnc/tests/mobile-home-game-trigger-coverage-smoke.cjs'
      - 'cnc/docs/mobile-home-game-main-push-contract.md'
      - '.github/workflows/cnc-mobile-home-game-ui-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'cnc/index.html'
      - 'cnc/personal-home.js'
      - 'cnc/mobile-home-game.css'
      - 'cnc/import-test.js'
      - 'cnc/mobile-trust-nav.js'
      - 'cnc/industrial-tools.js'
      - 'cnc/course-*.html'
      - 'cnc/beginner-placement.html'
      - 'cnc/training-camp.html'
      - 'cnc/practice.html'
      - 'cnc/practice-wrong-review.html'
      - 'cnc/simulator-hub.html'
      - 'cnc/profile.html'
      - 'cnc/tests/mobile-home-game-ui-smoke.cjs'
      - 'cnc/tests/mobile-home-game-trigger-coverage-smoke.cjs'
      - 'cnc/docs/mobile-home-game-main-push-contract.md'
      - '.github/workflows/cnc-mobile-home-game-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnc-mobile-home-game-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  mobile-home-game:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax, trigger coverage and Chinese contract
        run: |
          set -euxo pipefail
          test -f cnc/tests/mobile-home-game-ui-smoke.cjs
          test -f cnc/tests/mobile-home-game-trigger-coverage-smoke.cjs
          test -f cnc/docs/mobile-home-game-main-push-contract.md
          node --check cnc/personal-home.js
          node --check cnc/tests/mobile-home-game-ui-smoke.cjs
          node --check cnc/tests/mobile-home-game-trigger-coverage-smoke.cjs
          grep -q 'main 推送' cnc/docs/mobile-home-game-main-push-contract.md
          grep -q '390×844' cnc/docs/mobile-home-game-main-push-contract.md
          grep -q '相同系统和机型的原厂手册' cnc/docs/mobile-home-game-main-push-contract.md
          grep -q '授权人员确认' cnc/docs/mobile-home-game-main-push-contract.md
      - name: Verify pull request and main push trigger coverage
        run: node cnc/tests/mobile-home-game-trigger-coverage-smoke.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cnc-home-server.log 2>&1 &
          echo $! > /tmp/cnc-home-server.pid
      - name: Run 390x844 mobile homepage smoke
        run: node cnc/tests/mobile-home-game-ui-smoke.cjs
      - name: Preserve server log
        if: always()
        run: cp /tmp/cnc-home-server.log artifacts/mobile-home-game/server.log || true
      - name: Upload browser and trigger diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-mobile-home-game-ui-${{ github.run_id }}
          path: artifacts/mobile-home-game/
          if-no-files-found: error
          retention-days: 14
