name: CNC mobile game home UI smoke

on:
  pull_request:
    paths:
      - 'cnc/personal-home.js'
      - 'cnc/mobile-home-game.css'
      - 'cnc/tests/mobile-home-game-ui-smoke.cjs'
      - '.github/workflows/cnc-mobile-home-game-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-home-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check cnc/personal-home.js
          node --check cnc/tests/mobile-home-game-ui-smoke.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cnc-home-server.log 2>&1 &
          echo $! > /tmp/cnc-home-server.pid
      - name: Run 390x844 mobile homepage smoke
        run: node cnc/tests/mobile-home-game-ui-smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-mobile-home-game-ui
          path: artifacts/mobile-home-game
          if-no-files-found: warn
