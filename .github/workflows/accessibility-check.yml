name: Yuhua Accessibility Check

on:
  push:
    branches: [upgrade-84h]
    paths:
      - "index.html"
      - "404.html"
      - "scripts/audit-accessibility.cjs"
      - ".github/workflows/accessibility-check.yml"
  pull_request:
    paths:
      - "index.html"
      - "404.html"
      - "scripts/audit-accessibility.cjs"
      - ".github/workflows/accessibility-check.yml"

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check audit script syntax
        run: node --check scripts/audit-accessibility.cjs
      - name: Audit public page accessibility
        run: node scripts/audit-accessibility.cjs
      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-accessibility-audit
          path: |
            test-artifacts/accessibility-audit-summary.json
            test-artifacts/accessibility-audit-items.csv
          if-no-files-found: error
          retention-days: 14
