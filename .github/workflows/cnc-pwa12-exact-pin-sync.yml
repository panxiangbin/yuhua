name: CNC PWA12 exact pin sync
on:
  pull_request:
    paths:
      - '.github/workflows/cnc-pwa12-exact-pin-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cnc-pwa12-exact-pin-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'chatgpt/cnc-home-refresh-regression-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-home-refresh-regression-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact PWA12 gate synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          current = '20260804-pwa12'
          previous = '20260804-pwa11'
          legacy = '20260803-' + 'pwa9'

          active = [
            'cnc/tests/mobile-pwa-offline-cache-smoke.cjs',
            'cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs',
            'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs',
            'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
            'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
            'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
            '.github/workflows/cnc-pwa-offline-cache-smoke.yml',
            '.github/workflows/cnc-pwa-self-test-smoke.yml',
            '.github/workflows/cnc-pwa-upgrade-data-smoke.yml',
            '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml',
            '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml',
            '.github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml',
          ]

          def text(path): return Path(path).read_text(encoding='utf-8')
          def write(path, value): Path(path).write_text(value, encoding='utf-8')
          def must(path, old, new, minimum=1):
            value = text(path)
            count = value.count(old)
            if count < minimum:
              raise SystemExit(f'{path}: missing exact token {old!r}')
            write(path, value.replace(old, new))

          for path in active:
            must(path, previous, current)
          for path in [
            'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs',
            'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
            'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
            'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
            '.github/workflows/cnc-pwa-upgrade-data-smoke.yml',
            '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml',
            '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml',
            '.github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml',
          ]:
            must(path, legacy, previous)

          must('cnc/tests/mobile-pwa-offline-cache-smoke.cjs',
               "const CORE_OFFLINE_PATHS = [\n  './beginner-placement.html',",
               "const CORE_OFFLINE_PATHS = [\n  './homepage-refresh.css',\n  './beginner-placement.html',")

          for path in [
            'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
            'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
            'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
          ]:
            must(path,
                 "  const core = [\n    './index.html',\n    './offline.html',",
                 "  const core = [\n    './index.html',\n    './homepage-refresh.css',\n    './offline.html',")

          ai = 'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs'
          must(ai, "    \"const RUNTIME_CACHE = `cnc-runtime-${BUILD}`\",\n    \"'./beginner-placement.html'\",",
                   "    \"const RUNTIME_CACHE = `cnc-runtime-${BUILD}`\",\n    \"'./homepage-refresh.css'\",\n    \"'./beginner-placement.html'\",")
          must(ai, "    `const EXPECTED='${expectedBuild}'`,\n    \"'./beginner-placement.html'\",",
                   "    `const EXPECTED='${expectedBuild}'`,\n    \"'./homepage-refresh.css'\",\n    \"'./beginner-placement.html'\",")
          must(ai, 'fourteenCoreResourcesVerified', 'fifteenCoreResourcesVerified')
          must(ai, '14项且无重复', '15项且无重复')
          must(ai, 'PWA10会刷新已清理开发占位后的核心课程正文', 'PWA12用于刷新桌面首页本地样式、自检核心资源与离线缓存的一致性')
          must(ai, 'PWA10用于刷新已清理开发占位后的核心课程正文', 'PWA12用于刷新桌面首页本地样式、自检核心资源与离线缓存的一致性')

          beginner = 'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs'
          must(beginner, "    `const BUILD = '${expectedBuild}'`,\n    \"'./beginner-placement.html'\",",
                         "    `const BUILD = '${expectedBuild}'`,\n    \"'./homepage-refresh.css'\",\n    \"'./beginner-placement.html'\",")
          must(beginner, '进入14项核心预缓存', '及桌面首页样式进入15项核心预缓存')

          training = 'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs'
          must(training, "    'const REQUIRED_CORE_PATHS = [',\n    \"'./training-camp.html'\",",
                         "    'const REQUIRED_CORE_PATHS = [',\n    \"'./homepage-refresh.css'\",\n    \"'./training-camp.html'\",")
          must(training, '公网必须已经是PWA10', '公网必须已经是PWA12')
          must(training, '进入14项核心预缓存', '与桌面首页样式进入15项核心预缓存')

          for path in [
            'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
            'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
            'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
          ]:
            value = text(path)
            marker = "'正式课程开发占位清零'"
            if "'桌面首页离线样式一致性'" not in value:
              value = value.replace(marker, marker + ", '桌面首页离线样式一致性'")
              write(path, value)

          for path in [
            '.github/workflows/cnc-pwa-offline-cache-smoke.yml',
            '.github/workflows/cnc-pwa-self-test-smoke.yml',
            '.github/workflows/cnc-pwa-upgrade-data-smoke.yml',
            '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml',
            '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml',
            '.github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml',
          ]:
            value = text(path)
            value = value.replace("          for (const file of [\n            './beginner-placement.html',",
                                  "          for (const file of [\n            './homepage-refresh.css',\n            './beginner-placement.html',")
            value = value.replace("for (const file of ['./training-camp.html'",
                                  "for (const file of ['./homepage-refresh.css','./training-camp.html'")
            value = value.replace("            './beginner-placement.html',",
                                  "            './homepage-refresh.css',\n            './beginner-placement.html',")
            value = value.replace('fourteenCoreResourcesVerified', 'fifteenCoreResourcesVerified')
            value = value.replace('PWA10用于刷新已清理开发占位后的核心课程正文',
                                  'PWA12用于刷新桌面首页本地样式、自检核心资源与离线缓存的一致性')
            if '正式课程开发占位清零' in value and '桌面首页离线样式一致性' not in value:
              value = value.replace("'正式课程开发占位清零'", "'正式课程开发占位清零','桌面首页离线样式一致性'")
            write(path, value)

          print('PWA12 exact synchronization applied')
          PY
      - name: Validate exact result
        run: |
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check
      - name: Commit synchronized gates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cnc/tests .github/workflows/cnc-pwa-offline-cache-smoke.yml .github/workflows/cnc-pwa-self-test-smoke.yml .github/workflows/cnc-pwa-upgrade-data-smoke.yml .github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml .github/workflows/cnc-beginner-placement-offline-pages-smoke.yml .github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml
          git diff --cached --quiet && { echo 'No synchronization changes found'; exit 1; }
          git commit -m 'test(cnc): 同步PWA12完整门禁与15项核心资源'
          git push origin HEAD:chatgpt/cnc-home-refresh-regression-fix
