name: CNC PWA35 G95 batch repair

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'codex/cnc-g95-dual-semantics-pwa35'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact starting head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "starting_head=$actual"
      - name: Apply real-root repairs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pwaPrefix = '20260810-pwa';
          const cachePrefix = '20260810-learning';
          const oldPwa = pwaPrefix + '33';
          const previousPwa = pwaPrefix + '34';
          const currentPwa = pwaPrefix + '35';
          const oldCache = cachePrefix + '33';
          const previousCache = cachePrefix + '34';
          const currentCache = cachePrefix + '35';

          function read(path) {
            if (!fs.existsSync(path)) throw new Error(`missing target: ${path}`);
            return fs.readFileSync(path, 'utf8');
          }
          function write(path, text) { fs.writeFileSync(path, text); }
          function requireReplace(text, from, to, label) {
            if (!text.includes(from)) throw new Error(`required marker missing: ${label}`);
            return text.replaceAll(from, to);
          }

          const workflows = [
            '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml',
            '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml',
            '.github/workflows/cnc-pwa-upgrade-data-smoke.yml',
            '.github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml',
            '.github/workflows/cnc-pwa-offline-cache-smoke.yml',
            '.github/workflows/cnc-pwa-self-test-smoke.yml',
            '.github/workflows/cnc-g98-g99-cold-offline-source-trust-smoke.yml',
            '.github/workflows/cnc-g96-g97-cold-offline-source-trust-smoke.yml',
            '.github/workflows/cnc-learning-media-smoke.yml'
          ];
          for (const path of workflows) {
            let text = read(path);
            if (!text.includes(currentPwa)) {
              text = requireReplace(text, previousPwa, currentPwa, `${path} current PWA`);
              text = requireReplace(text, previousCache, currentCache, `${path} current cache`);
            }
            text = text.replaceAll(oldPwa, previousPwa).replaceAll(oldCache, previousCache);
            text = text.replaceAll('Validate PWA34 and anti-bypass contract', 'Validate PWA35 and anti-bypass contract');
            text = text.replaceAll('Validate committed PWA33 media contract', 'Validate committed PWA35 media contract');
            text = text.replaceAll('Committed PWA33 media contract passed.', 'Committed PWA35 media contract passed.');
            write(path, text);
          }

          for (const path of [
            'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
            'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
            'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs'
          ]) {
            let text = read(path);
            text = requireReplace(text, oldPwa, previousPwa, `${path} previous PWA`);
            text = requireReplace(text, oldCache, previousCache, `${path} previous cache`);
            write(path, text);
          }

          {
            const path = '.github/workflows/cnc-g95-dual-semantic-boundary-trust-smoke.yml';
            let text = read(path);
            text = requireReplace(
              text,
              "! grep -F 'continue-on-error:' .github/workflows/cnc-g95-dual-semantic-boundary-trust-smoke.yml",
              "! grep -Eq '^[[:space:]]*continue-on-error[[:space:]]*:' .github/workflows/cnc-g95-dual-semantic-boundary-trust-smoke.yml",
              'G95 anti-bypass anchored check'
            );
            write(path, text);
          }

          {
            const path = 'cnc/tests/g10-programmable-data-input-trust-smoke.cjs';
            let text = read(path);
            text = requireReplace(
              text,
              '作为第二层防御保持G10/G28/G53/G92/G94/G96/G97/G98/G99边界一致',
              '作为第二层防御保持G10/G28/G53/G92/G94/G95/G96/G97/G98/G99边界一致',
              'G10 guard chain includes G95'
            );
            text = text.replaceAll('G10/G28/G53/G92/G94/G98/G99内容安全归一化器', 'G10/G28/G53/G92/G94/G95/G96/G97/G98/G99内容安全归一化器');
            text = text.replaceAll('PWA33首次安装离线核心', 'PWA35首次安装离线核心');
            text = text.replaceAll('build-info与PWA33不一致', 'build-info与PWA35不一致');
            write(path, text);
          }

          {
            const path = '.github/workflows/cnc-g98-g99-cold-offline-source-trust-smoke.yml';
            let text = read(path);
            text = requireReplace(
              text,
              'g10-g28-g53-g92-g94-g96-g97-g98-g99-boundary-7',
              'g10-g28-g53-g92-g94-g95-g96-g97-g98-g99-boundary-8',
              'G98/G99 boundary-8'
            );
            write(path, text);
          }

          {
            const path = '.github/workflows/cnc-g96-g97-cold-offline-source-trust-smoke.yml';
            let text = read(path);
            const oldCheckout = "      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4";
            if (text.includes(oldCheckout)) {
              const expr = '$' + '{{ github.event.pull_request.head.sha || github.sha }}';
              const replacement = [
                '      - uses: actions/checkout@v4',
                '        with:',
                `          ref: ${expr}`,
                '      - name: Verify exact tested commit',
                '        shell: bash',
                '        run: |',
                `          expected='${expr}'`,
                '          actual="$(git rev-parse HEAD)"',
                '          test "$actual" = "$expected" || { echo "exact-head mismatch: expected=$expected actual=$actual" >&2; exit 1; }',
                '      - uses: actions/setup-node@v4'
              ].join('\n');
              text = text.replace(oldCheckout, replacement);
            }
            write(path, text);
          }

          {
            const path = 'cnc/tests/g95-cold-offline-source-trust-smoke.cjs';
            let text = read(path);
            const marker = "    ];\n    for (const token of gmRequired) {\n      if (!sourceEvidence.gmText.includes(token))";
            if (!text.includes(marker)) throw new Error('G95 source-scope marker missing');
            const inserted = `    ];\n    let gmCatalog;\n    try {\n      gmCatalog = JSON.parse(sourceEvidence.gmText\n        .replace(/^\\s*window\\.CNC_GM_CODES\\s*=\\s*/, '')\n        .replace(/;\\s*$/, ''));\n    } catch (error) {\n      throw new Error(\`G95冷离线基础源无法解析：\${error.message}\`);\n    }\n    const g95SourceEntry = Array.isArray(gmCatalog) ? gmCatalog.find(item => item && item.id === 'kb-gcode-g95') : null;\n    if (!g95SourceEntry) throw new Error('G95冷离线基础源条目缺失');\n    const g95SourceText = JSON.stringify(g95SourceEntry);\n    for (const token of gmRequired) {\n      if (!g95SourceText.includes(token))`;
            text = text.replace(marker, inserted);
            text = text.replace(
              "if (sourceEvidence.gmText.includes(forbidden)) throw new Error(`G95冷离线基础源仍含可直接照抄或跨机型口诀：${forbidden}`);",
              "if (g95SourceText.includes(forbidden)) throw new Error(`G95冷离线基础源仍含可直接照抄或跨机型口诀：${forbidden}`);"
            );
            write(path, text);
          }

          console.log('PWA35/G95 repairs applied.');
          NODE
      - name: Validate repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check cnc/tests/g95-cold-offline-source-trust-smoke.cjs
          node --check cnc/tests/g10-programmable-data-input-trust-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          node cnc/tests/g10-programmable-data-input-trust-smoke.cjs
          node cnc/tests/g95-dual-semantic-boundary-trust-smoke.cjs
          node --check cnc/tests/g96-g97-cold-offline-source-trust-smoke.cjs
          node --check cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs
          bad="$(git diff --name-only | grep -Ev '^(cnc/|\.github/workflows/cnc-)' || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }
      - name: Commit CNC-only repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CNC repair automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cnc .github/workflows/cnc-*.yml
          git diff --cached --quiet && { echo 'No repair changes'; exit 1; }
          git commit -m 'fix(cnc): 修复PWA35门禁迁移与G95冷离线根因'
          echo "REPAIR_COMMIT=$(git rev-parse HEAD)"
          git show --stat --oneline --no-renames HEAD
      - name: Push without force
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:codex/cnc-g95-dual-semantics-pwa35
