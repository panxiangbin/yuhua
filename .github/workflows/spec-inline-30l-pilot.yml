name: Temporary 30L spec inline-image pilot

on:
  push:
    branches:
      - perf/spec-inline-30l-pilot
    paths:
      - .github/workflows/spec-inline-30l-pilot.yml

permissions:
  contents: write

jobs:
  apply-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: perf/spec-inline-30l-pilot

      - name: Externalize only the proven duplicate image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, struct

          target = Path('specs/反应釜/4-反应釜_3_高压反应釜_付青杰_fcf升降釜_30l电动升降技术参数.html')
          encoded_digest = 'd0da2b4c71757738e9963135547210727a163696133551a93154dbee7e177a71'
          expected_blob = '9c4f414201dc6745873574c0440b03129f896540'
          asset = Path(f'assets/spec-inline/{encoded_digest}.png')
          relative_url = f'../../../assets/spec-inline/{encoded_digest}.png'

          original = target.read_bytes()
          git_blob = hashlib.sha1(b'blob ' + str(len(original)).encode() + b'\0' + original).hexdigest()
          if git_blob != expected_blob:
              raise SystemExit(f'guard failed: source blob {git_blob} != expected {expected_blob}')

          text = original.decode('utf-8')
          matches = []
          for match in re.finditer(r'data:image/png;base64,([A-Za-z0-9+/=]+)', text):
              payload = match.group(1).encode('ascii')
              if hashlib.sha256(payload).hexdigest() == encoded_digest:
                  raw = base64.b64decode(payload, validate=True)
                  matches.append((match.group(0), payload, raw))

          if len(matches) != 2:
              raise SystemExit(f'guard failed: expected exactly 2 candidate occurrences, found {len(matches)}')
          if matches[0][0] != matches[1][0] or matches[0][1] != matches[1][1] or matches[0][2] != matches[1][2]:
              raise SystemExit('guard failed: candidate occurrences are not byte-identical')

          uri, payload, png = matches[0]
          if hashlib.sha256(payload).hexdigest() != encoded_digest:
              raise SystemExit('guard failed: encoded payload digest mismatch')
          if len(png) != 312110:
              raise SystemExit(f'guard failed: PNG size {len(png)} != 312110')
          if png[:8] != b'\x89PNG\r\n\x1a\n' or png[12:16] != b'IHDR':
              raise SystemExit('guard failed: candidate is not the expected PNG structure')
          width, height = struct.unpack('>II', png[16:24])
          if (width, height) != (338, 661):
              raise SystemExit(f'guard failed: PNG dimensions {(width, height)} != (338, 661)')

          if asset.exists() and asset.read_bytes() != png:
              raise SystemExit('guard failed: existing shared asset differs from candidate bytes')
          asset.parent.mkdir(parents=True, exist_ok=True)
          asset.write_bytes(png)

          if text.count(uri) != 2:
              raise SystemExit('guard failed: exact URI does not occur exactly twice')
          changed = text.replace(uri, relative_url)
          if changed.count(relative_url) != 2:
              raise SystemExit('guard failed: replacement count is not exactly two')
          remaining_hashes = {
              hashlib.sha256(m.group(1).encode('ascii')).hexdigest()
              for m in re.finditer(r'data:image/png;base64,([A-Za-z0-9+/=]+)', changed)
          }
          if encoded_digest in remaining_hashes:
              raise SystemExit('guard failed: candidate payload still remains inline')

          restored = changed.replace(relative_url, uri).encode('utf-8')
          if restored != original:
              raise SystemExit('guard failed: reverse substitution does not restore source bytes exactly')

          target.write_bytes(changed.encode('utf-8'))
          after = target.stat().st_size
          savings = len(original) - after
          print(f'original_html_bytes={len(original)}')
          print(f'new_html_bytes={after}')
          print(f'html_bytes_saved={savings}')
          print(f'shared_png_bytes={len(png)}')
          print(f'net_repo_bytes_saved={savings-len(png)}')
          print(f'encoded_payload_sha256={hashlib.sha256(payload).hexdigest()}')
          print(f'decoded_png_sha256={hashlib.sha256(png).hexdigest()}')
          print(f'candidate_dimensions={width}x{height}')
          PY

      - name: Commit only the pilot result and remove this temporary workflow
        shell: bash
        run: |
          rm .github/workflows/spec-inline-30l-pilot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --check
          git commit -m 'perf: externalize duplicate image in 30L reactor spec'
          git push origin HEAD:perf/spec-inline-30l-pilot
