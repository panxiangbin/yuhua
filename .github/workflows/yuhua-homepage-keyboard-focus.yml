name: Yuhua homepage keyboard focus audit

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - 'tools/audit_homepage_keyboard_focus.py'
      - '.github/workflows/yuhua-homepage-keyboard-focus.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - 'tools/audit_homepage_keyboard_focus.py'
      - '.github/workflows/yuhua-homepage-keyboard-focus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keyboard-focus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser audit dependency
        run: python -m pip install --disable-pip-version-check --quiet selenium==4.35.0

      - name: Run desktop and mobile keyboard focus audit
        run: |
          python tools/audit_homepage_keyboard_focus.py \
            --json homepage_keyboard_focus_audit.json \
            --markdown homepage_keyboard_focus_audit.md

      - name: Verify report contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('homepage_keyboard_focus_audit.json').read_text(encoding='utf-8'))
          assert report['ok']
          assert report['desktop']['skip_link_activation']['active']['id'] == 'main-content'
          assert report['desktop']['product_dialog']['focus_restored_to_opener']
          assert report['mobile']['mobile_menu']['expanded']
          assert report['mobile']['inquiry_form']['control_count'] >= 9
          assert report['mobile']['inquiry_form']['all_controls_have_visible_focus']
          assert '不会修改产品事实、规格书内容、型号、价格或联系方式' in report['policy']
          print('Keyboard focus report contract: OK')
          PY

      - name: Upload keyboard focus audit
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-homepage-keyboard-focus-audit
          path: |
            homepage_keyboard_focus_audit.json
            homepage_keyboard_focus_audit.md
          retention-days: 90
