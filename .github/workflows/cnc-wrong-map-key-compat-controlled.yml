name: CNC wrong-map key compatibility controlled fix

on:
  push:
    branches:
      - codex/cnc-wrong-map-key-compat

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prove tested commit identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Configure bot commit identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply scoped CNC patch
        shell: bash
        run: python3 cnc/tests/apply_wrong_map_key_compat_fix.py
      - name: Validate exact four-file scope
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
              'cnc/profile.html',
              'cnc/practice-wrong-review.html',
              'cnc/tests/mobile-profile-practice-analytics-smoke.cjs',
              'cnc/tests/mobile-practice-wrong-review-smoke.cjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected generated scope: {sorted(changed)}')
          print('scope ok:', sorted(changed))
          PY
      - name: Check generated JavaScript tests syntax
        shell: bash
        run: |
          node --check cnc/tests/mobile-profile-practice-analytics-smoke.cjs
          node --check cnc/tests/mobile-practice-wrong-review-smoke.cjs
      - name: Commit generated fix
        shell: bash
        run: |
          git add cnc/profile.html cnc/practice-wrong-review.html cnc/tests/mobile-profile-practice-analytics-smoke.cjs cnc/tests/mobile-practice-wrong-review-smoke.cjs
          git commit -m 'CNC：兼容错题对象键历史结构'
      - name: Push generated child commit
        shell: bash
        run: git push origin HEAD:codex/cnc-wrong-map-key-compat
