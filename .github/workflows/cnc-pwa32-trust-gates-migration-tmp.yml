name: CNC PWA32 trust gates migration tmp

on:
  push:
    branches:
      - codex/cnc-g94-dual-semantic-boundary
    paths:
      - 'cnc/tests/_tmp-pwa32-trust-gates-migration.py'
      - '.github/workflows/cnc-pwa32-trust-gates-migration-tmp.yml'

permissions:
  contents: write

jobs:
  migrate-pwa32-trust-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cnc-g94-dual-semantic-boundary
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run controlled trust gate migration
        run: python cnc/tests/_tmp-pwa32-trust-gates-migration.py
      - name: Validate changed-file whitelist and assertions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          expected=(
            cnc/tests/g10-programmable-data-input-trust-smoke.cjs
            cnc/tests/g28-reference-return-boundary-trust-smoke.cjs
            cnc/tests/g53-machine-coordinate-boundary-trust-smoke.cjs
            cnc/tests/g92-dual-semantic-boundary-trust-smoke.cjs
          )
          if [[ ${#changed[@]} -ne ${#expected[@]} ]]; then
            printf 'unexpected changes:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          for path in "${expected[@]}"; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$path" >/dev/null || exit 1
            node --check "$path"
            grep -F '20260810-pwa32' "$path" >/dev/null
            grep -F '20260810-learning32' "$path" >/dev/null
            grep -F 'g10-g28-g53-g92-g94-boundary-5' "$path" >/dev/null
            ! grep -F '20260809-pwa31' "$path"
            ! grep -F 'g10-g28-g53-g92-boundary-4' "$path"
          done
      - name: Commit controlled trust gate migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            cnc/tests/g10-programmable-data-input-trust-smoke.cjs \
            cnc/tests/g28-reference-return-boundary-trust-smoke.cjs \
            cnc/tests/g53-machine-coordinate-boundary-trust-smoke.cjs \
            cnc/tests/g92-dual-semantic-boundary-trust-smoke.cjs
          git diff --cached --quiet && { echo 'no gate migration changes to commit' >&2; exit 1; }
          git commit -m 'fix(cnc-trust): 对齐既有可信门禁到PWA32'
          git push origin HEAD:codex/cnc-g94-dual-semantic-boundary
