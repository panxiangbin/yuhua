name: CNC PWA31 content migration tmp

on:
  push:
    branches:
      - codex/cnc-g92-dual-semantic-boundary
    paths:
      - 'cnc/tests/_tmp-pwa31-content-migration.py'
      - '.github/workflows/cnc-pwa31-content-migration-tmp.yml'

permissions:
  contents: write

jobs:
  migrate-pwa31-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate exact PWA31 content contracts
        run: python cnc/tests/_tmp-pwa31-content-migration.py
      - name: Validate JavaScript syntax
        run: |
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/sw.js
      - name: Audit exact write scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          allowed='cnc/pwa-self-test.html cnc/pwa-status.html cnc/tests/mobile-pwa-upgrade-data-smoke.cjs'
          for file in "${changed[@]}"; do
            case " $allowed " in
              *" $file "*) ;;
              *) echo "一次性迁移出现白名单外改动: $file" >&2; exit 1 ;;
            esac
          done
      - name: Commit exact migration result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cnc/pwa-self-test.html cnc/pwa-status.html cnc/tests/mobile-pwa-upgrade-data-smoke.cjs; then
            echo 'PWA31内容已经处于目标状态'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/pwa-self-test.html cnc/pwa-status.html cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          git commit -m 'fix(cnc-pwa): 对齐PWA31状态与升级数据门禁'
          git push origin "HEAD:${GITHUB_REF_NAME}"
