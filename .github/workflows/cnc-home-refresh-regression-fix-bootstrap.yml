name: CNC home refresh regression fix bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/cnc-home-refresh-regression-fix-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-home-refresh-regression-fix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-home-refresh-regression-fix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 修复真实根因并执行静态验证
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          teacher = Path('cnc/ai-teacher.html')
          teacher_text = teacher.read_text(encoding='utf-8')
          old_build = "const BUILD = '20260801-ai-handoff1';"
          new_build = "const BUILD = '20260804-home-refresh1';"
          if teacher_text.count(old_build) != 1:
              raise SystemExit(f'AI老师旧构建针数量异常：{teacher_text.count(old_build)}')
          teacher.write_text(teacher_text.replace(old_build, new_build), encoding='utf-8')

          drift = Path('cnc/tests/placement-first-step-offline-core-drift-smoke.cjs')
          drift_text = drift.read_text(encoding='utf-8')
          old_rule = "return normalizeRelativePath(value, 'PWA核心资源', '(?:html|json)');"
          new_rule = "return normalizeRelativePath(value, 'PWA核心资源', '(?:html|json|css)');"
          if drift_text.count(old_rule) != 1:
              raise SystemExit(f'核心资源扩展名规则数量异常：{drift_text.count(old_rule)}')
          drift.write_text(drift_text.replace(old_rule, new_rule), encoding='utf-8')

          workflow = Path('.github/workflows/cnc-home-refresh-regression-fix-bootstrap.yml')
          workflow.unlink()
          PY

          node --check cnc/tests/placement-first-step-offline-core-drift-smoke.cjs
          grep -q "const BUILD = '20260804-home-refresh1';" cnc/ai-teacher.html
          grep -q "'(?:html|json|css)'" cnc/tests/placement-first-step-offline-core-drift-smoke.cjs
          grep -q "'./homepage-refresh.css'" cnc/sw.js
          grep -q "'./homepage-refresh.css'" cnc/pwa-self-test.html
          git diff --check

      - name: 提交最小修复
        shell: bash
        run: |
          if git diff --quiet; then
            echo '未产生修复内容' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/ai-teacher.html cnc/tests/placement-first-step-offline-core-drift-smoke.cjs .github/workflows/cnc-home-refresh-regression-fix-bootstrap.yml
          git commit -m 'fix(cnc): 修复首页刷新后的构建与离线资源门禁'
          git push origin HEAD:chatgpt/cnc-home-refresh-regression-fix
