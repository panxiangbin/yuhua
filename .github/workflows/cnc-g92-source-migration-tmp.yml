name: CNC G92 source migration tmp

on:
  push:
    branches:
      - codex/cnc-g92-dual-semantic-boundary
    paths:
      - 'cnc/tests/_tmp-g92-dual-semantic-source-migration.py'
      - '.github/workflows/cnc-g92-source-migration-tmp.yml'

permissions:
  contents: write

jobs:
  migrate-g92-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate exact G92 source boundary
        run: python cnc/tests/_tmp-g92-dual-semantic-source-migration.py
      - name: Audit exact write scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if [ -n "$changed" ] && [ "$changed" != "cnc/gm-code-complete.js" ]; then
            echo "一次性迁移出现白名单外改动" >&2
            exit 1
          fi
      - name: Commit exact migration result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cnc/gm-code-complete.js; then
            echo "G92基础源已是目标状态"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnc/gm-code-complete.js
          git commit -m "fix(cnc): 收紧G92车铣双语义边界"
          git push origin "HEAD:${GITHUB_REF_NAME}"
