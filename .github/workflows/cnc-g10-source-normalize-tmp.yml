name: CNC G10 source normalize temporary

on:
  push:
    branches:
      - codex/cnc-g10-safe-write-boundary
    paths:
      - 'cnc/tests/_tmp-g10-source-fix.cjs'
      - '.github/workflows/cnc-g10-source-normalize-tmp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/cnc-g10-safe-write-boundary
          fetch-depth: 0

      - name: Apply exact G10 source fix
        run: node cnc/tests/_tmp-g10-source-fix.cjs

      - name: Commit only the intended CNC source file
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- cnc/gm-code-complete.js; then
            echo 'source already normalized'
            exit 0
          fi
          git diff --exit-code -- . ':(exclude)cnc/gm-code-complete.js' || {
            echo 'unexpected files changed' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/gm-code-complete.js
          git commit -m 'fix(cnc-trust): 直接修正G10基础目录边界'
          git push origin HEAD:codex/cnc-g10-safe-write-boundary
