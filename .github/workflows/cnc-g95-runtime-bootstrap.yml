name: CNC G95 runtime bootstrap

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g95-runtime-bootstrap.yml'

permissions:
  contents: write

jobs:
  g95-runtime-bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/cnc-g95-dual-semantics-pwa35'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped G95 runtime safety remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          gm_path = Path('cnc/gm-code-complete.js')
          aliases_path = Path('cnc/search-aliases.js')
          sw_path = Path('cnc/sw.js')
          build_path = Path('cnc/build-info.json')

          gm = gm_path.read_text(encoding='utf-8')
          g95_pattern = re.compile(r'  \{\n    "id": "kb-gcode-g95",.*?\n  \},\n(?=  \{\n  "id": "kb-gcode-g96")', re.S)
          replacement = '''  {
            "id": "kb-gcode-g95",
            "category": "G代码",
            "title": "G95 每转进给/动力刀具端面刚性攻丝（按当前CNC确认）",
            "code": "G95",
            "aliases": [
              "每转进给",
              "Feed per revolution",
              "动力刀具端面刚性攻丝",
              "Live Tooling Rigid Tap",
              "车铣差异"
            ],
            "summary": "G95不是跨机型同一含义：部分铣床/加工中心CNC把它作为每转进给模式；部分车床CNC可把它用于动力刀具端面刚性攻丝循环。必须先确认机床类型、当前CNC、G代码组别并核对机床厂原厂手册。",
            "usage": "若本机将G95定义为每转进给，先确认单位制、主轴状态、F地址单位和当前进给模式；若本机将G95定义为动力刀具端面刚性攻丝循环，先确认机床具备相应动力刀具与同步攻丝能力，并按原厂手册逐项核对主轴/动力刀具、C轴或夹紧条件、进给同步以及F/S/R/Z/X/Y/C/Q等地址是否适用及其含义。",
            "beginner": "看到G95先问：这是哪台机床、哪种CNC、哪个G代码组别？不要把铣床的每转进给写法直接照搬到车床，也不要把某款车床的刚性攻丝循环格式反套到其它系统。",
            "warning": "G95的语义、所属组、地址含义和前置条件会随机床类型与CNC变化。任何F/S/螺距/深度/位置等数值都必须由本机参数、刀具、工件、装夹和工艺条件确定；真实机床执行前必须核对当前CNC与机床厂原厂手册和现场安全规程，并按本机允许的图形检查、仿真、单段、低倍率或空运行等受控方式验证。",
            "example": "教学语义示意：部分铣床/加工中心CNC中G95表示每转进给；部分车床CNC中G95可能表示动力刀具端面刚性攻丝。两类程序不能互抄，具体格式以及F/S/R/Z/X/Y/C/Q等地址含义必须以当前CNC和机床厂原厂手册为准，不提供可直接照抄的固定参数。",
            "risk": "高",
            "tags": [
              "G95",
              "车铣差异",
              "每转进给",
              "动力刀具",
              "刚性攻丝",
              "当前CNC",
              "原厂手册"
            ]
          },
          '''
          gm, count = g95_pattern.subn(replacement, gm, count=1)
          if count != 1:
              raise SystemExit(f'G95基础条目匹配数量异常：{count}')
          if 'G95 F0.2' in gm:
              raise SystemExit('G95固定F0.2教学值仍残留')
          gm_path.write_text(gm, encoding='utf-8')

          aliases = aliases_path.read_text(encoding='utf-8')
          old_comment = '作为第二层防御保持G10/G28/G53/G92/G94/G96/G97/G98/G99边界一致；基础源本身仍必须通过独立可信度门禁。'
          new_comment = '作为第二层防御保持G10/G28/G53/G92/G94/G95/G96/G97/G98/G99边界一致；基础源本身仍必须通过独立可信度门禁。'
          if aliases.count(old_comment) != 1:
              raise SystemExit('高风险归一化器说明匹配异常')
          aliases = aliases.replace(old_comment, new_comment, 1)

          anchor = "  function normalizeG96(entry) {"
          if aliases.count(anchor) != 1:
              raise SystemExit('normalizeG96锚点匹配异常')
          g95_guard = '''  function normalizeG95(entry) {
            if (!entry || entry.id !== 'kb-gcode-g95') return entry;
            return Object.assign({}, entry, {
              title: 'G95 每转进给/动力刀具端面刚性攻丝（按当前CNC确认）',
              summary: 'G95不是跨机型同一含义：部分铣床/加工中心CNC把它作为每转进给模式；部分车床CNC可把它用于动力刀具端面刚性攻丝循环。必须先确认机床类型、当前CNC、G代码组别并核对机床厂原厂手册。',
              usage: '若本机将G95定义为每转进给，先确认单位制、主轴状态、F地址单位和当前进给模式；若本机将G95定义为动力刀具端面刚性攻丝循环，先确认机床具备相应动力刀具与同步攻丝能力，并按原厂手册逐项核对主轴/动力刀具、C轴或夹紧条件、进给同步以及F/S/R/Z/X/Y/C/Q等地址是否适用及其含义。',
              beginner: '看到G95先问：这是哪台机床、哪种CNC、哪个G代码组别？不要把铣床的每转进给写法直接照搬到车床，也不要把某款车床的刚性攻丝循环格式反套到其它系统。',
              warning: 'G95的语义、所属组、地址含义和前置条件会随机床类型与CNC变化。任何F/S/螺距/深度/位置等数值都必须由本机参数、刀具、工件、装夹和工艺条件确定；真实机床执行前必须核对当前CNC与机床厂原厂手册和现场安全规程，并按本机允许的图形检查、仿真、单段、低倍率或空运行等受控方式验证。',
              example: '教学语义示意：部分铣床/加工中心CNC中G95表示每转进给；部分车床CNC中G95可能表示动力刀具端面刚性攻丝。两类程序不能互抄，具体格式以及F/S/R/Z/X/Y/C/Q等地址含义必须以当前CNC和机床厂原厂手册为准，不提供可直接照抄的固定参数。',
              risk: '高',
              tags: ['G95','车铣差异','每转进给','动力刀具','刚性攻丝','当前CNC','原厂手册']
            });
          }

          '''
          aliases = aliases.replace(anchor, g95_guard + anchor, 1)

          old_catalog = "return value.map(function (entry) { return normalizeG99(normalizeG98(normalizeG97(normalizeG96(normalizeG94(normalizeG92(normalizeG53(normalizeG28(normalizeG10(entry))))))))); });"
          new_catalog = "return value.map(function (entry) { return normalizeG99(normalizeG98(normalizeG97(normalizeG96(normalizeG95(normalizeG94(normalizeG92(normalizeG53(normalizeG28(normalizeG10(entry)))))))))); });"
          if aliases.count(old_catalog) != 1:
              raise SystemExit('normalizeCatalog链匹配异常')
          aliases = aliases.replace(old_catalog, new_catalog, 1)

          old_version = "version: 'g10-g28-g53-g92-g94-g96-g97-g98-g99-boundary-7'"
          new_version = "version: 'g10-g28-g53-g92-g94-g95-g96-g97-g98-g99-boundary-8'"
          if aliases.count(old_version) != 1:
              raise SystemExit('安全归一化器版本匹配异常')
          aliases = aliases.replace(old_version, new_version, 1)

          export_anchor = '    normalizeG94: normalizeG94,\n    normalizeG96: normalizeG96,'
          export_replacement = '    normalizeG94: normalizeG94,\n    normalizeG95: normalizeG95,\n    normalizeG96: normalizeG96,'
          if aliases.count(export_anchor) != 1:
              raise SystemExit('normalizeG95导出锚点匹配异常')
          aliases = aliases.replace(export_anchor, export_replacement, 1)
          aliases_path.write_text(aliases, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          if sw.count("const BUILD = '20260810-pwa34';") != 1 or sw.count("const CACHE_REVISION = '20260810-learning34';") != 1:
              raise SystemExit('Service Worker当前构建号不是预期PWA34/learning34')
          sw = sw.replace("const BUILD = '20260810-pwa34';", "const BUILD = '20260810-pwa35';", 1)
          sw = sw.replace("const CACHE_REVISION = '20260810-learning34';", "const CACHE_REVISION = '20260810-learning35';", 1)
          sw_path.write_text(sw, encoding='utf-8')

          build = json.loads(build_path.read_text(encoding='utf-8'))
          if build.get('pwaBuild') != '20260810-pwa34' or build.get('cacheRevision') != '20260810-learning34':
              raise SystemExit(f"build-info当前构建号异常：{build.get('pwaBuild')} / {build.get('cacheRevision')}")
          build['pwaBuild'] = '20260810-pwa35'
          build['cacheRevision'] = '20260810-learning35'
          stage = str(build.get('contentStage') or '')
          if 'G95车铣双语义适用范围' not in stage:
              build['contentStage'] = stage + '+G95车铣双语义适用范围'
          build['generatedAt'] = '2026-08-10T23:05:00+08:00'
          build_path.write_text(json.dumps(build, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          checks = {
              'gm': gm_path.read_text(encoding='utf-8'),
              'aliases': aliases_path.read_text(encoding='utf-8'),
              'sw': sw_path.read_text(encoding='utf-8')
          }
          required = [
              (checks['gm'], '动力刀具端面刚性攻丝'),
              (checks['gm'], '当前CNC'),
              (checks['gm'], '机床厂原厂手册'),
              (checks['aliases'], 'function normalizeG95(entry)'),
              (checks['aliases'], 'boundary-8'),
              (checks['sw'], '20260810-pwa35'),
              (checks['sw'], '20260810-learning35')
          ]
          for text, token in required:
              if token not in text:
                  raise SystemExit(f'整改后缺少关键标记：{token}')
          PY

          if git diff --quiet -- cnc/gm-code-complete.js cnc/search-aliases.js cnc/sw.js cnc/build-info.json; then
            echo 'G95运行时整改已存在，无需重复提交。'
            exit 0
          fi
          git diff --check -- cnc/gm-code-complete.js cnc/search-aliases.js cnc/sw.js cnc/build-info.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/gm-code-complete.js cnc/search-aliases.js cnc/sw.js cnc/build-info.json
          git commit -m 'feat(cnc): 收紧 G95 车铣双语义边界'
          git push origin HEAD:${{ github.head_ref }}
