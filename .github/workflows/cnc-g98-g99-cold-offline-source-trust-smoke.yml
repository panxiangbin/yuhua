name: CNC G98 G99 cold offline source trust smoke
on:
  pull_request:
    paths:
      - 'cnc/gm-code-complete.js'
      - 'cnc/search-aliases.js'
      - 'cnc/sw.js'
      - 'cnc/build-info.json'
      - 'cnc/index.html'
      - 'cnc/tests/pwa-controller-test-helper.cjs'
      - 'cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs'
      - '.github/workflows/cnc-g98-g99-cold-offline-source-trust-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'cnc/gm-code-complete.js'
      - 'cnc/search-aliases.js'
      - 'cnc/sw.js'
      - 'cnc/build-info.json'
      - 'cnc/index.html'
      - 'cnc/tests/pwa-controller-test-helper.cjs'
      - 'cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs'
      - '.github/workflows/cnc-g98-g99-cold-offline-source-trust-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-g98-g99-cold-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove tested commit identity
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "tested_head=$tested_head"
          echo "expected_head=$expected_head"
          test "$tested_head" = "$expected_head"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize diagnostics
        run: |
          mkdir -p cnc/test-results/g98-g99-cold-offline-workflow
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          fs.writeFileSync('cnc/test-results/g98-g99-cold-offline-workflow/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            testedHead: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            eventSha: process.env.GITHUB_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            runId: process.env.GITHUB_RUN_ID,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Validate cold offline trust contract
        run: |
          node --check cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs
          node --check cnc/sw.js
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const test = fs.readFileSync('cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs', 'utf8');
          if (info.pwaBuild !== '20260811-pwa36' || info.cacheRevision !== '20260811-learning36') {
            throw new Error(`unexpected PWA36 marker: ${info.pwaBuild}/${info.cacheRevision}`);
          }
          if (!String(info.contentStage || '').includes('G98/G99车铣双语义适用范围') || !String(info.contentStage || '').includes('G96/G97恒线速/恒转速适用范围')) {
            throw new Error('build-info missing G96/G97 or G98/G99 trust stage');
          }
          for (const file of ["'./search-aliases.js'", "'./gm-code-complete.js'"]) {
            if (!sw.includes(file)) throw new Error(`Service Worker core cache missing: ${file}`);
          }
          for (const token of [
            "const PWA_BUILD = '20260811-pwa36'",
            "const CACHE_REVISION = '20260811-learning36'",
            "stage = 'cold-offline-g98-g99-source'",
            "stage = 'cold-offline-g98-g99-reload'",
            'context.setOffline(true)',
            'stopOriginServerForOfflineProof',
            'serverStoppedForOffline',
            'server.closeAllConnections',
            'originServerStopped: serverStoppedForOffline',
            'offlineProbeResult.resolved && offlineProbeResult.status === 204',
            'EXPECTED_OFFLINE_CONSOLE_ERROR',
            'coldOfflineConsoleWindow = true',
            'CRITICAL_OFFLINE_PATHS',
            'criticalOffline504.length',
            'expectedOfflineConsoleErrorCount',
            '浏览器出现非预期错误',
            'G98不是跨机型同一含义',
            'G99不是跨机型同一含义',
            '初始Z平面',
            'R平面',
            '每分钟进给',
            '每转进给',
            '原厂手册',
            '完整计划运动空间',
            'g10-g28-g53-g92-g93-g94-g95-g96-g97-g98-g99-boundary-9',
            'normalizeG98',
            'normalizeG99',
            'g98G99ColdOfflineSourceTrust: true',
            'g98G99ColdOfflineRuntimeTrust: true',
            'g98G99ColdOfflineReload: true'
          ]) {
            if (!test.includes(token)) throw new Error(`cold offline trust assertion missing: ${token}`);
          }
          for (const forbidden of [
            'G98比G99退得更高',
            'G99效率高，但要求R平面绝对安全',
            'G99效率高',
            'R平面绝对安全'
          ]) {
            if (!test.includes(forbidden)) throw new Error(`forbidden slogan assertion missing: ${forbidden}`);
          }
          if (/\.skip\s*\(/.test(test) || /process\.exit\s*\(0\)/.test(test)) {
            throw new Error('cold offline trust gate contains bypass');
          }
          NODE
      - name: Install Playwright runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 G98 G99 cold offline source trust smoke
        env:
          DEBUG: pw:browser
        run: node cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs
      - name: Prove tracked sources remain read-only
        if: always()
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=no)"
          if [ -n "$changed" ]; then
            echo "$changed"
            exit 1
          fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-g98-g99-cold-offline-${{ github.run_id }}
          path: |
            cnc/test-results/g98-g99-cold-offline-*
          if-no-files-found: error
          retention-days: 14
