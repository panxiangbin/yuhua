name: CNC cutter compensation risk simulator smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-simulator-cutter-comp-risk-smoke.yml'
  workflow_dispatch:

jobs:
  cutter-comp-risk-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check cnc/tests/mobile-simulator-cutter-comp-risk-smoke.cjs
      - name: Start static server
        run: python3 -m http.server 4173 --directory . > /tmp/cnc-server.log 2>&1 &
      - name: Verify static server readiness
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:4173/cnc/simulator-cutter-comp-risk.html \
            > /dev/null || { cat /tmp/cnc-server.log; exit 1; }
      - name: Chromium 390x844 cutter compensation risk simulator
        run: node cnc/tests/mobile-simulator-cutter-comp-risk-smoke.cjs
      - name: Upload cutter compensation risk diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cutter-compensation-risk-simulator-diagnostics
          path: artifacts/simulator-cutter-comp-risk/
          if-no-files-found: warn
          retention-days: 7
