name: CNC Pages PWA15 contract sync

on:
  pull_request:
    paths:
      - 'cnc/tests/pages-*-deployment-smoke.cjs'
      - '.github/workflows/cnc-pages-pwa15-contract-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-pages-pwa15-contract-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'chatgpt/cnc-learning-mobile-accordion-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize current and previous Pages contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs'),
              Path('cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs'),
              Path('cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs'),
          ]

          for file in files:
              text = file.read_text(encoding='utf-8')
              original = text
              text, count = re.subn(
                  r"const previousPublicSiteBuild = '20260804-mobile-home1';",
                  "const previousPublicSiteBuild = '20260806-learning-depth1';",
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f'{file}: previous public site build replacement count={count}')

              text, count = re.subn(
                  r"if \(build === previousPublicPwaBuild\) return (EXACT_CORE(?:_PATHS)?)\.filter\(item => !LEARNING_DEPTH_CORE_PATHS\.has\(item\)\);",
                  r"if (build === previousPublicPwaBuild) return \1;",
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f'{file}: previous public core replacement count={count}')

              if file.name.startswith('pages-ai-teacher'):
                  replacements = {
                      'PWA13会刷新AI老师学习档案异常保护': 'PWA15会刷新80个图文小课、紧凑学习目录与AI老师学习档案异常保护',
                      'PWA14用于刷新80个图文小课与AI老师学习档案异常保护': 'PWA15用于刷新80个图文小课、紧凑学习目录与AI老师学习档案异常保护',
                  }
                  for old, new in replacements.items():
                      if text.count(old) != 1:
                          raise RuntimeError(f'{file}: expected exactly one visible-copy token {old!r}, got {text.count(old)}')
                      text = text.replace(old, new)

              if text == original:
                  raise RuntimeError(f'{file}: no changes made')
              file.write_text(text, encoding='utf-8')
              print(f'updated {file}')
          PY

          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          grep -R "previousPublicSiteBuild = '20260804-mobile-home1'" cnc/tests/pages-*-deployment-smoke.cjs && exit 1 || true
          grep -R "PWA13会刷新\|PWA14用于刷新80个图文小课" cnc/tests/pages-*-deployment-smoke.cjs && exit 1 || true
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check
      - name: Commit deployment contract fixes
        run: |
          if [ -z "$(git status --porcelain -- cnc/tests/pages-*-deployment-smoke.cjs)" ]; then
            echo 'Pages PWA15 contracts already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          git commit -m 'fix(cnc-pages): align PWA14 and PWA15 deployment contracts'
          git push origin HEAD:chatgpt/cnc-learning-mobile-accordion-20260806
