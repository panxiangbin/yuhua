name: CNC AI teacher handoff accessibility smoke

on:
  pull_request:
    paths:
      - 'cnc/ai-teacher.html'
      - 'cnc/ai-teacher-explainability.html'
      - 'cnc/tests/mobile-ai-teacher-handoff-accessibility-smoke.cjs'
      - 'cnc/tests/mobile-ai-teacher-handoff-recovery-smoke.cjs'
      - 'cnc/tests/mobile-ai-teacher-explainability-smoke.cjs'
      - 'cnc/tests/mobile-ai-teacher-smoke.cjs'
      - 'cnc/tests/ai-teacher-classification-smoke.cjs'
      - 'cnc/docs/ai-teacher-handoff-accessibility-contract.md'
      - '.github/workflows/cnc-ai-teacher-handoff-accessibility-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'cnc/ai-teacher.html'
      - 'cnc/ai-teacher-explainability.html'
      - 'cnc/tests/mobile-ai-teacher-handoff-accessibility-smoke.cjs'
      - 'cnc/tests/mobile-ai-teacher-handoff-recovery-smoke.cjs'
      - 'cnc/docs/ai-teacher-handoff-accessibility-contract.md'
      - '.github/workflows/cnc-ai-teacher-handoff-accessibility-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnc-ai-teacher-handoff-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  handoff-accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested head
        env:
          EXPECTED_TESTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_TESTED_HEAD"
          mkdir -p artifacts/ai-teacher-handoff-accessibility
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$actual" "$EXPECTED_TESTED_HEAD" > artifacts/ai-teacher-handoff-accessibility/identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate accessibility test and anti-bypass contract
        run: |
          set -euxo pipefail
          test -f cnc/tests/mobile-ai-teacher-handoff-accessibility-smoke.cjs
          test -f cnc/docs/ai-teacher-handoff-accessibility-contract.md
          node --check cnc/tests/mobile-ai-teacher-handoff-accessibility-smoke.cjs
          node --check cnc/tests/mobile-ai-teacher-handoff-recovery-smoke.cjs
          node --check cnc/tests/mobile-ai-teacher-explainability-smoke.cjs
          node --check cnc/tests/mobile-ai-teacher-smoke.cjs
          node --check cnc/tests/ai-teacher-classification-smoke.cjs
          grep -q 'role="status"' cnc/ai-teacher-explainability.html
          grep -q 'role="region"' cnc/ai-teacher-explainability.html
          grep -q 'aria-labelledby="result-title"' cnc/ai-teacher-explainability.html
          grep -q 'aria-describedby="result-reason"' cnc/ai-teacher-explainability.html
          grep -q 'aria-describedby="question-help"' cnc/ai-teacher-explainability.html
          grep -q 'tabindex="-1"' cnc/ai-teacher-explainability.html
          grep -q "focusNode('result-title')" cnc/ai-teacher-explainability.html
          grep -q "focusNode('handoff-note')" cnc/ai-teacher-explainability.html
          grep -q 'pageshow.persisted === true' cnc/docs/ai-teacher-handoff-accessibility-contract.md
          grep -q '相同版本原厂手册' cnc/docs/ai-teacher-handoff-accessibility-contract.md
          ! grep -Eq "test\.skip\(|describe\.skip\(|it\.skip\(|process\.exit\(0\)" cnc/tests/mobile-ai-teacher-handoff-accessibility-smoke.cjs
          ! grep -Eqi "allowOperationalUse: true|跳过原厂手册|关闭联锁" cnc/docs/ai-teacher-handoff-accessibility-contract.md
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start isolated CNC static server
        run: |
          cat > /tmp/cnc-ai-teacher-handoff-accessibility-server.py <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

          class CncHandler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.split('?', 1)[0] == '/favicon.ico':
                      self.send_response(204)
                      self.end_headers()
                      return
                  super().do_GET()

          ThreadingHTTPServer(('127.0.0.1', 4173), CncHandler).serve_forever()
          PY
          python3 /tmp/cnc-ai-teacher-handoff-accessibility-server.py > /tmp/cnc-ai-teacher-handoff-accessibility-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/cnc/ai-teacher-explainability.html >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/cnc-ai-teacher-handoff-accessibility-server.log
          exit 1
      - name: Regress AI teacher mobile trust boundary
        run: node cnc/tests/mobile-ai-teacher-smoke.cjs
      - name: Regress classification samples
        run: node cnc/tests/ai-teacher-classification-smoke.cjs
      - name: Regress one-time handoff consumer
        run: node cnc/tests/mobile-ai-teacher-explainability-smoke.cjs
      - name: Regress BFCache, storage failure and tab isolation
        run: node cnc/tests/mobile-ai-teacher-handoff-recovery-smoke.cjs
      - name: Validate screen reader semantics and focus on 390x844 mobile
        run: node cnc/tests/mobile-ai-teacher-handoff-accessibility-smoke.cjs
      - name: Upload handoff accessibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-handoff-accessibility-${{ github.run_id }}
          path: |
            artifacts/ai-teacher/
            artifacts/ai-teacher-explainability/
            artifacts/ai-teacher-handoff-recovery/
            artifacts/ai-teacher-handoff-accessibility/
            /tmp/cnc-ai-teacher-handoff-accessibility-server.log
          if-no-files-found: warn
          retention-days: 14
