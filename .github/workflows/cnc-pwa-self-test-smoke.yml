name: CNC PWA self-test smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-self-test-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pwa-self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: node --check cnc/tests/mobile-pwa-self-test-smoke.cjs
      - name: Validate self-test contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const html = fs.readFileSync('cnc/pwa-self-test.html', 'utf8');
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const placement = fs.readFileSync('cnc/beginner-placement.html', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild || !html.includes(`const EXPECTED='${info.pwaBuild}'`)) {
            throw new Error('PWA self-test/build-info/Service Worker version mismatch');
          }
          if (info.pwaBuild !== '20260802-pwa7') throw new Error(`unexpected PWA build: ${info.pwaBuild}`);
          for (const token of [
            'Service Worker已注册',
            '当前页面已被接管',
            '运行构建号一致',
            '静态缓存版本存在',
            '运行时缓存版本存在',
            '核心离线资源完整',
            '公网构建标记与PWA一致',
            './beginner-placement.html',
            './ai-teacher.html',
            './ai-teacher-intake.html',
            './ai-teacher-explainability.html',
            '关键安全门禁'
          ]) {
            if (!html.includes(token)) throw new Error(`self-test contract missing: ${token}`);
          }
          if (!placement.includes('criticalFailures') || !placement.includes("decision:'critical-safety'")) throw new Error('beginner placement critical safety gate missing');
          if (!String(info.contentStage || '').includes('起点测评关键安全门禁')) throw new Error('build marker missing critical safety gate');
          NODE
      - name: Install Playwright runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 PWA self-test smoke
        env:
          DEBUG: pw:browser
        run: node cnc/tests/mobile-pwa-self-test-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-self-test-${{ github.run_id }}
          path: cnc/test-results/pwa-self-test-*
          if-no-files-found: warn
          retention-days: 14
