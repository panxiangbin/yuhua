name: CNC PWA self-test smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-self-test-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pwa-self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize diagnostics
        run: |
          mkdir -p cnc/test-results/pwa-self-test-workflow
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const testedHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          fs.writeFileSync('cnc/test-results/pwa-self-test-workflow/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            testedHead,
            eventSha: process.env.GITHUB_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Check JavaScript syntax
        run: node --check cnc/tests/mobile-pwa-self-test-smoke.cjs
      - name: Validate self-test contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const html = fs.readFileSync('cnc/pwa-self-test.html', 'utf8');
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const placement = fs.readFileSync('cnc/beginner-placement.html', 'utf8');
          const camp = fs.readFileSync('cnc/training-camp.html', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          const swCache = sw.match(/const CACHE_REVISION = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild || swCache !== info.cacheRevision || !html.includes(`const EXPECTED='${info.pwaBuild}'`) || !html.includes(`const EXPECTED_CACHE='${info.cacheRevision}'`)) {
            throw new Error('PWA self-test/build-info/Service Worker build or cache revision mismatch');
          }
          if (info.pwaBuild !== '20260818-pwa54') throw new Error(`unexpected PWA build: ${info.pwaBuild}`);
          if (info.cacheRevision !== '20260818-learning54') throw new Error(`unexpected cache revision: ${info.cacheRevision}`);
          for (const token of [
            'Service Worker已注册',
            '当前页面已被接管',
            '运行构建号一致',
            '静态缓存版本存在',
            '运行时缓存版本存在',
            '核心离线资源完整',
            '公网构建标记与PWA一致',
            './index.html',
            './mobile-home-refactor.css',
            './personal-home.js',
            './training-practice.js',
            './training-profile.js',
            './search-aliases.js',
            './gm-code-complete.js',
            './learning-content-data.js',
            './learning-sublesson-catalog.js',
            './learning-sublesson-specificity.js',
            './learning-depth.css',
            './learning-detail.html',
            './beginner-placement.html',
            './training-camp.html',
            './course-safety-foundation.html',
            './course-coordinate-axes.html',
            './course-g00-g01-basics.html',
            './ai-teacher.html',
            './ai-teacher-intake.html',
            './ai-teacher-explainability.html',
            './assets/images/batch02_operation_basics/machine-init-flow-001.webp',
            './assets/videos/learning/stage01_safety.mp4',
            './assets/videos/learning/stage02_xyz.mp4',
            './assets/videos/learning/stage03_z_tool.mp4',
            './assets/videos/learning/stage04_program.mp4',
            './assets/videos/learning/stage05_g90_g91.mp4',
            './assets/videos/learning/stage06_g00_g01.mp4',
            './assets/videos/learning/stage07_sf.mp4',
            './assets/videos/learning/stage08_g02_g03.mp4',
            './assets/videos/learning/stage09_milling_direction.mp4',
            './assets/videos/learning/stage10_g41_g42.mp4',
            './assets/videos/learning/stage11_g81_g83.mp4',
            './assets/videos/learning/stage12_first_part.mp4',
            '关键安全门禁',
            '三类测评首步课程',
            '练习达到80分只能作为能力证据',
            '必须同时完成当天目标课程的真实通关记录',
            '才能增加训练天数、连续训练和20 XP',
            '当天训练目标在完成前后保持稳定',
            '不能假定轨迹必然为固定直线或固定折线',
            '不能把“先Z后XY”教成所有机床通用规则',
            '12关主课程数据',
            'T/H刀长补偿映射适用范围',
            'G/M代码可信目录',
            'G10可编程数据写入适用范围',
            'G90/G91绝对或增量解释',
            '备份原数据',
            '授权人员确认',
            'G28参考点返回适用范围',
            '高风险自动运动',
            'G90/G91下中间位置的绝对或增量解释',
            '当前CNC和机床厂原厂手册',
            '完整计划运动空间',
            '不要把G91 G28 Z0或固定“先Z后XY”当成通用防撞规则',
            'G53机床坐标定位适用范围',
            '高风险机床坐标运动',
            '机床坐标零点',
            '刀补及其它补偿影响',
            '不能把Z0、换刀点或固定机械坐标当成跨机床通用安全点',
            'G92车铣双语义适用范围',
            '部分铣床/加工中心',
            '部分车床',
            '两类程序不能直接互抄',
            'G52/G54-G59',
            'X/Z或U/W',
            'I/Q/F',
            '主轴同步',
            'G93反时间进给适用范围',
            'G94车铣双语义适用范围',
            'G93/G94/G95',
            '公制/英制',
            'F的单位',
            'K/F',
            '返回/退刀路径',
            'G98/G99车铣双语义适用范围',
            '不能把“G98一定更高”',
            'G99一定更低、更快、更安全',
            '固定循环',
            '初始平面',
            'R平面',
            '每分钟进给',
            '每转进给',
            'G代码组别',
            '教学格式示意不得直接作为真实机床参数'
          ]) {
            if (!html.includes(token)) throw new Error(`self-test contract missing: ${token}`);
          }
          if (!placement.includes('criticalFailures') || !placement.includes("decision:'critical-safety'")) throw new Error('beginner placement critical safety gate missing');
          if (!placement.includes('cnc_beginner_placement_route_handoff_v1') || !camp.includes('cnc_beginner_placement_route_handoff_v1')) throw new Error('placement route handoff producer or consumer missing');
          for (const stage of ['起点测评关键安全门禁','训练营路线离线核心','测评首步课程离线核心','正式课程开发占位清零','AI老师学习档案异常保护','80个图文小课','学习目录紧凑布局','80课现场动作与风险针对性','训练题库与成长档案离线核心','手机构建标记一致性','固定12关能力映射与真实薄弱课推荐','AI老师与固定12关成长档案语义一致','每日训练薄弱课错题精准回流','固定12关60题真实80分与关键题硬门禁','AI老师课程完成以真实完成记录为准','成长档案今日训练奖励以真实课程完成记录为准','G00快速定位与安全撤离适用范围','12关主课程数据首次安装离线核心','T/H刀长补偿映射适用范围','G10可编程数据写入适用范围','G/M代码首次安装离线核心','G28参考点返回适用范围','G53机床坐标定位适用范围','G92车铣双语义适用范围','G93反时间进给适用范围','G94车铣双语义适用范围','G98/G99车铣双语义适用范围']) {
            if (!String(info.contentStage || '').includes(stage)) throw new Error(`build marker missing: ${stage}`);
          }
          NODE
      - name: Install Playwright runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 PWA self-test smoke
        env:
          DEBUG: pw:browser
        run: node cnc/tests/mobile-pwa-self-test-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-self-test-${{ github.run_id }}
          path: cnc/test-results/pwa-self-test-*
          if-no-files-found: error
          retention-days: 14
