name: CNC AI teacher integrity runtime keys controlled fix

on:
  pull_request:
    paths:
      - 'cnc/ai-teacher.html'
      - 'cnc/tests/apply_ai_teacher_integrity_runtime_keys_fix.py'
      - '.github/workflows/cnc-ai-teacher-integrity-runtime-keys-controlled-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-ai-teacher-integrity-runtime-keys-controlled-fix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  controlled-fix:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_TESTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_TESTED_HEAD }}
          fetch-depth: 0

      - name: Verify exact PR head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_TESTED_HEAD"
          mkdir -p artifacts/ai-teacher-integrity-runtime-keys-fix
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$actual" "$EXPECTED_TESTED_HEAD" > artifacts/ai-teacher-integrity-runtime-keys-fix/identity.json

      - name: Configure bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply exact CNC fix
        run: |
          set -euo pipefail
          python3 cnc/tests/apply_ai_teacher_integrity_runtime_keys_fix.py | tee artifacts/ai-teacher-integrity-runtime-keys-fix/generator.log

      - name: Audit exact scope and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}" > artifacts/ai-teacher-integrity-runtime-keys-fix/changed-files.txt
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'cnc/ai-teacher.html'
          python3 - <<'PY'
          from pathlib import Path
          text=Path('cnc/ai-teacher.html').read_text(encoding='utf-8')
          assert text.count("const KEYS = Object.freeze({\n    study:'cnc_study_completed_v1'") == 1
          script=text.split('<script data-integrity-runtime-v1>',1)[1].split('</script>',1)[0]
          Path('/tmp/ai-teacher-integrity-runtime.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/ai-teacher-integrity-runtime.js
          git diff --check
          git diff -- cnc/ai-teacher.html > artifacts/ai-teacher-integrity-runtime-keys-fix/fix.patch

      - name: Commit and push target-only fix
        shell: bash
        run: |
          set -euo pipefail
          git add cnc/ai-teacher.html
          git commit -m 'CNC：修复AI老师完整性运行时键映射'
          child="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          printf '{"parent":"%s","child":"%s"}\n' "$parent" "$child" > artifacts/ai-teacher-integrity-runtime-keys-fix/commit.json
          test "$parent" = "$EXPECTED_TESTED_HEAD"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload controlled-fix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-integrity-runtime-keys-fix-${{ github.run_id }}
          path: artifacts/ai-teacher-integrity-runtime-keys-fix/
          if-no-files-found: error
