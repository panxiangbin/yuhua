name: CNC main course catalog drift smoke

on:
  pull_request:
    paths:
      - 'cnc/personal-home.js'
      - 'cnc/learning-sublesson-catalog.js'
      - 'cnc/learning-detail.html'
      - 'cnc/learning-depth.css'
      - 'cnc/training-camp.html'
      - 'cnc/ai-teacher.html'
      - 'cnc/course-*.html'
      - 'cnc/tests/main-course-catalog-drift-smoke.cjs'
      - 'cnc/tests/learning-depth-smoke.cjs'
      - 'cnc/docs/main-course-catalog-drift-contract.md'
      - '.github/workflows/cnc-main-course-catalog-drift-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'cnc/personal-home.js'
      - 'cnc/learning-sublesson-catalog.js'
      - 'cnc/learning-detail.html'
      - 'cnc/learning-depth.css'
      - 'cnc/training-camp.html'
      - 'cnc/ai-teacher.html'
      - 'cnc/course-*.html'
      - 'cnc/tests/main-course-catalog-drift-smoke.cjs'
      - 'cnc/tests/learning-depth-smoke.cjs'
      - 'cnc/docs/main-course-catalog-drift-contract.md'
      - '.github/workflows/cnc-main-course-catalog-drift-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-main-course-catalog-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/cnc-learning-depth-mainline-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-learning-depth-mainline-20260806
          fetch-depth: 0
      - name: Apply exact PWA14 gate repairs
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'cnc/tests/mobile-home-smoke.cjs',
              "    assert.match((await page.locator('.study-card[data-level=\"10\"] p').textContent()) || '', /最小输入单位/);",
              """    const g0203Summary = (await page.locator('.study-card[data-level=\"10\"] p').textContent()) || '';
    for (const token of ['加工平面', '方向', '圆心', '半径']) {
      assert.match(g0203Summary, new RegExp(token), `G02/G03课程摘要必须保留${token}技术边界`);
    }"""
          )
          replace_once(
              'cnc/tests/mobile-home-smoke.cjs',
              "    await page.waitForFunction(() => document.querySelectorAll('#view-study .study-card[data-level] .study-card-thumb').length === 12, null, { timeout: 15000 });",
              """    await page.waitForFunction(() => document.querySelectorAll('#view-study .study-card[data-level] .study-card-thumb').length === 12, null, { timeout: 15000 });
    await page.waitForFunction(() => window.CNC_LEARNING_SUBLESSONS?.version === '20260805-learning-depth1', null, { timeout: 15000 });
    const learningSafety = await page.evaluate(() => window.CNC_LEARNING_SUBLESSONS.safety || '');
    assert.match(learningSafety, /机床说明书/, '80课必须要求核对机床说明书');
    assert.match(learningSafety, /现场工艺/, '80课必须要求核对现场工艺');
    assert.match(learningSafety, /空运行验证/, '80课必须要求空运行验证');"""
          )
          replace_once(
              'cnc/tests/mobile-ai-teacher-smoke.cjs',
              "    await page.waitForFunction(() => window.CNC_AI_TEACHER?.build === '20260804-mobile-home1');",
              "    await page.waitForFunction(() => window.CNC_AI_TEACHER?.build === '20260806-learning-depth1');"
          )
          replace_once(
              '.github/workflows/cnc-ai-teacher-smoke.yml',
              'grep -q "20260804-mobile-home1" cnc/ai-teacher.html',
              'grep -q "20260806-learning-depth1" cnc/ai-teacher.html'
          )

          core_old = """  './personal-home.js',
  './mobile-trust-nav.js',"""
          core_new = """  './personal-home.js',
  './learning-sublesson-catalog.js',
  './learning-depth.css',
  './learning-detail.html',
  './mobile-trust-nav.js',"""
          for path in [
              'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
              'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
              'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
          ]:
              replace_once(path, core_old, core_new)

          replace_once(
              'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
              """const previousPublicPwaBuild = '20260804-pwa13';
const expectedSiteBuild = '20260806-learning-depth1';""",
              """const previousPublicPwaBuild = '20260804-pwa13';
const expectedSiteBuild = '20260806-learning-depth1';
const previousPublicSiteBuild = '20260804-mobile-home1';"""
          )
          replace_once(
              'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
              """  if (data.app !== 'cnc-training-platform') throw new Error(`${label}应用标识错误：${data.app}`);
  if (data.build !== expectedSiteBuild) throw new Error(`${label}站点构建错误：${data.build}`);
  assertAllowedBuild(data.pwaBuild, label);
  const expectedCache = expectedCacheRevision(data.pwaBuild, label);""",
              """  if (data.app !== 'cnc-training-platform') throw new Error(`${label}应用标识错误：${data.app}`);
  assertAllowedBuild(data.pwaBuild, label);
  const controlledSiteBuild = data.pwaBuild === branchTargetPwaBuild ? expectedSiteBuild : previousPublicSiteBuild;
  if (data.build !== controlledSiteBuild) throw new Error(`${label}站点构建错误：${data.build}，期望${controlledSiteBuild}`);
  const expectedCache = expectedCacheRevision(data.pwaBuild, label);"""
          )
          PY

          node --check cnc/tests/mobile-home-smoke.cjs
          node --check cnc/tests/mobile-ai-teacher-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          ! grep -Eq "test\.skip\(|describe\.skip\(|it\.skip\(|process\.exit\(0\)" \
            cnc/tests/mobile-home-smoke.cjs \
            cnc/tests/mobile-ai-teacher-smoke.cjs \
            cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs \
            cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs \
            cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs

      - name: Restore read-only workflow and commit repairs
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/cnc-pwa14-gate-repair.yml
          cat > .github/workflows/cnc-main-course-catalog-drift-smoke.yml <<'YAML'
          name: CNC main course catalog drift smoke

          on:
            pull_request:
              paths:
                - 'cnc/personal-home.js'
                - 'cnc/learning-sublesson-catalog.js'
                - 'cnc/learning-detail.html'
                - 'cnc/learning-depth.css'
                - 'cnc/training-camp.html'
                - 'cnc/ai-teacher.html'
                - 'cnc/course-*.html'
                - 'cnc/tests/main-course-catalog-drift-smoke.cjs'
                - 'cnc/tests/learning-depth-smoke.cjs'
                - 'cnc/docs/main-course-catalog-drift-contract.md'
                - '.github/workflows/cnc-main-course-catalog-drift-smoke.yml'
            push:
              branches: [main]
              paths:
                - 'cnc/personal-home.js'
                - 'cnc/learning-sublesson-catalog.js'
                - 'cnc/learning-detail.html'
                - 'cnc/learning-depth.css'
                - 'cnc/training-camp.html'
                - 'cnc/ai-teacher.html'
                - 'cnc/course-*.html'
                - 'cnc/tests/main-course-catalog-drift-smoke.cjs'
                - 'cnc/tests/learning-depth-smoke.cjs'
                - 'cnc/docs/main-course-catalog-drift-contract.md'
                - '.github/workflows/cnc-main-course-catalog-drift-smoke.yml'
            workflow_dispatch:

          permissions:
            contents: read

          concurrency:
            group: cnc-main-course-catalog-drift-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: false

          jobs:
            audit:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 24
                - name: Validate syntax, learning depth and Chinese contract
                  run: |
                    set -euxo pipefail
                    node --check cnc/personal-home.js
                    node --check cnc/learning-sublesson-catalog.js
                    node --check cnc/tests/main-course-catalog-drift-smoke.cjs
                    node --check cnc/tests/learning-depth-smoke.cjs
                    grep -q '12关' cnc/docs/main-course-catalog-drift-contract.md
                    grep -q '三端' cnc/docs/main-course-catalog-drift-contract.md
                    grep -q 'AI CNC 老师' cnc/docs/main-course-catalog-drift-contract.md
                    grep -q '原厂手册' cnc/docs/main-course-catalog-drift-contract.md
                    grep -q '授权人员确认' cnc/docs/main-course-catalog-drift-contract.md
                    grep -q '教学参考，需按机床说明书、现场工艺和空运行验证' cnc/learning-sublesson-catalog.js
                    ! grep -Eq "test\.skip\(|describe\.skip\(|it\.skip\(|process\.exit\(0\)" cnc/tests/main-course-catalog-drift-smoke.cjs cnc/tests/learning-depth-smoke.cjs
                - name: Verify fixed 12-stage catalog and 80 sublessons
                  run: |
                    node cnc/tests/learning-depth-smoke.cjs
                    node cnc/tests/main-course-catalog-drift-smoke.cjs
                - name: Reject incomplete diagnostics
                  run: |
                    node - <<'NODE'
                    const fs = require('fs');
                    const report = JSON.parse(fs.readFileSync('cnc/test-results/main-course-catalog-drift/report.json', 'utf8'));
                    if (!report.passed) throw new Error(`12关目录报告未通过：${JSON.stringify(report.errors)}`);
                    if (report.homeCatalog.length !== 12 || report.trainingCampCatalog.length !== 12 || report.aiTeacherCourseLinks.length !== 12 || report.canonicalCourses.length !== 12) {
                      throw new Error(`12关目录覆盖不足：${JSON.stringify({home: report.homeCatalog.length, camp: report.trainingCampCatalog.length, aiTeacher: report.aiTeacherCourseLinks.length, canonical: report.canonicalCourses.length})}`);
                    }
                    for (const key of ['stageIdsAndOrderMatch','entryFilesMatch','aiTeacherCourseLinksMatch','aiTeacherRecommendationUsesCatalog','titlesCompatible','allTargetsExist','redirectAliasesControlled','canonicalTargetsUnique','learningDepthCatalog','sublessonImagesExist','sublessonSafetyBoundaries','pullRequestAndMainPushPathsSymmetric','requiredTriggerPathsCovered','readOnlyPermissions','noCancellation']) {
                      if (report.checks[key] !== true) throw new Error(`12关目录检查缺失或失败：${key}`);
                    }
                    if (report.checks.totalSublessons !== 80 || report.sublessonCounts['1'] !== 10 || report.sublessonCounts['2'] !== 10) {
                      throw new Error(`学习深度不足：${JSON.stringify({total:report.checks.totalSublessons, stage1:report.sublessonCounts['1'], stage2:report.sublessonCounts['2']})}`);
                    }
                    NODE
                - name: Upload catalog diagnostics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: cnc-main-course-catalog-drift-${{ github.run_id }}
                    path: cnc/test-results/main-course-catalog-drift/**
                    if-no-files-found: error
                    retention-days: 14
          YAML

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/cnc-main-course-catalog-drift-smoke.yml \
            .github/workflows/cnc-ai-teacher-smoke.yml \
            .github/workflows/cnc-pwa14-gate-repair.yml \
            cnc/tests/mobile-home-smoke.cjs \
            cnc/tests/mobile-ai-teacher-smoke.cjs \
            cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs \
            cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs \
            cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          git diff --cached --check
          git commit -m "test(cnc): 同步PWA14课程与AI老师门禁"
          git push origin HEAD:chatgpt/cnc-learning-depth-mainline-20260806

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate syntax, learning depth and Chinese contract
        run: |
          set -euxo pipefail
          node --check cnc/personal-home.js
          node --check cnc/learning-sublesson-catalog.js
          node --check cnc/tests/main-course-catalog-drift-smoke.cjs
          node --check cnc/tests/learning-depth-smoke.cjs
          grep -q '12关' cnc/docs/main-course-catalog-drift-contract.md
          grep -q '三端' cnc/docs/main-course-catalog-drift-contract.md
          grep -q 'AI CNC 老师' cnc/docs/main-course-catalog-drift-contract.md
          grep -q '原厂手册' cnc/docs/main-course-catalog-drift-contract.md
          grep -q '授权人员确认' cnc/docs/main-course-catalog-drift-contract.md
          grep -q '教学参考，需按机床说明书、现场工艺和空运行验证' cnc/learning-sublesson-catalog.js
          ! grep -Eq "test\.skip\(|describe\.skip\(|it\.skip\(|process\.exit\(0\)" cnc/tests/main-course-catalog-drift-smoke.cjs cnc/tests/learning-depth-smoke.cjs
      - name: Verify fixed 12-stage catalog and 80 sublessons
        run: |
          node cnc/tests/learning-depth-smoke.cjs
          node cnc/tests/main-course-catalog-drift-smoke.cjs
      - name: Reject incomplete diagnostics
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('cnc/test-results/main-course-catalog-drift/report.json', 'utf8'));
          if (!report.passed) throw new Error(`12关目录报告未通过：${JSON.stringify(report.errors)}`);
          if (report.homeCatalog.length !== 12 || report.trainingCampCatalog.length !== 12 || report.aiTeacherCourseLinks.length !== 12 || report.canonicalCourses.length !== 12) {
            throw new Error(`12关目录覆盖不足：${JSON.stringify({home: report.homeCatalog.length, camp: report.trainingCampCatalog.length, aiTeacher: report.aiTeacherCourseLinks.length, canonical: report.canonicalCourses.length})}`);
          }
          for (const key of ['stageIdsAndOrderMatch','entryFilesMatch','aiTeacherCourseLinksMatch','aiTeacherRecommendationUsesCatalog','titlesCompatible','allTargetsExist','redirectAliasesControlled','canonicalTargetsUnique','learningDepthCatalog','sublessonImagesExist','sublessonSafetyBoundaries','pullRequestAndMainPushPathsSymmetric','requiredTriggerPathsCovered','readOnlyPermissions','noCancellation']) {
            if (report.checks[key] !== true) throw new Error(`12关目录检查缺失或失败：${key}`);
          }
          if (report.checks.totalSublessons !== 80 || report.sublessonCounts['1'] !== 10 || report.sublessonCounts['2'] !== 10) {
            throw new Error(`学习深度不足：${JSON.stringify({total:report.checks.totalSublessons, stage1:report.sublessonCounts['1'], stage2:report.sublessonCounts['2']})}`);
          }
          NODE
      - name: Upload catalog diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-main-course-catalog-drift-${{ github.run_id }}
          path: cnc/test-results/main-course-catalog-drift/**
          if-no-files-found: error
          retention-days: 14
