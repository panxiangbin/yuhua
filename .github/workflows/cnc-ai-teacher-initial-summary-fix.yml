name: CNC AI teacher initial summary exact fix

on:
  push:
    branches:
      - chatgpt/cnc-ai-teacher-data-integrity-mainline

permissions:
  contents: write

concurrency:
  group: cnc-ai-teacher-initial-summary-exact-fix
  cancel-in-progress: false

jobs:
  exact-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前PR最新头
        uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-ai-teacher-data-integrity-mainline
          fetch-depth: 0

      - name: 精确修复公开摘要异常阻断
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('cnc/ai-teacher.html')
          text = page.read_text(encoding='utf-8')
          old = """  if(window.CNC_AI_TEACHER){
    const originalGetSummary=window.CNC_AI_TEACHER.getSummary;
    window.CNC_AI_TEACHER.dataIntegrity={inspect:inspectLearningData,get status(){return inspectLearningData().ok?'ok':'blocked'}};
    window.CNC_AI_TEACHER.getSummary=()=>{
      const integrity=inspectLearningData();
      if(!integrity.ok)return {integrity:'blocked',invalidKeys:integrity.invalid.map(item=>item.key),courses:null,wrong:null,simulations:null,weakest:null};
      return originalGetSummary();
    };
  }
"""
          new = """  function blockedSummary(integrity){
    return {integrity:'blocked',invalidKeys:integrity.invalid.map(item=>item.key),courses:null,wrong:null,simulations:null,weakest:null};
  }

  if(window.CNC_AI_TEACHER){
    const originalGetSummary=window.CNC_AI_TEACHER.getSummary;
    window.CNC_AI_TEACHER.dataIntegrity={inspect:inspectLearningData,get status(){return inspectLearningData().ok?'ok':'blocked'}};
    if(!initialIntegrity.ok)window.CNC_AI_TEACHER.initialSummary=blockedSummary(initialIntegrity);
    window.CNC_AI_TEACHER.getSummary=()=>{
      const integrity=inspectLearningData();
      if(!integrity.ok)return blockedSummary(integrity);
      return originalGetSummary();
    };
  }
"""
          if text.count(old) != 1:
              raise SystemExit(f'目标代码块数量异常：{text.count(old)}，拒绝修改')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: 静态核验且不降低门禁
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('cnc/ai-teacher.html').read_text(encoding='utf-8')
          test = Path('cnc/tests/ai-teacher-data-integrity-smoke.cjs').read_text(encoding='utf-8')
          required_page = [
              "function blockedSummary(integrity)",
              "initialSummary=blockedSummary(initialIntegrity)",
              "if(!integrity.ok)return blockedSummary(integrity)",
              "courses:null,wrong:null,simulations:null,weakest:null",
          ]
          required_test = [
              "initialSummary",
              "integrity",
              "blocked",
              "courses",
              "wrong",
              "simulations",
              "weakest",
          ]
          missing = [item for item in required_page if item not in page]
          missing_test = [item for item in required_test if item not in test]
          if missing or missing_test:
              raise SystemExit(f'公开摘要阻断核验失败 page={missing} test={missing_test}')
          PY
          git diff --check

      - name: 删除一次性写入工作流并提交
        shell: bash
        run: |
          git rm .github/workflows/cnc-ai-teacher-initial-summary-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnc/ai-teacher.html
          git diff --cached --quiet && { echo '没有可提交的精确修复'; exit 1; }
          git commit -m "fix(cnc): 阻断AI老师公开摘要伪零进度"
          git push origin HEAD:chatgpt/cnc-ai-teacher-data-integrity-mainline
