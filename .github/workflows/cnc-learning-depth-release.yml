name: CNC learning depth release preparation

on:
  pull_request:
    paths:
      - 'cnc/tools/learning-depth-payload.zip'
      - 'cnc/personal-home.js'
      - 'cnc/learning-sublesson-catalog.js'
      - 'cnc/learning-detail.html'
      - 'cnc/learning-depth.css'
      - 'cnc/tests/learning-depth-smoke.cjs'
      - '.github/workflows/cnc-learning-depth-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-learning-depth-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/learning-depth-refactor-20260805'
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Restore learning depth payload
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zipfile import ZipFile, BadZipFile

          payload = Path('cnc/tools/learning-depth-payload.zip')
          expected = {
              'cnc/personal-home.js',
              'cnc/learning-sublesson-catalog.js',
              'cnc/learning-detail.html',
              'cnc/learning-depth.css',
              'cnc/tests/main-course-catalog-drift-smoke.cjs',
              'cnc/tests/learning-depth-smoke.cjs',
              'cnc/LEARNING_DEPTH_PROGRESS.md',
          }

          if payload.exists():
              try:
                  with ZipFile(payload, 'r') as archive:
                      members = set(archive.namelist())
                      bad_member = archive.testzip()
                      if bad_member:
                          raise RuntimeError(f'Payload ZIP CRC failed: {bad_member}')
                      missing = sorted(expected - members)
                      if missing:
                          raise RuntimeError(f'Payload ZIP missing files: {missing}')
                      archive.extractall(Path('.'))
              except BadZipFile as error:
                  raise RuntimeError(f'Payload ZIP is invalid: {error}') from error
              payload.unlink()
              print('Learning depth payload restored:')
              for item in sorted(expected):
                  path = Path(item)
                  if not path.is_file() or path.stat().st_size == 0:
                      raise RuntimeError(f'Restored file missing or empty: {item}')
                  print(f'  {item} ({path.stat().st_size} bytes)')
          else:
              print('Payload already restored; verifying target files.')
              for item in sorted(expected):
                  path = Path(item)
                  if not path.is_file() or path.stat().st_size == 0:
                      raise RuntimeError(f'Target file missing after prior restore: {item}')
                  print(f'  {item} ({path.stat().st_size} bytes)')
          '@ | python -

      - name: Synchronize PWA13 learning depth release
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import re

          current='20260804-pwa12'
          target='20260805-pwa13'
          old_cache='20260804-mobile12'
          new_cache='20260805-learning13'
          root=Path('cnc')
          changed=[]

          for file in root.rglob('*'):
              if not file.is_file() or file.suffix.lower() not in {'.js','.cjs','.json','.html','.md'}:
                  continue
              if 'node_modules' in file.parts or 'test-results' in file.parts or 'docs' in file.parts:
                  continue
              text=file.read_text(encoding='utf-8')
              updated=text.replace(current,target)
              if file.as_posix()=='cnc/tests/mobile-pwa-upgrade-data-smoke.cjs':
                  updated=re.sub(r"const PREVIOUS_PWA_BUILD = '[^']+';","const PREVIOUS_PWA_BUILD = '20260804-pwa12';",updated,count=1)
              if updated!=text:
                  file.write_text(updated,encoding='utf-8')
                  changed.append(str(file))

          sw=Path('cnc/sw.js')
          text=sw.read_text(encoding='utf-8')
          updated=text.replace(old_cache,new_cache)
          marker="  './personal-home.js',"
          additions="\n  './learning-sublesson-catalog.js',\n  './learning-depth.css',\n  './learning-detail.html',"
          if './learning-sublesson-catalog.js' not in updated and marker in updated:
              updated=updated.replace(marker,marker+additions)
          if updated!=text:
              sw.write_text(updated,encoding='utf-8')
              if str(sw) not in changed: changed.append(str(sw))

          info_path=Path('cnc/build-info.json')
          info=json.loads(info_path.read_text(encoding='utf-8'))
          desired={
              'build':'20260805-learning-depth1',
              'pwaBuild':target,
              'learningBuild':'20260805-learning-depth1',
              'cacheRevision':new_cache,
              'contentStage':'课程12关 · 80个图文小课 · 第1/2关各10课 · 手机首页一屏化 · 学习与查询图片 · AI CNC老师 · PWA可靠性'
          }
          if any(info.get(k)!=v for k,v in desired.items()):
              info.update(desired)
              info['generatedAt']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
              info_path.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              if str(info_path) not in changed: changed.append(str(info_path))

          print(f'learning depth PWA sync: {len(changed)} files')
          for file in changed: print(file)
          '@ | python -

          node --check cnc/sw.js
          node --check cnc/personal-home.js
          node --check cnc/learning-sublesson-catalog.js
          node --check cnc/tests/main-course-catalog-drift-smoke.cjs
          node --check cnc/tests/learning-depth-smoke.cjs
          node cnc/tests/learning-depth-smoke.cjs
          node cnc/tests/main-course-catalog-drift-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check

          if (git status --porcelain) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A cnc
            git commit -m 'feat(cnc-learning): add 80 expandable image lessons'
            git push origin HEAD:codex/learning-depth-refactor-20260805
          } else {
            Write-Host 'Learning depth and PWA13 already synchronized.'
          }
