name: Yuhua public deployment freshness

on:
  pull_request:
    paths:
      - 'index.html'
      - 'catalog.html'
      - '404.html'
      - 'model/**'
      - 'sitemap.xml'
      - 'styles.css'
      - 'app.js'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - '.github/workflows/yuhua-public-site-freshness.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'catalog.html'
      - '404.html'
      - 'model/**'
      - 'sitemap.xml'
      - 'styles.css'
      - 'app.js'
      - 'assets/customer-tools.js'
      - 'assets/customer-tools.css'
      - '.github/workflows/yuhua-public-site-freshness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Compare deployed core files with repository source
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/yuhua-public-freshness-report.txt"
          exec > >(tee -a "${REPORT}") 2>&1

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            EXPECTED_REF="$(curl -fsSL --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${BASE_REF}" | jq -r '.sha')"
            MAX_ATTEMPTS=1
          else
            EXPECTED_REF="${GITHUB_SHA}"
            MAX_ATTEMPTS=48
          fi

          RAW_BASE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${EXPECTED_REF}"
          PUBLIC_BASE="https://panxiangbin.github.io/yuhua"
          FILES=(
            "index.html"
            "catalog.html"
            "404.html"
            "sitemap.xml"
            "styles.css"
            "app.js"
            "assets/customer-tools.js"
            "assets/customer-tools.css"
          )

          while IFS= read -r model_path; do
            [[ -n "${model_path}" ]] && FILES+=("${model_path}")
          done < <(
            curl -fsSL --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/model?ref=${EXPECTED_REF}" \
              | jq -r '.[] | select(.type == "file" and (.name | endswith(".html"))) | .path' \
              | sort
          )

          echo "Expected source commit: ${EXPECTED_REF}"
          echo "Checking ${#FILES[@]} public files without cloning the ~1.2 GB repository."

          # Download immutable source copies once. During a slow Pages rollout, only
          # public files that are still stale need to be fetched again.
          for path in "${FILES[@]}"; do
            expected="/tmp/expected-${path//\//-}"
            curl -fsSL --retry 3 --retry-delay 2 \
              "${RAW_BASE}/${path}" -o "${expected}"
          done

          PENDING_FILES=("${FILES[@]}")
          matched=0
          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "Public deployment check attempt ${attempt}/${MAX_ATTEMPTS}"
            NEXT_PENDING=()

            for path in "${PENDING_FILES[@]}"; do
              expected="/tmp/expected-${path//\//-}"
              actual="/tmp/actual-${path//\//-}"

              curl -fsSL --retry 3 --retry-delay 2 \
                -H 'Cache-Control: no-cache' \
                "${PUBLIC_BASE}/${path}?source=${EXPECTED_REF}&attempt=${attempt}" -o "${actual}"

              if ! cmp -s "${expected}" "${actual}"; then
                NEXT_PENDING+=("${path}")
                echo "Mismatch: ${path}"
                echo "  expected sha256: $(sha256sum "${expected}" | awk '{print $1}')"
                echo "  public   sha256: $(sha256sum "${actual}" | awk '{print $1}')"
              else
                echo "Match: ${path}"
              fi
            done

            if [[ "${#NEXT_PENDING[@]}" -eq 0 ]]; then
              matched=1
              break
            fi

            PENDING_FILES=("${NEXT_PENDING[@]}")
            if [[ "${attempt}" -lt "${MAX_ATTEMPTS}" ]]; then
              echo "Pages may still be propagating; ${#PENDING_FILES[@]} file(s) remain stale. Retrying in 15 seconds."
              sleep 15
            fi
          done

          if [[ "${matched}" -ne 1 ]]; then
            echo "::error::Public GitHub Pages content does not match expected repository source ${EXPECTED_REF}."
            printf 'Still stale after retries: %s\n' "${PENDING_FILES[*]}"
            echo "First lines of the public and expected home pages:"
            diff -u <(sed -n '1,120p' /tmp/expected-index.html) <(sed -n '1,120p' /tmp/actual-index.html) || true
            exit 1
          fi

          if ! grep -Fq 'smxpxb008@gmail.com' /tmp/actual-index.html; then
            echo "::error::Allowed public sales email is missing from deployed index.html."
            exit 1
          fi
          if grep -Fqi 'href="tel:' /tmp/actual-index.html || \
             grep -Fqi "href='tel:" /tmp/actual-index.html || \
             grep -Eqi 'weixin://|wechat://' /tmp/actual-index.html; then
            echo "::error::Disallowed phone/WeChat contact link found on deployed index.html."
            exit 1
          fi

          echo "Public deployment matches ${EXPECTED_REF} for all checked customer-critical files."

      - name: Upload public deployment freshness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-public-deployment-freshness-report
          path: ${{ runner.temp }}/yuhua-public-freshness-report.txt
          if-no-files-found: warn
