name: CNC training profile nested integrity PWA49 controlled sync

on:
  pull_request:
    paths:
      - 'cnc/tests/apply_training_profile_nested_integrity_pwa49.py'
      - '.github/workflows/cnc-training-profile-nested-integrity-pwa49-controlled-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact temporary head
        shell: bash
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$tested" = "$expected"
          mkdir -p /tmp/cnc-pwa49-sync
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$tested" "$expected" > /tmp/cnc-pwa49-sync/identity.json
      - name: Configure controlled commit identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Generate nested-integrity and PWA49 CNC changes
        shell: bash
        run: |
          set -euo pipefail
          python3 cnc/tests/apply_training_profile_nested_integrity_pwa49.py 2>&1 | tee /tmp/cnc-pwa49-sync/generator.log
      - name: Audit generated scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/cnc-pwa49-sync/files.txt
          test -s /tmp/cnc-pwa49-sync/files.txt
          if grep -Ev '^cnc/' /tmp/cnc-pwa49-sync/files.txt; then
            echo '受控生成越出cnc/**范围' >&2
            exit 1
          fi
          if grep -E '^cnc/(docs/|test-results/)' /tmp/cnc-pwa49-sync/files.txt; then
            echo '受控生成不得修改历史文档或自动诊断产物' >&2
            exit 1
          fi
          node --check cnc/training-profile.js
          node --check cnc/tests/mobile-daily-training-plan-smoke.cjs
          node --check cnc/tests/mobile-training-profile-smoke.cjs
          node -e "const i=require('./cnc/build-info.json'); if(i.pwaBuild!=='20260817-pwa49'||i.cacheRevision!=='20260817-learning49') process.exit(1)"
          git diff --stat > /tmp/cnc-pwa49-sync/stat.txt
          git diff > /tmp/cnc-pwa49-sync/generated.patch
      - name: Create and push controlled CNC child commit
        shell: bash
        run: |
          set -euo pipefail
          git add cnc
          git commit -m 'CNC：阻断共享成长档案嵌套异常覆盖并同步PWA49'
          child="$(git rev-parse HEAD)"
          parent="$(git rev-parse HEAD^)"
          printf '{"child":"%s","parent":"%s"}\n' "$child" "$parent" > /tmp/cnc-pwa49-sync/commit.json
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
      - name: Upload controlled generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-training-profile-nested-integrity-pwa49-${{ github.run_id }}
          path: /tmp/cnc-pwa49-sync/*
          if-no-files-found: error
          retention-days: 14
