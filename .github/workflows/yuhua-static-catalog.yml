name: Yuhua static catalog index check

on:
  pull_request:
    paths:
      - 'index.html'
      - 'catalog.html'
      - 'products.json'
      - 'assets/data.js'
      - 'specs_index.json'
      - 'sitemap.xml'
      - 'model/*.html'
      - 'tools/audit_public_catalog_runtime.py'
      - '.github/workflows/yuhua-static-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'catalog.html'
      - 'products.json'
      - 'assets/data.js'
      - 'specs_index.json'
      - 'sitemap.xml'
      - 'model/*.html'
      - 'tools/audit_public_catalog_runtime.py'
      - '.github/workflows/yuhua-static-catalog.yml'

permissions:
  contents: read

jobs:
  verify-static-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static counts, links, accessibility and contact policy
        run: |
          python - <<'PY'
          import json
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlparse

          from tools.audit_public_catalog_runtime import load_window_array

          source_products = json.loads(Path('products.json').read_text(encoding='utf-8'))
          public_products = load_window_array(Path('assets/data.js'), 'PRODUCTS')
          specs = json.loads(Path('specs_index.json').read_text(encoding='utf-8'))
          html = Path('catalog.html').read_text(encoding='utf-8')
          index_html = Path('index.html').read_text(encoding='utf-8')

          expected = {
              'product-records': len(public_products),
              'modeled-records': sum(1 for item in public_products if str(item.get('型号') or '').strip()),
              'spec-records': len(specs),
          }
          for key, value in expected.items():
              match = re.search(rf'data-{key}="(\d+)"', html)
              assert match, f'missing data-{key} in catalog.html'
              actual = int(match.group(1))
              assert actual == value, f'data-{key} is stale: page={actual}, public-runtime={value}'
              assert f'<b>{value}</b>' in html, f'visible count {value} is missing from catalog.html'

          index_hero_count = re.search(r'<b id="stat-models">(\d+)\+</b>\s*<span>产品目录记录</span>', index_html)
          assert index_hero_count, 'homepage hero must label the counter as product catalog records'
          assert int(index_hero_count.group(1)) == len(source_products), (
              f'homepage hero fallback is stale: page={index_hero_count.group(1)}, source={len(source_products)}'
          )

          index_product_count = re.search(r'<b id="totalCount">(\d+)</b>', index_html)
          assert index_product_count, 'static totalCount fallback is missing from index.html'
          assert int(index_product_count.group(1)) == len(source_products), (
              f'index product count is stale: page={index_product_count.group(1)}, source={len(source_products)}'
          )
          index_spec_count = re.search(r'<b id="specCount">(\d+)</b>', index_html)
          assert index_spec_count, 'static specCount fallback is missing from index.html'
          assert int(index_spec_count.group(1)) == len(specs), (
              f'index spec count is stale: page={index_spec_count.group(1)}, source={len(specs)}'
          )
          assert 'href="catalog.html"' in index_html, 'index.html must expose the static catalog link'

          expected_email = 'smxpxb008@gmail.com'
          assert expected_email in html and f'mailto:{expected_email}' in html, 'approved sales email is missing'
          assert 'tel:' not in html.lower(), 'telephone link is not allowed'
          assert '微信' not in html, 'WeChat wording is not allowed'
          assert not re.search(r'(?<!\d)1[3-9]\d{9}(?!\d)', html), 'possible mobile phone number found'

          assert re.search(r'<a[^>]+class="skip-link"[^>]+href="#main-content"', html), (
              'catalog.html must provide a skip link to #main-content'
          )
          assert re.search(r'<main[^>]+id="main-content"', html), (
              'catalog.html must expose #main-content on the main element'
          )
          assert ':focus-visible' in html, 'catalog.html must keep a visible keyboard focus style'

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'a':
                      href = dict(attrs).get('href')
                      if href: self.hrefs.append(href)

          parser = LinkParser(); parser.feed(html)
          catalog_paths = set()
          for href in parser.hrefs:
              if href.startswith(('mailto:', 'http://', 'https://', '#')):
                  continue
              path = urlparse(href).path
              if not path or path == './':
                  continue
              assert Path(path).exists(), f'broken local link in catalog.html: {href}'

              normalized = unquote(path).lstrip('/')
              if normalized.startswith('yuhua/'):
                  normalized = normalized.removeprefix('yuhua/')
              catalog_paths.add(normalized)

          model_pages = sorted(
              path.as_posix()
              for path in Path('model').glob('*.html')
              if path.is_file()
          )
          assert model_pages, 'no standalone model/*.html pages found'
          missing_model_links = [path for path in model_pages if path not in catalog_paths]
          assert not missing_model_links, (
              'catalog.html is missing standalone model page links: '
              + ', '.join(missing_model_links)
          )

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert 'https://panxiangbin.github.io/yuhua/catalog.html' in sitemap, 'catalog.html is missing from sitemap.xml'
          print('Static catalog public-runtime index: OK', expected)
          print('Homepage static fallback: OK', {'products': len(source_products), 'specs': len(specs)})
          print('Static catalog accessibility baseline: OK')
          print(f'Standalone model coverage in catalog.html: OK ({len(model_pages)}/{len(model_pages)})')
          PY
