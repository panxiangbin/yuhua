name: Canonical Pilot Apply Once

on:
  push:
    branches: [upgrade-84h]
    paths:
      - ".github/workflows/canonical-pilot-apply-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade-84h
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify current branch and clean checkout
        run: |
          test "$(git branch --show-current)" = "upgrade-84h"
          test -z "$(git status --porcelain)"
      - name: Enforce no direct contact policy before change
        run: |
          node scripts/check-no-direct-contact.cjs
          node scripts/audit-public-contact-leaks.cjs
      - name: Apply verified canonical pilot
        run: node scripts/apply-canonical-pilot.cjs --write
      - name: Verify exact canonical values
        run: |
          grep -Fq '<link rel="canonical" href="https://www.gyyuhua.cn/cnc/cnc_program_checker_optimizer.html" />' cnc/cnc_program_checker_optimizer.html
          grep -Fq '<link rel="canonical" href="https://www.gyyuhua.cn/cnc/cnc-calculator-suite.html" />' cnc/cnc-calculator-suite.html
          test "$(grep -Eic '<link[^>]+rel=["'"']canonical["'"']' cnc/cnc_program_checker_optimizer.html)" -eq 1
          test "$(grep -Eic '<link[^>]+rel=["'"']canonical["'"']' cnc/cnc-calculator-suite.html)" -eq 1
      - name: Run canonical and safety regression
        run: |
          node scripts/check-no-direct-contact.cjs
          node scripts/audit-public-contact-leaks.cjs
          node scripts/audit-canonical-links.cjs
          node scripts/classify-canonical-page-types.cjs
          node scripts/build-self-canonical-plan.cjs
          node scripts/audit-self-canonical-plan-integrity.cjs
      - name: Restrict changes to approved files
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'cnc/cnc-calculator-suite.html' 'cnc/cnc_program_checker_optimizer.html' | sort)"
          test "$changed" = "$expected"
      - name: Remove one-shot workflow and commit pilot
        run: |
          rm .github/workflows/canonical-pilot-apply-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnc/cnc_program_checker_optimizer.html cnc/cnc-calculator-suite.html .github/workflows/canonical-pilot-apply-once.yml
          git commit -m "seo: add canonical links to two CNC tools"
          git push origin HEAD:upgrade-84h
