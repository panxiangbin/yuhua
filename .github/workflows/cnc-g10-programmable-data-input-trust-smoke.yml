name: CNC G10 programmable data input trust smoke

on:
  push:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g10-programmable-data-input-trust-smoke.yml'
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g10-programmable-data-input-trust-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g10-programmable-data-input-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "exact head: $actual"

      - name: Reject bypass patterns
        shell: bash
        run: |
          set -euo pipefail
          test_file='cnc/tests/g10-programmable-data-input-trust-smoke.cjs'
          test -f "$test_file"
          if grep -nE 'test\.skip|describe\.skip|it\.skip|process\.exit\(0\)' "$test_file"; then
            echo '发现会绕过G10可信度门禁的跳过模式' >&2
            exit 1
          fi

      - name: Run G10 programmable data input trust smoke
        run: node cnc/tests/g10-programmable-data-input-trust-smoke.cjs
