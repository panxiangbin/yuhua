name: CNC PWA13 exact reference sync

on:
  push:
    branches:
      - chatgpt/cnc-ai-teacher-data-integrity-mainline
    paths:
      - '.github/workflows/cnc-pwa13-exact-sync.yml'

permissions:
  contents: write

concurrency:
  group: cnc-pwa13-exact-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-ai-teacher-data-integrity-mainline
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 精确同步PWA13主动构建针与缓存修订
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f'{path}: 期望精确出现 {expected} 次，实际 {actual} 次：{old!r}')
              write(path, text.replace(old, new))

          # 冷离线测试：构建号与缓存修订分开核验。
          offline = 'cnc/tests/mobile-pwa-offline-cache-smoke.cjs'
          replace_exact(offline,
              "const PWA_BUILD = '20260804-pwa12';",
              "const PWA_BUILD = '20260804-pwa13';\nconst CACHE_REVISION = '20260804-mobile13';")
          text = read(offline)
          static_count = text.count('`cnc-static-${PWA_BUILD}`')
          runtime_count = text.count('`cnc-runtime-${PWA_BUILD}`')
          if static_count < 2 or runtime_count < 1:
              raise SystemExit(f'{offline}: 缓存名称引用数量异常 static={static_count} runtime={runtime_count}')
          text = text.replace('`cnc-static-${PWA_BUILD}`', '`cnc-static-${CACHE_REVISION}`')
          text = text.replace('`cnc-runtime-${PWA_BUILD}`', '`cnc-runtime-${CACHE_REVISION}`')
          write(offline, text)

          # 升级回归：PWA12 -> PWA13，并使用对应的mobile缓存修订。
          upgrade = 'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs'
          replace_exact(upgrade,
              "const CURRENT_PWA_BUILD = '20260804-pwa12';\nconst PREVIOUS_PWA_BUILD = '20260804-pwa11';\nconst CURRENT_STATIC_CACHE = `cnc-static-${CURRENT_PWA_BUILD}`;\nconst CURRENT_RUNTIME_CACHE = `cnc-runtime-${CURRENT_PWA_BUILD}`;\nconst PREVIOUS_STATIC_CACHE = `cnc-static-${PREVIOUS_PWA_BUILD}`;\nconst PREVIOUS_RUNTIME_CACHE = `cnc-runtime-${PREVIOUS_PWA_BUILD}`;",
              "const CURRENT_PWA_BUILD = '20260804-pwa13';\nconst PREVIOUS_PWA_BUILD = '20260804-pwa12';\nconst CURRENT_CACHE_REVISION = '20260804-mobile13';\nconst PREVIOUS_CACHE_REVISION = '20260804-mobile12';\nconst CURRENT_STATIC_CACHE = `cnc-static-${CURRENT_CACHE_REVISION}`;\nconst CURRENT_RUNTIME_CACHE = `cnc-runtime-${CURRENT_CACHE_REVISION}`;\nconst PREVIOUS_STATIC_CACHE = `cnc-static-${PREVIOUS_CACHE_REVISION}`;\nconst PREVIOUS_RUNTIME_CACHE = `cnc-runtime-${PREVIOUS_CACHE_REVISION}`;")

          # 三项Pages精确部署：PR目标PWA13，当前公网允许PWA12。
          replace_exact('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
              "const branchTargetPwaBuild = '20260804-pwa12';\nconst previousPublicPwaBuild = '20260803-pwa9';\nconst expectedSiteBuild = '20260804-home-refresh1';",
              "const branchTargetPwaBuild = '20260804-pwa13';\nconst previousPublicPwaBuild = '20260804-pwa12';\nconst expectedSiteBuild = '20260804-mobile-home1';")
          replace_exact('cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
              "const branchTargetPwaBuild = '20260804-pwa12';\nconst previousPublicPwaBuild = '20260803-pwa9';",
              "const branchTargetPwaBuild = '20260804-pwa13';\nconst previousPublicPwaBuild = '20260804-pwa12';")
          replace_exact('cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
              "const expectedSiteBuild = '20260804-home-refresh1';\nconst expectedPwaBuild = '20260804-pwa12';\nconst previousPublicPwaBuild = '20260803-pwa9';",
              "const expectedSiteBuild = '20260804-mobile-home1';\nconst expectedPwaBuild = '20260804-pwa13';\nconst previousPublicPwaBuild = '20260804-pwa12';")

          # 对应只读工作流中的主动参数同步；不修改历史文档。
          workflow_paths = [
              '.github/workflows/cnc-pwa-offline-cache-smoke.yml',
              '.github/workflows/cnc-pwa-upgrade-data-smoke.yml',
              '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml',
              '.github/workflows/cnc-beginner-placement-offline-pages-smoke.yml',
              '.github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml'
          ]
          for path in workflow_paths:
              text = read(path)
              original = text
              text = text.replace('20260804-pwa12', '20260804-pwa13')
              text = text.replace('20260804-pwa11', '20260804-pwa12')
              text = text.replace('20260803-pwa9', '20260804-pwa12')
              text = text.replace('20260804-home-refresh1', '20260804-mobile-home1')
              if text == original:
                  raise SystemExit(f'{path}: 没有发现需要同步的精确构建参数')
              write(path, text)
          PY
      - name: 语法、构建引用和差异审计
        run: |
          set -euxo pipefail
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check
      - name: 提交精确同步结果
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            cnc/tests/mobile-pwa-offline-cache-smoke.cjs \
            cnc/tests/mobile-pwa-upgrade-data-smoke.cjs \
            cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs \
            cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs \
            cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs \
            .github/workflows/cnc-pwa-offline-cache-smoke.yml \
            .github/workflows/cnc-pwa-upgrade-data-smoke.yml \
            .github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml \
            .github/workflows/cnc-beginner-placement-offline-pages-smoke.yml \
            .github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml
          git diff --cached --quiet && { echo '没有待提交的精确同步结果'; exit 1; }
          git commit -m 'test(cnc): 同步PWA13主动门禁与缓存修订'
          git push origin HEAD:chatgpt/cnc-ai-teacher-data-integrity-mainline
