name: One-off IMG_1678 poster cleanup

on:
  push:
    branches:
      - fix-img-1678-poster-20260921

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-img-1678-poster-20260921
          fetch-depth: 0

      - name: Apply deterministic cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          manifest_old = '  "file": "assets/videos/img_1678.mp4",\n  "poster": "assets/videos/img_1678.jpg"'
          manifest_new = '  "file": "assets/videos/img_1678.mp4"'

          for name in ('assets/videos.js', 'videos.json'):
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if text.count(manifest_old) != 1:
                  raise SystemExit(f'{name}: expected exactly one IMG_1678 stale poster block')
              text = text.replace(manifest_old, manifest_new, 1)
              p.write_text(text, encoding='utf-8')

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          fallback_old = '    "assets/videos/dji_20260115_143343_503_video.jpg": true,\n    "assets/videos/img_1678.jpg": true'
          fallback_new = '    "assets/videos/dji_20260115_143343_503_video.jpg": true'
          if text.count(fallback_old) != 1:
              raise SystemExit('index.html: expected exactly one IMG_1678 fallback block')
          text = text.replace(fallback_old, fallback_new, 1)
          old_cache = 'assets/videos.js?v=20260921e'
          new_cache = 'assets/videos.js?v=20260921f'
          if text.count(old_cache) != 1:
              raise SystemExit('index.html: expected exactly one current videos.js cache key')
          text = text.replace(old_cache, new_cache, 1)
          p.write_text(text, encoding='utf-8')

          data = json.loads(Path('videos.json').read_text(encoding='utf-8'))
          matches = [v for v in data if v.get('title') == 'IMG_1678']
          if len(matches) != 1:
              raise SystemExit('videos.json: IMG_1678 entry count changed unexpectedly')
          if matches[0].get('file') != 'assets/videos/img_1678.mp4':
              raise SystemExit('videos.json: IMG_1678 video file changed unexpectedly')
          if 'poster' in matches[0]:
              raise SystemExit('videos.json: stale IMG_1678 poster still present')

          js = Path('assets/videos.js').read_text(encoding='utf-8')
          html = Path('index.html').read_text(encoding='utf-8')
          for text_name, body in [('assets/videos.js', js), ('videos.json', Path('videos.json').read_text(encoding='utf-8')), ('index.html', html)]:
              if 'assets/videos/img_1678.jpg' in body:
                  raise SystemExit(f'{text_name}: stale IMG_1678 poster remains')
          if 'assets/videos/img_1678.mp4' not in js:
              raise SystemExit('assets/videos.js: IMG_1678 MP4 missing')
          if 'assets/videos/dji_20260115_143343_503_video.jpg' not in html:
              raise SystemExit('index.html: unrelated DJI fallback was removed')
          PY

          node --check assets/videos.js
          python -m json.tool videos.json >/dev/null

      - name: Commit minimal change and remove runner
        shell: bash
        run: |
          git rm .github/workflows/tmp-fix-img-1678.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' assets/videos.js index.html videos.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos.js videos.json index.html
          git commit -m "Fix stale IMG_1678 video poster reference"
          git push origin HEAD:fix-img-1678-poster-20260921
