name: CNC simulator hub smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-simulator-hub-smoke.yml'
  workflow_dispatch:

jobs:
  simulator-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check cnc/tests/mobile-simulator-hub-smoke.cjs
      - name: Start static server
        run: python3 -m http.server 4173 --directory . > /tmp/cnc-server.log 2>&1 &
      - name: Chromium 390x844 simulator hub
        run: node cnc/tests/mobile-simulator-hub-smoke.cjs
      - name: Upload simulator hub diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-hub-diagnostics
          path: artifacts/simulator-hub/
          if-no-files-found: warn
          retention-days: 7
