name: Yuhua conflicting model evidence trace

on:
  push:
    branches: [main]
    paths:
      - 'products.json'
      - 'assets/data.js'
      - 'specs_index.json'
      - 'specs/**'
      - 'tools/audit_conflicting_model_evidence_trace.py'
      - 'tools/audit_product_model_duplicate_conflicts.py'
      - '.github/workflows/yuhua-conflicting-model-evidence-trace.yml'
  pull_request:
    paths:
      - 'products.json'
      - 'assets/data.js'
      - 'specs_index.json'
      - 'specs/**'
      - 'tools/audit_conflicting_model_evidence_trace.py'
      - 'tools/audit_product_model_duplicate_conflicts.py'
      - '.github/workflows/yuhua-conflicting-model-evidence-trace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace-conflicting-model-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Self-test literal identity and conflict rules
        run: |
          python tools/audit_conflicting_model_evidence_trace.py --self-test
          python tools/audit_product_model_duplicate_conflicts.py --self-test

      - name: Generate review-only R-1005 regression trace
        run: |
          python tools/audit_conflicting_model_evidence_trace.py \
            --model R-1005 \
            --output audit-output/r1005-evidence-trace.json

      - name: Generate review-only trace for all current source conflicts
        run: |
          python tools/audit_conflicting_model_evidence_trace.py \
            --all-conflicts \
            --output audit-output/conflicting-model-evidence-trace.json

      - name: Validate report safety and coverage contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.audit_product_model_duplicate_conflicts import build_report

          r1005 = json.loads(Path('audit-output/r1005-evidence-trace.json').read_text(encoding='utf-8'))
          batch = json.loads(Path('audit-output/conflicting-model-evidence-trace.json').read_text(encoding='utf-8'))
          products = json.loads(Path('products.json').read_text(encoding='utf-8'))
          duplicate_report = build_report(products)

          assert r1005['target_model'] == 'R-1005'
          assert r1005['policy']['automatic_fix_authorized'] is False
          assert r1005['summary']['automatic_fix_authorized'] is False
          assert r1005['summary']['spec_page_read_error_count'] == 0
          assert isinstance(r1005['source']['conflicting_nonempty_values'], dict)
          assert isinstance(r1005['runtime']['rows'], list)
          assert r1005['policy']['specification_evidence_scope'].startswith('document/model identity')

          expected_conflicts = duplicate_report['summary']['conflicting_group_count']
          summary = batch['summary']
          assert batch['policy']['automatic_fix_authorized'] is False
          assert summary['automatic_fix_authorized'] is False
          assert summary['conflicting_model_count'] == expected_conflicts
          assert summary['traced_model_count'] == expected_conflicts
          assert len(batch['target_models']) == expected_conflicts
          assert len(batch['models']) == expected_conflicts
          assert len({model.strip().casefold() for model in batch['target_models']}) == expected_conflicts
          assert 'r-1005' in {model.strip().casefold() for model in batch['target_models']}
          assert summary['spec_page_read_error_count'] == 0

          for report in batch['models']:
              assert report['policy']['automatic_fix_authorized'] is False
              assert report['summary']['automatic_fix_authorized'] is False
              assert report['summary']['unresolved_source_conflict'] is True
              assert report['summary']['source_conflict_field_count'] > 0

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Confirm audited data stayed read-only
        run: git diff --exit-code -- products.json assets/data.js specs_index.json specs

      - name: Upload R-1005 regression trace
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-r1005-evidence-trace
          path: audit-output/r1005-evidence-trace.json
          retention-days: 90

      - name: Upload all conflicting-model evidence traces
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-conflicting-model-evidence-traces
          path: audit-output/conflicting-model-evidence-trace.json
          retention-days: 90
