name: CNC training profile practice integrity PWA50 controlled fix

on:
  pull_request:
    paths:
      - 'cnc/tests/apply_training_profile_practice_integrity_pwa50.py'
      - '.github/workflows/cnc-training-profile-practice-integrity-pwa50-controlled.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$tested" = "$expected"
      - name: Configure commit identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Apply scoped CNC patch
        shell: bash
        run: |
          set -euo pipefail
          python3 cnc/tests/apply_training_profile_practice_integrity_pwa50.py | tee /tmp/generator.log
      - name: Scope and syntax audit
        shell: bash
        run: |
          set -euo pipefail
          node --check cnc/training-profile.js
          node --check cnc/tests/mobile-daily-training-plan-smoke.cjs
          changed="$(git diff --name-only)"
          test -n "$changed"
          if echo "$changed" | grep -Ev '^(cnc/)' >/dev/null; then
            echo '受控生成越过 CNC 范围：' >&2
            echo "$changed" >&2
            exit 1
          fi
          if echo "$changed" | grep -E '^cnc/(test-results|test-artifacts)/' >/dev/null; then
            echo '受控生成不得提交测试产物' >&2
            exit 1
          fi
      - name: Create scoped child commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add cnc
          if git diff --cached --quiet; then
            echo '没有生成正式 CNC 改动' >&2
            exit 1
          fi
          git commit -m 'CNC：阻断共享练习档案嵌套异常并同步PWA50'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Push child commit
        shell: bash
        run: |
          set -euo pipefail
          branch="${{ github.event.pull_request.head.ref }}"
          if [ -z "$branch" ]; then
            echo '仅允许 PR head 受控推送' >&2
            exit 1
          fi
          git push origin "HEAD:$branch"
      - name: Preserve generation evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/cnc-pwa50-generation
          cp /tmp/generator.log /tmp/cnc-pwa50-generation/generator.log 2>/dev/null || true
          git rev-parse HEAD > /tmp/cnc-pwa50-generation/head.txt 2>/dev/null || true
          git status --short > /tmp/cnc-pwa50-generation/status.txt 2>/dev/null || true
          git show --stat --oneline HEAD > /tmp/cnc-pwa50-generation/stat.txt 2>/dev/null || true
          git show --format=fuller --patch HEAD > /tmp/cnc-pwa50-generation/patch.txt 2>/dev/null || true
      - name: Upload generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-training-profile-practice-integrity-pwa50-${{ github.run_id }}
          path: /tmp/cnc-pwa50-generation/*
          if-no-files-found: warn
          retention-days: 14
