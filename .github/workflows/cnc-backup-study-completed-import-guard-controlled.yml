name: CNC backup study completed import guard controlled apply

on:
  push:
    branches:
      - codex/cnc-backup-study-completed-risk-gate

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify tested head identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.sha }}"
          test "$actual" = "$expected"
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$actual" "$expected" > /tmp/identity.json
      - name: Apply controlled CNC patch
        run: python3 cnc/tests/apply_backup_study_completed_import_guard.py
      - name: Validate target scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'cnc/data-backup.html\ncnc/tests/mobile-data-backup-history-migration-smoke.cjs'
          node --check cnc/tests/mobile-data-backup-history-migration-smoke.cjs
          grep -q 'studyCompletedInvalidEntriesBlocked:true' cnc/tests/mobile-data-backup-history-migration-smoke.cjs
          grep -q '禁止自动恢复该项' cnc/data-backup.html
      - name: Commit controlled patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No controlled patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/data-backup.html cnc/tests/mobile-data-backup-history-migration-smoke.cjs
          git commit -m 'CNC：阻断损坏课程完成记录自动恢复'
          git push origin HEAD:${{ github.ref_name }}
      - name: Upload identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-backup-study-completed-import-guard-${{ github.run_id }}
          path: /tmp/identity.json
