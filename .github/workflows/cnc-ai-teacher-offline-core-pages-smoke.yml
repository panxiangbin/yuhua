name: CNC AI teacher offline core Pages smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-ai-teacher-offline-core-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize diagnostics
        run: |
          mkdir -p cnc/test-results/ai-teacher-offline-core-pages
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('cnc/test-results/ai-teacher-offline-core-pages/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            headSha: process.env.GITHUB_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Validate exact deployment contract
        run: |
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/sw.js
          node - <<'NODE'
          const fs = require('fs');
          const test = fs.readFileSync('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs', 'utf8');
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const status = fs.readFileSync('cnc/pwa-status.html', 'utf8');
          const selfTest = fs.readFileSync('cnc/pwa-self-test.html', 'utf8');
          const placement = fs.readFileSync('cnc/beginner-placement.html', 'utf8');
          const camp = fs.readFileSync('cnc/training-camp.html', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          const swCache = sw.match(/const CACHE_REVISION = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild) throw new Error(`Service Worker/build-info mismatch: ${swBuild} / ${info.pwaBuild}`);
          if (swCache !== info.cacheRevision) throw new Error(`Service Worker/build-info cache mismatch: ${swCache} / ${info.cacheRevision}`);
          if (info.build !== '20260806-learning-depth1') throw new Error(`unexpected site build: ${info.build}`);
          if (info.pwaBuild !== '20260807-pwa18' || info.cacheRevision !== '20260807-learning18') throw new Error(`unexpected branch build: ${info.pwaBuild}/${info.cacheRevision}`);
          for (const token of [
            "const branchTargetPwaBuild = '20260807-pwa18'",
            "const previousPublicPwaBuild = '20260807-pwa17'",
            "const expectedSiteBuild = '20260806-learning-depth1'",
            "[branchTargetPwaBuild]: '20260807-learning18'",
            "[previousPublicPwaBuild]: '20260807-learning17'",
            'CNC_PAGES_VERIFY_ATTEMPTS || 18',
            "cache: 'no-store'",
            'mainPagesExactBytesMatch: true',
            'mainPagesExactSha256Match: true',
            'branchDeploymentPending',
            'trainingPracticeInCoreCache: true',
            'trainingProfileInCoreCache: true',
            'beginnerPlacementInCoreCache: true',
            'placementRouteHandoffInBranch: true',
            'criticalSafetyGateInBranch: true',
            'coreResourceCount: EXACT_CORE_PATHS.length',
            'process.exit(1)'
          ]) {
            if (!test.includes(token)) throw new Error(`deployment test missing: ${token}`);
          }
          for (const file of [
            './training-practice.js','./training-profile.js','./beginner-placement.html','./training-camp.html','./learning-sublesson-specificity.js','./course-safety-foundation.html','./course-coordinate-axes.html','./course-g00-g01-basics.html','./ai-teacher.html','./ai-teacher-intake.html','./ai-teacher-explainability.html'
          ]) {
            if (!sw.includes(`'${file}'`)) throw new Error(`Service Worker core missing: ${file}`);
            if (!selfTest.includes(file)) throw new Error(`self-test core missing: ${file}`);
          }
          if (!placement.includes('criticalFailures') || !placement.includes("decision:'critical-safety'")) throw new Error('beginner placement critical safety gate missing');
          if (!placement.includes('cnc_beginner_placement_route_handoff_v1') || !camp.includes('cnc_beginner_placement_route_handoff_v1')) throw new Error('placement route handoff producer or consumer missing');
          if (!status.includes(`const EXPECTED='${info.pwaBuild}'`) || !status.includes(`const EXPECTED_CACHE='${info.cacheRevision}'`)) throw new Error('PWA status build/cache mismatch');
          if (!selfTest.includes(`const EXPECTED='${info.pwaBuild}'`) || !selfTest.includes(`const EXPECTED_CACHE='${info.cacheRevision}'`)) throw new Error('PWA self-test build/cache mismatch');
          for (const stage of ['起点测评关键安全门禁','起点测评离线核心','测评路线一次性交接','训练营路线离线核心','测评首步课程离线核心','正式课程开发占位清零','AI老师现场问诊单','AI老师判断说明','AI老师离线核心','AI老师学习档案异常保护','80个图文小课','80课现场动作与风险针对性','训练题库与成长档案离线核心','手机构建标记一致性']) {
            if (!String(info.contentStage || '').includes(stage)) throw new Error(`build marker missing: ${stage}`);
          }
          for (const forbidden of ['test.skip(', 'describe.skip(', 'it.skip(', 'process.exit(0)', 'CNC_PAGES_VERIFY_ATTEMPTS || 0']) {
            if (test.includes(forbidden)) throw new Error(`deployment gate bypass found: ${forbidden}`);
          }
          NODE
      - name: Verify main and Pages exact deployment
        env:
          CNC_PAGES_VERIFY_ATTEMPTS: 18
          CNC_PAGES_VERIFY_INTERVAL_MS: 10000
        run: node cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-offline-core-pages-${{ github.run_id }}
          path: cnc/test-results/ai-teacher-offline-core-pages/**
          if-no-files-found: error
          retention-days: 14
