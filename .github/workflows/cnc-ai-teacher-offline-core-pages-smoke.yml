name: CNC AI teacher offline core Pages smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-ai-teacher-offline-core-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize diagnostics
        run: |
          mkdir -p cnc/test-results/ai-teacher-offline-core-pages
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const testedHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          fs.writeFileSync('cnc/test-results/ai-teacher-offline-core-pages/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            testedHead,
            eventSha: process.env.GITHUB_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Validate exact deployment contract
        run: |
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/sw.js
          node - <<'NODE'
          const fs = require('fs');
          const test = fs.readFileSync('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs', 'utf8');
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const status = fs.readFileSync('cnc/pwa-status.html', 'utf8');
          const selfTest = fs.readFileSync('cnc/pwa-self-test.html', 'utf8');
          const placement = fs.readFileSync('cnc/beginner-placement.html', 'utf8');
          const camp = fs.readFileSync('cnc/training-camp.html', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          const swCache = sw.match(/const CACHE_REVISION = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild) throw new Error(`Service Worker/build-info mismatch: ${swBuild} / ${info.pwaBuild}`);
          if (swCache !== info.cacheRevision) throw new Error(`Service Worker/build-info cache mismatch: ${swCache} / ${info.cacheRevision}`);
          if (info.build !== '20260806-learning-depth1') throw new Error(`unexpected site build: ${info.build}`);
          if (info.pwaBuild !== '20260813-pwa42' || info.cacheRevision !== '20260813-learning42') throw new Error(`unexpected branch build: ${info.pwaBuild}/${info.cacheRevision}`);
          for (const token of [
            "const branchTargetPwaBuild = '20260813-pwa42'",
            "const controlledPublicPwaBuild = '20260811-pwa37'",
            "const expectedSiteBuild = '20260806-learning-depth1'",
            "[branchTargetPwaBuild]: '20260813-learning42'",
            "[controlledPublicPwaBuild]: '20260811-learning37'",
            'const VIDEO_CORE_PATHS = [',
            'const EXACT_CORE_PATHS = [...BASE_CORE_PATHS, ...VIDEO_CORE_PATHS]',
            'const CONTROLLED_PUBLIC_CORE_PATHS = EXACT_CORE_PATHS',
            'CNC_PAGES_VERIFY_ATTEMPTS || 18',
            "cache: 'no-store'",
            'mainPagesExactBytesMatch: true',
            'mainPagesExactSha256Match: true',
            'branchDeploymentPending',
            'trainingPracticeInCoreCache: true',
            'trainingProfileInCoreCache: true',
            'mainLearningContentInCoreCache: true',
            'beginnerPlacementInCoreCache: true',
            'placementRouteHandoffInBranch: true',
            'criticalSafetyGateInBranch: true',
            'localVideoCoreCount: VIDEO_CORE_PATHS.length',
            'coreResourceCount: EXACT_CORE_PATHS.length',
            'process.exit(1)'
          ]) {
            if (!test.includes(token)) throw new Error(`deployment test missing: ${token}`);
          }
          for (const file of [
            './training-practice.js','./training-profile.js','./search-aliases.js','./gm-code-complete.js','./learning-content-data.js','./beginner-placement.html','./training-camp.html','./learning-sublesson-specificity.js','./course-safety-foundation.html','./course-coordinate-axes.html','./course-g00-g01-basics.html','./ai-teacher.html','./ai-teacher-intake.html','./ai-teacher-explainability.html'
          ]) {
            if (!sw.includes(`'${file}'`)) throw new Error(`Service Worker core missing: ${file}`);
            if (!selfTest.includes(file)) throw new Error(`self-test core missing: ${file}`);
          }
          for (const video of [
            './assets/videos/learning/stage01_safety.mp4','./assets/videos/learning/stage02_xyz.mp4','./assets/videos/learning/stage03_z_tool.mp4','./assets/videos/learning/stage04_program.mp4','./assets/videos/learning/stage05_g90_g91.mp4','./assets/videos/learning/stage06_g00_g01.mp4','./assets/videos/learning/stage07_sf.mp4','./assets/videos/learning/stage08_g02_g03.mp4','./assets/videos/learning/stage09_milling_direction.mp4','./assets/videos/learning/stage10_g41_g42.mp4','./assets/videos/learning/stage11_g81_g83.mp4','./assets/videos/learning/stage12_first_part.mp4'
          ]) {
            if (!sw.includes(`'${video}'`)) throw new Error(`Service Worker video core missing: ${video}`);
            if (!selfTest.includes(video)) throw new Error(`self-test video core missing: ${video}`);
          }
          if (!placement.includes('criticalFailures') || !placement.includes("decision:'critical-safety'")) throw new Error('beginner placement critical safety gate missing');
          if (!placement.includes('cnc_beginner_placement_route_handoff_v1') || !camp.includes('cnc_beginner_placement_route_handoff_v1')) throw new Error('placement route handoff producer or consumer missing');
          if (!status.includes(`const EXPECTED='${info.pwaBuild}'`) || !status.includes(`const EXPECTED_CACHE='${info.cacheRevision}'`)) throw new Error('PWA status build/cache mismatch');
          if (!selfTest.includes(`const EXPECTED='${info.pwaBuild}'`) || !selfTest.includes(`const EXPECTED_CACHE='${info.cacheRevision}'`)) throw new Error('PWA self-test build/cache mismatch');
          for (const token of [
            '练习达到80分只能作为能力证据',
            '必须同时完成当天目标课程的真实通关记录',
            '才能增加训练天数、连续训练和20 XP',
            '不能假定轨迹必然为固定直线或固定折线',
            '不能把“先Z后XY”教成所有机床通用规则',
            '12关主课程数据',
            'T/H编号相同只是常见工具管理约定',
            '不能仅凭T01后调用H02就直接判错',
            'G/M代码可信目录',
            'G10可编程数据写入适用范围',
            '备份原数据',
            '授权人员确认',
            'G28参考点返回适用范围',
            'G53机床坐标定位适用范围',
            '机床坐标零点',
            '完整计划运动空间',
            '不能把Z0、换刀点或固定机械坐标当成跨机床通用安全点',
            'G92车铣双语义适用范围',
            'G94车铣双语义适用范围',
            'G98/G99车铣双语义适用范围',
            '两类程序不能直接互抄',
            'G52/G54-G59',
            'X/Z或U/W',
            'I/Q/F',
            '主轴同步',
            '初始平面',
            'R平面',
            '单位制',
            'F含义',
            '教学格式示意不得直接作为真实机床参数'
          ]) {
            if (!status.includes(token)) throw new Error(`PWA status PWA33 explanation missing: ${token}`);
            if (!selfTest.includes(token)) throw new Error(`PWA self-test PWA33 explanation missing: ${token}`);
          }
          if (!status.includes('G90/G91下的绝对或增量解释')) throw new Error('PWA status缺少G10在G90/G91下的解释边界');
          if (!selfTest.includes('G90/G91绝对或增量解释')) throw new Error('PWA self-test缺少G10在G90/G91下的解释边界');
          for (const stage of ['起点测评关键安全门禁','起点测评离线核心','测评路线一次性交接','训练营路线离线核心','测评首步课程离线核心','正式课程开发占位清零','AI老师现场问诊单','AI老师判断说明','AI老师离线核心','AI老师学习档案异常保护','80个图文小课','80课现场动作与风险针对性','训练题库与成长档案离线核心','手机构建标记一致性','固定12关能力映射与真实薄弱课推荐','AI老师与固定12关成长档案语义一致','每日训练薄弱课错题精准回流','固定12关60题真实80分与关键题硬门禁','AI老师课程完成以真实完成记录为准','成长档案今日训练奖励以真实课程完成记录为准','G00快速定位与安全撤离适用范围','12关主课程数据首次安装离线核心','T/H刀长补偿映射适用范围','G10可编程数据写入适用范围','G/M代码首次安装离线核心','G28参考点返回适用范围','G53机床坐标定位适用范围','G92车铣双语义适用范围','G94车铣双语义适用范围','G98/G99车铣双语义适用范围']) {
            if (!String(info.contentStage || '').includes(stage)) throw new Error(`build marker missing: ${stage}`);
          }
          for (const forbidden of ['test.skip(', 'describe.skip(', 'it.skip(', 'process.exit(0)', 'CNC_PAGES_VERIFY_ATTEMPTS || 0']) {
            if (test.includes(forbidden)) throw new Error(`deployment gate bypass found: ${forbidden}`);
          }
          NODE
      - name: Verify main and Pages exact deployment
        env:
          CNC_PAGES_VERIFY_ATTEMPTS: 18
          CNC_PAGES_VERIFY_INTERVAL_MS: 10000
        run: node cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-offline-core-pages-${{ github.run_id }}
          path: cnc/test-results/ai-teacher-offline-core-pages/**
          if-no-files-found: error
          retention-days: 14
