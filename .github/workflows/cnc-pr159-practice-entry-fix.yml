name: CNC PR159 practice entry exact fix

on:
  push:
    branches:
      - chatgpt/cnc-ai-teacher-data-integrity-mainline

permissions:
  contents: write

jobs:
  exact-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-ai-teacher-data-integrity-mainline
          fetch-depth: 0

      - name: Precisely restore practice entry on the single-layer study page
        id: patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('cnc/training-practice.js')
          text = path.read_text(encoding='utf-8')
          old = "function ensureEntry(){var overview=document.getElementById('xp-training-overview');if(!overview)return false;"
          new = "function ensureEntry(){var overview=document.getElementById('xp-training-overview')||document.querySelector('#view-study .section-head');if(!overview)return false;"

          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              changed = True
          elif old_count == 0 and new_count == 1:
              changed = False
          else:
              raise SystemExit(f'精确挂载标记异常：old={old_count}, new={new_count}')

          with open(Path.cwd() / 'patch-result.txt', 'w', encoding='utf-8') as handle:
              handle.write('changed=true\n' if changed else 'changed=false\n')
          PY
          cat patch-result.txt >> "$GITHUB_OUTPUT"

      - name: Verify syntax and strict regression assertions
        shell: bash
        run: |
          node --check cnc/training-practice.js
          node --check cnc/tests/mobile-training-practice-smoke.cjs
          grep -F "document.querySelector('#view-study .section-head')" cnc/training-practice.js
          grep -F "assert.equal(api.questions, 9)" cnc/tests/mobile-training-practice-smoke.cjs
          grep -F "assert.equal(api.lessonGates, 12)" cnc/tests/mobile-training-practice-smoke.cjs
          grep -F "assert.equal(api.passScore, 80)" cnc/tests/mobile-training-practice-smoke.cjs
          grep -F "重复答对不得重复刷经验值" cnc/tests/mobile-training-practice-smoke.cjs
          grep -F "答案点击区不得过小" cnc/tests/mobile-training-practice-smoke.cjs
          git diff --check

      - name: Commit exact production fix
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnc/training-practice.js
          git commit -m "fix(cnc): 在单层学习页挂载练习入口"
          git push origin HEAD:chatgpt/cnc-ai-teacher-data-integrity-mainline
