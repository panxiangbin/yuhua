name: CNC G53 machine coordinate boundary trust smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g53-machine-coordinate-boundary-trust-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g53-machine-coordinate-boundary-trust-smoke.yml'

permissions:
  contents: read

jobs:
  g53-machine-coordinate-boundary-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate G53 machine-coordinate safety boundary
        run: node cnc/tests/g53-machine-coordinate-boundary-trust-smoke.cjs
