name: CNC training profile daily fixture controlled fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  controlled-fix:
    if: github.event.pull_request.head.ref == 'codex/cnc-training-profile-root-integrity-pwa48'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          tested="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$tested" = "$expected" || { echo "tested=$tested expected=$expected" >&2; exit 1; }

      - name: Apply exact test-fixture correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('cnc/tests/mobile-daily-training-plan-smoke.cjs')
          text = path.read_text(encoding='utf-8')
          old = "const done = [1, '2', 2, 13, 0, null, [], {}];"
          new = "const done = [1, 2];"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'目标夹具必须唯一，实际 {count} 处')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "cnc/tests/mobile-daily-training-plan-smoke.cjs" || { echo "非预期范围：$changed" >&2; exit 1; }
          grep -F "const done = [1, 2];" cnc/tests/mobile-daily-training-plan-smoke.cjs >/dev/null
          grep -F "assert.equal(corruptReadOnly.state.xp, 0, '数值字符串XP不得被信任');" cnc/tests/mobile-daily-training-plan-smoke.cjs >/dev/null
          grep -F "assert.equal(rootIntegrity.state.integrity, false" cnc/tests/mobile-daily-training-plan-smoke.cjs >/dev/null

      - name: Commit and push target-only fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/tests/mobile-daily-training-plan-smoke.cjs
          git commit -m 'CNC：修复共享档案字段异常测试夹具'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
