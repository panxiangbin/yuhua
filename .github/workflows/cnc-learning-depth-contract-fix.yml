name: CNC learning depth one-shot contract repair

on:
  push:
    branches:
      - codex/learning-depth-refactor-20260805
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/learning-depth-refactor-20260805
          fetch-depth: 0

      - name: Repair build, PWA, safety and accessibility contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} anchors, found {actual}: {old[:100]}')
              file.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          info_path = Path('cnc/build-info.json')
          info = json.loads(info_path.read_text(encoding='utf-8-sig'))
          if info.get('pwaBuild') != '20260805-pwa13':
              raise SystemExit(f"unexpected pwaBuild: {info.get('pwaBuild')}")
          if info.get('learningBuild') != '20260805-learning-depth1':
              raise SystemExit(f"unexpected learningBuild: {info.get('learningBuild')}")
          info['build'] = '20260804-mobile-home1'
          info['cacheRevision'] = '20260805-pwa13'
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          replace_exact(
              'cnc/sw.js',
              "const CACHE_REVISION = '20260805-learning13';\nconst STATIC_CACHE = `cnc-static-${CACHE_REVISION}`;\nconst RUNTIME_CACHE = `cnc-runtime-${CACHE_REVISION}`;",
              "const CACHE_REVISION = BUILD;\nconst STATIC_CACHE = `cnc-static-${BUILD}`;\nconst RUNTIME_CACHE = `cnc-runtime-${BUILD}`;",
          )

          replace_exact(
              'cnc/pwa-self-test.html',
              "const REQUIRED=['./index.html','./offline.html','./pwa-status.html','./pwa-self-test.html','./pages-status.html','./beginner-placement.html','./training-camp.html','./course-safety-foundation.html','./course-coordinate-axes.html','./course-g00-g01-basics.html','./ai-teacher.html','./ai-teacher-intake.html','./ai-teacher-explainability.html','./build-info.json'];",
              "const REQUIRED=['./index.html','./offline.html','./pwa-status.html','./pwa-self-test.html','./pages-status.html','./beginner-placement.html','./training-camp.html','./course-safety-foundation.html','./course-coordinate-axes.html','./course-g00-g01-basics.html','./ai-teacher.html','./ai-teacher-intake.html','./ai-teacher-explainability.html','./build-info.json','./learning-sublesson-catalog.js','./learning-depth.css','./learning-detail.html'];",
          )

          stage9_old = '分清快速定位和直线切削，并学会受控验证。'
          stage9_new = '分清快速定位和直线切削；G00移动轨迹不保证直线，必须使用单段、空运行和低倍率受控验证。'
          stage10_old = '结合加工平面、方向、圆心和半径理解圆弧编程。'
          stage10_new = '结合加工平面、方向、圆心和半径理解圆弧编程；I、J、K等圆心增量受系统最小输入单位约束。'
          for target in ['cnc/personal-home.js', 'cnc/learning-sublesson-catalog.js']:
              replace_exact(target, stage9_old, stage9_new)
              replace_exact(target, stage10_old, stage10_new)

          personal = Path('cnc/personal-home.js')
          source = personal.read_text(encoding='utf-8')
          helper_anchor = "  function boot() {\n"
          helper = (
              "  function syncQuickSearchAccessibility() {\n"
              "    var input = document.getElementById('quick-search-input');\n"
              "    if (!input) return false;\n"
              "    input.setAttribute('aria-label', '快速搜索G代码、报警和参数');\n"
              "    return true;\n"
              "  }\n\n"
          )
          if source.count(helper_anchor) != 1:
              raise SystemExit('cnc/personal-home.js: boot anchor drift')
          source = source.replace(helper_anchor, helper + helper_anchor, 1)
          observer_call = "    installQueryImageObserver();\n"
          if source.count(observer_call) != 2:
              raise SystemExit(f'cnc/personal-home.js: observer call count={source.count(observer_call)}')
          source = source.replace(observer_call, observer_call + "    syncQuickSearchAccessibility();\n")
          personal.write_text(source, encoding='utf-8', newline='\n')

          pages_contracts = [
              ('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs', 'expectedCorePaths', 'build', 'branchTargetPwaBuild'),
              ('cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs', 'expectedCore', 'expectedBuild', 'branchTargetPwaBuild'),
              ('cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs', 'expectedCorePaths', 'build', 'expectedPwaBuild'),
          ]
          learning_push = "core.push('./learning-sublesson-catalog.js', './learning-depth.css', './learning-detail.html');"
          for path, function_name, parameter, target_build in pages_contracts:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              if learning_push in source:
                  continue
              function_start = source.find(f'function {function_name}(')
              if function_start < 0:
                  raise SystemExit(f'{path}: {function_name} missing')
              return_at = source.find('  return core;', function_start)
              if return_at < 0:
                  raise SystemExit(f'{path}: core return missing')
              insertion = f"  if ({parameter} === {target_build}) {learning_push}\n"
              source = source[:return_at] + insertion + source[return_at:]
              file.write_text(source, encoding='utf-8', newline='\n')

          checks = {
              'cnc/build-info.json': ['20260804-mobile-home1', '20260805-pwa13', '20260805-learning-depth1'],
              'cnc/sw.js': ['const CACHE_REVISION = BUILD;', 'const STATIC_CACHE = `cnc-static-${BUILD}`', "'./learning-sublesson-catalog.js'"],
              'cnc/pwa-self-test.html': ['./learning-sublesson-catalog.js', './learning-depth.css', './learning-detail.html'],
              'cnc/personal-home.js': ['G00移动轨迹不保证直线', '最小输入单位', '快速搜索G代码、报警和参数'],
          }
          for path, tokens in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              missing = [token for token in tokens if token not in text]
              if missing:
                  raise SystemExit(f'{path}: missing post-repair tokens: {missing}')
          PY

      - name: Validate repaired contracts
        shell: bash
        run: |
          python3 -m json.tool cnc/build-info.json >/dev/null
          node --check cnc/sw.js
          node --check cnc/personal-home.js
          node --check cnc/learning-sublesson-catalog.js
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node cnc/tests/learning-depth-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/cnc-learning-depth-contract-fix.yml
          git config user.name '潘斌'
          git config user.email 'smxpxb008@gmail.com'
          git add cnc/build-info.json cnc/sw.js cnc/pwa-self-test.html cnc/personal-home.js cnc/learning-sublesson-catalog.js \
            cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs \
            cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs \
            cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          git commit -m 'fix(cnc-learning): restore build, PWA and mobile safety contracts'
          git push origin HEAD:codex/learning-depth-refactor-20260805
