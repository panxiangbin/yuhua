name: CNC G28 PWA29 migrate tmp

on:
  push:
    branches:
      - codex/cnc-g28-reference-return-boundary
    paths:
      - 'cnc/tests/_tmp-g28-pwa29-migrate.cjs'
      - '.github/workflows/cnc-g28-pwa29-migrate-tmp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-g28-pwa29:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/cnc-g28-reference-return-boundary
          fetch-depth: 0

      - name: Verify expected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'codex/cnc-g28-reference-return-boundary'
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'

      - name: Run deterministic G28 and PWA29 migration
        run: node cnc/tests/_tmp-g28-pwa29-migrate.cjs

      - name: Remove one-shot migration files
        shell: bash
        run: |
          set -euo pipefail
          rm cnc/tests/_tmp-g28-pwa29-migrate.cjs
          rm .github/workflows/cnc-g28-pwa29-migrate-tmp.yml

      - name: Audit changed scope and commit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git status --porcelain=v1 | sed -E 's/^.. //' | sort)
          test "${#files[@]}" -gt 0
          printf '%s\n' "${files[@]}"
          for file in "${files[@]}"; do
            case "$file" in
              cnc/*|.github/workflows/cnc-*.yml|.github/workflows/cnc-*.yaml) ;;
              *) echo "越界修改：$file" >&2; exit 1 ;;
            esac
          done
          if git diff --name-only | grep -Ev '^(cnc/|\.github/workflows/cnc-.*\.ya?ml$)' ; then
            echo '发现非CNC范围改动' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(cnc): 收紧G28参考点返回边界并升级PWA29'
          git push origin HEAD:codex/cnc-g28-reference-return-boundary
