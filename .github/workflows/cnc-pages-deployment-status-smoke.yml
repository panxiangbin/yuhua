name: CNC Pages deployment status smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pages-deployment-status-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pages-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate build marker and PWA version consistency
        run: >-
          node -e "const fs=require('fs');const info=JSON.parse(fs.readFileSync('cnc/build-info.json','utf8'));if(info.app!=='cnc-training-platform')throw new Error('invalid app marker');if(!/^\d{8}-[a-z0-9-]+$/.test(info.build))throw new Error('invalid site build format');if(!/^\d{8}-pwa\d+$/.test(info.pwaBuild))throw new Error('invalid PWA build format');const sw=fs.readFileSync('cnc/sw.js','utf8');const match=sw.match(/const BUILD = '([^']+)'/);if(!match||match[1]!==info.pwaBuild)throw new Error('Service Worker build mismatch');for(const file of ['cnc/pwa-status.html','cnc/pwa-self-test.html','cnc/tests/mobile-pwa-offline-cache-smoke.cjs','cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs']){const text=fs.readFileSync(file,'utf8');if(!text.includes(info.pwaBuild))throw new Error(file+' PWA build mismatch');}"
      - name: Check JavaScript syntax
        run: node --check cnc/tests/mobile-pages-deployment-status-smoke.cjs
      - name: Install Playwright runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 Pages status smoke
        run: node cnc/tests/mobile-pages-deployment-status-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pages-status-${{ github.run_id }}
          path: cnc/test-results/pages-deployment-status-*
          if-no-files-found: warn
          retention-days: 14