name: CNC Pages deployment status smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pages-deployment-status-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pages-deployment-status-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pages-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate build marker and PWA version consistency
        run: >-
          node -e "const fs=require('fs');const info=JSON.parse(fs.readFileSync('cnc/build-info.json','utf8'));if(info.app!=='cnc-training-platform')throw new Error('invalid app marker');if(!/^\d{8}-[a-z0-9-]+$/.test(info.build))throw new Error('invalid site build format');if(!/^\d{8}-pwa\d+$/.test(info.pwaBuild))throw new Error('invalid PWA build format');const sw=fs.readFileSync('cnc/sw.js','utf8');const match=sw.match(/const BUILD = '([^']+)'/);if(!match||match[1]!==info.pwaBuild)throw new Error('Service Worker build mismatch');for(const file of ['cnc/pwa-status.html','cnc/pwa-self-test.html','cnc/tests/mobile-pwa-offline-cache-smoke.cjs','cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs']){const text=fs.readFileSync(file,'utf8');if(!text.includes(info.pwaBuild))throw new Error(file+' PWA build mismatch');}"
      - name: Check JavaScript syntax
        run: >-
          node --check cnc/tests/mobile-pages-deployment-status-smoke.cjs &&
          node --check cnc/tests/pages-exact-resource-deployment-smoke.cjs &&
          node --check cnc/tests/pages-resource-fix-deployment-smoke.cjs &&
          node --check cnc/tests/pages-content-trust-evidence-deployment-smoke.cjs &&
          node --check cnc/tests/pages-content-trust-evidence-transaction-deployment-smoke.cjs &&
          node --check cnc/tools/validate-content-trust-evidence-ledger.cjs &&
          node --check cnc/ui-knowledge-tree.js
      - name: Verify exact-resource gate contract
        run: |
          node -e "const fs=require('fs');const text=fs.readFileSync('cnc/tests/pages-exact-resource-deployment-smoke.cjs','utf8');for(const token of ['mobile-trust-nav.js','ui-knowledge-tree.js','content-trust-status.html','content-trust-manifest.json','knowledge-tree-lazy','content-trust-page','content-trust-manifest','sha256','exactBytesMatch','globalMutationObserverAbsent','lazyMaterializationPresent','fullRecursiveFirstPaintAbsent','operationalCount']){if(!text.includes(token))throw new Error('missing exact-resource contract: '+token);}"
          node - <<'NODE'
          const fs = require('fs');
          const test = fs.readFileSync('cnc/tests/pages-resource-fix-deployment-smoke.cjs', 'utf8');
          const contract = fs.readFileSync('cnc/docs/pages-resource-fix-propagation-contract.md', 'utf8');
          for (const token of [
            'cnc/training-profile.html',
            'cnc/assets/images/batch01_core/placeholder.svg',
            'window.location.search + window.location.hash',
            'learningDataMutationAbsent',
            'aria-labelledby="title desc"',
            'activeContentAbsent',
            'exactBytesMatch',
            'exactSha256Match',
            'semanticContractMatch',
            'CNC_PAGES_VERIFY_ATTEMPTS || 18',
            'pages-deployment-status-resource-fix-propagation'
          ]) {
            if (!test.includes(token)) throw new Error(`missing resource-fix deployment contract: ${token}`);
          }
          for (const token of [
            '成长档案兼容入口',
            '教学图片回退',
            '逐字节',
            'SHA-256',
            '原厂手册',
            '授权人员',
            '不得修改予华仪器官网根目录'
          ]) {
            if (!contract.includes(token)) throw new Error(`missing Chinese resource-fix contract: ${token}`);
          }
          for (const forbidden of [
            'test.skip(',
            'process.exit(0)',
            'CNC_PAGES_VERIFY_ATTEMPTS || 0',
            'continue-on-error: true',
            'cancel-in-progress: true'
          ]) {
            if (test.includes(forbidden)) throw new Error(`resource-fix deployment bypass found: ${forbidden}`);
          }
          NODE
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('cnc/tests/pages-content-trust-evidence-deployment-smoke.cjs', 'utf8');
          for (const token of [
            'content-trust-evidence.html',
            'content-trust-evidence-ledger.json',
            'content-trust-manifest.json',
            'validateLedger',
            'REQUIRED_SOURCE_FIELDS',
            'stateDefinitions',
            'awaiting_sources',
            'sources_ready',
            'in_review',
            'review_complete',
            'readyForItemReview',
            'sourceRecords',
            'itemReviewRecords',
            'source-count',
            'item-review-count',
            'reviewedItemCount',
            'separateRecordCounts',
            'reviewedItemCountMatchesUniqueItemKeys',
            'stateTransitionConsistent',
            'exactBytesMatch',
            'exactSha256Match',
            'semanticContractMatch',
            'noUnverifiedContentClaim'
          ]) {
            if (!text.includes(token)) throw new Error(`missing evidence resource contract: ${token}`);
          }
          for (const forbidden of [
            'process.exit(0)',
            'test.skip(',
            'CNC_PAGES_VERIFY_ATTEMPTS || 0',
            "item.state !== 'awaiting_sources'",
            'sourceRecordCount !== 0',
            'reviewedItemCount !== 0'
          ]) {
            if (text.includes(forbidden)) throw new Error(`evidence deployment gate forbidden bypass or frozen baseline: ${forbidden}`);
          }
          NODE
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('cnc/tests/pages-content-trust-evidence-transaction-deployment-smoke.cjs', 'utf8');
          for (const token of [
            'content-trust-evidence-transaction.schema.json',
            'content-trust-evidence-transaction-template.json',
            'expectedBaseLedgerSha256',
            'nextLedgerSha256',
            'operationSummary',
            'datasetsChanged',
            'sourceRecordsAdded',
            'itemReviewRecordsAdded',
            'reviewedItemsAdded',
            'stateTransitions',
            'requireLocalMainMatch',
            'exactBytesMatch',
            'exactSha256Match',
            'schemaTemplateFieldAlignment',
            'noFakeTransactionMetadata',
            'noUnverifiedContentClaim'
          ]) {
            if (!text.includes(token)) throw new Error(`missing evidence transaction deployment contract: ${token}`);
          }
          for (const forbidden of [
            'test.skip(',
            'CNC_PAGES_VERIFY_ATTEMPTS || 0',
            "template.expectedBaseLedgerSha256 = '0'.repeat(64)",
            'allowOperationalUse: true'
          ]) {
            if (text.includes(forbidden)) throw new Error(`evidence transaction deployment gate forbidden bypass: ${forbidden}`);
          }
          NODE
      - name: Install Playwright runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 Pages status smoke
        run: node cnc/tests/mobile-pages-deployment-status-smoke.cjs
      - name: Verify Pages mobile navigation resource deployment
        env:
          CNC_EXACT_RESOURCE_PATH: cnc/mobile-trust-nav.js
          CNC_EXACT_RESOURCE_CONTRACT: mobile-trust-nav
        run: node cnc/tests/pages-exact-resource-deployment-smoke.cjs
      - name: Verify Pages knowledge tree lazy resource deployment
        env:
          CNC_EXACT_RESOURCE_PATH: cnc/ui-knowledge-tree.js
          CNC_EXACT_RESOURCE_CONTRACT: knowledge-tree-lazy
        run: node cnc/tests/pages-exact-resource-deployment-smoke.cjs
      - name: Verify Pages content trust status deployment
        env:
          CNC_EXACT_RESOURCE_PATH: cnc/content-trust-status.html
          CNC_EXACT_RESOURCE_CONTRACT: content-trust-page
        run: node cnc/tests/pages-exact-resource-deployment-smoke.cjs
      - name: Verify Pages content trust manifest deployment
        env:
          CNC_EXACT_RESOURCE_PATH: cnc/content-trust-manifest.json
          CNC_EXACT_RESOURCE_CONTRACT: content-trust-manifest
        run: node cnc/tests/pages-exact-resource-deployment-smoke.cjs
      - name: Verify Pages resource-fix propagation
        run: node cnc/tests/pages-resource-fix-deployment-smoke.cjs
      - name: Verify Pages content trust evidence deployment and semantics
        run: node cnc/tests/pages-content-trust-evidence-deployment-smoke.cjs
      - name: Verify Pages evidence transaction Schema and template deployment
        run: node cnc/tests/pages-content-trust-evidence-transaction-deployment-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pages-status-${{ github.run_id }}
          path: cnc/test-results/pages-deployment-status-*
          if-no-files-found: warn
          retention-days: 14
