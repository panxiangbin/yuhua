name: CNC PWA build reference audit smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'
  push:
    branches: [main]
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pwa-build-reference-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check audit script syntax
        run: node --check cnc/tests/pwa-build-reference-audit-smoke.cjs
      - name: Audit current and previous PWA build references
        run: node cnc/tests/pwa-build-reference-audit-smoke.cjs
      - name: Reject bypasses and incomplete diagnostics
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const script = fs.readFileSync('cnc/tests/pwa-build-reference-audit-smoke.cjs', 'utf8');
          for (const forbidden of ['test.skip(', 'describe.skip(', 'it.skip(', 'process.exit(0)']) {
            if (script.includes(forbidden)) throw new Error(`PWA引用审计发现绕过：${forbidden}`);
          }

          const requiredScriptTokens = [
            'CURRENT_PIN_SPECS',
            'CONTROLLED_PUBLIC_PIN_SPECS',
            'PREVIOUS_PIN_SPEC',
            'MEDIA_PROGRESS_SPEC',
            'currentCacheRevision',
            'DECLARED_LEGACY_REFERENCES',
            'documentation-history',
            'audit-governance',
            'cnc/MOBILE_LEARNING_MEDIA_PROGRESS.md',
            'cnc/runtime-env-detector.js',
            'cnc/import-test.js',
            'unusedLegacyAllowances'
          ];
          for (const token of requiredScriptTokens) {
            if (!script.includes(token)) throw new Error(`PWA引用审计缺少结构契约：${token}`);
          }

          const legacyBlock = script.match(/const\s+DECLARED_LEGACY_REFERENCES\s*=\s*\[([\s\S]*?)\n\];/)?.[1] || '';
          const declaredLegacyCount = (legacyBlock.match(/\{\s*\n\s*file:/g) || []).length;
          if (declaredLegacyCount < 2) {
            throw new Error(`PWA历史引用声明解析异常：${declaredLegacyCount}`);
          }

          const report = JSON.parse(fs.readFileSync('cnc/test-results/pwa-build-reference-audit/report.json', 'utf8'));
          if (!report.passed) throw new Error('PWA引用审计报告未通过');

          const requiredPinFiles = [
            'cnc/sw.js',
            'cnc/pwa-status.html',
            'cnc/pwa-self-test.html',
            'cnc/MOBILE_LEARNING_MEDIA_PROGRESS.md',
            'cnc/tests/mobile-pwa-offline-cache-smoke.cjs',
            'cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs',
            'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs',
            'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
            'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
            'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs'
          ];

          if (!report.currentPwaBuild || !report.currentCacheRevision || !report.controlledPublicPwaBuild || !report.previousPwaBuild) {
            throw new Error(`PWA引用审计缺少当前构建、缓存修订、受控公网基线或历史升级构建：${JSON.stringify(report)}`);
          }
          if (new Set([report.currentPwaBuild, report.controlledPublicPwaBuild, report.previousPwaBuild]).size !== 3) {
            throw new Error(`PWA三代构建必须互不相同：${report.currentPwaBuild}/${report.controlledPublicPwaBuild}/${report.previousPwaBuild}`);
          }
          if (!report.mediaTarget || report.mediaTarget.file !== 'cnc/MOBILE_LEARNING_MEDIA_PROGRESS.md') {
            throw new Error(`学习媒体进度目标证据缺失：${JSON.stringify(report.mediaTarget)}`);
          }
          if (report.mediaTarget.pwaBuild !== report.currentPwaBuild || report.mediaTarget.cacheRevision !== report.currentCacheRevision) {
            throw new Error(`学习媒体进度目标与当前构建漂移：${JSON.stringify(report.mediaTarget)} / ${report.currentPwaBuild}/${report.currentCacheRevision}`);
          }
          if (report.activePinCount < requiredPinFiles.length) {
            throw new Error(`PWA当前构建针覆盖不足：${report.activePinCount}/${requiredPinFiles.length}`);
          }
          if (report.operationalReferenceCount < 10) {
            throw new Error(`PWA运行引用覆盖不足：${report.operationalReferenceCount}`);
          }
          if (report.legacyReferenceCount !== declaredLegacyCount) {
            throw new Error(`PWA受控历史引用数量与声明清单不一致：实际${report.legacyReferenceCount}，声明${declaredLegacyCount}`);
          }
          for (const key of ['staleActivePins', 'unexpectedReferences', 'unusedLegacyAllowances']) {
            if (!Array.isArray(report[key]) || report[key].length !== 0) {
              throw new Error(`PWA引用审计异常字段${key}未清空：${JSON.stringify(report[key])}`);
            }
          }
          for (const file of requiredPinFiles) {
            const pin = report.currentPins.find(item => item.file === file);
            if (!pin) throw new Error(`PWA引用审计缺少当前构建针：${file}`);
            if (pin.version !== report.currentPwaBuild) {
              throw new Error(`PWA当前构建针漂移：${file}=${pin.version}，期望${report.currentPwaBuild}`);
            }
          }
          const controlledPublicFiles = new Set((report.controlledPublicPins || []).map(item => item.file));
          for (const file of ['cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs','cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs','cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs']) {
            if (!controlledPublicFiles.has(file)) throw new Error(`PWA受控公网基线针缺失：${file}`);
          }
          if ((report.controlledPublicPins || []).some(item => item.version !== report.controlledPublicPwaBuild)) {
            throw new Error(`PWA受控公网基线针漂移：${JSON.stringify(report.controlledPublicPins)}`);
          }
          if (!report.previousPin || report.previousPin.file !== 'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs') {
            throw new Error(`PWA上一构建针来源无效：${JSON.stringify(report.previousPin)}`);
          }
          if (report.previousPin.version !== report.previousPwaBuild) {
            throw new Error(`PWA上一构建针漂移：${JSON.stringify(report.previousPin)}`);
          }
          const legacyFiles = new Set((report.legacyReferences || []).map(item => item.file));
          for (const file of ['cnc/runtime-env-detector.js', 'cnc/import-test.js']) {
            if (!legacyFiles.has(file)) throw new Error(`PWA受控历史诊断引用缺失：${file}`);
          }
          NODE
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-build-reference-audit-${{ github.run_id }}
          path: cnc/test-results/pwa-build-reference-audit/**
          if-no-files-found: error
          retention-days: 14
