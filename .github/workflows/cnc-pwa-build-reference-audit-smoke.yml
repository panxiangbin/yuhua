name: CNC PWA build reference audit smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'
  push:
    branches:
      - codex/learning-depth-refactor-20260805
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/learning-depth-refactor-20260805
          fetch-depth: 0
      - name: Apply transition baseline repair
        run: python3 cnc/tools/repair-pages-transition-baseline.py
      - name: Validate repaired contracts
        run: |
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node --check cnc/tests/pwa-build-reference-audit-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check
      - name: Commit repair and restore workflow
        run: |
          git show a45e9702a8e469dd0b4f24bdd231ef4d647e41e6:.github/workflows/cnc-pwa-build-reference-audit-smoke.yml > .github/workflows/cnc-pwa-build-reference-audit-smoke.yml
          git rm -f .github/workflows/cnc-pages-transition-baseline-fix.yml
          git rm -f cnc/tools/repair-pages-transition-baseline.py
          git config user.name '潘斌'
          git config user.email 'smxpxb008@gmail.com'
          git add .github/workflows/cnc-pwa-build-reference-audit-smoke.yml \
            cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs \
            cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs \
            cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs \
            cnc/tests/pwa-build-reference-audit-smoke.cjs
          git commit -m 'fix(cnc-pages): allow controlled main PWA13 transition baseline'
          git push origin HEAD:codex/learning-depth-refactor-20260805
