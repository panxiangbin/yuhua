name: CNC backup reward duplicate test fix

on:
  push:
    branches:
      - codex/cnc-backup-reward-duplicate-guard
    paths:
      - cnc/tests/apply_backup_reward_duplicate_test_expectation_fix.py
      - .github/workflows/cnc-backup-reward-duplicate-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Verify triggering head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Apply exact stale assertion fix
        run: python3 cnc/tests/apply_backup_reward_duplicate_test_expectation_fix.py
      - name: Check JavaScript syntax
        run: node --check cnc/tests/mobile-data-backup-history-migration-smoke.cjs
      - name: Audit generated scope
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "cnc/tests/mobile-data-backup-history-migration-smoke.cjs"
          git diff --check
          git diff -- cnc/tests/mobile-data-backup-history-migration-smoke.cjs
      - name: Commit and push target-only fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnc/tests/mobile-data-backup-history-migration-smoke.cjs
          git commit -m "CNC：同步重复奖励恢复测试最终状态期望"
          git push origin HEAD:${GITHUB_REF_NAME}
