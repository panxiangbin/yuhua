name: CNC AI teacher completion PWA24 bootstrap

on:
  push:
    branches: ["codex/cnc-ai-teacher-completion-pwa24"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: codex/cnc-ai-teacher-completion-pwa24
          fetch-depth: 0

      - name: Apply scoped CNC patch once
        shell: bash
        run: |
          if [ "$(git log -1 --pretty=%s)" = "fix(cnc-ai): 校正课程完成语义并升级PWA24" ]; then
            echo "PWA24 patch already applied."
            exit 0
          fi
          python3 cnc/tools/apply-ai-teacher-completion-pwa24.py
          grep -F "function completedCourses(study,profile){" cnc/ai-teacher.html
          if grep -F "lessonScore(level,profile,practice)>=80)completed.add(level)" cnc/ai-teacher.html; then
            echo "score-to-completion inference still exists"
            exit 1
          fi
          grep -F "80分或旧100分不得冒充真实课程完成" cnc/tests/mobile-ai-teacher-smoke.cjs
          grep -F '"pwaBuild": "20260808-pwa24"' cnc/build-info.json
          grep -F "const BUILD = '20260808-pwa24';" cnc/sw.js
          grep -F "const CACHE_REVISION = '20260808-learning24';" cnc/sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnc
          if git diff --cached --quiet; then
            echo "No CNC patch changes to commit"
            exit 1
          fi
          git commit -m "fix(cnc-ai): 校正课程完成语义并升级PWA24"
          git push origin HEAD:codex/cnc-ai-teacher-completion-pwa24
