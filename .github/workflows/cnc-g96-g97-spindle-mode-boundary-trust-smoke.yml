name: CNC G96 G97 spindle mode boundary trust smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g96-g97-spindle-mode-boundary-trust-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-g96-g97-spindle-mode-boundary-trust-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g96-g97-spindle-mode-boundary-trust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Prove tested commit identity
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "tested_head=$tested_head"
          echo "expected_head=$expected_head"
          test "$tested_head" = "$expected_head"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate G96 G97 spindle mode safety boundary
        run: node cnc/tests/g96-g97-spindle-mode-boundary-trust-smoke.cjs
      - name: Upload G96 G97 trust diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-g96-g97-spindle-mode-boundary-${{ github.run_id }}
          path: cnc/test-results/g96-g97-spindle-mode-boundary-trust/
          if-no-files-found: error
          retention-days: 14
