name: CNC PWA41 active pin controlled sync

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply controlled PWA41 pin sync
        run: node cnc/tests/sync-pwa41-active-pins.cjs
      - name: Verify central PWA reference audit
        run: node cnc/tests/pwa-build-reference-audit-smoke.cjs
      - name: Commit synchronized pins locally
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CNC Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cnc .github/workflows/cnc-*.yml
          if git diff --cached --quiet; then
            echo 'PWA41主动构建针已经同步，无需新提交。'
          else
            git commit -m 'CNC：同步PWA41主动构建针'
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git diff --check HEAD^ HEAD
      - name: Attempt fast-forward push
        id: push
        continue-on-error: true
        shell: bash
        run: git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Record synchronization diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/pwa41-pin-sync
          python - <<'PY'
          import json, os, subprocess
          p='artifacts/pwa41-pin-sync/report.json'
          try:
              data=json.load(open(p,encoding='utf-8'))
          except Exception:
              data={}
          data.update({
              'commitSha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'parentSha': subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),
              'pushOutcome': os.environ.get('PUSH_OUTCOME','unknown')
          })
          open(p,'w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False,indent=2))
          PY
        env:
          PUSH_OUTCOME: ${{ steps.push.outcome }}
      - name: Upload synchronization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa41-active-pin-sync-${{ github.run_id }}
          path: artifacts/pwa41-pin-sync/**
          if-no-files-found: error
          retention-days: 14
