name: CNC program fill sort debug practice smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-program-fill-sort-debug-practice-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/cnc-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/cnc/practice-program-fill-sort-debug.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/cnc-server.log
          exit 1
      - name: Run Chromium 390x844 smoke
        env:
          CNC_BASE_URL: http://127.0.0.1:4173
          CNC_ARTIFACT_DIR: artifacts/program-fill-sort-debug
        run: node cnc/tests/mobile-program-fill-sort-debug-practice-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-program-fill-sort-debug-${{ github.run_id }}
          path: artifacts/program-fill-sort-debug
          if-no-files-found: warn
          retention-days: 14
