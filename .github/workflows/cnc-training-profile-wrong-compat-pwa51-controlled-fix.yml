name: CNC training profile wrong compatibility PWA51 controlled fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'cnc/tests/apply_training_profile_wrong_compat_pwa51.py'
      - '.github/workflows/cnc-training-profile-wrong-compat-pwa51-controlled-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  controlled-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$actual" = "$expected"
          mkdir -p cnc/test-artifacts/training-profile-wrong-compat-pwa51
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$actual" "$expected" > cnc/test-artifacts/training-profile-wrong-compat-pwa51/identity.json

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Generate scoped CNC PWA51 patch
        shell: bash
        run: |
          set -euo pipefail
          python cnc/tests/apply_training_profile_wrong_compat_pwa51.py 2>&1 | tee cnc/test-artifacts/training-profile-wrong-compat-pwa51/generator.log

      - name: Validate JavaScript and generated scope
        shell: bash
        run: |
          set -euo pipefail
          node --check cnc/training-profile.js
          node --check cnc/tests/mobile-daily-training-plan-smoke.cjs
          git diff --name-only > cnc/test-artifacts/training-profile-wrong-compat-pwa51/changed-files.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
            'cnc/MOBILE_LEARNING_MEDIA_PROGRESS.md','cnc/build-info.json','cnc/pwa-self-test.html','cnc/pwa-status.html','cnc/sw.js',
            'cnc/tests/g10-programmable-data-input-trust-smoke.cjs','cnc/tests/g28-reference-return-boundary-trust-smoke.cjs','cnc/tests/g53-machine-coordinate-boundary-trust-smoke.cjs','cnc/tests/g92-dual-semantic-boundary-trust-smoke.cjs','cnc/tests/g94-dual-semantic-boundary-trust-smoke.cjs','cnc/tests/g95-cold-offline-source-trust-smoke.cjs','cnc/tests/g95-dual-semantic-boundary-trust-smoke.cjs','cnc/tests/g96-g97-cold-offline-source-trust-smoke.cjs','cnc/tests/g96-g97-spindle-mode-boundary-trust-smoke.cjs','cnc/tests/g98-g99-cold-offline-source-trust-smoke.cjs','cnc/tests/g98-g99-dual-semantic-boundary-trust-smoke.cjs','cnc/tests/mobile-daily-training-plan-smoke.cjs','cnc/tests/mobile-pwa-offline-cache-smoke.cjs','cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs','cnc/tests/mobile-pwa-upgrade-data-smoke.cjs','cnc/tests/mobile-training-ability-smoke.cjs','cnc/tests/mobile-training-camp-foundation-smoke.cjs','cnc/tests/mobile-training-profile-smoke.cjs','cnc/tests/mobile-training-streak-smoke.cjs','cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs','cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs','cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs','cnc/training-profile.js'
          }
          changed = {line.strip() for line in Path('cnc/test-artifacts/training-profile-wrong-compat-pwa51/changed-files.txt').read_text().splitlines() if line.strip()}
          if changed != allowed:
              raise SystemExit(f'generated scope mismatch missing={sorted(allowed-changed)} extra={sorted(changed-allowed)}')
          PY

      - name: Commit generated CNC files
        shell: bash
        run: |
          set -euo pipefail
          git add cnc/MOBILE_LEARNING_MEDIA_PROGRESS.md cnc/build-info.json cnc/pwa-self-test.html cnc/pwa-status.html cnc/sw.js cnc/training-profile.js cnc/tests
          git reset -- cnc/tests/apply_training_profile_wrong_compat_pwa51.py cnc/test-artifacts || true
          git diff --cached --name-only > cnc/test-artifacts/training-profile-wrong-compat-pwa51/committed-files.txt
          git commit -m 'CNC：兼容共享错题历史结构并升级PWA51'
          git rev-parse HEAD > cnc/test-artifacts/training-profile-wrong-compat-pwa51/generated-commit.txt
          git show --stat --oneline HEAD > cnc/test-artifacts/training-profile-wrong-compat-pwa51/stat.txt

      - name: Push generated commit without force
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload controlled-fix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-training-profile-wrong-compat-pwa51-${{ github.run_id }}
          path: cnc/test-artifacts/training-profile-wrong-compat-pwa51/
          if-no-files-found: warn
