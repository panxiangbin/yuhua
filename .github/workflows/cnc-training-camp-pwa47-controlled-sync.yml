name: CNC training camp PWA47 controlled sync

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'

permissions:
  contents: write

jobs:
  controlled-sync:
    if: github.event.pull_request.head.ref == 'codex/cnc-training-camp-canonical-pwa47'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          mkdir -p artifacts/training-camp-pwa47-sync
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$(git rev-parse HEAD)" "${{ github.event.pull_request.head.sha }}" > artifacts/training-camp-pwa47-sync/identity.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate training camp fix and PWA47 pins
        run: python3 cnc/tests/apply_training_camp_pwa47_sync.py

      - name: Re-run strict central PWA audit
        run: node cnc/tests/pwa-build-reference-audit-smoke.cjs

      - name: Verify generated scope and create clean commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cnc/test-results/pwa-build-reference-audit
          git diff --name-only > artifacts/training-camp-pwa47-sync/generated-files.txt
          if grep -Ev '^(cnc/|\.github/workflows/cnc-)' artifacts/training-camp-pwa47-sync/generated-files.txt | grep -q .; then
            echo '发现非CNC范围文件'; cat artifacts/training-camp-pwa47-sync/generated-files.txt; exit 1
          fi
          if grep '^cnc/test-results/' artifacts/training-camp-pwa47-sync/generated-files.txt | grep -q .; then
            echo '自动诊断产物不得进入提交'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc .github/workflows/cnc-*.yml
          git commit -m 'CNC：统一训练营完成语义并升级PWA47'
          git rev-parse HEAD > artifacts/training-camp-pwa47-sync/generated-commit.txt
          git rev-parse HEAD^ > artifacts/training-camp-pwa47-sync/generated-parent.txt
          git show --stat --oneline HEAD > artifacts/training-camp-pwa47-sync/generated-stat.txt
          git show --format=fuller --binary HEAD > artifacts/training-camp-pwa47-sync/generated.patch
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          cp cnc/test-results/pwa-build-reference-audit/report.json artifacts/training-camp-pwa47-sync/pwa-build-reference-report.json
          rm -rf cnc/test-results/pwa-build-reference-audit
          git status --porcelain > artifacts/training-camp-pwa47-sync/status-before-push.txt

      - name: Attempt non-force fast-forward push
        id: push
        shell: bash
        run: |
          set +e
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}" > artifacts/training-camp-pwa47-sync/push.log 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" > artifacts/training-camp-pwa47-sync/push-exit-code.txt
          cat artifacts/training-camp-pwa47-sync/push.log
          exit 0

      - name: Upload controlled sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-training-camp-pwa47-controlled-sync
          path: artifacts/training-camp-pwa47-sync
          if-no-files-found: error

      - name: Enforce push result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code='${{ steps.push.outputs.code }}'
          if [ -z "$code" ]; then echo '缺少push结果'; exit 1; fi
          if [ "$code" != '0' ]; then echo "受控同步生成成功，但自动push失败（code=$code）；必须读取真实日志和Artifact后处理。"; exit "$code"; fi
