name: CNC practice score integrity controlled fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cnc/tests/apply_practice_score_integrity_fix.py'
      - '.github/workflows/cnc-practice-score-integrity-controlled-fix.yml'

permissions:
  contents: write

jobs:
  controlled-fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ github.event.pull_request.head.sha }}"
          test "$actual" = "$expected"
          printf '{"testedHead":"%s","expectedHead":"%s"}\n' "$actual" "$expected" > /tmp/identity.json

      - name: Apply scoped CNC patch
        shell: bash
        run: |
          set -euo pipefail
          python3 cnc/tests/apply_practice_score_integrity_fix.py | tee /tmp/generator.log
          node --check cnc/tests/mobile-data-health-smoke.cjs
          node --check cnc/tests/data-health-transaction-smoke.cjs
          node --check cnc/tests/mobile-data-backup-history-migration-smoke.cjs

      - name: Audit generated scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/changed.txt
          cat /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 5
          grep -Fx 'cnc/data-health.html' /tmp/changed.txt
          grep -Fx 'cnc/data-backup.html' /tmp/changed.txt
          grep -Fx 'cnc/tests/mobile-data-health-smoke.cjs' /tmp/changed.txt
          grep -Fx 'cnc/tests/data-health-transaction-smoke.cjs' /tmp/changed.txt
          grep -Fx 'cnc/tests/mobile-data-backup-history-migration-smoke.cjs' /tmp/changed.txt
          if grep -Ev '^(cnc/data-health\.html|cnc/data-backup\.html|cnc/tests/mobile-data-health-smoke\.cjs|cnc/tests/data-health-transaction-smoke\.cjs|cnc/tests/mobile-data-backup-history-migration-smoke\.cjs)$' /tmp/changed.txt; then
            echo '发现越界修改' >&2
            exit 1
          fi

      - name: Commit and push generated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/data-health.html cnc/data-backup.html cnc/tests/mobile-data-health-smoke.cjs cnc/tests/data-health-transaction-smoke.cjs cnc/tests/mobile-data-backup-history-migration-smoke.cjs
          git commit -m 'CNC：补齐练习成绩嵌套完整性恢复链'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload controlled-fix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-practice-score-integrity-controlled-fix-${{ github.run_id }}
          path: |
            /tmp/identity.json
            /tmp/generator.log
            /tmp/changed.txt
          if-no-files-found: warn
