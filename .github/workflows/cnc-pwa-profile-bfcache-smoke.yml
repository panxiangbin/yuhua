name: CNC PWA profile BFCache smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-profile-bfcache-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - run: node cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-profile-bfcache-${{ github.run_id }}
          path: cnc/test-results/pwa-profile-bfcache-*
          if-no-files-found: warn
