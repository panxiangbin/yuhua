name: CNC PWA profile BFCache smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-profile-bfcache-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pwa-profile-bfcache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate BFCache build contract
        run: |
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const test = fs.readFileSync('cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild) throw new Error(`Service Worker/build-info mismatch: ${swBuild} / ${info.pwaBuild}`);
          if (!test.includes(`const PWA_BUILD = '${info.pwaBuild}'`)) throw new Error('BFCache test PWA build mismatch');
          if (!test.includes(`const CACHE_REVISION = '${info.cacheRevision}'`)) throw new Error('BFCache test cache revision mismatch');
          for (const required of [
            "ignoreDefaultArgs: ['--disable-back-forward-cache']",
            "'--enable-bfcache'",
            "'--enable-features=BackForwardCache:enable_same_site/true'",
            "Page.backForwardCacheNotUsed",
            "event.persisted",
            "history.back()",
            "waitUntil: 'commit'",
            "headlessDelegateBfcacheEnabled: true",
            "sameSiteBfcacheEnabled: true",
            "pageshowPersisted: true",
            "chromiumBfcacheEnabled: true",
            "history-return-real-bfcache",
            "cache-mismatch",
            "cache-recovery",
            "bfcacheRestore: true"
          ]) {
            if (!test.includes(required)) throw new Error(`BFCache contract missing: ${required}`);
          }
          for (const forbidden of [
            'test.skip(',
            'describe.skip(',
            'it.skip(',
            'process.exit(0)',
            "page.goBack({ waitUntil: 'domcontentloaded' })"
          ]) {
            if (test.includes(forbidden)) throw new Error(`BFCache gate bypass found: ${forbidden}`);
          }
          NODE
      - name: Install Playwright test runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 real profile BFCache smoke
        env:
          DEBUG: pw:browser
        run: node cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-profile-bfcache-${{ github.run_id }}
          path: cnc/test-results/pwa-profile-bfcache-*
          if-no-files-found: error
          retention-days: 14
