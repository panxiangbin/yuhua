name: CNC PWA profile BFCache smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-profile-bfcache-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pwa-profile-bfcache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright test runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check smoke test syntax
        run: node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
      - name: Enforce no direct contact policy
        run: |
          node scripts/check-no-direct-contact.cjs
          node scripts/audit-public-contact-leaks.cjs
      - name: Run 390x844 profile and BFCache smoke
        env:
          DEBUG: pw:browser
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' node cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-profile-bfcache-${{ github.run_id }}
          path: cnc/test-results/pwa-profile-bfcache-*
          if-no-files-found: warn
          retention-days: 14
