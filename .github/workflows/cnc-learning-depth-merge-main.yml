name: CNC learning depth merge latest main

on:
  pull_request:
    paths:
      - '.github/workflows/cnc-learning-depth-merge-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-learning-depth-merge-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  merge-main:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/learning-depth-refactor-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Merge latest main and remove this one-shot workflow
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff -X ours origin/main
          git rm .github/workflows/cnc-learning-depth-merge-main.yml
          git commit -m 'merge(main): absorb latest PWA13 platform fixes'
          git push origin HEAD:codex/learning-depth-refactor-20260805
