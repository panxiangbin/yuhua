name: CNC training achievements smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-training-achievements-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training-achievements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record exact tested head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cnc/test-artifacts/training-achievements
          tested_head="$(git rev-parse HEAD)"
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ "$tested_head" != "$expected_head" ]; then
            echo "成长成果实际检出提交与预期最新头不一致：tested=$tested_head expected=$expected_head" >&2
            exit 1
          fi
          TESTED_HEAD="$tested_head" EVENT_SHA="$GITHUB_SHA" node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('cnc/test-artifacts/training-achievements/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            eventName: process.env.GITHUB_EVENT_NAME,
            testedHead: process.env.TESTED_HEAD,
            eventSha: process.env.EVENT_SHA,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE

      - name: Controlled apply integrity fix to child commit
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "function addCompleted(set,values,source)" cnc/training-achievements.html; then
            echo '成长成果完整性生产修复已经进入当前头提交；继续执行真实门禁。'
            exit 0
          fi
          python3 cnc/tests/apply_training_achievements_completion_integrity_fix.py
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          expected=(cnc/tests/mobile-training-achievements-smoke.cjs cnc/training-achievements.html)
          if [ "${#files[@]}" -ne "${#expected[@]}" ]; then
            printf '受控修复文件范围异常：\n%s\n' "${files[*]}" >&2
            exit 1
          fi
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/training-achievements.html cnc/tests/mobile-training-achievements-smoke.cjs
          git commit -m 'CNC：阻断成长成果非法课程完成项静默降级'
          git push origin HEAD:${GITHUB_HEAD_REF}
          echo '已生成新的真实子提交；当前旧头门禁故意失败，最终结果只认新头。' >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium

      - name: JavaScript syntax and strict data contracts
        run: |
          node --check cnc/tests/mobile-training-achievements-smoke.cjs
          node --check cnc/tests/training-achievements-date-contract-smoke.cjs
          node --check cnc/tests/training-achievements-wrong-compat-smoke.cjs
          node --check cnc/tests/training-achievements-completion-integrity-contract-smoke.cjs
          node cnc/tests/training-achievements-date-contract-smoke.cjs
          node cnc/tests/training-achievements-completion-integrity-contract-smoke.cjs
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('cnc/training-achievements.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f'成长成果页内联脚本数量异常：{len(scripts)}')
          Path('/tmp/cnc-training-achievements-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/cnc-training-achievements-inline.js

      - name: Start static server and wait until ready
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory . > /tmp/cnc-server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/cnc/training-achievements.html >/dev/null; then
              cp /tmp/cnc-server.log cnc/test-artifacts/training-achievements/server.log
              exit 0
            fi
            sleep 0.25
          done
          cp /tmp/cnc-server.log cnc/test-artifacts/training-achievements/server.log || true
          echo 'CNC成长成果静态服务器未在10秒内就绪' >&2
          exit 1

      - name: Chromium 390x844 training achievements
        shell: bash
        run: |
          set -o pipefail
          node cnc/tests/mobile-training-achievements-smoke.cjs 2>&1 | tee cnc/test-artifacts/training-achievements/test.log
          node cnc/tests/training-achievements-wrong-compat-smoke.cjs 2>&1 | tee cnc/test-artifacts/training-achievements/wrong-compat-test.log

      - name: Prove gate is read-only for tracked CNC sources
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo '成长成果门禁修改了受版本控制文件：' >&2
            git status --short --untracked-files=no >&2
            exit 1
          fi

      - name: Upload training achievements diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-training-achievements-${{ github.run_id }}
          path: cnc/test-artifacts/training-achievements/*
          if-no-files-found: error
          retention-days: 14
