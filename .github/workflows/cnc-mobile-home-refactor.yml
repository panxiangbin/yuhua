name: CNC mobile home refactor acceptance

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'
  push:
    branches: [main]
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-*.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-mobile-home-refactor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Synchronize mobile PWA build references
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/mobile-home-refactor-20260804'
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from datetime import datetime, timezone
          import json

          current = '20260804-pwa11'
          target = '20260804-pwa12'
          extensions = {'.js', '.cjs', '.json', '.html', '.md', '.yml', '.yaml'}
          roots = [Path('cnc'), Path('.github/workflows')]
          changed = []

          for root in roots:
              for file in root.rglob('*'):
                  if not file.is_file() or file.suffix.lower() not in extensions:
                      continue
                  if 'node_modules' in file.parts or 'test-results' in file.parts or 'docs' in file.parts:
                      continue
                  text = file.read_text(encoding='utf-8')
                  updated = text.replace(current, target)
                  if updated != text:
                      file.write_text(updated, encoding='utf-8')
                      changed.append(str(file))

          info_path = Path('cnc/build-info.json')
          info = json.loads(info_path.read_text(encoding='utf-8'))
          info['build'] = '20260804-mobile-home1'
          info['pwaBuild'] = target
          info['mobileBuild'] = '20260804-mobile-home1'
          info['cacheRevision'] = '20260804-mobile12'
          info['generatedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if str(info_path) not in changed:
              changed.append(str(info_path))

          print(f'PWA references synchronized: {len(changed)} files')
          for file in changed:
              print(file)
          '@ | python -

          node --check cnc/sw.js
          node --check cnc/tests/pwa-build-reference-audit-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check

          if (git status --porcelain) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cnc .github/workflows
            git commit -m 'chore(cnc-mobile): bump PWA12 for mobile home release'
            git push origin HEAD:codex/mobile-home-refactor-20260804
          } else {
            Write-Host 'PWA12 references already synchronized.'
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate scripts and required assets
        shell: pwsh
        run: |
          node --check cnc/personal-home.js
          node --check cnc/sw.js
          node --check cnc/tests/mobile-home-final-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          if (-not (Test-Path 'cnc/mobile-home-hardening.css')) { throw 'mobile-home-hardening.css missing' }
          if (-not (Select-String -Path 'cnc/MOBILE_HOME_ASSET_INVENTORY.md' -Pattern '速肯方面' -Quiet)) { throw '速肯方面 inventory marker missing' }

      - name: Install Playwright without bundled browsers
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --no-save playwright@1.54.2

      - name: Verify Microsoft Edge
        shell: pwsh
        run: |
          $edge = 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          if (-not (Test-Path $edge)) { throw "Microsoft Edge not found at $edge" }
          & $edge --version

      - name: Run mobile, first-paint, learning, query, PWA and desktop checks
        shell: pwsh
        env:
          CNC_EDGE_PATH: 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
        run: node cnc/tests/mobile-home-final-smoke.cjs

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-mobile-home-final-evidence-${{ github.run_id }}
          path: cnc/test-results/mobile-home-final-v2/
          if-no-files-found: error
          retention-days: 30
