name: CNC data backup history migration smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-data-backup-history-migration-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact tested head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          mkdir -p cnc/test-results
          printf '{"expectedHead":"%s","testedHead":"%s"}\n' "$EXPECTED_HEAD" "$ACTUAL_HEAD" > cnc/test-results/data-backup-history-migration-identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: node --check cnc/tests/mobile-data-backup-history-migration-smoke.cjs
      - run: node cnc/tests/mobile-data-backup-history-migration-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-data-backup-history-migration-${{ github.run_id }}
          path: cnc/test-results/data-backup-history-migration*
          if-no-files-found: warn
