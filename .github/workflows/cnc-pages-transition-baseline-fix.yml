name: CNC Pages transition baseline one-shot repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/learning-depth-refactor-20260805
          fetch-depth: 1

      - name: Register current main PWA as controlled transition baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [
              ('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs', 'branchTargetPwaBuild'),
              ('cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs', 'branchTargetPwaBuild'),
              ('cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs', 'expectedPwaBuild'),
          ]
          current_main = "const currentMainPwaBuild = '20260804-pwa13';"
          for path, target in pages:
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              previous_line = "const previousPublicPwaBuild = '20260803-pwa9';"
              if current_main not in source:
                  if source.count(previous_line) != 1:
                      raise SystemExit(f'{path}: previous public PWA anchor drift')
                  source = source.replace(previous_line, previous_line + '\n' + current_main, 1)
              old = f'[previousPublicPwaBuild, {target}]'
              new = f'[previousPublicPwaBuild, currentMainPwaBuild, {target}]'
              count = source.count(old)
              if count < 2:
                  raise SystemExit(f'{path}: expected at least 2 controlled-build lists, found {count}')
              source = source.replace(old, new)
              file.write_text(source, encoding='utf-8', newline='\n')

          audit = Path('cnc/tests/pwa-build-reference-audit-smoke.cjs')
          source = audit.read_text(encoding='utf-8')
          anchor = "  {\n    file: 'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',\n    version: '20260803-pwa9',"
          if source.count(anchor) != 1:
              raise SystemExit('PWA audit legacy anchor drift')
          additions = """  {
    file: 'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
    version: '20260804-pwa13',
    reason: 'PR合并前允许读取当前main的PWA13作为受控部署过渡基线，不作为分支目标构建针'
  },
  {
    file: 'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
    version: '20260804-pwa13',
    reason: 'PR合并前允许读取当前main的PWA13作为受控部署过渡基线，不作为分支目标构建针'
  },
  {
    file: 'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
    version: '20260804-pwa13',
    reason: 'PR合并前允许读取当前main的PWA13作为受控部署过渡基线，不作为分支目标构建针'
  },
"""
          if "version: '20260804-pwa13'" not in source:
              source = source.replace(anchor, additions + anchor, 1)
          audit.write_text(source, encoding='utf-8', newline='\n')
          PY

      - name: Validate transition contracts
        shell: bash
        run: |
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node --check cnc/tests/pwa-build-reference-audit-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/cnc-pages-transition-baseline-fix.yml
          git config user.name '潘斌'
          git config user.email 'smxpxb008@gmail.com'
          git add cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs \
            cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs \
            cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs \
            cnc/tests/pwa-build-reference-audit-smoke.cjs
          git commit -m 'fix(cnc-pages): allow controlled main PWA13 transition baseline'
          git push origin HEAD:codex/learning-depth-refactor-20260805
