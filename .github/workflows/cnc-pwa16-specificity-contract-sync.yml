name: CNC PWA16 specificity contract sync

on:
  push:
    branches:
      - chatgpt/cnc-sublesson-specificity-20260806
    paths:
      - 'cnc/tools/sync-pwa16-specificity-contracts.py'
      - '.github/workflows/cnc-pwa16-specificity-contract-sync.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: cnc-pwa16-specificity-contract-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'panxiangbin/yuhua' && github.ref == 'refs/heads/chatgpt/cnc-sublesson-specificity-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出当前CNC分支
        uses: actions/checkout@v4
        with:
          ref: chatgpt/cnc-sublesson-specificity-20260806
          fetch-depth: 0

      - name: 同步PWA16与PWA15双版本契约
        run: python3 cnc/tools/sync-pwa16-specificity-contracts.py

      - name: 验证JavaScript与PWA构建引用
        run: |
          node --check cnc/learning-sublesson-specificity.js
          node --check cnc/tests/learning-sublesson-specificity-smoke.cjs
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node cnc/tests/learning-sublesson-specificity-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check

      - name: 保存工作流同步诊断
        run: |
          mkdir -p cnc/test-results/pwa16-contract-sync/workflows
          cp .github/workflows/cnc-ai-teacher-offline-core-pages-smoke.yml cnc/test-results/pwa16-contract-sync/workflows/
          cp .github/workflows/cnc-beginner-placement-offline-pages-smoke.yml cnc/test-results/pwa16-contract-sync/workflows/
          cp .github/workflows/cnc-pwa-offline-cache-smoke.yml cnc/test-results/pwa16-contract-sync/workflows/
          cp .github/workflows/cnc-pwa-self-test-smoke.yml cnc/test-results/pwa16-contract-sync/workflows/
          cp .github/workflows/cnc-pwa-upgrade-data-smoke.yml cnc/test-results/pwa16-contract-sync/workflows/
          cp .github/workflows/cnc-training-camp-route-handoff-pages-smoke.yml cnc/test-results/pwa16-contract-sync/workflows/
          git diff -- .github/workflows > cnc/test-results/pwa16-contract-sync/workflow-changes.patch
          git diff -- cnc/tests > cnc/test-results/pwa16-contract-sync/test-changes.patch

      - name: 上传同步诊断产物
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa16-contract-sync-${{ github.run_id }}
          path: cnc/test-results/pwa16-contract-sync/**
          if-no-files-found: error
          retention-days: 14

      - name: 记录诊断运行
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 163 --repo panxiangbin/yuhua --body "PWA16工作流同步诊断 Run: ${GITHUB_RUN_ID}"
