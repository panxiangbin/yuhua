name: CNC training certificate completion integrity smoke

on:
  pull_request:
    paths:
      - 'cnc/training-certificate.html'
      - 'cnc/tests/mobile-training-certificate-completion-integrity-smoke.cjs'
      - '.github/workflows/cnc-training-certificate-completion-integrity-smoke.yml'
  workflow_dispatch:

jobs:
  training-certificate-completion-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
      - name: Verify exact tested head
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD"
          mkdir -p cnc/test-results/training-certificate-completion-integrity
          printf '{"testedHead":"%s","expectedHead":"%s","event":"%s"}\n' "$actual" "$EXPECTED_HEAD" "${{ github.event_name }}" > cnc/test-results/training-certificate-completion-integrity/identity.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright@1.52.0
      - run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: node --check cnc/tests/mobile-training-certificate-completion-integrity-smoke.cjs
      - name: Start static server
        run: python3 -m http.server 4176 --directory . > /tmp/cnc-server.log 2>&1 &
      - name: Chromium 390x844 certificate completion integrity
        run: node cnc/tests/mobile-training-certificate-completion-integrity-smoke.cjs | tee cnc/test-results/training-certificate-completion-integrity/browser.log
      - name: Upload exact-head diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-training-certificate-completion-integrity-${{ github.run_id }}
          path: cnc/test-results/training-certificate-completion-integrity
          if-no-files-found: error
