name: CNC PWA15 visible copy sync

on:
  pull_request:
    paths:
      - 'cnc/pwa-self-test.html'
      - 'cnc/pwa-status.html'
      - '.github/workflows/cnc-pwa15-visible-copy-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-pwa15-visible-copy-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'chatgpt/cnc-learning-mobile-accordion-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Synchronize visible PWA15 copy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          self_path = Path('cnc/pwa-self-test.html')
          self_text = self_path.read_text(encoding='utf-8')
          self_text, count = re.subn(
              r'PWA\d+用于刷新80个图文小课(?:、紧凑学习目录)?与AI老师学习档案异常保护',
              'PWA15用于刷新80个图文小课、紧凑学习目录与AI老师学习档案异常保护',
              self_text,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'pwa-self-test visible copy replacement count={count}')
          self_path.write_text(self_text, encoding='utf-8')

          status_path = Path('cnc/pwa-status.html')
          status_text = status_path.read_text(encoding='utf-8')
          status_text, count = re.subn(
              r'<strong id="expected">[^<]+</strong>',
              '<strong id="expected">20260806-pwa15</strong>',
              status_text,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'pwa-status expected copy replacement count={count}')
          status_text, count = re.subn(
              r'PWA\d+会刷新[^；]+；',
              'PWA15会刷新80个图文小课、紧凑学习目录与AI老师学习档案异常保护，确保损坏记录不会在旧离线缓存中被误显示为零进度；',
              status_text,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'pwa-status visible copy replacement count={count}')
          status_path.write_text(status_text, encoding='utf-8')
          PY

          grep -F "PWA15用于刷新80个图文小课、紧凑学习目录与AI老师学习档案异常保护" cnc/pwa-self-test.html
          grep -F '<strong id="expected">20260806-pwa15</strong>' cnc/pwa-status.html
          grep -F 'PWA15会刷新80个图文小课、紧凑学习目录与AI老师学习档案异常保护' cnc/pwa-status.html
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check
      - name: Commit visible copy
        run: |
          if [ -z "$(git status --porcelain -- cnc/pwa-self-test.html cnc/pwa-status.html)" ]; then
            echo 'Visible PWA15 copy already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/pwa-self-test.html cnc/pwa-status.html
          git commit -m 'fix(cnc-pwa): align visible PWA15 copy'
          git push origin HEAD:chatgpt/cnc-learning-mobile-accordion-20260806
