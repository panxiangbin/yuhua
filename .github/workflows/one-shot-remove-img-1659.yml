name: One-shot remove missing IMG 1659 poster

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/remove-missing-img-1659-poster'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-missing-img-1659-poster
          fetch-depth: 0
      - name: Apply deterministic manifest cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          manifest_pattern = re.compile(
              r'(?m)^(\s*"file": "assets/videos/img_1659\.mp4"),\n\s*"poster": "assets/videos/img_1659\.jpg"'
          )

          for filename in ("assets/videos.js", "videos.json"):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              updated, count = manifest_pattern.subn(r"\1", text)
              if count != 1:
                  raise SystemExit(f"Expected exactly one IMG_1659 poster reference in {filename}, found {count}")
              path.write_text(updated, encoding="utf-8")

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^\s*"assets/videos/img_1659\.jpg": true,\n',
              "",
              text,
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one IMG_1659 missing-poster fallback, found {count}")

          old_cache = "assets/videos.js?v=20260920a"
          new_cache = "assets/videos.js?v=20260920b"
          if updated.count(old_cache) != 1:
              raise SystemExit(f"Expected exactly one cache token {old_cache}")
          updated = updated.replace(old_cache, new_cache, 1)
          index.write_text(updated, encoding="utf-8")

          for filename in ("assets/videos.js", "videos.json", "index.html"):
              if "assets/videos/img_1659.jpg" in Path(filename).read_text(encoding="utf-8"):
                  raise SystemExit(f"Stale IMG_1659 poster reference remains in {filename}")
      - name: Verify diff
        run: |
          git diff --check
          git diff -- assets/videos.js videos.json index.html
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/videos.js videos.json index.html
          git commit -m "fix: remove missing img_1659 poster reference"
          git push origin HEAD:fix/remove-missing-img-1659-poster
