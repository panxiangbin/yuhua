name: CNC real mobile smoke test

on:
  pull_request:
    paths:
      - "cnc/**"
      - ".github/workflows/cnc-mobile-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start current and baseline sites
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          git worktree add --force /tmp/cnc-baseline "origin/${BASE_REF}"
          python3 -m http.server 4173 --directory . >/tmp/cnc-current-http.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/cnc-baseline >/tmp/cnc-baseline-http.log 2>&1 &
          for port in 4173 4174; do
            ready=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${port}/cnc/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat /tmp/cnc-current-http.log || true
              cat /tmp/cnc-baseline-http.log || true
              exit 1
            fi
          done
          mkdir -p cnc/test-artifacts/industrial-card-sample

      - name: Mobile startup performance and console errors
        run: node cnc/tests/mobile-performance-smoke.cjs
      - name: Mobile canonical startup stays on dashboard
        run: node cnc/tests/mobile-startup-home-smoke.cjs
      - name: Mobile bottom navigation accessibility
        run: node cnc/tests/mobile-nav-accessibility-smoke.cjs
      - name: Mobile homepage industrial card sample
        run: node cnc/tests/mobile-home-smoke.cjs
      - name: Mobile beginner training camp foundation
        run: node cnc/tests/mobile-training-camp-foundation-smoke.cjs
      - name: Mobile beginner practice and wrong-answer loop
        run: |
          set -o pipefail
          node cnc/tests/mobile-training-practice-smoke.cjs 2>&1 | tee cnc/test-artifacts/industrial-card-sample/training-practice.log
      - name: Mobile advanced beginner practice types
        run: node cnc/tests/mobile-training-advanced-practice-smoke.cjs
      - name: Mobile course practice completion gates
        run: |
          set -o pipefail
          node cnc/tests/mobile-training-course-gates-smoke.cjs 2>&1 | tee cnc/test-artifacts/industrial-card-sample/training-course-gates.log
      - name: Mobile homepage recent record cards
        run: node cnc/tests/mobile-industrial-dashboard-recents-smoke.cjs
      - name: Mobile industrial homepage and G01 detail acceptance
        run: node cnc/tests/mobile-industrial-sample-smoke.cjs
      - name: Mobile industrial query workspace
        run: node cnc/tests/mobile-industrial-workspace-smoke.cjs
      - name: Mobile industrial calculator tools
        run: node cnc/tests/mobile-industrial-tools-smoke.cjs
      - name: Mobile industrial diagnosis workflow
        run: |
          set -o pipefail
          node cnc/tests/mobile-industrial-diagnosis-smoke.cjs 2>&1 | tee cnc/test-artifacts/industrial-card-sample/diagnosis.log
      - name: Mobile industrial recent and favorite records
        run: node cnc/tests/mobile-industrial-records-smoke.cjs
      - name: Mobile industrial gallery and modal focus
        run: node cnc/tests/mobile-industrial-gallery-smoke.cjs
      - name: Mobile industrial knowledge map
        run: node cnc/tests/mobile-industrial-knowledge-map-smoke.cjs
      - name: Mobile industrial alarm and parameter details
        run: node cnc/tests/mobile-industrial-detail-pages-smoke.cjs
      - name: Mobile detail sharing and industrial navigation
        run: node cnc/tests/mobile-detail-share-smoke.cjs
      - name: Mobile alarm parameter fault split
        run: node cnc/tests/mobile-query-split-smoke.cjs
      - name: Mobile G-code clean layout
        run: node cnc/tests/mobile-gcode-layout-smoke.cjs
      - name: Mobile G-code search cards
        run: node cnc/tests/mobile-gcode-search-smoke.cjs
      - name: Mobile G01 detail content
        run: node cnc/tests/mobile-gcode-detail-content-smoke.cjs
      - name: Mobile G-code fullscreen panel
        run: node cnc/tests/mobile-gcode-detail-panel-smoke.cjs
      - name: Mobile parameter clean journey
        run: node cnc/tests/mobile-other-search-smoke.cjs
      - name: Service Worker remains disabled
        run: node cnc/tests/mobile-sw-smoke.cjs

      - name: Generate 390x844 before and after screenshots
        if: always()
        env:
          CURRENT_URL: http://127.0.0.1:4173
          BASELINE_URL: http://127.0.0.1:4174
        run: node cnc/tests/mobile-industrial-visual.cjs

      - name: Upload industrial sample screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-industrial-card-sample-390x844
          path: cnc/test-artifacts/industrial-card-sample/*
          retention-days: 14
          if-no-files-found: error
