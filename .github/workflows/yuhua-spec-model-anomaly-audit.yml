name: Yuhua suspicious specification model audit

on:
  pull_request:
    paths:
      - 'products.json'
      - 'specs_index.json'
      - 'specs/**'
      - 'downloads/specs/**'
      - 'tools/check_product_data.py'
      - 'tools/audit_suspicious_spec_models.py'
      - 'tools/audit_spec_model_evidence_closure.py'
      - '.github/workflows/yuhua-spec-model-anomaly-audit.yml'
  push:
    branches: [main]
    paths:
      - 'products.json'
      - 'specs_index.json'
      - 'specs/**'
      - 'downloads/specs/**'
      - 'tools/check_product_data.py'
      - 'tools/audit_suspicious_spec_models.py'
      - 'tools/audit_spec_model_evidence_closure.py'
      - '.github/workflows/yuhua-spec-model-anomaly-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile audit scripts
        run: python -m py_compile tools/check_product_data.py tools/audit_suspicious_spec_models.py tools/audit_spec_model_evidence_closure.py

      - name: Verify exact-model evidence preserves internal whitespace
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from audit_suspicious_spec_models import audit

          products = [
              {'型号': 'AB C', '类别': 'test'},
              {'型号': 'SHZ-95B', '类别': 'test'},
          ]
          specs = [
              {'model': 'ABC.DOCX', 'title': 'ABC manual', 'series': '', 'page': 'a', 'dl': 'a'},
              {'model': 'AB C.DOCX', 'title': 'AB C manual', 'series': '', 'page': 'b', 'dl': 'b'},
              {'model': 'ABC', 'title': 'existing ABC', 'series': '', 'page': 'c', 'dl': 'c'},
              {'model': 'SHZ-95B.DOCX', 'title': 'SHZ-95B manual', 'series': '', 'page': 'd', 'dl': 'd'},
          ]
          report = audit(products, specs)
          rows = {row['model']: row for row in report['all_suspicious_records']}

          whitespace_product = rows['ABC.DOCX']
          assert whitespace_product['exact_product_model_matches'] == []
          assert whitespace_product['whitespace_normalized_only_product_model_matches']
          assert whitespace_product['fix_readiness'] == 'insufficient_cross_source_evidence'

          whitespace_spec = rows['AB C.DOCX']
          assert whitespace_spec['exact_product_model_matches']
          assert whitespace_spec['existing_spec_model_matches'] == []
          assert whitespace_spec['whitespace_normalized_only_existing_spec_model_matches']
          assert whitespace_spec['fix_readiness'] == 'whitespace_normalized_existing_spec_review'

          literal_exact = rows['SHZ-95B.DOCX']
          assert literal_exact['exact_product_model_matches']
          assert literal_exact['whitespace_normalized_only_product_model_matches'] == []
          assert literal_exact['fix_readiness'] == 'supported_correction_candidate'
          print('Literal exact-model regression guard: OK')
          PY

      - name: Classify suspicious specification models
        run: |
          python tools/audit_suspicious_spec_models.py \
            --json-output spec_model_anomaly_report.json

      - name: Verify page and download evidence for supported suffix candidates
        run: |
          python tools/audit_spec_model_evidence_closure.py \
            --json-output spec_model_evidence_closure_report.json

      - name: Verify report is read-only and internally consistent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('spec_model_anomaly_report.json').read_text(encoding='utf-8'))
          summary = report['summary']
          categories = summary['category_counts']
          groups = report['review_groups']

          assert report['policy']['read_only'] is True
          assert report['policy']['auto_fix_count'] == 0
          assert summary['suspicious_model_count'] == sum(categories.values())
          assert summary['filename_extension_suffix_count'] == categories.get('filename_extension_suffix', 0)
          assert summary['extension_placeholder_count'] == categories.get('extension_placeholder', 0)
          assert len(report['all_suspicious_records']) == summary['suspicious_model_count']

          assert summary['supported_correction_candidate_count'] == len(groups['supported_correction_candidates'])
          assert summary['existing_spec_model_collision_count'] == len(groups['existing_spec_model_collision_risk'])
          assert summary['whitespace_normalized_existing_spec_review_count'] == len(groups['whitespace_normalized_existing_spec_review'])
          assert summary['suffix_candidate_whitespace_normalized_product_match_count'] == len(groups['suffix_candidates_with_whitespace_normalized_product_match'])
          assert summary['other_unresolved_suffix_count'] == len(groups['other_unresolved_suffix_candidates'])

          # A supported correction candidate must be backed by both the title and
          # a literal existing product model, must not be a capacity-only token,
          # and must not collide with an existing literal or whitespace-only
          # specification model spelling.
          for row in groups['supported_correction_candidates']:
              assert row['category'] == 'filename_extension_suffix'
              assert row['candidate_in_title'] is True
              assert row['candidate_is_capacity_only'] is False
              assert row['candidate_itself_suspicious'] is False
              assert row['exact_product_model_matches']
              assert row['existing_spec_model_matches'] == []
              assert row['whitespace_normalized_only_existing_spec_model_matches'] == []
              assert row['fix_readiness'] == 'supported_correction_candidate'

          for row in groups['existing_spec_model_collision_risk']:
              assert row['existing_spec_model_matches']
              assert row['fix_readiness'] == 'existing_spec_model_collision'

          for row in groups['whitespace_normalized_existing_spec_review']:
              assert row['existing_spec_model_matches'] == []
              assert row['whitespace_normalized_only_existing_spec_model_matches']
              assert row['fix_readiness'] == 'whitespace_normalized_existing_spec_review'

          # Every .DOC/.DOCX suffix anomaly must land in exactly one readiness bucket.
          readiness = summary['fix_readiness_counts']
          suffix_partition = (
              readiness.get('supported_correction_candidate', 0)
              + readiness.get('existing_spec_model_collision', 0)
              + readiness.get('whitespace_normalized_existing_spec_review', 0)
              + readiness.get('capacity_only_manual_review', 0)
              + readiness.get('candidate_still_suspicious', 0)
              + readiness.get('insufficient_cross_source_evidence', 0)
          )
          assert suffix_partition == summary['filename_extension_suffix_count']
          print('Specification-model anomaly report: OK')
          PY

      - name: Verify evidence-closure report is conservative and complete
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          anomaly = json.loads(Path('spec_model_anomaly_report.json').read_text(encoding='utf-8'))
          closure = json.loads(Path('spec_model_evidence_closure_report.json').read_text(encoding='utf-8'))
          summary = closure['summary']
          records = closure['all_supported_candidate_records']

          assert closure['policy']['read_only'] is True
          assert closure['policy']['auto_fix_count'] == 0
          assert closure['policy']['complete_evidence_does_not_authorize_source_rewrite'] is True
          assert summary['source_supported_correction_candidate_count'] == anomaly['summary']['supported_correction_candidate_count']
          assert summary['source_supported_correction_candidate_count'] == len(records)
          assert summary['evidence_closure_complete_count'] + summary['evidence_gap_count'] == len(records)
          assert len(closure['review_sample']) <= 3

          for row in records:
              assert row['source_fix_readiness'] == 'supported_correction_candidate'
              assert row['review_candidate']
              assert row['exact_product_model_matches']
              if row['evidence_closure_complete_for_review']:
                  assert row['failed_checks'] == []
                  assert row['page_read_error'] == ''
                  assert all(row['evidence_checks'].values())

          print('Specification-model evidence closure report: OK')
          PY

      - name: Confirm audits did not modify source facts or source documents
        run: git diff --exit-code -- products.json specs_index.json specs downloads/specs

      - name: Upload anomaly audit reports
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-spec-model-anomaly-report
          path: |
            spec_model_anomaly_report.json
            spec_model_evidence_closure_report.json
          if-no-files-found: error
          retention-days: 90

      # Audit-only by design: source product/specification data is never rewritten.
