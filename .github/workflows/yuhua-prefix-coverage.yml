name: Yuhua detail-page prefix coverage

on:
  pull_request:
    paths:
      - 'assets/data.js'
      - 'assets/pages.js'
      - 'app.js'
      - 'tools/audit_page_prefix_hits.py'
      - '.github/workflows/yuhua-prefix-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'assets/data.js'
      - 'assets/pages.js'
      - 'app.js'
      - 'tools/audit_page_prefix_hits.py'
      - '.github/workflows/yuhua-prefix-coverage.yml'

permissions:
  contents: read

jobs:
  audit-prefix-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit actual detail-page prefix hits
        run: python tools/audit_page_prefix_hits.py --json-output prefix_coverage_report.json

      - name: Enforce safe runtime resolution
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('prefix_coverage_report.json').read_text(encoding='utf-8'))
          assert report['runtime_ambiguous_count'] == 0, (
              'Detail-page runtime ambiguity detected: ' + repr(report['runtime_ambiguous'])
          )
          assert report['missing_explicit_detail_target_count'] == 0, (
              'Explicit product detail points to missing file: '
              + repr(report['missing_explicit_detail_targets'])
          )

          # TGYF-C is a deliberate longer-prefix split from generic TGYF. Keep a
          # regression gate here because dropping this row would silently send
          # TGYF-C models to the TGYF-A detail page while remaining unambiguous.
          tgyf_c = [
              item for item in report['prefix_usage']
              if item['key'] == 'hp_reactor' and item['prefix'] == 'TGYF-C'
          ]
          assert len(tgyf_c) == 1, 'Expected exactly one hp_reactor / TGYF-C prefix mapping'
          assert tgyf_c[0]['page'] == 'product/tgyf-c.html', (
              'TGYF-C must resolve to product/tgyf-c.html, got: ' + repr(tgyf_c[0]['page'])
          )
          assert tgyf_c[0]['winner_count'] > 0, (
              'TGYF-C mapping exists but no published TGYF-C model resolves through it'
          )
          print('Runtime detail-page safety gate: OK (including TGYF-C split route)')
          PY

      - name: Upload prefix coverage report
        uses: actions/upload-artifact@v4
        with:
          name: yuhua-prefix-coverage-report
          path: prefix_coverage_report.json
