name: CNC AI teacher mobile smoke fixture fix

on:
  push:
    branches:
      - codex/cnc-ai-teacher-simulator-pass-pwa43
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Align shared AI teacher mobile fixture with final simulator contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cnc/tests/mobile-ai-teacher-smoke.cjs')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ("workholding: { passed: false, bestScore: 85 }", "'workholding-check': { passed: false, bestScore: 100 }"),
              ("alarm: { passed: false, bestScore: 75 }", "'alarm-troubleshooting': { passed: false, bestScore: 90 }")
          ]
          for old, new in replacements:
              assert s.count(old) == 1, f'fixture target mismatch: {old}'
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          node --check cnc/tests/mobile-ai-teacher-smoke.cjs
          grep -Fq "'workholding-check': { passed: false, bestScore: 100 }" cnc/tests/mobile-ai-teacher-smoke.cjs
          grep -Fq "'alarm-troubleshooting': { passed: false, bestScore: 90 }" cnc/tests/mobile-ai-teacher-smoke.cjs
          grep -Fq "assert.equal(await page.locator('#sim-progress').textContent(), '2/13')" cnc/tests/mobile-ai-teacher-smoke.cjs
      - name: Remove one-time workflow before final commit
        run: git rm -f .github/workflows/cnc-ai-teacher-mobile-smoke-fixture-fix.yml
      - name: Create generated final-tree commit
        id: generated
        shell: bash
        env:
          BASE_MAIN: 036d5e68e65d93586c54fb9c8b1e3179a81c9dca
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc/tests/mobile-ai-teacher-smoke.cjs .github/workflows/cnc-ai-teacher-mobile-smoke-fixture-fix.yml
          git commit -m 'CNC：对齐AI老师共享模拟回归夹具'
          git rev-parse HEAD | tee generated-sha.txt
          git diff --name-only "$BASE_MAIN" HEAD | tee final-diff-files.txt
          test "$(git diff --name-only "$BASE_MAIN" HEAD | wc -l | tr -d ' ')" = '35'
          ! grep -Fxq '.github/workflows/cnc-ai-teacher-mobile-smoke-fixture-fix.yml' final-diff-files.txt
          git diff --name-only "$BASE_MAIN" HEAD | awk '($0 ~ /^cnc\//) || ($0 ~ /^\.github\/workflows\/cnc-.*\.ya?ml$/) {next} {print "unexpected final path: "$0; bad=1} END{exit bad}'
      - name: Attempt non-force branch push
        shell: bash
        run: |
          set +e
          git push origin HEAD:codex/cnc-ai-teacher-simulator-pass-pwa43 > push-output.txt 2>&1
          code=$?
          echo "$code" > push-code.txt
          cat push-output.txt
          exit 0
      - name: Upload fixture-fix diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-ai-teacher-mobile-smoke-fixture-fix-${{ github.run_id }}
          path: |
            generated-sha.txt
            final-diff-files.txt
            push-code.txt
            push-output.txt
          retention-days: 7
          if-no-files-found: warn
