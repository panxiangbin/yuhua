name: CNC learning mobile PWA15 sync

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-learning-mobile-pwa15-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cnc-learning-mobile-pwa15-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'chatgpt/cnc-learning-mobile-accordion-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synchronize PWA15 active references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json
          import re

          CURRENT_PWA = '20260806-pwa15'
          PREVIOUS_PWA = '20260806-pwa14'
          CURRENT_CACHE = '20260806-learning15'
          PREVIOUS_CACHE = '20260806-learning14'

          def edit(path, replacements):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              original = text
              for pattern, replacement, expected in replacements:
                  text, count = re.subn(pattern, replacement, text, count=expected)
                  if count != expected:
                      raise RuntimeError(f'{path}: expected {expected} replacement(s) for {pattern!r}, got {count}')
              if text != original:
                  file.write_text(text, encoding='utf-8')
                  print(f'updated {path}')

          edit('cnc/sw.js', [
              (r"const BUILD = '20260806-pwa14';", f"const BUILD = '{CURRENT_PWA}';", 1),
              (r"const CACHE_REVISION = '20260806-learning14';", f"const CACHE_REVISION = '{CURRENT_CACHE}';", 1),
          ])

          info_path = Path('cnc/build-info.json')
          info = json.loads(info_path.read_text(encoding='utf-8'))
          if info.get('pwaBuild') not in {PREVIOUS_PWA, CURRENT_PWA}:
              raise RuntimeError(f"unexpected build-info pwaBuild: {info.get('pwaBuild')}")
          if info.get('cacheRevision') not in {PREVIOUS_CACHE, CURRENT_CACHE}:
              raise RuntimeError(f"unexpected build-info cacheRevision: {info.get('cacheRevision')}")
          info['pwaBuild'] = CURRENT_PWA
          info['cacheRevision'] = CURRENT_CACHE
          marker = '学习目录紧凑布局'
          stages = str(info.get('contentStage') or '')
          if marker not in stages:
              info['contentStage'] = f'{stages} · {marker}' if stages else marker
          info['generatedAt'] = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          info_path.write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('updated cnc/build-info.json')

          edit('cnc/pwa-status.html', [
              (r"const EXPECTED='20260806-pwa14'", f"const EXPECTED='{CURRENT_PWA}'", 1),
              (r"const EXPECTED_CACHE='20260806-learning14'", f"const EXPECTED_CACHE='{CURRENT_CACHE}'", 1),
          ])
          edit('cnc/pwa-self-test.html', [
              (r"const EXPECTED='20260806-pwa14'", f"const EXPECTED='{CURRENT_PWA}'", 1),
              (r"const EXPECTED_CACHE='20260806-learning14'", f"const EXPECTED_CACHE='{CURRENT_CACHE}'", 1),
          ])
          edit('cnc/tests/mobile-pwa-offline-cache-smoke.cjs', [
              (r"const PWA_BUILD = '20260806-pwa14';", f"const PWA_BUILD = '{CURRENT_PWA}';", 1),
              (r"const CACHE_REVISION = '20260806-learning14';", f"const CACHE_REVISION = '{CURRENT_CACHE}';", 1),
          ])
          edit('cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs', [
              (r"const PWA_BUILD = '20260806-pwa14';", f"const PWA_BUILD = '{CURRENT_PWA}';", 1),
              (r"const CACHE_REVISION = '20260806-learning14';", f"const CACHE_REVISION = '{CURRENT_CACHE}';", 1),
          ])
          edit('cnc/tests/mobile-pwa-upgrade-data-smoke.cjs', [
              (r"const PREVIOUS_PWA_BUILD = '20260804-pwa13';", f"const PREVIOUS_PWA_BUILD = '{PREVIOUS_PWA}';", 1),
              (r"const CURRENT_PWA_BUILD = '20260806-pwa14';", f"const CURRENT_PWA_BUILD = '{CURRENT_PWA}';", 1),
              (r"const PREVIOUS_CACHE_REVISION = '20260804-mobile13';", f"const PREVIOUS_CACHE_REVISION = '{PREVIOUS_CACHE}';", 1),
              (r"const CURRENT_CACHE_REVISION = '20260806-learning14';", f"const CURRENT_CACHE_REVISION = '{CURRENT_CACHE}';", 1),
          ])
          edit('cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs', [
              (r"const branchTargetPwaBuild = '20260806-pwa14';", f"const branchTargetPwaBuild = '{CURRENT_PWA}';", 1),
              (r"const previousPublicPwaBuild = '20260804-pwa13';", f"const previousPublicPwaBuild = '{PREVIOUS_PWA}';", 1),
              (r"\[branchTargetPwaBuild\]: '20260806-learning14'", f"[branchTargetPwaBuild]: '{CURRENT_CACHE}'", 1),
              (r"\[previousPublicPwaBuild\]: '20260804-mobile13'", f"[previousPublicPwaBuild]: '{PREVIOUS_CACHE}'", 1),
          ])
          edit('cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs', [
              (r"const branchTargetPwaBuild = '20260806-pwa14';", f"const branchTargetPwaBuild = '{CURRENT_PWA}';", 1),
              (r"const previousPublicPwaBuild = '20260804-pwa13';", f"const previousPublicPwaBuild = '{PREVIOUS_PWA}';", 1),
              (r"\[branchTargetPwaBuild\]: '20260806-learning14'", f"[branchTargetPwaBuild]: '{CURRENT_CACHE}'", 1),
              (r"\[previousPublicPwaBuild\]: '20260804-mobile13'", f"[previousPublicPwaBuild]: '{PREVIOUS_CACHE}'", 1),
          ])
          edit('cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs', [
              (r"const expectedPwaBuild = '20260806-pwa14';", f"const expectedPwaBuild = '{CURRENT_PWA}';", 1),
              (r"const previousPublicPwaBuild = '20260804-pwa13';", f"const previousPublicPwaBuild = '{PREVIOUS_PWA}';", 1),
              (r"\[expectedPwaBuild\]: '20260806-learning14'", f"[expectedPwaBuild]: '{CURRENT_CACHE}'", 1),
              (r"\[previousPublicPwaBuild\]: '20260804-mobile13'", f"[previousPublicPwaBuild]: '{PREVIOUS_CACHE}'", 1),
          ])
          PY

          node --check cnc/sw.js
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/mobile-pwa-profile-bfcache-smoke.cjs
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          git diff --check
      - name: Commit synchronized CNC resources
        run: |
          if [ -z "$(git status --porcelain -- cnc)" ]; then
            echo 'PWA15 CNC resources already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc
          git commit -m 'chore(cnc-pwa): bump PWA15 for compact learning directory'
          git push origin HEAD:chatgpt/cnc-learning-mobile-accordion-20260806
