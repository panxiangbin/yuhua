name: CNC PWA upgrade data smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-upgrade-data-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnc-pwa-upgrade-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate current upgrade contract
        run: |
          mkdir -p cnc/test-results/pwa-upgrade-data
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pwa-build-reference-audit-smoke.cjs
          node --check cnc/sw.js
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const test = fs.readFileSync('cnc/tests/mobile-pwa-upgrade-data-smoke.cjs', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild) throw new Error(`Service Worker/build-info mismatch: ${swBuild} / ${info.pwaBuild}`);
          if (!test.includes(`const CURRENT_PWA_BUILD = '${info.pwaBuild}'`)) throw new Error('upgrade current PWA target mismatch');
          if (!test.includes("const PREVIOUS_PWA_BUILD = '20260804-pwa12'")) throw new Error('upgrade previous PWA target mismatch');
          for (const token of ['cnc_training_profile_v1', 'cnc_training_practice_v1', 'cnc_training_simulator_v1', 'other-app-cache-v1']) {
            if (!test.includes(token)) throw new Error(`upgrade data contract missing: ${token}`);
          }
          NODE
      - name: Install Playwright test runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 PWA upgrade data smoke
        env:
          DEBUG: pw:browser
        run: node cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-upgrade-data-${{ github.run_id }}
          path: |
            cnc/test-results/pwa-upgrade-data/**
            cnc/test-results/pwa-upgrade-data-*
          if-no-files-found: error
          retention-days: 14
