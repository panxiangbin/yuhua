name: CNC PWA upgrade data smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-upgrade-data-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pwa-upgrade-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize diagnostics
        run: |
          mkdir -p cnc/test-results/pwa-upgrade-data
          node - <<'NODE'
          const fs = require('fs');
          fs.writeFileSync('cnc/test-results/pwa-upgrade-data/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            headSha: process.env.GITHUB_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Validate PWA upgrade data contract
        run: |
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/sw.js
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const test = fs.readFileSync('cnc/tests/mobile-pwa-upgrade-data-smoke.cjs', 'utf8');
          const placement = fs.readFileSync('cnc/beginner-placement.html', 'utf8');
          const camp = fs.readFileSync('cnc/training-camp.html', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          const swCacheRevision = sw.match(/const CACHE_REVISION = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild) throw new Error(`Service Worker/build-info mismatch: ${swBuild} / ${info.pwaBuild}`);
          if (swCacheRevision !== info.cacheRevision) throw new Error(`Service Worker/build-info cache mismatch: ${swCacheRevision} / ${info.cacheRevision}`);
          if (info.pwaBuild !== '20260806-pwa15') throw new Error(`unexpected PWA build: ${info.pwaBuild}`);
          if (info.cacheRevision !== '20260806-learning15') throw new Error(`unexpected cache revision: ${info.cacheRevision}`);
          if (!test.includes(`const CURRENT_PWA_BUILD = '${info.pwaBuild}'`)) throw new Error('upgrade test current PWA build mismatch');
          if (!test.includes(`const CURRENT_CACHE_REVISION = '${info.cacheRevision}'`)) throw new Error('upgrade test current cache revision mismatch');
          for (const required of [
            "const PREVIOUS_PWA_BUILD = '20260806-pwa14'",
            "const PREVIOUS_CACHE_REVISION = '20260806-learning14'",
            'cnc_training_profile_v1',
            'cnc_training_practice_v1',
            'cnc_training_simulator_v1',
            'indexedDB.open',
            'other-app-cache-v1',
            'beginner-placement.html',
            'training-camp\\.html',
            'beginnerPlacementColdOfflineAfterUpgrade: true',
            'beginnerPlacementCriticalSafetyGateAfterUpgrade: true',
            'trainingCampColdOfflineAfterUpgrade: true',
            'placementRouteHandoffColdOfflineAfterUpgrade: true',
            'placementRouteHandoffImmediateCleanup: true',
            'placementFirstStepClickColdOfflineAfterUpgrade: true',
            'placementFirstStepCoursesColdOfflineAfterUpgrade: true',
            'course-safety-foundation.html',
            'course-coordinate-axes.html',
            'course-g00-g01-basics.html',
            'ai-teacher.html',
            'ai-teacher-intake.html',
            'ai-teacher-explainability.html',
            'explainabilityColdOfflineAfterUpgrade: true'
          ]) {
            if (!test.includes(required)) throw new Error(`upgrade contract missing: ${required}`);
          }
          if (!placement.includes('criticalFailures') || !placement.includes("decision:'critical-safety'")) throw new Error('beginner placement critical safety gate missing');
          if (!placement.includes('cnc_beginner_placement_route_handoff_v1') || !camp.includes('cnc_beginner_placement_route_handoff_v1')) throw new Error('placement route handoff producer or consumer missing');
          for (const file of ['./training-camp.html','./course-safety-foundation.html','./course-coordinate-axes.html','./course-g00-g01-basics.html']) {
            if (!sw.includes(`'${file}'`)) throw new Error(`PWA core missing: ${file}`);
          }
          if (!sw.includes("name.startsWith('cnc-')") || !sw.includes('name !== STATIC_CACHE && name !== RUNTIME_CACHE')) {
            throw new Error('Service Worker old CNC cache cleanup contract missing');
          }
          if (!String(info.contentStage || '').includes('测评首步课程离线核心')) throw new Error('build marker missing placement first-step offline core');
          if (!String(info.contentStage || '').includes('正式课程开发占位清零')) throw new Error('build marker missing formal course content refresh');
          if (!String(info.contentStage || '').includes('AI老师学习档案异常保护')) throw new Error('build marker missing AI teacher data integrity protection');
          if (!String(info.contentStage || '').includes('80个图文小课')) throw new Error('build marker missing learning depth content');
          for (const forbidden of ['test.skip(', 'describe.skip(', 'it.skip(', 'process.exit(0)']) {
            if (test.includes(forbidden)) throw new Error(`upgrade test bypass found: ${forbidden}`);
          }
          NODE
      - name: Install Playwright test runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 PWA upgrade data smoke
        env:
          DEBUG: pw:browser
        run: node cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-upgrade-data-${{ github.run_id }}
          path: |
            cnc/test-results/pwa-upgrade-data/**
            cnc/test-results/pwa-upgrade-data-*
          if-no-files-found: error
          retention-days: 14
