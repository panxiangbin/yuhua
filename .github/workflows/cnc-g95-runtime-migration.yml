name: CNC G95 runtime safety migration

on:
  push:
    branches:
      - chatgpt/cnc-g95-runtime-safety

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Finalize CNC-only PWA35 contracts and G95 gates
        run: python3 cnc/tools/g95-finalize-migration.py
      - name: Commit final CNC-only migration state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnc .github/workflows/cnc-*.yml
          git status --short
          git commit -m 'test(cnc): 固化G95 PWA35可信度与冷离线门禁'
          git push origin HEAD:chatgpt/cnc-g95-runtime-safety
