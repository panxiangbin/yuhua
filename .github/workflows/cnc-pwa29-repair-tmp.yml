# one-shot repair: test files only; workflow cleanup is done through the repository API after success
name: CNC PWA29 gate repair temporary
on:
  push:
    branches:
      - 'codex/cnc-g28-reference-return-boundary'
    paths:
      - '.github/workflows/cnc-pwa29-repair-tmp.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cnc-pwa29-gate-repair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/codex/cnc-g28-reference-return-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply exact test repairs
        run: |
          python3 cnc/tests/_tmp-pwa29-gate-repair.py
          node --check cnc/tests/mobile-pwa-upgrade-data-smoke.cjs
          node --check cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs
          node --check cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs
          node --check cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs
          git diff --check
      - name: Audit test-only scope, clean helper and commit
        run: |
          python3 - <<'PY'
          import subprocess
          allowed = {
            'cnc/tests/pages-training-camp-route-handoff-deployment-smoke.cjs',
            'cnc/tests/pages-beginner-placement-offline-deployment-smoke.cjs',
            'cnc/tests/pages-ai-teacher-offline-core-deployment-smoke.cjs',
            'cnc/tests/mobile-pwa-upgrade-data-smoke.cjs',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != allowed:
            raise SystemExit('unexpected repaired file set: ' + ', '.join(sorted(changed)))
          PY
          git rm cnc/tests/_tmp-pwa29-gate-repair.py
          git config user.name 'CNC automation'
          git config user.email 'actions@users.noreply.github.com'
          git add cnc/tests/*.cjs
          git diff --cached --check
          git commit -m 'fix(cnc-pwa): 修复PWA29升级与Pages测试真实根因'
          git push origin HEAD:codex/cnc-g28-reference-return-boundary
