name: PWA Registration Contract Audit

on:
  push:
    branches: [upgrade-84h]
    paths:
      - "cnc/**/*.html"
      - "cnc/**/*.js"
      - "cnc/**/*.cjs"
      - "cnc/**/*.mjs"
      - "cnc/manifest.webmanifest"
      - "cnc/build-info.json"
      - "scripts/audit-pwa-registration-contract.cjs"
      - "scripts/check-no-direct-contact.cjs"
      - "scripts/audit-public-contact-leaks.cjs"
      - ".github/workflows/pwa-registration-contract-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "cnc/**/*.html"
      - "cnc/**/*.js"
      - "cnc/**/*.cjs"
      - "cnc/**/*.mjs"
      - "cnc/manifest.webmanifest"
      - "cnc/build-info.json"
      - "scripts/audit-pwa-registration-contract.cjs"
      - "scripts/check-no-direct-contact.cjs"
      - "scripts/audit-public-contact-leaks.cjs"
      - ".github/workflows/pwa-registration-contract-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check audit syntax
        run: node --check scripts/audit-pwa-registration-contract.cjs
      - name: Enforce no direct contact policy
        run: |
          node scripts/check-no-direct-contact.cjs
          node scripts/audit-public-contact-leaks.cjs
      - name: Audit PWA registration contract
        run: node scripts/audit-pwa-registration-contract.cjs
      - name: Upload PWA registration audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-registration-contract-audit
          path: test-artifacts/pwa-registration-contract-audit.json
          if-no-files-found: error
          retention-days: 14
