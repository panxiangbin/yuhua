name: CNC PWA offline cache smoke
on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-offline-cache-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cnc-pwa-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Initialize diagnostics
        run: |
          mkdir -p cnc/test-results/pwa-offline-workflow
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const testedHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          fs.writeFileSync('cnc/test-results/pwa-offline-workflow/workflow-bootstrap.json', JSON.stringify({
            stage: 'workflow-bootstrap',
            runId: process.env.GITHUB_RUN_ID,
            testedHead,
            eventSha: process.env.GITHUB_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            initializedAt: new Date().toISOString()
          }, null, 2));
          NODE
      - name: Validate starting assessment route handoff and first-step offline core contract
        run: |
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/sw.js
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const test = fs.readFileSync('cnc/tests/mobile-pwa-offline-cache-smoke.cjs', 'utf8');
          const selfTest = fs.readFileSync('cnc/pwa-self-test.html', 'utf8');
          const placement = fs.readFileSync('cnc/beginner-placement.html', 'utf8');
          const camp = fs.readFileSync('cnc/training-camp.html', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          const swCacheRevision = sw.match(/const CACHE_REVISION = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild) throw new Error(`Service Worker/build-info mismatch: ${swBuild} / ${info.pwaBuild}`);
          if (swCacheRevision !== info.cacheRevision) throw new Error(`Service Worker/build-info cache mismatch: ${swCacheRevision} / ${info.cacheRevision}`);
          if (info.pwaBuild !== '20260808-pwa24') throw new Error(`unexpected PWA build: ${info.pwaBuild}`);
          if (info.cacheRevision !== '20260808-learning24') throw new Error(`unexpected cache revision: ${info.cacheRevision}`);
          if (!test.includes("const PWA_BUILD = '20260808-pwa24'")) throw new Error('offline browser PWA build mismatch');
          if (!test.includes("const CACHE_REVISION = '20260808-learning24'")) throw new Error('offline browser cache revision mismatch');
          for (const file of [
            './training-practice.js',
            './training-profile.js',
            './beginner-placement.html',
            './training-camp.html',
            './learning-sublesson-specificity.js',
            './course-safety-foundation.html',
            './course-coordinate-axes.html',
            './course-g00-g01-basics.html',
            './ai-teacher.html',
            './ai-teacher-intake.html',
            './ai-teacher-explainability.html'
          ]) {
            if (!sw.includes(`'${file}'`)) throw new Error(`${file} missing from Service Worker core cache`);
            if (!test.includes(file)) throw new Error(`${file} missing from offline browser verification`);
            if (!selfTest.includes(file)) throw new Error(`${file} missing from PWA self-test required resources`);
          }
          for (const video of [
            './assets/videos/learning/stage01_safety.mp4',
            './assets/videos/learning/stage02_xyz.mp4',
            './assets/videos/learning/stage03_z_tool.mp4',
            './assets/videos/learning/stage04_program.mp4',
            './assets/videos/learning/stage05_g90_g91.mp4',
            './assets/videos/learning/stage06_g00_g01.mp4',
            './assets/videos/learning/stage07_sf.mp4',
            './assets/videos/learning/stage08_g02_g03.mp4',
            './assets/videos/learning/stage09_milling_direction.mp4',
            './assets/videos/learning/stage10_g41_g42.mp4',
            './assets/videos/learning/stage11_g81_g83.mp4',
            './assets/videos/learning/stage12_first_part.mp4'
          ]) {
            if (!sw.includes(`'${video}'`)) throw new Error(`${video} missing from Service Worker core cache`);
            if (!test.includes(video)) throw new Error(`${video} missing from offline browser verification`);
            if (!selfTest.includes(video)) throw new Error(`${video} missing from PWA self-test required resources`);
          }
          if (!placement.includes('criticalFailures') || !placement.includes("decision:'critical-safety'")) throw new Error('beginner placement critical safety gate missing');
          if (!placement.includes('cnc_beginner_placement_route_handoff_v1') || !camp.includes('cnc_beginner_placement_route_handoff_v1')) throw new Error('placement route handoff producer or consumer missing');
          for (const token of [
            'beginnerPlacementColdOffline: true',
            'beginnerPlacementCriticalSafetyGateColdOffline: true',
            'trainingCampColdOffline: true',
            'placementRouteHandoffColdOffline: true',
            'placementRouteHandoffImmediateCleanup: true',
            'placementFirstStepClickColdOffline: true',
            'placementFirstStepCoursesColdOffline: true',
            'trainingPracticeColdOfflineCore: true',
            'trainingProfileColdOfflineCore: true',
            'learningVideosColdOfflineCore: true',
            'learningVideoCorePaths: VIDEO_CORE_PATHS',
            'learningVideoCoreResponses: offlineVideoCore',
            "stage = 'cold-offline-video-core'",
            "'.mp4': 'video/mp4'",
            'item.bytes <= 0',
            'explainabilityColdOffline: true'
          ]) if (!test.includes(token)) throw new Error(`offline diagnostics missing: ${token}`);
          for (const stage of ['起点测评关键安全门禁','起点测评离线核心','测评路线一次性交接','训练营路线离线核心','测评首步课程离线核心','AI老师离线核心','正式课程开发占位清零','AI老师学习档案异常保护','80个图文小课','学习目录紧凑布局','80课现场动作与风险针对性','训练题库与成长档案离线核心','手机构建标记一致性','固定12关能力映射与真实薄弱课推荐','AI老师与固定12关成长档案语义一致','每日训练薄弱课错题精准回流','固定12关60题真实80分与关键题硬门禁','AI老师课程完成以真实完成记录为准']) {
            if (!String(info.contentStage || '').includes(stage)) throw new Error(`build marker missing: ${stage}`);
          }
          NODE
      - name: Install Playwright test runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 offline cache smoke
        env:
          DEBUG: pw:browser
        run: node cnc/tests/mobile-pwa-offline-cache-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-offline-${{ github.run_id }}
          path: cnc/test-results/pwa-offline-*
          if-no-files-found: error
          retention-days: 14
