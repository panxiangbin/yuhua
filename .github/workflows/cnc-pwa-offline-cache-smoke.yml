name: CNC PWA offline cache smoke

on:
  pull_request:
    paths:
      - 'cnc/**'
      - '.github/workflows/cnc-pwa-offline-cache-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnc-pwa-offline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate current offline contract
        run: |
          mkdir -p cnc/test-results/pwa-offline-workflow
          node --check cnc/tests/mobile-pwa-offline-cache-smoke.cjs
          node --check cnc/tests/pwa-build-reference-audit-smoke.cjs
          node --check cnc/sw.js
          node cnc/tests/pwa-build-reference-audit-smoke.cjs
          node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync('cnc/build-info.json', 'utf8'));
          const sw = fs.readFileSync('cnc/sw.js', 'utf8');
          const test = fs.readFileSync('cnc/tests/mobile-pwa-offline-cache-smoke.cjs', 'utf8');
          const swBuild = sw.match(/const BUILD = '([^']+)'/)?.[1];
          if (swBuild !== info.pwaBuild) throw new Error(`Service Worker/build-info mismatch: ${swBuild} / ${info.pwaBuild}`);
          if (!test.includes(`const PWA_BUILD = '${info.pwaBuild}'`)) throw new Error('offline browser PWA target mismatch');
          for (const file of ['./learning-sublesson-catalog.js', './learning-depth.css', './learning-detail.html']) {
            if (!sw.includes(`'${file}'`)) throw new Error(`learning core missing: ${file}`);
          }
          NODE
      - name: Install Playwright test runtime
        run: npm install --no-save playwright@1.52.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run 390x844 offline cache smoke
        env:
          DEBUG: pw:browser
        run: node cnc/tests/mobile-pwa-offline-cache-smoke.cjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnc-pwa-offline-${{ github.run_id }}
          path: cnc/test-results/pwa-offline-*
          if-no-files-found: error
          retention-days: 14
